朵小花组成，颖片不属于其中任何一朵小花。","options":["正确","错误"],"answer":[0],"explain":"小穗是禾本科花序的基本单位，基部为两枚（稀一枚）颖片，其上方着生小花；每朵小花由外稃、内稃、浆片、雄蕊和雌蕊组成，颖片位于全部小花之外，故该陈述正确。","tag":"禾本科"},{"id":"taxonomy-i018","type":"judge","stage":2,"stem":"菊科植物全部为草本，其头状花序中一定同时具有管状花和舌状花。","options":["正确","错误"],"answer":[1],"explain":"菊科虽以草本为主，但也有灌木甚至小乔木，如部分蒿属种类和帚菊木属；花序组成同样多样，蒲公英全为舌状花，红花等则全为管状花。故全部为草本、一定兼有两种花均不成立，陈述错误。","tag":"菊科"},{"id":"taxonomy-i023","type":"judge","stage":2,"stem":"十字花科的花具四强雄蕊，即雄蕊6枚，外轮2枚较短、内轮4枚较长。","options":["正确","错误"],"answer":[0],"explain":"四强雄蕊是十字花科的典型特征：花中具6枚雄蕊，外轮2枚花丝较短，内轮4枚较长，与十字形花冠、角果和假隔膜共同构成该科的识别要点。该陈述正确。","tag":"十字花科"},{"id":"taxonomy-i028","type":"judge","stage":2,"stem":"莎草科与禾本科同属禾本目，但莎草科果实为小坚果，花被退化为鳞片或刚毛，与禾本科的颖果和浆片不同。","options":["正确","错误"],"answer":[0],"explain":"二者均属禾本目，但果实与花被明显不同：莎草科为小坚果（坚果状瘦果），花被退化为鳞片或刚毛；禾本科为颖果，花被退化为2枚浆片。各项表述均正确，故陈述成立。","tag":"莎草科"},{"id":"taxonomy-i033","type":"judge","stage":2,"stem":"豆科植物的花均为两侧对称的蝶形花，雄蕊均为二体雄蕊，因而该科花部特征高度一致。","options":["正确","错误"],"answer":[1],"explain":"蝶形花冠与二体雄蕊只是蝶形花亚科的特征；含羞草亚科花辐射对称、雄蕊多数且花丝分离，云实亚科的花也非典型蝶形花。故均为、高度一致的说法不正确，陈述错误。","tag":"豆科"},{"id":"taxonomy-i038","type":"judge","stage":2,"stem":"蔷薇科既有蓇葖果、瘦果，也有梨果和核果，因此果实类型不能作为鉴定蔷薇科的唯一依据。","options":["正确","错误"],"answer":[0],"explain":"蔷薇科四亚科果实各异：绣线菊亚科为蓇葖果，蔷薇亚科为聚合瘦果，苹果亚科为梨果，李亚科为核果。故不能仅凭果实类型鉴定该科，还需结合花托、子房位置与雄蕊数目，陈述正确。","tag":"蔷薇科"},{"id":"taxonomy-i042","type":"judge","stage":2,"stem":"羊草为禾本科多年生草本，具发达根状茎，耐旱、耐盐碱，是我国北方草原重要的优良饲用植物。","options":["正确","错误"],"answer":[0],"explain":"羊草隶属禾本科赖草属，具发达根状茎，靠根状茎行营养繁殖，耐旱耐盐碱、适口性好，可刈割调制干草，是北方典型草原的优势种和重要饲草，各项描述均正确。","tag":"常见饲用植物"},{"id":"taxonomy-i053","type":"judge","stage":2,"stem":"优先律在同一等级内比较名称发表先后，同一分类群若有数个合格发表的合法名称，应采用最早发表者；保留名与废弃名属于优先律的例外。","options":["正确","错误"],"answer":[0],"explain":"陈述正确。优先律只在同一等级的名称间比较发表时间，最早合格发表者优先；《法规》另设保留名、废弃名等机制作为例外，以维护名称的稳定使用。","tag":"命名法规"},{"id":"taxonomy-i063","type":"judge","stage":2,"stem":"禾本科植物的花均为两性花，子房下位，果实为颖果，种子具丰富的胚乳。","options":["正确","错误"],"answer":[1],"explain":"陈述错误。禾本科虽多为两性花，但玉米等存在单性花；其子房为上位而非下位。颖果和胚乳丰富的描述正确，改正后应为“花常两性、子房上位”。","tag":"禾本科"},{"id":"taxonomy-i072","type":"judge","stage":2,"stem":"菊科植物的花为合瓣花，雄蕊5枚且花药合生成筒、花丝分离，子房下位，果实为瘦果。","options":["正确","错误"],"answer":[0],"explain":"陈述正确。菊科花冠合瓣，雄蕊为聚药雄蕊（花药合生、花丝分离），子房下位、1室1胚珠，发育成瘦果；这些特征也是识别菊科的重要依据。","tag":"菊科"},{"id":"taxonomy-i076","type":"judge","stage":2,"stem":"十字花科植物的子房由2心皮合生，具假隔膜，果实为角果，种子着生于假隔膜边缘。","options":["正确","错误"],"answer":[0],"explain":"陈述正确。十字花科子房由2心皮合生，假隔膜由胎座延伸形成并将子房分隔，果实为角果，种子着生于假隔膜边缘，这是该科最稳定的识别特征之一。","tag":"十字花科"},{"id":"taxonomy-i082","type":"judge","stage":2,"stem":"豆科云实亚科的花为蝶形花冠，旗瓣位于最外方，雄蕊10枚连合成二体雄蕊。","options":["正确","错误"],"answer":[1],"explain":"陈述错误。云实亚科为假蝶形花冠，最上一枚花瓣位于最内方，雄蕊10枚多离生；旗瓣在最外方、雄蕊二体是蝶形花亚科的特征，二者不可混同。","tag":"豆科"},{"id":"taxonomy-i085","type":"judge","stage":2,"stem":"蔷薇科植物花托形态多样，子房上位或下位，果实有蓇葖果、瘦果、梨果和核果等类型。","options":["正确","错误"],"answer":[0],"explain":"陈述正确。蔷薇科以花托和子房位置分化出四个亚科，果实类型相应多样：绣线菊亚科多蓇葖果，蔷薇亚科多瘦果，苹果亚科为梨果，李亚科为核果。","tag":"蔷薇科"},{"id":"taxonomy-i093","type":"judge","stage":2,"stem":"无芒雀麦为豆科雀麦属多年生牧草，具发达根状茎，是优良的放牧和刈割草种。","options":["正确","错误"],"answer":[1],"explain":"陈述错误。无芒雀麦属禾本科雀麦属，虽具根状茎且为优良牧草，但并非豆科；豆科牧草应具蝶形花冠、荚果等特征，如紫花苜蓿、白三叶。","tag":"常见饲用植物"},{"id":"taxonomy-a001","type":"single","stage":3,"stem":"某草地植物名录中依次出现 Poaceae、Panicoideae、Paniceae、Panicum 四个名称，它们所代表的分类等级由高到低依次是","options":["科—亚科—族—属","科—族—亚科—属","亚科—科—族—属","属—族—亚科—科"],"answer":[0],"explain":"Poaceae为科，词尾-oideae的Panicoideae为亚科，词尾-eae的Paniceae为族，Panicum为属，故由高到低为科—亚科—族—属。把族当作亚科，或把属列在科之前，均属错误。","tag":"分类等级"},{"id":"taxonomy-a003","type":"single","stage":3,"stem":"某饲用植物原名 Avena elatior L.，后经研究归入 Arrhenatherum 属，合格发表为 Arrhenatherum elatius (L.) P.Beauv. ex J.Presl & C.Presl。对括号内外作者的判断，正确的是","options":["括号内的L.是该新组合的命名人，括号外为基名作者","括号表示该名称已作废弃处理，L. 不再具有意义","括号内的L.为基名（原名称）的作者，括号外作者是作出新组合的作者","括号内外作者均为模式标本的采集人，与命名无关"],"answer":[2],"explain":"把种移至另一属时保留原种加词，并在括号内注明基名作者L.，括号外为作出新组合并合格发表的作者。括号不是废弃标记，作者也并非采集人。","tag":"双名法"},{"id":"taxonomy-a007","type":"single","stage":3,"stem":"在野外区分竹亚科与禾亚科时，下列特征组合最为可靠的是","options":["小穗是否具颖片、雄蕊是否为3枚","秆是否木质化、叶片与叶鞘连接处是否具关节","花药是否为丁字着生、柱头是否呈羽毛状","果实是否为颖果、胚是否偏向一侧"],"answer":[1],"explain":"竹亚科秆木质化，叶片与叶鞘连接处具关节，叶片脱落后叶鞘留存；禾亚科秆草质，叶鞘与叶片间无关节。颖片、雄蕊数目、花药着生方式与颖果类型在两亚科间一致，不能作为区分依据。","tag":"禾本科"},{"id":"taxonomy-a008","type":"single","stage":3,"stem":"某禾草叶片扁平，叶鞘开裂，叶舌膜质，叶耳明显抱茎，穗为穗状花序、小穗互生于穗轴两侧，外稃具芒。该植物最可能属于","options":["燕麦属","早熟禾属","小麦属","狗尾草属"],"answer":[2],"explain":"小麦属具明显叶耳、穗状花序，小穗互生于穗轴两侧，外稃具芒。燕麦属、早熟禾属为圆锥花序且无叶耳，狗尾草属为圆柱状圆锥花序，与描述均不符。","tag":"禾本科"},{"id":"taxonomy-a011","type":"single","stage":3,"stem":"下列各组禾本科植物中，均属黍亚科、具花环状（Kranz）叶解剖结构并营C4光合途径的是","options":["小麦、大麦、燕麦","早熟禾、羊茅、黑麦草","雀麦、鸭茅、看麦娘","玉米、高粱、狗尾草"],"answer":[3],"explain":"黍亚科多具花环状叶解剖结构和C4途径，玉米、高粱、狗尾草属之；小麦、大麦、燕麦、早熟禾、羊茅、黑麦草、雀麦、鸭茅均属早熟禾亚科，为C3植物，无花环状结构。","tag":"禾本科"},{"id":"taxonomy-a012","type":"single","stage":3,"stem":"玉米植株上，顶生的圆锥花序与腋生的肉穗花序分别着生的小花性别是","options":["顶生圆锥花序着生雄花，腋生肉穗花序着生雌花","顶生圆锥花序着生雌花，腋生肉穗花序着生雄花","两种花序均着生两性花","顶生花序着生两性花，腋生花序着生不育花"],"answer":[0],"explain":"玉米雌雄同株而异花序，顶生圆锥花序为雄穗，着生雄花；腋生肉穗花序为雌穗，着生雌花，外被苞叶，花柱细长呈丝状伸出。说两类花序均两性可育与事实不符。","tag":"禾本科"},{"id":"taxonomy-a014","type":"single","stage":3,"stem":"燕麦脱粒后籽实外面仍包着稃片，而小麦脱粒后籽粒裸露，造成这一差异的直接结构原因是","options":["燕麦的护颖较长，包住了整个小穗","燕麦的颖果与内、外稃紧贴，脱粒时稃片不脱落","燕麦的胚乳为角质，小麦的胚乳为粉质","燕麦的小穗含多数小花，小麦的小穗仅含1朵小花"],"answer":[1],"explain":"燕麦的颖果与内稃、外稃紧贴，脱粒时稃片不脱落，故籽实带稃；小麦颖果与稃片分离，脱粒后籽粒裸露。护颖长短、胚乳质地和小花数目都不能决定稃片是否脱落。","tag":"禾本科"},{"id":"taxonomy-a015","type":"single","stage":3,"stem":"某多年生禾草具根状茎，叶鞘开放，叶舌短小，穗状花序顶生，小穗互生并紧贴穗轴的两侧，颖片具脊。该植物最可能属于","options":["早熟禾属","燕麦属","冰草属","雀麦属"],"answer":[2],"explain":"冰草属为多年生、具根状茎，穗状花序顶生，小穗互生并紧贴穗轴两侧；早熟禾属、燕麦属、雀麦属均为圆锥花序，花序类型不符，故不能选。","tag":"禾本科"},{"id":"taxonomy-a016","type":"single","stage":3,"stem":"禾本科牧草种子田常因倒伏而减产，与抗倒伏能力关系最直接的是","options":["小穗数目的多少","叶舌的长短","颖果胚乳的类型","茎壁的厚薄与机械组织的发达程度"],"answer":[3],"explain":"茎壁厚、机械组织发达的植株抗倒伏能力强，这是茎秆强度的直接结构基础；小穗数目、叶舌长短和胚乳类型与茎秆强度无关，故其余选项不能解释倒伏差异。","tag":"禾本科"},{"id":"taxonomy-a017","type":"single","stage":3,"stem":"莎草科的小穗与禾本科小穗在结构上的主要区别是","options":["莎草科小穗的鳞片腋内各着生1朵花，花外无外稃和内稃","莎草科小穗基部有2枚颖片，花外包有外稃和内稃","莎草科小穗内只有1朵花，禾本科小穗内有多朵花","莎草科小穗由总苞片包被，禾本科小穗无总苞片"],"answer":[0],"explain":"莎草科小穗由多数鳞片组成，每片腋内着生1朵花，花被退化为下位刚毛或鳞片，无内外稃；禾本科小穗具2枚颖片，每朵小花有外稃和内稃。小穗含花数与总苞有无不是本质区别。","tag":"莎草科"},{"id":"taxonomy-a020","type":"single","stage":3,"stem":"在薹草属（Carex）中，包被雌花、顶端具喙的瓶状结构是","options":["下位刚毛","果囊（囊苞）","内稃","总苞片"],"answer":[1],"explain":"薹草属雌花外包有由先出叶形成的瓶状果囊，顶端具喙和口，是分种的重要依据；下位刚毛是退化的花被，位于果囊之内，内稃和总苞片都不包被雌花。","tag":"莎草科"},{"id":"taxonomy-a021","type":"single","stage":3,"stem":"莎草科植物多生于湿地沼泽，其茎、叶和根中通气组织发达，这一特征的主要意义是","options":["增强机械支持，防止植株倒伏","减少蒸腾，适应干旱生境","向缺氧的根系输送氧气，适应渍水生境","储存大量养分，供越冬后再生"],"answer":[2],"explain":"湿地土壤缺氧，通气组织可把地上部吸收的氧气输送到根系，维持根系呼吸；机械支持主要靠厚壁组织，减少蒸腾属旱生适应，养分贮藏与通气组织无直接关系。","tag":"莎草科"},{"id":"taxonomy-a022","type":"single","stage":3,"stem":"菊科植物果实顶端的冠毛，其来源是","options":["花冠的舌片","花托的附属物","总苞片的延伸","花萼的退化与特化"],"answer":[3],"explain":"菊科花萼退化成鳞片状、刺毛状或毛状的冠毛，宿存于瘦果顶端，借风力传播；花冠舌片、花托附属物和总苞片都不形成冠毛，故其余选项错误。","tag":"菊科"},{"id":"taxonomy-a025","type":"single","stage":3,"stem":"向日葵头状花序边缘的舌状花与中央的管状花在育性上的差异是","options":["舌状花中性不育，管状花两性可育，结实主要靠中央管状花","舌状花两性可育，管状花雄性不育","两类花均两性可育，均可结实","两类花均不育，靠无融合生殖结实"],"answer":[0],"explain":"向日葵边缘舌状花仅有花冠而无雄蕊和雌蕊，为中性花；中央管状花两性，具聚药雄蕊和2裂柱头，能够结实，故籽实由管状花发育而来。","tag":"菊科"},{"id":"taxonomy-a026","type":"single","stage":3,"stem":"某草原植物有香气，叶羽状深裂，头状花序小、多数集成圆锥状，花全为管状花，边花雌性细管状，中央花两性。该植物最可能属于","options":["蓟属","蒿属","蒲公英属","苦苣菜属"],"answer":[1],"explain":"蒿属头状花序小、集成圆锥状，全为管状花，边花雌性、盘花两性，且多具香气和羽状分裂叶；蓟属头状花序较大且有刺，蒲公英属与苦苣菜属全为舌状花并具乳汁。","tag":"菊科"},{"id":"taxonomy-a027","type":"single","stage":3,"stem":"头状花序全部由舌状花组成、植物体具乳汁的菊科植物（如蒲公英、苦苣菜）通常归属于","options":["菜蓟族","向日葵族","菊苣族","旋覆花族"],"answer":[2],"explain":"菊苣族头状花序全由舌状花组成，植物体具乳汁，如蒲公英、苦苣菜、莴苣；向日葵族、旋覆花族具管状花和舌状花，菜蓟族多为管状花且常有刺，均不符合。","tag":"菊科"},{"id":"taxonomy-a028","type":"single","stage":3,"stem":"十字花科角果中的假隔膜（次生隔膜）形成于","options":["花托顶部向上延伸的部分","花萼筒内壁的突起","两个心皮边缘愈合处的外壁","胎座向子房中央延伸形成的膜质隔片"],"answer":[3],"explain":"假隔膜由胎座向子房腔中央延伸形成，把1室子房分隔为2室，与心皮边缘愈合形成的真正隔膜不同；花托、花萼和心皮外壁都不形成假隔膜。","tag":"十字花科"},{"id":"taxonomy-a031","type":"single","stage":3,"stem":"十字花科中，长角果具长喙、种子间缢缩呈串珠状，该特征见于","options":["萝卜属","芸苔属","荠菜属","独行菜属"],"answer":[0],"explain":"萝卜属的长角果具长喙，种子间缢缩成串珠状；芸苔属角果细长但种子间不缢缩，荠菜属和独行菜属为短角果，均不符合串珠状长角果这一特征。","tag":"十字花科"},{"id":"taxonomy-a032","type":"single","stage":3,"stem":"荚果成熟时通常沿背腹两条缝线开裂为两瓣，据此判断荚果由几个心皮构成、种子着生方式是","options":["2个心皮合生，种子着生于中轴胎座","1个心皮，种子着生于腹缝线的边缘胎座","多个离生心皮，种子着生于侧膜胎座","3个心皮合生，种子着生于特立中央胎座"],"answer":[1],"explain":"荚果由单心皮发育，为单室果实，种子沿腹缝线的边缘胎座着生，成熟时自背、腹两缝线开裂；2个以上心皮以及中轴、侧膜胎座均与荚果结构不符。","tag":"豆科"},{"id":"taxonomy-a035","type":"single","stage":3,"stem":"某豆科植物花辐射对称，花瓣镊合状排列，雄蕊多数而分离，叶为二回羽状复叶。该植物属于","options":["蝶形花亚科","云实亚科","含羞草亚科","酢浆草科"],"answer":[2],"explain":"含羞草亚科花辐射对称、花瓣镊合状排列、雄蕊多数或与花瓣同数而分离，多为二回羽状复叶；蝶形花亚科花蝶形、雄蕊二体，云实亚科花两侧对称但非蝶形。","tag":"豆科"},{"id":"taxonomy-a036","type":"single","stage":3,"stem":"豆科植物与根瘤菌的共生关系中，双方的物质交换是","options":["根瘤菌寄生于根部，从寄主获取全部有机养料而不提供氮素","根瘤菌进行光合作用供给寄主糖类，寄主提供矿质元素","根瘤菌与根形成菌根，帮助寄主吸收磷和水分","寄主供给糖类等有机养料，根瘤菌将游离氮固定为化合态氮供寄主利用"],"answer":[3],"explain":"根瘤菌侵入根毛形成侵染线，在皮层细胞中繁殖形成根瘤，把氮气还原成氨供寄主利用，寄主供应糖类等养分；根瘤不是菌根，根瘤菌也不进行光合作用，并非单纯寄生。","tag":"豆科"},{"id":"taxonomy-a037","type":"single","stage":3,"stem":"蔷薇科划分绣线菊亚科、苹果亚科、蔷薇亚科和李亚科的主要依据是","options":["心皮数目、子房位置及果实类型","叶的形状、是否具托叶及花序类型","花萼裂片数目与雄蕊轮数","种子胚乳的有无与子叶数目"],"answer":[0],"explain":"四亚科依据心皮数目、离生或合生、子房上位或下位以及由此形成的果实类型划分，如蓇葖果、梨果、聚合瘦果和核果；叶形、花序和萼片数目只作辅助特征。","tag":"蔷薇科"},{"id":"taxonomy-a039","type":"single","stage":3,"stem":"蔷薇属植物的多个瘦果包藏在壶状的肉质花托内，该果实特称为","options":["梨果","蔷薇果（假果）","聚合蓇葖果","核果"],"answer":[1],"explain":"蔷薇属的肉质部分由壶状花托发育而来，内含多数瘦果，属假果，特称蔷薇果；梨果由下位子房与花托共同发育，蓇葖果为离生心皮的干果，核果为单心皮肉质果。","tag":"蔷薇科"},{"id":"taxonomy-a040","type":"single","stage":3,"stem":"按现代分子系统学（APG）处理，原来独立的藜科（Chenopodiaceae）被并入","options":["石竹科","蓼科","苋科","马齿苋科"],"answer":[2],"explain":"APG系统依据分子证据把藜科并入苋科，作为藜亚科处理；石竹科、蓼科和马齿苋科虽同属石竹目，但花部结构和胚的特征不同，并未接收藜科各属。","tag":"藜科"},{"id":"taxonomy-a043","type":"single","stage":3,"stem":"藜科植物多为盐生或旱生，其适应盐碱生境的结构特征是","options":["叶大型、薄而平展，气孔密集","叶片为羽状复叶，具托叶和叶耳","茎中空且具发达的通气组织","叶肉质，表皮具盐腺或密被毛，气孔下陷"],"answer":[3],"explain":"藜科植物常具肉质叶以稀释盐分，表皮有盐腺排盐或密被毛以减少蒸腾，气孔下陷可降低水分散失；薄大叶、通气组织和羽状复叶与耐盐适应无关。","tag":"藜科"},{"id":"taxonomy-a044","type":"single","stage":3,"stem":"羊草（Leymus chinensis）是我国北方草原的优良牧草，其科属与主要识别特征是","options":["禾本科赖草属，具根状茎，穗状花序，穗轴每节常着生2枚小穗","禾本科羊茅属，丛生，圆锥花序，小穗含多数花","豆科黄芪属，直根，总状花序，荚果","莎草科薹草属，三棱茎，小坚果"],"answer":[0],"explain":"羊草属禾本科赖草属，具发达根状茎，穗状花序，穗轴每节常着生2枚小穗；羊茅属为圆锥花序，豆科具荚果，莎草科具小坚果，特征均与羊草不符。","tag":"常见饲用植物"},{"id":"taxonomy-a045","type":"single","stage":3,"stem":"紫花苜蓿（Medicago sativa）的主要形态特征是","options":["须根系，叶为羽状复叶，穗状花序","直根系，三出复叶，总状花序","直根系，掌状复叶，伞形花序","须根系，三出复叶，头状花序"],"answer":[1],"explain":"紫花苜蓿为豆科苜蓿属多年生草本，直根系发达，三出复叶，小叶先端有锯齿，花紫色组成总状花序；羽状复叶配穗状花序、伞形花序或头状花序均与苜蓿属不符。","tag":"常见饲用植物"},{"id":"taxonomy-a047","type":"single","stage":3,"stem":"在干旱沙地建植人工草地时，下列豆科牧草中最耐旱、耐瘠薄、根系发达并常用于防风固沙的是","options":["白三叶","红豆草","草木樨","沙打旺"],"answer":[3],"explain":"沙打旺为豆科黄芪属多年生草本，根系发达，耐旱耐瘠薄、抗风沙，常用于沙地改良和防风固沙；白三叶喜湿润，红豆草和草木樨的耐旱抗沙埋能力均不及沙打旺。","tag":"常见饲用植物"},{"id":"taxonomy-s18","type":"single","stem":"草莓的肉质食用部分由花托膨大形成，表面着生的许多小颗粒状结构，其真正的果实类型是","options":["瘦果","核果","梨果","蓇葖果"],"answer":[0],"explain":"草莓为聚合瘦果，花托肉质膨大，表面着生多数小瘦果，每个小瘦果内含1枚种子。核果由单心皮形成，梨果为下位子房与花托愈合，蓇葖果为离生心皮开裂果实，均不符合草莓结构。","tag":"蔷薇科","level":3,"stage":3,"standard":true},{"id":"taxonomy-s20","type":"single","stem":"在草原样地中，甲种禾草具根状茎，穗状花序，小穗含2～4朵花，颖锥形，外稃无芒；乙种禾草密丛生，叶片丝状，小穗含1朵花，外稃具长芒。甲、乙最可能分别是","options":["羊草、针茅","针茅、羊草","冰草、针茅","羊草、冰草"],"answer":[0],"explain":"羊草具发达根状茎，穗状花序，小穗含2～4花，外稃无芒；针茅属密丛生，叶丝状，小穗含1花，外稃具长芒。冰草小穗含多花且无长芒，不符合乙；其余选项或颠倒二者，或混搭冰草，均不正确。","tag":"常见饲用植物","level":3,"stage":3,"standard":true},{"id":"taxonomy-a002","type":"multi","stage":3,"stem":"在整理某天然草地植物名录时，下列对分类等级及其名称的处理，正确的是","options":["亚科名多由模式属名加词尾-oideae 构成，族名加-eae，科名加-aceae","种下等级包括亚种、变种和变型，书写时 subsp.、var.、f. 置于种加词之后","同一属下的不同种，学名的属名可以不同，只要种加词相同","在同一个分类系统中，一个种只能归入一个科"],"answer":[0,1,3],"explain":"亚科、族、科的名称词尾分别为-oideae、-eae、-aceae；种下等级缩写置于种加词之后；同一属各种共享属名，C项“属名可以不同”错误；一个种在同一系统中只能归入一个科，D项正确。","tag":"分类等级"},{"id":"taxonomy-a005","type":"multi","stage":3,"stem":"关于植物名称的合格发表、保留与优先律，下列叙述正确的是","options":["对长期使用但不符合优先律的名称，可提出保留名称（nomen conservandum）提案加以保留","名称只需在学术会议的报告摘要中宣读，即可视为有效发表","合格发表须附有拉丁文或英文的描述或特征集要，并指定模式标本","同一分类群有两个合格发表的名称时，应优先采用最早发表者"],"answer":[0,2,3],"explain":"对长期使用但不符合优先律的名称可提出保留名称提案；合格发表须有描述并指定模式；优先律要求采用最早合格发表的名称。仅在会议摘要中宣读不构成有效发表，故B项错误。","tag":"命名法规"},{"id":"taxonomy-a009","type":"multi","stage":3,"stem":"下列禾本科植物花序类型与所属属的对应，正确的是","options":["小麦属——复穗状花序，穗轴每节着生1枚无柄小穗","燕麦属——圆锥花序，小穗常下垂","狗牙根属——数枚穗状花序呈指状排列于茎顶","黍属——头状花序，小花集生于扁平花托上"],"answer":[0,1,2],"explain":"小麦属为复穗状花序，燕麦属为圆锥花序且小穗下垂，狗牙根属为数枚穗状花序指状排列；黍属为圆锥花序，头状花序是菊科的特征，故D项错误。","tag":"禾本科"},{"id":"taxonomy-a018","type":"multi","stage":3,"stem":"莎草科植物多生于湿地沼泽，下列对其茎、叶、花和果实的描述，正确的是","options":["茎通常三棱形，实心，节不明显","叶二列互生，叶鞘闭合，具明显的叶舌","花小，两性或单性，花被退化为下位刚毛或鳞片","果实为小坚果（瘦果状），成熟时不开裂"],"answer":[0,2,3],"explain":"莎草科茎三棱形、实心、节不明显，花被退化为下位刚毛或鳞片，果实为小坚果、不开裂；其叶为三列互生、叶鞘闭合且通常无叶舌，故B项错误。","tag":"莎草科"},{"id":"taxonomy-a023","type":"multi","stage":3,"stem":"下列菊科植物与其形态特征或主要用途的对应，正确的是","options":["向日葵——边缘的舌状花能正常结实，是重要的油料作物","菊属——头状花序边缘为舌状花、中央为管状花，两类花均可结实","蒿属——头状花序小，全为管状花，边花雌性，是草原常见植物","蓟属——总苞片先端具刺，头状花序的花全为管状花"],"answer":[1,2,3],"explain":"菊属头状花序边缘为舌状花、中央为管状花，两类花均可结实；蒿属头状花序小、全为管状花；蓟属总苞片具刺、花全为管状花。向日葵仅中央管状花结实，故A项错误。","tag":"菊科"},{"id":"taxonomy-a029","type":"multi","stage":3,"stem":"十字花科的花部与果实具有一系列稳定的识别特征，下列描述正确的是","options":["花两性，辐射对称，萼片4枚，花瓣4枚呈十字形排列","花基部常有4枚蜜腺，与虫媒传粉相适应","子房下位，2室，中轴胎座","果实为角果，由2个心皮合生而成"],"answer":[0,1,3],"explain":"十字花科花两性、辐射对称，萼片与花瓣各4枚，花基部有4枚蜜腺，果实为2心皮合生的角果；其子房上位、1室，因假隔膜而成2室，为侧膜胎座，故C项错误。","tag":"十字花科"},{"id":"taxonomy-a033","type":"multi","stage":3,"stem":"豆科植物兼有饲用与改土作用，下列形态与利用的叙述正确的是","options":["叶多为羽状或三出复叶，常具托叶，部分种类的叶轴顶端有卷须","花常组成总状或头状花序，蝶形花亚科的花多为虫媒传粉","根系常与根瘤菌共生形成根瘤，能固定空气中的游离氮","荚果由2个心皮合生而成，种子着生于中轴胎座"],"answer":[0,1,2],"explain":"豆科叶多为复叶且具托叶，豌豆等叶轴顶端有卷须，花组成总状或头状花序并多为虫媒，根瘤可固氮；荚果由单心皮发育、种子着生于腹缝线，故D项错误。","tag":"豆科"},{"id":"taxonomy-a038","type":"multi","stage":3,"stem":"蔷薇科各亚科习性多样，但花托与花部结构具有共性，下列描述正确的是","options":["叶对生，单叶，无托叶","花托发达，萼片、花瓣和雄蕊着生于花托边缘，形成周位花或上位花","雄蕊常多数，心皮1至多数，离生或合生","果实类型多样，有蓇葖果、瘦果、梨果和核果等"],"answer":[1,2,3],"explain":"蔷薇科花托发达而成周位花或上位花，雄蕊多数、心皮1至多数，果实有蓇葖果、瘦果、梨果和核果等；其叶互生、常具托叶，故A项错误。","tag":"蔷薇科"},{"id":"taxonomy-a041","type":"multi","stage":3,"stem":"在饲料资源调查中，下列对藜科植物主要用途的判断，正确的是","options":["甜菜——根富含糖分，重要的糖料作物","菠菜——重要的叶菜类蔬菜","望江南——藜科一年生饲用牧草","驼绒藜——荒漠草地重要的饲用半灌木"],"answer":[0,1,3],"explain":"甜菜为糖料作物，菠菜为叶菜，驼绒藜是荒漠草地重要的饲用半灌木；望江南属豆科决明属，并非藜科植物，故C项错误。","tag":"藜科"},{"id":"taxonomy-m02","type":"multi","stem":"关于豆科三亚科的花部特征，下列叙述正确的是","options":["含羞草亚科花辐射对称，雄蕊常多数","云实亚科花两侧对称，最上方一枚花瓣位于最内方","蝶形花亚科花两侧对称，旗瓣位于最外方，雄蕊常二体","三个亚科的花均为蝶形花冠，雄蕊均为二体"],"answer":[0,1,2],"explain":"含羞草亚科花辐射对称、雄蕊常多数；云实亚科为假蝶形花冠，最上方花瓣在最内方；蝶形花亚科旗瓣最外，雄蕊常9+1二体。D错在云实亚科并非典型蝶形花冠，含羞草亚科雄蕊也不是二体。","tag":"豆科","level":3,"stage":3,"standard":true},{"id":"taxonomy-a004","type":"judge","stage":3,"stem":"一个种的完整学名由属名、种加词和命名人引证三部分组成，其中命名人引证是名称得以合格发表的必要条件之一。","options":["正确","错误"],"answer":[1],"explain":"错误。学名本身由属名与种加词构成，命名人引证只是书写时的补充规范，并非合格发表的条件；合格发表要求有描述或特征集要并指定模式，作者引证缺失不影响名称成立。","tag":"双名法"},{"id":"taxonomy-a006","type":"judge","stage":3,"stem":"若两个不同属的植物使用了相同的种加词，则二者构成同名（homonym），后发表的名称不合法。","options":["正确","错误"],"answer":[1],"explain":"错误。同名指同一等级上的相同名称，同一属内两个种使用相同种加词才是同名，后发表者为晚出同名；不同属可以使用相同的种加词，并不构成同名。","tag":"命名法规"},{"id":"taxonomy-a010","type":"judge","stage":3,"stem":"禾本科植物的叶由叶鞘和叶片组成，叶鞘与叶片交界处的内方常有叶舌，而叶耳并非所有种类都具有。","options":["正确","错误"],"answer":[0],"explain":"正确。禾本科叶分为叶鞘和叶片，交界处内方常有叶舌，叶耳有无因属种而异，如小麦有叶耳而雀麦无，不能把叶耳视为全科普遍特征。","tag":"禾本科"},{"id":"taxonomy-a013","type":"judge","stage":3,"stem":"玉米、高粱、甘蔗的小穗多成对排列，其中一枚无柄能育、一枚有柄不育，这一排列方式与小麦小穗全部能育的情况完全相同。","options":["正确","错误"],"answer":[1],"explain":"错误。高粱、甘蔗、玉米的小穗成对，一无柄能育、一有柄不育或雄性；小麦穗轴每节着生1枚小穗，小穗内仅基部2~3朵小花能育，上部小花常退化不育，二者排列方式和育性并不相同。","tag":"禾本科"},{"id":"taxonomy-a019","type":"judge","stage":3,"stem":"薹草属的果囊由先出叶发育而成，包被雌花，其形状、喙的有无及脉纹是薹草属分种的重要依据。","options":["正确","错误"],"answer":[0],"explain":"正确。薹草属雌花外的果囊由先出叶形成，顶端具喙，表面有脉，形状有卵形、披针形等，是薹草属分种的关键性状。","tag":"莎草科"},{"id":"taxonomy-a024","type":"judge","stage":3,"stem":"菊科舌状花的花冠为二唇形，上唇3裂、下唇2裂，故舌状花属于二唇形花冠。","options":["正确","错误"],"answer":[1],"explain":"错误。舌状花为合瓣花冠，先端5齿裂，并非二唇形；二唇形花冠通常上唇2裂、下唇3裂，见于唇形科等，二者不能混为一谈。","tag":"菊科"},{"id":"taxonomy-a030","type":"judge","stage":3,"stem":"十字花科的长角果由2个心皮合生而成，具假隔膜，种子着生于假隔膜边缘，成熟时果瓣由基部向上开裂。","options":["正确","错误"],"answer":[0],"explain":"正确。长角果由2个心皮合生，子房1室，胎座延伸形成假隔膜，种子着生于假隔膜边缘，成熟时果瓣自基部向上开裂，假隔膜留存。","tag":"十字花科"},{"id":"taxonomy-a034","type":"judge","stage":3,"stem":"荚果由单心皮发育而成，种子着生于腹缝线上，有的种类成熟后不开裂或断裂成节荚。","options":["正确","错误"],"answer":[0],"explain":"正确。荚果为单心皮单室果实，种子沿腹缝线着生；落花生等成熟后不开裂，山蚂蝗等横裂成节荚，不能认为荚果成熟后一定开裂。","tag":"豆科"},{"id":"taxonomy-a042","type":"judge","stage":3,"stem":"藜科植物的胞果果皮薄而膜质，与种子紧贴或分离，种子横生或直立，胚环形或螺旋形围绕胚乳。","options":["正确","错误"],"answer":[0],"explain":"正确。胞果果皮膜质、成熟后不开裂，内含1粒种子；藜科种子多横生或直立，胚弯曲成环形或螺旋形围绕粉质胚乳，是种子鉴定的重要依据。","tag":"藜科"},{"id":"taxonomy-a046","type":"judge","stage":3,"stem":"多年生黑麦草（Lolium perenne）耐热性强，在我国南方高温季节仍能旺盛生长，是亚热带草地的主栽牧草。","options":["正确","错误"],"answer":[1],"explain":"错误。多年生黑麦草为冷季型禾草，耐热性差，夏季高温时生长受抑甚至死亡，多在温凉地区栽培或用于南方冬春补播；亚热带越夏需改用雀稗、象草等暖季型牧草。","tag":"常见饲用植物"},{"id":"soil-b001","type":"single","stage":1,"stem":"下列因素中，不属于五大自然成土因素的是","options":["气候","母质","耕作","地形"],"answer":[2],"explain":"五大自然成土因素为气候、母质、生物、地形和时间，耕作属人为成土因素，是生产活动施加的影响。气候、母质、地形均在自然因素之列。","tag":"土壤成土因素"},{"id":"soil-b002","type":"single","stage":1,"stem":"岩石风化后残留在原地、未经搬运的成土母质称为","options":["残积物","坡积物","冲积物","风积物"],"answer":[0],"explain":"残积物是基岩风化后残留原地的疏松风化壳，未经外力搬运。坡积物、冲积物和风积物分别经重力、流水、风力搬运，属运积母质。","tag":"土壤成土因素"},{"id":"soil-b003","type":"single","stage":1,"stem":"我国土壤由东南向西北呈现的地带性更替，其主要决定因素是","options":["母质类型","水热条件","地形起伏","成土时间"],"answer":[1],"explain":"由东南向西北降水递减，热量与水分组合改变，土壤类型依次更替，主导因素是气候的水热条件。母质和地形只造成局部差异，成土时间决定发育程度。","tag":"土壤成土因素"},{"id":"soil-b004","type":"single","stage":1,"stem":"在土壤剖面中，黏粒和铁铝氧化物明显淀积的层次是","options":["O层（枯枝落叶层）","A层（腐殖质层）","C层（母质层）","B层（淀积层）"],"answer":[3],"explain":"B层为淀积层，上层淋溶下来的黏粒、铁铝氧化物和碳酸钙在此聚积，质地黏重。A层以腐殖质积累为主，C层是未明显成土的母质，均非淀积部位。","tag":"土壤成土因素"},{"id":"soil-b007","type":"single","stage":1,"stem":"按国际制粒级划分，粒径0.02～0.002 mm的土壤颗粒属于","options":["粉粒","石砾","砂粒","黏粒"],"answer":[0],"explain":"国际制中粉粒粒径为0.02～0.002 mm；砂粒为2～0.02 mm，黏粒小于0.002 mm，石砾大于2 mm。粉粒比表面积较大，保水性介于砂粒与黏粒之间。","tag":"土壤物理性质"},{"id":"soil-b008","type":"single","stage":1,"stem":"土壤容重是指","options":["单位容积土粒的烘干重","单位重量土壤的容积","单位容积原状土壤的烘干重","土壤孔隙占土壤容积的百分数"],"answer":[2],"explain":"容重是单位容积原状土壤（含孔隙）的烘干重，单位为克每立方厘米。单位容积土粒的烘干重是比重，孔隙占容积的百分数是孔隙度。","tag":"土壤物理性质"},{"id":"soil-b009","type":"single","stage":1,"stem":"土壤非毛管孔隙的主要作用是","options":["保蓄植物可利用的水分","通气与排水","吸附交换性阳离子","固定土壤有机质"],"answer":[1],"explain":"非毛管孔隙孔径大，是土壤空气交换和多余水分下渗的通道，起通气排水作用。保蓄有效水主要靠毛管孔隙，吸附阳离子由土壤胶体完成。","tag":"土壤物理性质"},{"id":"soil-b010","type":"single","stage":1,"stem":"长期受犁耕压实的犁底层，最常见的土壤结构类型是","options":["团粒结构","核状结构","柱状结构","片状结构"],"answer":[3],"explain":"犁底层受犁体挤压和干湿交替，土粒呈水平层状排列，形成片状结构，透水性差。团粒结构见于肥沃表土，核状结构见于黏重心底土，柱状结构见于碱土。","tag":"土壤物理性质"},{"id":"soil-b011","type":"single","stage":1,"stem":"在土壤质地类型中，耕性良好、宜耕期较长且兼有砂土与黏土优点的是","options":["壤土","砂土","黏土","砾质土"],"answer":[0],"explain":"壤土砂黏比例适中，孔隙状况良好，耕性、通透性与保水保肥性兼顾，宜耕期长。砂土漏水漏肥，黏土湿黏干硬，砾质土保水保肥更差。","tag":"土壤物理性质"},{"id":"soil-b014","type":"single","stage":1,"stem":"与近地面大气相比，土壤空气的组成特点是","options":["二氧化碳浓度低、氧气浓度高","二氧化碳与氧气浓度均高于大气","二氧化碳浓度高、氧气浓度低","二氧化碳与氧气浓度均低于大气"],"answer":[2],"explain":"根系呼吸和微生物分解不断消耗氧气、释放二氧化碳，而土壤气体交换比大气缓慢，故土壤空气二氧化碳高、氧气低。其余组合与呼吸消耗、扩散受限的事实不符。","tag":"土壤物理性质"},{"id":"soil-b016","type":"single","stage":1,"stem":"土壤水分形态中，被土粒表面分子引力紧紧吸附、植物几乎不能利用的是","options":["膜状水","吸湿水","毛管水","重力水"],"answer":[1],"explain":"吸湿水受土粒表面强大分子引力吸附，只有风干或烘干才能除去，植物无法吸收。膜状水可部分利用，毛管水是主要可利用形态，重力水易下渗流失。","tag":"土壤水分"},{"id":"soil-b017","type":"single","stage":1,"stem":"降水或灌溉后，受重力作用沿大孔隙向下移动的水分是","options":["吸湿水","膜状水","毛管水","重力水"],"answer":[3],"explain":"重力水是含水量超过田间持水量后在重力作用下向下移动的水，停留时间短，易进入深层或地下水。吸湿水和膜状水受吸附力束缚，毛管水被毛管力保持，均不能自由下渗。","tag":"土壤水分"},{"id":"soil-b018","type":"single","stage":1,"stem":"土壤水分运动的方向是","options":["从水势高（负值小）处流向水势低（负值大）处","从水势低处流向水势高处","从含水率高处流向含水率低处","从温度高处流向温度低处"],"answer":[0],"explain":"土壤水运动由水势梯度决定，从水势高（负值绝对值小）处流向水势低处；含盐、温度等因素通过改变水势起作用。仅比较含水率或温度不能判断水流方向。","tag":"土壤水分"},{"id":"soil-b019","type":"single","stage":1,"stem":"土壤全部孔隙都被水充满时的含水量称为","options":["最大吸湿量","凋萎系数","饱和含水量","田间持水量"],"answer":[2],"explain":"饱和含水量是全部孔隙充水时的含水量，为土壤持水上限。田间持水量指毛管悬着水稳定时的含水量，凋萎系数是植物永久凋萎时的含水量，最大吸湿量是吸湿水上限。","tag":"土壤水分"},{"id":"soil-b023","type":"single","stage":1,"stem":"土壤胶体带负电荷的主要原因是","options":["土壤溶液中阳离子过多","黏土矿物的同晶替代和腐殖质羧基解离","土壤有机质含量过低","土壤中碳酸钙的溶解"],"answer":[1],"explain":"2∶1型黏土矿物晶格中高价离子被低价离子同晶替代，产生永久负电荷；腐殖质羧基、酚羟基解离产生可变负电荷。阳离子数量和碳酸钙溶解不是负电荷来源。","tag":"土壤化学性质"},{"id":"soil-b024","type":"single","stage":1,"stem":"土壤盐基饱和度是指","options":["交换性钠离子占阳离子交换量的百分比","盐基离子占土壤溶液总盐量的百分比","土壤含盐量占干土重的百分比","交换性盐基离子占阳离子交换量的百分比"],"answer":[3],"explain":"盐基饱和度是交换性钾、钠、钙、镁总量占阳离子交换量的百分数，反映保肥供肥和酸碱状况。交换性钠占阳离子交换量的比例是碱化度，含盐量是另一概念。","tag":"土壤化学性质"},{"id":"soil-b025","type":"single","stage":1,"stem":"长期淹水的稻田或湿地土壤中，硝态氮的主要去向是","options":["经反硝化作用形成氮气逸出","被黏粒吸附保存","全部转化为铵态氮被固定","随毛管水上升至表层"],"answer":[0],"explain":"淹水后土壤缺氧，反硝化细菌将硝态氮还原为氮气和氧化亚氮逸出，造成氮素损失。硝态氮带负电，不被带负电的胶体吸附；毛管上升水发生在非饱和条件下。","tag":"土壤化学性质"},{"id":"soil-b026","type":"single","stage":1,"stem":"改良酸性草地土壤、中和土壤酸度最常用的措施是","options":["施用石膏","施用硫酸铵","施用石灰","大量灌水淋洗"],"answer":[2],"explain":"石灰可中和土壤酸度、提高盐基饱和度并减轻铝毒，是改良酸性土最常用的措施。石膏用于碱土，硫酸铵是生理酸性肥会加剧酸化，淋洗不能改变酸度。","tag":"土壤化学性质"},{"id":"soil-b030","type":"single","stage":1,"stem":"土壤肥力的四大要素是","options":["氮、磷、钾、有机质","水、肥、气、热","砂、粉、黏、砾","酸碱度、交换量、盐基饱和度、含盐量"],"answer":[1],"explain":"土壤肥力是土壤同时供给植物水分、养分、空气和热量的能力，即水、肥、气、热四要素及其协调。氮磷钾只是养分种类，粒级与化学指标只是影响因素或表征。","tag":"土壤肥力"},{"id":"soil-b032","type":"single","stage":1,"stem":"土壤碱化度是指","options":["土壤可溶盐总量占干土重的百分比","交换性盐基占阳离子交换量的百分比","土壤pH高于7的土壤面积比例","交换性钠离子占阳离子交换量的百分比"],"answer":[3],"explain":"碱化度是交换性钠占阳离子交换量的百分数，是划分碱土的核心指标。可溶盐总量占干土重是含盐量，用于划分盐土；交换性盐基占交换量是盐基饱和度。","tag":"土壤盐碱化"},{"id":"soil-b033","type":"single","stage":1,"stem":"华北、东北草原区盐碱地盐分向表层积累最强烈的时期是","options":["春季","夏季","秋季","冬季"],"answer":[0],"explain":"春季气温回升快、蒸发强烈而降水少，毛管水携盐上升表聚，形成返盐高峰。夏季降水集中，盐分被淋洗下移；秋季蒸发减弱；冬季土壤冻结，蒸发很弱。","tag":"土壤盐碱化"},{"id":"soil-b034","type":"single","stage":1,"stem":"碱土的典型不良性状是","options":["表层疏松、通透性过强","含盐量高但酸碱度偏低","湿时泥泞、干时板结坚硬，透水性差","土壤有机质完全缺乏"],"answer":[2],"explain":"碱土交换性钠多，遇水分散膨胀呈泥泞状，干燥后收缩板结成硬壳，透水通气极差，酸碱度常高于9。表层疏松、酸碱度偏低与碱土性质相反。","tag":"土壤盐碱化"},{"id":"soil-b035","type":"single","stage":1,"stem":"改良碱土、降低其交换性钠含量最常用的化学改良剂是","options":["食盐","石膏","硫磺","硝酸铵"],"answer":[1],"explain":"石膏提供钙离子置换胶体上的交换性钠，钠盐随水排走，从而降低碱化度、改善结构。食盐和硝酸铵增加盐分和钠，硫磺虽能酸化土壤但作用缓慢。","tag":"土壤盐碱化"},{"id":"soil-b036","type":"single","stage":1,"stem":"盐土改良的首要措施是","options":["增施有机肥","种植耐盐牧草","深耕晒垡","灌水洗盐并建立排水系统"],"answer":[3],"explain":"盐土的核心问题是可溶盐过多，盐随水来、盐随水去，首先须引水洗盐并把含盐水排出，防止地下水位回升。增施有机肥、种耐盐牧草和深耕只是配合措施。","tag":"土壤盐碱化"},{"id":"soil-b039","type":"single","stage":1,"stem":"长期重度放牧对草地土壤物理性质的主要影响是","options":["容重增大、孔隙度减小","容重减小、孔隙度增大","容重和孔隙度均不变","容重减小、通气性增强"],"answer":[0],"explain":"牲畜践踏使表土压实，容重增大，总孔隙度与大孔隙减少，通气透水变差，进而影响根系生长和水分下渗。其余说法与践踏压实的实际作用方向相反。","tag":"草地土壤管理"},{"id":"soil-b040","type":"single","stage":1,"stem":"与常规翻耕相比，草地实施免耕或少耕的主要生态效益是","options":["提高土壤酸碱度","完全替代施肥","减轻风蚀水蚀、保护表层有机质","加快有机质分解"],"answer":[2],"explain":"免耕少耕减少对表土的扰动，保留残茬覆盖，可减轻风蚀水蚀、减少有机质矿化并保蓄水分。它不能提高酸碱度，也不能替代施肥，且减缓而非加快有机质分解。","tag":"草地土壤管理"},{"id":"soil-b041","type":"single","stage":1,"stem":"建植以豆科牧草为主的人工草地时，增施磷肥的主要作用是","options":["提高土壤酸碱度","杀灭土壤病原菌","增加土壤通气性","促进根瘤形成与固氮"],"answer":[3],"explain":"磷是根瘤形成、豆血红蛋白合成和固氮酶活性所必需的元素，供磷充足可促进结瘤固氮和根系发育。磷肥不改变土壤酸碱度，也无杀菌和改善通气的作用。","tag":"草地土壤管理"},{"id":"soil-b042","type":"single","stage":1,"stem":"草原地区植被遭到破坏后，在干燥多风条件下最易发生的土壤退化类型是","options":["盐渍化","风蚀沙化","潜育化","酸化"],"answer":[1],"explain":"干旱多风区植被覆盖减少后，表土失去保护，细颗粒被风力吹蚀，形成风蚀沙化。盐渍化需强烈蒸发积盐条件，潜育化发生在长期积水还原环境，酸化多见于湿润区淋溶。","tag":"草地土壤管理"},{"id":"soil-b046","type":"single","stage":1,"stem":"下列各项中，不属于土壤五大自然成土因素的是","options":["母质","气候","地形","耕作措施"],"answer":[3],"explain":"五大自然成土因素是母质、气候、生物、地形和时间。耕作、施肥、灌溉属于人为因素，虽能改变土壤发育方向，但不列入自然成土因素，故本题选耕作措施。母质、气候和地形都是公认的自然成土因素。","tag":"土壤成土因素"},{"id":"soil-b047","type":"single","stage":1,"stem":"土壤形成的物质基础是","options":["成土母质","土壤有机质","土壤微生物","土壤水分"],"answer":[0],"explain":"成土母质是岩石风化后形成的疏松堆积物，为土壤提供矿物骨架和矿质养分，是土壤形成的物质基础。有机质和微生物是生物因素作用的结果，水分只是成土条件之一，都不能充当物质基础。","tag":"土壤成土因素"},{"id":"soil-b048","type":"single","stage":1,"stem":"土壤形成过程的实质是","options":["岩石在温度变化下不断破碎的过程","母质被流水搬运并重新堆积的过程","地质大循环与生物小循环的对立统一过程","有机质被微生物彻底分解为无机物的过程"],"answer":[2],"explain":"土壤形成是地质大循环与生物小循环对立统一的过程：风化释放的养分经生物吸收、积累而保蓄，植物残体分解后又归还养分。单纯岩石破碎或母质搬运只是地质过程，有机质分解只是小循环的一个环节。","tag":"土壤成土因素"},{"id":"soil-b049","type":"single","stage":1,"stem":"人类活动对土壤形成的影响，主要表现为","options":["只改变土壤表层颜色，不影响土壤性质","通过耕作、施肥、灌溉等加速或改变土壤的发育方向","完全取代气候和生物因素而独立成土","只会使土壤有机质含量不断下降"],"answer":[1],"explain":"人类通过耕作、施肥、灌溉、排水等措施，可在较短时期内加速或改变土壤发育方向，形成耕作土壤。人类活动不能完全取代气候、生物等自然因素，也不只是改变颜色；管理得当可使有机质含量提高。","tag":"土壤成土因素"},{"id":"soil-b052","type":"single","stage":1,"stem":"土壤容重的正确含义是","options":["单位体积土壤固相物质的干重","单位体积原状土壤中液相物质的质量","单位体积原状土壤（包括孔隙）的干重","单位体积土壤在饱和持水状态下的质量"],"answer":[2],"explain":"容重是单位体积原状土壤（包括土粒和孔隙）在105℃烘干后的重量，常用克每立方厘米表示。它包含孔隙体积，数值必然小于比重；只计固相物质干重的是比重，计饱和水状态质量则属于另一指标。","tag":"土壤物理性质"},{"id":"soil-b053","type":"single","stage":1,"stem":"矿质土壤的比重（密度）数值一般约为","options":["1.0~1.2 克每立方厘米","2.6~2.7 克每立方厘米","1.2~1.5 克每立方厘米","3.5~4.0 克每立方厘米"],"answer":[1],"explain":"土壤比重是单位体积固相物质的重量，矿质土壤的数值较稳定，一般在2.6~2.7克每立方厘米之间。1.0~1.5克每立方厘米是多数土壤容重的范围，容重因孔隙多少而变化，明显小于比重。","tag":"土壤物理性质"},{"id":"soil-b054","type":"single","stage":1,"stem":"土壤非毛管孔隙（通气孔隙）的主要作用是","options":["保存植物可利用的有效水","吸附并保持交换性阳离子","为固氮微生物提供专门场所","通气透水，并容纳土壤空气"],"answer":[3],"explain":"非毛管孔隙孔径较大，是空气交换和水分向下渗透的通道，主要起通气透水作用。保存有效水的主要是毛管孔隙；吸附阳离子依靠土壤胶体；固氮是特定微生物的功能，与非毛管孔隙无直接关系。","tag":"土壤物理性质"},{"id":"soil-b055","type":"single","stage":1,"stem":"与砂质土相比，黏质土在肥力上的典型特点是","options":["保水保肥能力强，但通气透水性差","通气透水性强，但保水保肥能力弱","有机质分解快，速效养分供应充足","毛管孔隙少，有效水含量低"],"answer":[0],"explain":"黏质土黏粒含量高、比表面积大，吸附保蓄水分和养分的能力强，但孔隙细小、通气透水差，容易板结。通气强而保肥弱是砂质土的特点；黏质土有机质分解慢，且毛管孔隙多、有效水含量并不低。","tag":"土壤物理性质"},{"id":"soil-b056","type":"single","stage":1,"stem":"促进土壤团粒结构形成的主要胶结物质是","options":["氯化钠等可溶性盐","腐殖质和多糖类有机胶体","石英砂粒","碳酸钙粉末"],"answer":[1],"explain":"腐殖质、微生物多糖和黏粒是形成水稳性团粒的主要胶结物质，它们把土粒胶结成粒径适中的团聚体。可溶性盐会破坏结构并造成盐害，石英砂粒没有胶结能力，碳酸钙只能形成较粗的团聚体。","tag":"土壤物理性质"},{"id":"soil-b057","type":"single","stage":1,"stem":"与近地面大气相比，土壤空气的典型特征是","options":["氧气含量高，二氧化碳含量低","水汽含量低，几乎不含水汽","氧气和二氧化碳含量都与大气相同","二氧化碳含量高，氧气含量低"],"answer":[3],"explain":"土壤中有机质分解和根系呼吸消耗氧气、释放二氧化碳，且气体交换受孔隙状况限制，故土壤空气中二氧化碳含量明显高于大气、氧气低于大气。土壤空气常接近水汽饱和，与大气组成并不相同。","tag":"土壤物理性质"},{"id":"soil-b061","type":"single","stage":1,"stem":"对植物有效性最高、是旱地植物吸水主要来源的土壤水分形态是","options":["吸湿水","膜状水","毛管水","重力水"],"answer":[2],"explain":"毛管水受毛管力保持在细小孔隙中，移动快、可被根系吸收，是旱地植物用水的主要来源。吸湿水被土粒牢固吸附，植物不能利用；膜状水移动极慢、有效性很低；重力水很快下渗流失，难以持续利用。","tag":"土壤水分"},{"id":"soil-b062","type":"single","stage":1,"stem":"关于土壤吸湿水的叙述，正确的是","options":["是植物吸收利用的主要水分形态","被土粒表面牢固吸附，植物不能利用","存在于毛管孔隙中，可以自由移动","只在降雨后的短时间内存在"],"answer":[1],"explain":"吸湿水是土粒靠分子引力和静电引力从空气中吸附的水汽，吸附力极大，植物根系无法吸收。它不同于可移动的毛管水，也不只出现在降雨之后；膜状水有效性很低，只有毛管水才是主要水源。","tag":"土壤水分"},{"id":"soil-b063","type":"single","stage":1,"stem":"土壤饱和持水量（全蓄水量）是指","options":["土壤孔隙全部被水充满时的含水量","土壤仅保持吸湿水时的含水量","重力水刚刚排尽、毛管水达到最大时的含水量","植物开始永久凋萎时的含水量"],"answer":[0],"explain":"饱和持水量是土壤孔隙全部充满水时的最大含水量。重力水排尽、毛管水最大时是田间持水量；仅保持吸湿水时是吸湿系数；植物永久凋萎时对应凋萎系数，三者含义各不相同。","tag":"土壤水分"},{"id":"soil-b064","type":"single","stage":1,"stem":"土壤水分在土壤中运动的总趋势是","options":["由温度高处向温度低处移动，与水分多少无关","由黏粒多的地方向砂粒多的地方移动","由下层始终向上层移动","由水势高处向水势低处移动"],"answer":[3],"explain":"土壤水分运动的根本原因是水势差，水总是从水势高处流向水势低处，包括液态流动和气态扩散。温度、质地和层次只能通过改变水势间接影响运动方向，不能作为普遍规律。","tag":"土壤水分"},{"id":"soil-b068","type":"single","stage":1,"stem":"土壤胶体带负电荷的主要来源是","options":["土壤溶液中的可溶性盐","土壤空气中的二氧化碳","黏土矿物的同晶替代和表面羟基的解离","土壤中尚未分解的植物残体"],"answer":[2],"explain":"黏土矿物晶格中低价阳离子同晶替代高价阳离子，使胶体带永久负电荷；表面羟基解离也产生可变负电荷，二者是负电荷的主要来源。可溶性盐和二氧化碳不带负电，植物残体须腐解形成腐殖质后才起胶体作用。","tag":"土壤化学性质"},{"id":"soil-b069","type":"single","stage":1,"stem":"土壤中起主要酸碱缓冲作用的成分是","options":["土壤腐殖质","石英砂","砾石","土壤空气"],"answer":[0],"explain":"土壤腐殖质带有大量可变电荷和官能团，能吸附或释放氢离子，对酸碱变化起主要缓冲作用；石英砂、砾石和土壤空气的缓冲能力很弱。","tag":"土壤化学性质"},{"id":"soil-b070","type":"single","stage":1,"stem":"土壤缓冲性最强的情况通常是","options":["砂质土且有机质含量低","黏质土且有机质含量高","含盐量很高的盐土","交换性钠很多的碱土"],"answer":[1],"explain":"土壤缓冲性主要来自黏粒和腐殖质的交换吸附作用，二者含量越高缓冲能力越强，故黏质土且有机质高时缓冲性最强。砂土有机质少、缓冲性弱；盐土和碱土盐分或钠离子过多，缓冲能力反而较差且易危害植物。","tag":"土壤化学性质"},{"id":"soil-b071","type":"single","stage":1,"stem":"关于土壤潜性酸的叙述，正确的是","options":["指土壤溶液中自由氢离子直接表现出的酸度","只能由土壤中的碳酸和有机酸解离产生","就是pH计在田间测得的数值","包括交换性酸和水解性酸，被交换进入溶液后才表现出酸性"],"answer":[3],"explain":"潜性酸包括交换性酸和水解性酸，由胶体表面吸附的氢、铝离子被其他阳离子交换进入溶液后产生，故D正确。溶液中自由氢离子直接表现的是活性酸，也是pH计测定的对象；潜性酸不只来自碳酸。","tag":"土壤化学性质"},{"id":"soil-b075","type":"single","stage":1,"stem":"通常把土壤肥力因素概括为","options":["水、肥、气、热","氮、磷、钾、有机质","砂粒、粉粒、黏粒、砾石","腐殖质、黏土矿物、氧化物、盐类"],"answer":[0],"explain":"土壤肥力因素通常概括为水、肥、气、热四个方面，它们相互制约并共同影响牧草生长。氮磷钾是养分元素，砂粒粉粒黏粒是粒级，腐殖质等是土壤组成物质，都不能完整概括肥力因素。","tag":"土壤肥力"},{"id":"soil-b077","type":"single","stage":1,"stem":"盐土与碱土在性质上的主要区别是","options":["盐土不含可溶性盐，碱土含大量可溶性盐","盐土呈强碱性，碱土呈中性","盐土以可溶性盐类积累为主，碱土以交换性钠含量高、碱化度大为主","盐土只分布在滨海，碱土只分布在草原"],"answer":[2],"explain":"盐土以氯化物、硫酸盐等可溶性盐大量积累为特征；碱土的可溶盐不一定多，但交换性钠占阳离子交换量比例大、碱化度通常超过15%，呈强碱性且物理性质恶劣。A、B把两者特征说反，D也不符合实际分布。","tag":"土壤盐碱化"},{"id":"soil-b078","type":"single","stage":1,"stem":"盐土与碱土的主要区别是","options":["盐土含盐量高，碱土交换性钠高、pH高","盐土pH高，碱土含盐量高","盐土只分布在滨海，碱土只分布在内陆","盐土不含钠，碱土不含钙"],"answer":[0],"explain":"盐土以可溶性盐大量积累为特征；碱土以交换性钠含量高、pH高、物理性质恶化为特征。二者常伴生，不能按滨海/内陆或含钠、含钙简单区分。","tag":"土壤盐碱化"},{"id":"soil-b079","type":"single","stage":1,"stem":"草地次生盐渍化形成的最主要原因是","options":["灌溉不当使地下水位抬高，强烈蒸发导致盐分表聚","降水过多使盐分随水下渗到深层","长期种植豆科牧草使土壤氮素累积","围栏封育后枯落物覆盖地表"],"answer":[0],"explain":"次生盐渍化多因灌溉水量过大、排水不畅，抬高了地下水位，潜水沿毛管上升蒸发，把盐分带到表层积聚。降水多会淋洗盐分；种植豆科牧草和枯落物覆盖都不会引起盐分表聚，反而有利于抑制返盐。","tag":"土壤盐碱化"},{"id":"soil-b080","type":"single","stage":1,"stem":"农谚“盐随水来、盐随水去”说明土壤盐分运动主要取决于","options":["土壤有机质含量","土壤水分的运动方向","土壤空气的组成","土壤微生物的活动"],"answer":[1],"explain":"可溶性盐随土壤水移动，水分上升蒸发则盐分向表层积聚，水分下渗则盐分被淋洗，因此盐分运动方向由水分运动决定。有机质、空气和微生物会影响土壤性质，但不是盐分迁移的直接载体。","tag":"土壤盐碱化"},{"id":"soil-b084","type":"single","stage":1,"stem":"长期过度放牧对草地表层土壤最直接的影响是","options":["土壤有机质含量显著升高","土壤孔隙度增大，入渗增强","土壤盐分被大量淋洗","土壤被践踏紧实，容重增大、孔隙度下降"],"answer":[3],"explain":"牲畜反复践踏使表层土壤压紧，容重增大、孔隙度下降，入渗和通气变差；采食又减少凋落物归还，使有机质下降。有机质升高、孔隙增大和盐分淋洗都不是过度放牧的直接结果。","tag":"草地土壤管理"},{"id":"soil-b085","type":"single","stage":1,"stem":"草地土壤最易发生风蚀的条件是","options":["植被盖度高、地表有枯落物覆盖","土壤湿润、团聚体稳定","干旱多风、植被稀疏、地表裸露","地势平坦、草层茂密"],"answer":[2],"explain":"风蚀需要风速超过起沙风速且地表缺乏保护，干旱多风使土粒分散、植被稀疏使地表裸露，因此最容易起沙。植被盖度高、枯落物覆盖、土壤湿润和草层茂密都能削弱风速、固定土粒，不易风蚀。","tag":"草地土壤管理"},{"id":"soil-b086","type":"single","stage":1,"stem":"在退化草地上采用免耕补播改良，其主要生态意义是","options":["减少对表土的扰动和破坏，保护土壤结构","彻底翻埋原有植被，消除种间竞争","把表层土壤翻到下层以增加有机质","加快土壤水分蒸发以降低地下水位"],"answer":[0],"explain":"免耕补播不翻动土层，只破土播种，可减少表土扰动、保护结构和有机质，降低风蚀水蚀风险。彻底翻埋植被和把表土翻到下层都是常规翻耕的做法，与免耕相反；加快蒸发也不利于保水。","tag":"草地土壤管理"},{"id":"soil-b087","type":"single","stage":1,"stem":"增施腐熟厩肥对草地土壤的主要作用是","options":["直接杀死土壤中的线虫和病原菌","提高有机质含量，改善结构并增强保水保肥能力","迅速提高土壤含盐量以抑制杂草","使土壤pH值立即降至强酸性"],"answer":[1],"explain":"厩肥富含有机质和养分，施入后经腐殖化提高有机质含量，促进团粒形成，改善通气、透水和保水保肥能力。它不能直接杀菌，也不会大幅提高含盐量或使土壤骤然变酸，这些说法都夸大或歪曲了作用。","tag":"草地土壤管理"},{"id":"soil-b088","type":"single","stage":1,"stem":"与自由连续放牧相比，划区轮牧对草地土壤的有利影响是","options":["使牲畜集中采食，加快有机质积累","完全禁止牲畜进入，恢复原始植被","给牧草留出恢复时间，减轻践踏和局部过牧","延长放牧时间，提高土壤含水量"],"answer":[2],"explain":"划区轮牧把草地分成小区轮流利用，牧草有休养恢复的机会，可减轻反复践踏造成的紧实和局部过牧。它并未禁止放牧，也不是靠集中采食积累有机质；延长放牧时间反而加重利用强度。","tag":"草地土壤管理"},{"id":"soil-b091","type":"single","stage":1,"stem":"下列各项中，不属于五大自然成土因素的是","options":["气候","母质","地形","容重"],"answer":[3],"explain":"五大自然成土因素是气候、母质、生物、地形和时间。容重是反映土壤紧实程度的物理指标，属成土结果而非成土因素，故D项不属于；其余三项均为经典成土因素。","tag":"土壤成土因素"},{"id":"soil-b093","type":"single","stage":1,"stem":"土壤中可溶性物质和细土粒随下渗水由上层向下层迁移的过程称为","options":["淋溶作用","淀积作用","潜育作用","盐渍化作用"],"answer":[0],"explain":"淋溶作用是物质随水下移的过程，可在剖面中形成淋溶层。淀积作用是下移物质在底层聚积，方向相反；潜育作用指长期渍水形成的还原过程。故选A。","tag":"土壤成土因素"},{"id":"soil-b094","type":"single","stage":1,"stem":"在土壤剖面中，仍保留母岩特征、成土作用微弱的层次是","options":["A层","B层","C层","R层"],"answer":[2],"explain":"C层为母质层，由风化碎屑组成，成土作用微弱并保留母岩特征。A层为腐殖质层，B层为淀积层，R层为坚硬基岩，均不符合题意。","tag":"土壤成土因素"},{"id":"soil-b096","type":"single","stage":1,"stem":"与其他成土因素相比，人为活动对土壤的作用特点是","options":["作用缓慢且不可逆","只影响土壤温度","仅改变土壤质地","作用速度快并具有定向性"],"answer":[3],"explain":"人为活动可定向调控土壤，作用速度快、强度大，如施肥改土数年即可见效。A项错在人为作用并不缓慢，B、C项把影响范围缩小为单一性质，均不全面。","tag":"土壤成土因素"},{"id":"soil-b097","type":"single","stage":1,"stem":"土壤质地分类的主要依据是","options":["土壤孔隙的多少","各级土粒的相对含量比例","土壤有机质含量","土壤颜色的深浅"],"answer":[1],"explain":"质地由砂粒、粉粒、黏粒等各级土粒的相对比例决定，据此划分砂土、壤土和黏土。孔隙多少受结构和容重影响，有机质与颜色都不是质地分类依据。","tag":"土壤物理性质"},{"id":"soil-b098","type":"single","stage":1,"stem":"同一质地的土壤，容重越大说明","options":["土壤越疏松，孔隙度越大","土壤有机质含量越高","土壤质地越黏重","土壤越紧实，总孔隙度越小"],"answer":[3],"explain":"容重是单位容积原状土壤的干重，容重越大表明土体越紧实、孔隙越少，总孔隙度越小。A项把关系说反，B、C项把容重与有机质、质地混为一谈。","tag":"土壤物理性质"},{"id":"soil-b100","type":"single","stage":1,"stem":"土壤中孔径较小、靠毛管力保持水分且对植物有效的孔隙称为","options":["毛管孔隙","非毛管孔隙","通气孔隙","无效孔隙"],"answer":[0],"explain":"毛管孔隙孔径小，靠毛管力持水，所持水分是植物利用的主要水源。非毛管孔隙即通气孔隙，孔径大，主要起通气排水作用，持水能力弱，故不选B、C。","tag":"土壤物理性质"},{"id":"soil-b102","type":"single","stage":1,"stem":"土壤热容量较大的主要原因是","options":["土壤水分含量较高","土壤空气含量较高","土壤砂粒较多","土壤颜色较浅"],"answer":[0],"explain":"水的比热容远大于土壤矿物质和空气，土壤水分含量越高，热容量越大，升温和降温都较缓慢；空气热容量小，砂粒和颜色对热容量的影响相对次要。","tag":"土壤物理性质"},{"id":"soil-b103","type":"single","stage":1,"stem":"土壤含水量增加时，其热容量和升温速度的变化是","options":["热容量减小，升温变慢","热容量增大，升温变慢","热容量不变，升温变快","热容量增大，升温变快"],"answer":[1],"explain":"水的比热容大，土壤含水量增加后热容量增大，吸收同样热量时升温幅度变小、升温变慢。A项方向相反，D项把热容量与升温速度的关系说反。","tag":"土壤物理性质"},{"id":"soil-b105","type":"single","stage":1,"stem":"土壤颗粒中，直径大于2 mm的土粒称为","options":["砂粒","粉粒","黏粒","石砾"],"answer":[3],"explain":"按粒径分级，大于2 mm的为石砾，2~0.02 mm为砂粒，0.02~0.002 mm为粉粒，小于0.002 mm为黏粒。A、B、C项粒径均小于2 mm，不符合题意。","tag":"土壤物理性质"},{"id":"soil-b106","type":"single","stage":1,"stem":"被土粒表面分子引力紧紧吸附、植物几乎不能利用的水分是","options":["吸湿水","膜状水","毛管水","重力水"],"answer":[0],"explain":"吸湿水受土粒表面强大吸附力束缚，植物无法吸收。膜状水可被部分利用，毛管水是主要可利用水源，重力水会下渗流失，三者与吸湿水性质不同。","tag":"土壤水分"},{"id":"soil-b108","type":"single","stage":1,"stem":"土壤中植物吸收利用最主要的水分形态是","options":["吸湿水","毛管水","膜状水","重力水"],"answer":[1],"explain":"毛管水受毛管力保持、移动较快，是植物吸收的主要水源。吸湿水被牢固吸附不能利用，膜状水移动缓慢，重力水易下渗流失，故不选A、C、D。","tag":"土壤水分"},{"id":"soil-b110","type":"single","stage":1,"stem":"土壤质量含水量是指","options":["土壤中水分的体积占土壤总容积的百分数","土壤中水分的质量占湿土质量的百分数","土壤中水分的质量占烘干土质量的百分数","土壤中水分的体积占孔隙容积的百分数"],"answer":[2],"explain":"质量含水量以烘干土质量为基数，计算水分质量所占百分数。A、D项以容积为基数属容积含水量，B项误用湿土质量作分母，结果偏低。","tag":"土壤水分"},{"id":"soil-b111","type":"single","stage":1,"stem":"降水或灌溉后，土壤中超过田间持水量的那部分水分主要","options":["受重力作用向下渗漏","被土粒表面牢固吸附","转化为吸湿水","由毛管力向上移动"],"answer":[0],"explain":"田间持水量是毛管悬着水的最大量，超过部分不能为毛管力保持，在重力作用下向下渗漏，形成重力水。B、C项为吸附作用，D项方向错误。","tag":"土壤水分"},{"id":"soil-b113","type":"single","stage":1,"stem":"土壤胶体表面吸附的阳离子被溶液中其他阳离子取代的现象称为","options":["沉淀作用","专性吸附","阳离子交换作用","阴离子吸附作用"],"answer":[2],"explain":"土壤胶体多带负电荷，吸附的阳离子可与溶液中阳离子等当量交换，称阳离子交换作用，是保肥供肥的基础。A、B、D项均不涉及同号离子间的交换。","tag":"土壤化学性质"},{"id":"soil-b114","type":"single","stage":1,"stem":"土壤胶体上吸附的盐基离子占交换性阳离子总量的百分比称为","options":["盐基饱和度","碱化度","阳离子交换量","水解性酸度"],"answer":[0],"explain":"盐基饱和度反映交换性盐基离子所占比例，饱和度高说明土壤保肥供肥能力较好。碱化度特指交换性钠的比例，阳离子交换量是总量指标，均不同。","tag":"土壤化学性质"},{"id":"soil-b117","type":"single","stage":1,"stem":"酸性土壤施用石灰的主要作用是","options":["降低土壤pH","中和土壤酸性并补充钙素","增加土壤含盐量","固定土壤中的磷素"],"answer":[1],"explain":"石灰中的钙可中和土壤酸度、提高盐基饱和度，并补充钙素，改善结构。A项方向相反，C项会增加盐分，D项石灰并不起固定磷素的作用。","tag":"土壤化学性质"},{"id":"soil-b118","type":"single","stage":1,"stem":"土壤具有缓冲性的主要原因是","options":["土壤微生物数量多","土壤中含有胶体和弱酸及其盐类","土壤孔隙度大","土壤含水量高"],"answer":[1],"explain":"土壤胶体吸附的交换性离子与弱酸及其盐类构成缓冲体系，可减弱外来酸碱引起的pH变化。微生物、孔隙度和含水量不构成缓冲体系，故不选A、C、D。","tag":"土壤化学性质"},{"id":"soil-b119","type":"single","stage":1,"stem":"保持和提高土壤肥力的核心措施是","options":["增施有机肥、合理轮作与用养结合","长期单施化肥","长期大水漫灌","连续深翻晒垡"],"answer":[0],"explain":"增施有机肥可提高有机质和团聚体，合理轮作与用养结合能平衡养分、减轻病虫草害；长期单施化肥易酸化板结，大水漫灌破坏结构，连续深翻增加侵蚀风险。","tag":"土壤肥力"},{"id":"soil-b121","type":"single","stage":1,"stem":"改良碱土时施用石膏的主要作用是","options":["提供钙离子置换交换性钠","降低土壤温度","增加土壤有机质","提高土壤含盐量"],"answer":[0],"explain":"石膏（硫酸钙）提供钙离子，把土壤胶体上的交换性钠置换出来，随灌溉水排走，从而降低碱化度和pH、改善土壤结构；石膏不提供有机质，也不降低温度。","tag":"土壤盐碱化"},{"id":"soil-b123","type":"single","stage":1,"stem":"灌区草地发生次生盐碱化，最主要的人为原因是","options":["大水漫灌且排水不畅，地下水位上升","长期增施有机肥","种植耐盐牧草","实行围栏封育"],"answer":[0],"explain":"灌溉不当使地下水位抬升，强烈蒸发把盐分带到表层聚积，形成次生盐碱化。增施有机肥、种耐盐牧草和围栏封育均有改良作用，不会导致盐分积累。","tag":"土壤盐碱化"},{"id":"soil-b124","type":"single","stage":1,"stem":"盐碱土对牧草生长的主要危害是","options":["降低土壤温度，抑制种子发芽","提高土壤溶液渗透压，根系吸水困难","固定土壤磷素，造成缺磷","破坏土壤结构，使通气过强"],"answer":[1],"explain":"盐分高使土壤溶液渗透压升高，根系吸水困难，甚至发生反渗透，同时伴随离子毒害。A、C不是主要危害，D项与盐碱土结构板结、通气不良相反。","tag":"土壤盐碱化"},{"id":"soil-b127","type":"single","stage":1,"stem":"碱土改良时常施用石膏，其原理是","options":["钙离子置换胶体上的交换性钠","石膏直接中和土壤中的可溶盐","石膏增加土壤有机质含量","石膏降低地下水位"],"answer":[0],"explain":"石膏提供钙离子，把胶体上吸附的交换性钠置换出来，随灌溉水淋洗排出，从而改善土壤结构和碱性。石膏不能直接除盐，也不增加有机质。","tag":"土壤盐碱化"},{"id":"soil-b128","type":"single","stage":1,"stem":"在盐碱草地上种植耐盐牧草，对土壤的主要改良作用是","options":["迅速降低地下水位","直接中和土壤碱性","覆盖地面减少蒸发，改善结构并增加有机质","彻底消除土壤中的盐分"],"answer":[2],"explain":"耐盐牧草覆盖地面可减少蒸发和返盐，根系和残体改善土壤结构、增加有机质，属生物改良。它不能迅速降低地下水位，也不能直接中和碱性或彻底除盐。","tag":"土壤盐碱化"},{"id":"soil-b129","type":"single","stage":1,"stem":"与连续放牧相比，划区轮牧对草地土壤的主要好处是","options":["增加土壤含盐量","减轻践踏和板结，保持植被覆盖","加速土壤有机质分解","提高地下水位"],"answer":[1],"explain":"划区轮牧让草地在放牧间隙恢复，减轻牲畜践踏造成的板结，保持植被盖度，有利于土壤结构改善。A、C、D项都是草地退化的表现，不是轮牧的好处。","tag":"草地土壤管理"},{"id":"soil-b132","type":"single","stage":1,"stem":"草地表层土壤板结的主要成因是","options":["过度放牧和机械压实","施用有机肥过多","降水过多","种植豆科牧草"],"answer":[0],"explain":"牲畜践踏和机械作业压实土体，破坏团粒结构，使容重增大、孔隙减少，形成板结。增施有机肥和种豆科牧草能改善结构，降水多并不直接造成板结。","tag":"草地土壤管理"},{"id":"soil-b133","type":"single","stage":1,"stem":"退化草地补播优良牧草的主要作用是","options":["彻底改变土壤质地","消除土壤中的盐分","提高土壤容重","增加优良牧草比例和地表覆盖"],"answer":[3],"explain":"补播可提高优良牧草比例和植被盖度，增加有机质归还，改善土壤结构。补播不能改变质地、消除盐分，也不会以提高容重为目的，故A、B、C错。","tag":"草地土壤管理"},{"id":"soil-s01","type":"single","stem":"在五大自然成土因素中，决定土壤有机质积累量与分解速度对比关系的是","options":["母质","气候","地形","时间"],"answer":[1],"explain":"气候通过水热条件同时控制植被类型与微生物活性，从而决定有机质“生产”与“分解”的对比关系；母质提供矿质基础，地形只再分配水热，时间决定发育程度，均不直接决定该对比关系。","tag":"土壤成土因素","level":1,"stage":1,"standard":true},{"id":"soil-s02","type":"single","stem":"关于成土母质对土壤性质影响的叙述，正确的是","options":["母质只影响土壤的矿物组成，不影响养分状况","母质是土壤矿质养分的最初来源，其矿物组成和颗粒粗细影响土壤质地与保水保肥能力","母质对土壤性质的影响随时间推移不断增强","花岗岩风化形成的土壤富含钾、钠，质地黏重"],"answer":[1],"explain":"母质是土壤矿质养分的最初来源，其矿物组成和颗粒粗细直接影响质地、保水保肥能力；随时间推移母质的影响逐渐减弱，花岗岩风化后富含钾但质地偏砂，故A、C、D错误。","tag":"土壤成土因素","level":1,"stage":1,"standard":true},{"id":"soil-s03","type":"single","stem":"在土壤形成过程中，生物因素的核心作用是","options":["提供土壤矿物质和原始颗粒","促进养分循环与有机质积累，是土壤肥力形成的决定性因素","决定土壤的温度状况和冻融过程","加速岩石的物理崩解"],"answer":[1],"explain":"生物（植物、微生物、动物）通过光合产物输入、残体分解和养分循环，使有机质积累并形成肥力，是五大成土因素中最活跃、具决定性的因素；母质提供矿质，地形影响水热再分配。","tag":"土壤成土因素","level":1,"stage":1,"standard":true},{"id":"soil-s04","type":"single","stem":"地形对成土过程的主要影响表现为","options":["直接为土壤提供矿质养分","通过重新分配水热条件和物质迁移影响土壤发育","决定土壤微生物的种群组成","改变成土母质的矿物成分"],"answer":[1],"explain":"地形通过海拔、坡度和坡向重新分配水热与物质，引起淋溶、淀积和侵蚀的差异，从而影响土壤发育方向与厚度；地形不提供矿质养分，也不改变母质矿物成分。","tag":"土壤成土因素","level":1,"stage":1,"standard":true},{"id":"soil-s05","type":"single","stem":"关于成土时间与土壤发育关系的叙述，正确的是","options":["成土时间越长，土壤一定越肥沃","土壤发育程度随成土时间延长而提高，但不同气候条件下达到相对平衡所需时间不同","成土时间长短不影响土壤剖面的发育","湿润地区土壤的发育速度一般慢于干旱地区"],"answer":[1],"explain":"成土时间越长，风化与剖面发育越充分，但不同气候条件下达到相对平衡所需时间不同；湿润区水热充足、风化与淋溶强，发育快于干旱区，故A、C、D错误。","tag":"土壤成土因素","level":1,"stage":1,"standard":true},{"id":"soil-s06","type":"single","stem":"与黏质土相比，砂质土的特点是","options":["保水保肥能力强，阳离子交换量大","通气透水性好，但保水保肥能力差","毛管孔隙多，毛管水上升高度大","有机质含量高，团粒结构发达"],"answer":[1],"explain":"砂土颗粒粗、非毛管孔隙多，通气透水好而保水保肥差；黏土则毛管孔隙多、比表面大、CEC高。A、C、D描述的均是黏质土的特征，故不选。","tag":"土壤物理性质","level":1,"stage":1,"standard":true},{"id":"soil-s07","type":"single","stem":"团粒结构被认为是理想的土壤结构，其主要原因是","options":["增加土壤容重，提高土壤紧实度","使毛管孔隙与非毛管孔隙比例协调，兼具通气透水与保水保肥能力","降低土壤有机质含量，减少养分释放","抑制土壤微生物活动，减少养分损失"],"answer":[1],"explain":"团粒结构使毛管孔隙与非毛管孔隙比例协调，水稳性团聚体既保证通气透水，又能保持毛管水；它降低而非提高容重，并有利于而非抑制微生物活动，故A、C、D错误。","tag":"土壤物理性质","level":1,"stage":1,"standard":true},{"id":"soil-s08","type":"single","stem":"一般耕地土壤的总孔隙度约为","options":["20%~30%","40%~50%","50%~60%","70%~80%"],"answer":[2],"explain":"一般耕地土壤总孔隙度在50%~60%，其中通气孔隙约10%~20%、毛管孔隙约30%~40%；砂土偏低、黏土偏高，20%~30%明显偏低，70%~80%则过于疏松。","tag":"土壤物理性质","level":1,"stage":1,"standard":true},{"id":"soil-s10","type":"single","stem":"田间持水量是指","options":["土壤全部孔隙被水充满时的含水量","土壤充分灌水或降雨后，重力水排尽时土壤所保持的水量","植物发生永久凋萎时土壤的含水量","毛管水全部消失时土壤的含水量"],"answer":[1],"explain":"田间持水量是重力水排尽后由毛管力保持的水量，为旱地有效水上限；A为饱和含水量，C为凋萎系数，D接近凋萎系数以下，三者均不是田间持水量。","tag":"土壤水分","level":1,"stage":1,"standard":true},{"id":"soil-s13","type":"single","stem":"关于土壤pH对养分有效性影响的叙述，正确的是","options":["磷在pH 6.5~7.5时有效性最高","铁、锰在碱性条件下有效性最高","钼在酸性条件下有效性最高","氮素的有效性不受土壤pH影响"],"answer":[0],"explain":"pH 6.5~7.5时磷以H₂PO₄⁻、HPO₄²⁻为主，被铁铝或钙固定较少，有效性最高；铁锰在酸性下有效，钼在碱性下有效，氮的矿化与硝化也明显受pH影响，故B、C、D错误。","tag":"土壤化学性质","level":1,"stage":1,"standard":true},{"id":"soil-s14","type":"single","stem":"土壤阳离子交换量（CEC）的大小主要取决于","options":["土壤有机质和黏土矿物的数量与类型","土壤总孔隙度","土壤含水量","土壤温度"],"answer":[0],"explain":"CEC来自黏土矿物和有机质表面的负电荷，其大小取决于二者的数量与类型；孔隙度、含水量和温度影响离子扩散与运输，但不决定交换位点的总量。","tag":"土壤化学性质","level":1,"stage":1,"standard":true},{"id":"soil-s16","type":"single","stem":"土壤肥力是指","options":["土壤提供植物生长所需水分、养分、空气和热量的能力","土壤中有机质含量的高低","土壤中矿质养分元素的总储量","土壤酸碱反应与缓冲能力的大小"],"answer":[0],"explain":"土壤肥力是土壤同时供给植物水分、养分、空气和热量并协调其比例的能力，是物理、化学、生物性质的综合体现；有机质含量、养分储量和pH只是肥力的部分指标。","tag":"土壤肥力","level":1,"stage":1,"standard":true},{"id":"soil-b005","type":"multi","stage":1,"stem":"下列因素中属于自然成土因素的有","options":["气候","耕作","地形","生物"],"answer":[0,2,3],"explain":"自然成土因素包括气候、母质、生物、地形和时间，气候、地形、生物均在列。耕作是人类生产活动，属人为成土因素，可改变土壤性质但不属自然因素。","tag":"土壤成土因素"},{"id":"soil-b012","type":"multi","stage":1,"stem":"下列因素中，影响土壤容重大小的有","options":["土壤颜色","土壤质地","有机质含量","结构状况"],"answer":[1,2,3],"explain":"质地越黏、有机质越多、团粒结构越发育，容重越小；压实则容重增大。土壤颜色只反映矿物和有机质组成，不决定单位容积重量。","tag":"土壤物理性质"},{"id":"soil-b013","type":"multi","stage":1,"stem":"团粒结构有利于土壤肥力提高，主要表现在","options":["协调土壤水、气、热状况","提高土壤比重","增强保肥与供肥能力","改善土壤耕性"],"answer":[0,2,3],"explain":"团粒结构使毛管孔隙与非毛管孔隙比例适当，协调水气热，并改善耕性和保肥供肥。土壤比重取决于矿物组成，一般在2.6～2.7，不因结构而改变。","tag":"土壤物理性质"},{"id":"soil-b020","type":"multi","stage":1,"stem":"下列因素中，影响土壤田间持水量大小的有","options":["土壤颜色","土壤质地","结构状况","有机质含量"],"answer":[1,2,3],"explain":"质地越细、团粒结构越发育、有机质越多，毛管孔隙越多，田间持水量越大。土壤颜色由矿物和腐殖质决定，不直接决定孔隙持水能力。","tag":"土壤水分"},{"id":"soil-b021","type":"multi","stage":1,"stem":"旱作草地提高土壤蓄水保墒能力的合理措施有","options":["增施有机肥培肥土壤","雨后及时中耕并覆盖秸秆","深松打破犁底层","频繁深耕晒垡"],"answer":[0,1,2],"explain":"增施有机肥和深松可改善结构、增加孔隙，中耕覆盖能切断毛管、减少蒸发，均利于蓄水保墒。频繁深耕晒垡破坏结构、加速有机质分解和水分蒸发。","tag":"土壤水分"},{"id":"soil-b027","type":"multi","stage":1,"stem":"下列措施中，有利于提高土壤阳离子交换量的有","options":["增施有机肥","掺黏客土或施用黏土矿物","种植绿肥并翻压还田","长期大量施用生理酸性化肥"],"answer":[0,1,2],"explain":"有机质腐殖化产生大量可变负电荷，黏粒增加也提高交换量，绿肥翻压同时增加有机质。长期大量施生理酸性化肥会酸化土壤、促使胶体破坏和盐基淋失。","tag":"土壤化学性质"},{"id":"soil-b028","type":"multi","stage":1,"stem":"下列因素中，影响土壤盐基饱和度的有","options":["阳离子交换量的大小","土壤颗粒的颜色","交换性盐基离子的数量","降水淋溶的强弱"],"answer":[0,2,3],"explain":"盐基饱和度由交换量和交换性盐基数量共同决定；降水丰富、淋溶强烈处盐基易被氢、铝离子置换淋失，饱和度降低。土壤颜色与盐基饱和度无直接关系。","tag":"土壤化学性质"},{"id":"soil-b037","type":"multi","stage":1,"stem":"盐碱草地采用农业生物措施改良，可行的做法有","options":["种植耐盐牧草和绿肥","增施有机肥并覆盖秸秆","灌水后不设排水沟","选育耐盐品种并合理轮作"],"answer":[0,1,3],"explain":"种耐盐牧草和绿肥可覆盖地面、抑制蒸发并增加有机质，覆盖和增施有机肥减少盐分表聚，选育耐盐品种轮作可稳定产量。灌水不排水会使盐分滞留并抬高地下水位。","tag":"土壤盐碱化"},{"id":"soil-b043","type":"multi","stage":1,"stem":"防止草地土壤退化的合理管理措施有","options":["以草定畜，控制载畜量","延长放牧时间以提高利用率","划区轮牧，留足休牧期","补播豆科牧草与当地优良草种"],"answer":[0,2,3],"explain":"控制载畜量、划区轮牧可避免过度啃食和践踏，补播豆科牧草能恢复植被并增加土壤氮素。延长放牧时间会加重采食与践踏，加速土壤和植被退化。","tag":"草地土壤管理"},{"id":"soil-b050","type":"multi","stage":1,"stem":"关于成土因素作用的叙述，正确的有","options":["气候通过水热条件同时影响岩石风化和生物过程","生物因素是有机质积累和土壤肥力形成的关键","地形影响水热再分配和物质的搬运堆积","时间因素可以脱离其他因素单独决定土壤类型"],"answer":[0,1,2],"explain":"气候以水热条件控制风化强度和生物过程，生物是腐殖质形成和肥力发展的关键，地形决定水热再分配与物质迁移，A、B、C正确。时间只提供发育过程的持续条件，不能脱离母质、气候、生物和地形单独决定土壤类型，D错误。","tag":"土壤成土因素"},{"id":"soil-b058","type":"multi","stage":1,"stem":"关于土壤质地与肥力关系的叙述，正确的有","options":["砂质土通气透水好，但保水保肥能力差","黏质土保水保肥能力强，但通气透水性差","壤质土砂黏比例适中，兼有较好的通气性和保肥性","砂质土比表面积大，吸附阳离子的能力强"],"answer":[0,1,2],"explain":"砂质土孔隙粗大，通气透水好而保水保肥差；黏质土黏粒多、吸附力强，保肥好但通气差；壤质土砂黏适中，兼具两者优点，A、B、C正确。砂质土比表面积小、吸附能力弱，D说反了。","tag":"土壤物理性质"},{"id":"soil-b059","type":"multi","stage":1,"stem":"关于土壤孔隙状况的叙述，正确的有","options":["总孔隙度等于毛管孔隙度与非毛管孔隙度之和","毛管孔隙能保持水分，是植物有效水的主要贮存场所","非毛管孔隙有利于通气透水和水分下渗","土壤容重越大，总孔隙度越大"],"answer":[0,1,2],"explain":"总孔隙度由毛管孔隙和非毛管孔隙组成，毛管孔隙持水、非毛管孔隙通气透水，A、B、C正确。由孔隙度等于1减去容重与比重之比的百分数可知，容重越大说明孔隙越少、总孔隙度越小，D错误。","tag":"土壤物理性质"},{"id":"soil-b065","type":"multi","stage":1,"stem":"关于土壤水分形态与有效性的叙述，正确的有","options":["吸湿水被土粒牢固吸附，植物不能利用","膜状水移动缓慢，有效性很低","毛管水可被植物吸收，是有效水的主要部分","重力水能长期保持在土壤中供植物利用"],"answer":[0,1,2],"explain":"吸湿水吸附力极强，植物无法利用；膜状水移动慢、有效性低；毛管水是有效水的主体，A、B、C正确。重力水受重力作用下渗，不能长期保存在根层，长期积水还会造成通气不良，D错误。","tag":"土壤水分"},{"id":"soil-b066","type":"multi","stage":1,"stem":"有利于提高草地土壤蓄水保水能力的措施有","options":["增施有机肥，提高土壤有机质含量","深松破除紧实层，增加水分入渗","地表覆盖秸秆或枯草，减少蒸发","长期大水漫灌，使土壤保持饱和"],"answer":[0,1,2],"explain":"有机质可改善结构、增加孔隙，深松能打破紧实层提高入渗，覆盖可减少无效蒸发，三者都提高蓄水保水能力。长期大水漫灌会使土壤长期饱和、通气不良，还会抬高地下水位引起次生盐渍化。","tag":"土壤水分"},{"id":"soil-b072","type":"multi","stage":1,"stem":"关于土壤胶体与离子交换的叙述，正确的有","options":["阳离子交换吸附是可逆的，并遵循等当量交换原则","土壤阳离子交换量的大小与胶体的数量和种类有关","腐殖质胶体的交换量通常高于高岭石","所有阴离子都不能被土壤吸附"],"answer":[0,1,2],"explain":"阳离子交换可逆且等当量进行，阳离子交换量取决于胶体数量与种类，腐殖质和2∶1型黏土矿物的交换量高，A、B、C正确。阴离子并非全部不被吸附，磷酸根等可发生专性吸附，D过于绝对，错误。","tag":"土壤化学性质"},{"id":"soil-b081","type":"multi","stage":1,"stem":"盐碱土对牧草生长的危害主要表现在","options":["土壤溶液渗透压高，根系吸水困难","钠离子等对植物产生离子毒害","碱性过强降低铁、磷等养分的有效性","可溶性盐能提高土壤水分对植物的有效性"],"answer":[0,1,2],"explain":"盐碱土渗透压高造成生理干旱，钠离子过量产生离子毒害，强碱性使铁、磷、锌等沉淀而降低有效性，A、B、C正确。盐分提高的是土壤溶液浓度、降低水分有效性，不会提高有效性，D错误。","tag":"土壤盐碱化"},{"id":"soil-b082","type":"multi","stage":1,"stem":"在盐碱草地上种植耐盐牧草，对改良土壤的作用有","options":["增加地表覆盖，减少蒸发和盐分表聚","根系穿插和残体分解可改善土壤结构","增加土壤有机质，提高养分含量","迅速把地下水位降低到零"],"answer":[0,1,2],"explain":"耐盐牧草覆盖地面可抑制蒸发返盐，根系活动与残体分解能改善结构、增加有机质，A、B、C正确。牧草蒸腾虽能降低局部地下水位，但不可能使地下水位降到零，D夸大了其作用。","tag":"土壤盐碱化"},{"id":"soil-b089","type":"multi","stage":1,"stem":"草地土壤退化的常见表现有","options":["表层有机质含量下降，团粒结构破坏","土壤容重增大，孔隙度和入渗能力降低","风蚀、水蚀加剧，出现裸露斑块和切沟","土壤盐分被大量淋洗，含盐量持续下降"],"answer":[0,1,2],"explain":"草地退化时凋落物归还减少、践踏加重，有机质下降、结构破坏、容重增大、入渗减弱，植被稀疏后风蚀水蚀加剧，A、B、C正确。盐分被大量淋洗属于脱盐过程，并非退化的普遍表现，D错误。","tag":"草地土壤管理"},{"id":"soil-b092","type":"multi","stage":1,"stem":"关于成土因素综合作用的叙述，正确的有","options":["各成土因素相互影响，对土壤的作用是综合的","不同地区起主导作用的成土因素可以不同","某一成土因素可以被另一因素完全替代","成土因素相同，形成的土壤类型必然相同"],"answer":[0,1],"explain":"成土因素以综合方式起作用，且各自不可被完全替代；不同地区主导因素不同，故A、B正确。C项错在因素不可替代，D项错在土壤还受时间与人为活动影响，类型未必相同。","tag":"土壤成土因素"},{"id":"soil-b101","type":"multi","stage":1,"stem":"影响土壤容重大小的因素有","options":["土壤质地","土壤结构状况","土壤有机质含量","土壤颜色深浅"],"answer":[0,1,2],"explain":"质地、结构和有机质都影响土体的紧实程度，从而改变容重：有机质多、结构好则容重小。颜色只反映矿物与有机质种类，不能决定容重，故D错。","tag":"土壤物理性质"},{"id":"soil-b104","type":"multi","stage":1,"stem":"关于土壤孔隙的叙述，正确的有","options":["总孔隙度等于毛管孔隙度与非毛管孔隙度之和","非毛管孔隙主要起通气、排水作用","土壤容重越大，总孔隙度越大","毛管孔隙的孔径一般大于非毛管孔隙"],"answer":[0,1],"explain":"孔隙按孔径分为毛管孔隙和非毛管孔隙，二者之和为总孔隙度，非毛管孔隙通气排水。C项关系说反，容重越大孔隙度越小；D项孔径大小颠倒。","tag":"土壤物理性质"},{"id":"soil-b109","type":"multi","stage":1,"stem":"关于土壤水分形态的叙述，正确的有","options":["吸湿水受土粒吸附力最强，植物不能利用","膜状水移动缓慢，植物只能利用一部分","毛管水是植物吸收利用的主要水分形态","重力水能长期保存在土壤孔隙中供植物利用"],"answer":[0,1,2],"explain":"吸湿水吸附力最强、植物无法利用，膜状水移动慢仅部分有效，毛管水是主要水源。D项错误，重力水受重力作用下渗，不能长期保存在土壤中。","tag":"土壤水分"},{"id":"soil-b115","type":"multi","stage":1,"stem":"影响土壤酸碱性的因素有","options":["气候条件，如降水淋溶强度","成土母质的矿物组成","有机质分解产生的有机酸","土壤颜色的深浅"],"answer":[0,1,2],"explain":"降水淋溶影响盐基淋失，母质决定土壤初始盐基含量，有机质分解产生有机酸，三者都影响酸碱反应。颜色只反映矿物与有机质种类，与酸碱性无直接关系。","tag":"土壤化学性质"},{"id":"soil-b122","type":"multi","stage":1,"stem":"关于盐土与碱土区别的叙述，正确的有","options":["盐土含盐量高，碱化度通常较低","碱土碱化度高，pH常在9以上","碱土表层常形成紧实的碱化层，透水性差","盐土的盐分主要以交换性钠形态存在"],"answer":[0,1,2],"explain":"盐土以高含盐量为特征，碱土以高碱化度、强碱性和不良物理性质为特征。D项错误，盐分主要以可溶盐形态存在于土壤溶液中，而非交换性钠。","tag":"土壤盐碱化"},{"id":"soil-b126","type":"multi","stage":1,"stem":"下列过程会导致土壤盐分向表层大量积累的有","options":["强烈蒸发使水分携盐上移","地下水位高且埋深浅","大水漫灌后排水不畅","地表覆盖秸秆减少蒸发"],"answer":[0,1,2],"explain":"强烈蒸发、地下水位高和不合理灌溉都会使盐分随毛管水上升到表层聚积。D项覆盖秸秆可减少蒸发，抑制返盐，是防盐措施而非积盐过程。","tag":"土壤盐碱化"},{"id":"soil-b131","type":"multi","stage":1,"stem":"防治草地土壤侵蚀的措施有","options":["保持地表覆盖，减少土壤裸露","控制载畜量，防止过度放牧","坡地实行等高带状种植","深耕翻压以疏松表土"],"answer":[0,1,2],"explain":"保持覆盖、合理载畜和等高带状种植都能削弱雨滴击溅与径流冲刷，减轻水蚀风蚀。D项深耕翻压使表土疏松裸露，反而加剧侵蚀。","tag":"草地土壤管理"},{"id":"soil-b134","type":"multi","stage":1,"stem":"草地土壤退化的表现有","options":["土壤沙化","土壤盐渍化","土壤有机质含量下降","土壤孔隙度增大"],"answer":[0,1,2],"explain":"草地退化常表现为沙化、盐渍化、酸化、板结和有机质下降。D项错误，退化土壤多因压实而容重增大、孔隙度减小，孔隙度增大不是退化表现。","tag":"草地土壤管理"},{"id":"soil-m02","type":"multi","stem":"关于土壤阳离子交换量（CEC）的叙述，正确的有","options":["CEC是土壤胶体吸附的交换性阳离子总量，通常以cmol(+)/kg表示","高岭石的CEC一般高于蒙脱石","CEC越大，土壤保肥能力越强","增施有机肥可提高土壤CEC"],"answer":[0,2,3],"explain":"CEC是土壤胶体吸附的交换性阳离子总量，以cmol(+)/kg表示，CEC越大保肥能力越强，增施有机肥可提高CEC；蒙脱石属2:1型，CEC高于1:1型高岭石，故B错误。","tag":"土壤化学性质","level":1,"stage":1,"standard":true},{"id":"soil-m03","type":"multi","stem":"关于土壤水分常数与有效水的叙述，正确的有","options":["重力水可长期保存在土壤中供植物利用","田间持水量是旱地土壤有效水的上限","凋萎系数随土壤黏粒含量增加而增大","毛管水是植物吸收利用的主要水分形态"],"answer":[1,2,3],"explain":"旱地有效水上限为田间持水量，下限为凋萎系数，毛管水是植物吸收的主要形态；凋萎系数随黏粒含量增加而增大，重力水受重力作用很快排走，不能被长期利用，故A错误。","tag":"土壤水分","level":1,"stage":1,"standard":true},{"id":"soil-m05","type":"multi","stem":"提高草地土壤肥力、防止草地退化的合理措施有","options":["合理确定载畜量，实行划区轮牧","长期重施单一氮肥，不补充磷钾肥","补播豆科牧草，利用生物固氮增加氮素输入","增施有机肥、秸秆还田，提高有机质含量"],"answer":[0,2,3],"explain":"划区轮牧可防止过牧退化，补播豆科牧草能生物固氮增加氮输入，增施有机肥与秸秆还田可提高有机质；长期重施单一氮肥且不补磷钾会造成养分失衡与土壤退化，故B错误。","tag":"草地土壤管理","level":1,"stage":1,"standard":true},{"id":"soil-b006","type":"judge","stage":1,"stem":"在土壤形成过程中，地质大循环使养分在土体中不断富集。","options":["正确","错误"],"answer":[1],"explain":"陈述错误。地质大循环经风化、搬运、沉积，养分总体趋向淋失分散；使养分在土体中富集的是生物小循环，即植物吸收、残体归还与分解。两者对立统一才形成土壤。","tag":"土壤成土因素"},{"id":"soil-b015","type":"judge","stage":1,"stem":"黏土的总孔隙度一般大于砂土，但其大孔隙少，通气透水性较差。","options":["正确","错误"],"answer":[0],"explain":"陈述正确。黏土颗粒细，总孔隙度可达50%以上，但以毛管孔隙为主，大孔隙少，通气透水慢；砂土总孔隙度较低而大孔隙比例高。总孔隙度与孔隙大小分布应分别看待。","tag":"土壤物理性质"},{"id":"soil-b022","type":"judge","stage":1,"stem":"膜状水移动缓慢，植物只能利用其中一部分，其有效性很低。","options":["正确","错误"],"answer":[0],"explain":"陈述正确。膜状水受土粒吸附力较强，只能在膜内外水势差驱动下缓慢移动，植物可利用部分有限，有效性低。田间植物主要利用毛管水，膜状水不是主要供水形态。","tag":"土壤水分"},{"id":"soil-b029","type":"judge","stage":1,"stem":"土壤胶体以带负电荷为主，能吸附钾、钙等阳离子，这是土壤保肥的重要原因。","options":["正确","错误"],"answer":[0],"explain":"陈述正确。带负电的黏粒和腐殖质通过静电引力吸附交换性阳离子，使其免遭淋失并可被根系交换吸收，这是土壤保肥性的基础。带正电胶体吸附阴离子的能力较小。","tag":"土壤化学性质"},{"id":"soil-b031","type":"judge","stage":1,"stem":"土壤有机质含量越高，土壤肥力水平就一定越高。","options":["正确","错误"],"answer":[1],"explain":"陈述错误。有机质是肥力的重要指标，但肥力还取决于水、气、热状况和养分有效性。有机质过高的泥炭土、沼泽土常通气不良、养分释放慢，肥力并不高，不能一概而论。","tag":"土壤肥力"},{"id":"soil-b038","type":"judge","stage":1,"stem":"碱土施用石膏后，钙离子可置换胶体上的交换性钠，从而降低碱化度、改善土壤结构。","options":["正确","错误"],"answer":[0],"explain":"陈述正确。石膏提供钙离子与胶体表面的钠离子发生交换，钠盐随灌溉排水排出，碱化度下降，土粒团聚性改善、通透性提高。施用时应配合灌水排水，否则盐分仍留在耕层。","tag":"土壤盐碱化"},{"id":"soil-b044","type":"judge","stage":1,"stem":"草地上长期大量施用硫酸铵等生理酸性肥料，会使土壤酸碱度逐渐升高。","options":["正确","错误"],"answer":[1],"explain":"陈述错误。硫酸铵中铵离子被作物吸收后残留硫酸根，长期施用使土壤酸化、酸碱度下降而非升高，盐基饱和度降低，可能出现缺钙和铝毒。应配合有机肥和石灰施用。","tag":"草地土壤管理"},{"id":"soil-b045","type":"judge","stage":1,"stem":"草地土壤一旦退化，只要停止放牧，其理化性质就能在短期内完全恢复。","options":["正确","错误"],"answer":[1],"explain":"陈述错误。退化后有机质库、团聚体和养分库恢复十分缓慢，往往需要数年乃至数十年，风蚀水蚀造成的土层损失更难逆转。停止放牧只是恢复起点，还需补播、施肥等措施。","tag":"草地土壤管理"},{"id":"soil-b051","type":"judge","stage":1,"stem":"气候是土壤形成中最活跃的因素之一，主要通过降水和温度影响岩石风化与生物过程，从而制约土壤发育的方向和速度。","options":["正确","错误"],"answer":[0],"explain":"该说法正确。降水和温度直接决定风化强度、淋溶程度以及有机质积累与分解的对比关系，进而影响土壤发育的方向和速度。气候与生物共同塑造了土壤的地带性分布规律。","tag":"土壤成土因素"},{"id":"soil-b060","type":"judge","stage":1,"stem":"土壤容重是指单位体积原状土壤（包括孔隙）的干重，其数值一般小于土壤比重。","options":["正确","错误"],"answer":[0],"explain":"该说法正确。容重的体积包含孔隙，而比重只计固相物质体积，所以同一种土壤的容重必然小于比重。一般矿质土壤容重为1.0~1.5克每立方厘米，比重约为2.6~2.7克每立方厘米。","tag":"土壤物理性质"},{"id":"soil-b067","type":"judge","stage":1,"stem":"重力水能被植物充分利用，是旱地植物吸收水分的主要来源。","options":["正确","错误"],"answer":[1],"explain":"该说法错误。重力水存在于大孔隙中，受重力作用很快下渗流出根层，不能被植物持续利用，长期存在还会使土壤通气不良。旱地植物吸水的主要来源是毛管水，而不是重力水。","tag":"土壤水分"},{"id":"soil-b073","type":"judge","stage":1,"stem":"潜性酸包括交换性酸和水解性酸，只有在胶体上吸附的氢、铝离子被交换进入土壤溶液后才表现出酸性。","options":["正确","错误"],"answer":[0],"explain":"该说法正确。潜性酸是胶体表面吸附的氢、铝离子所代表的酸度，未进入溶液时不显酸性，被其他阳离子交换后才转化为活性酸。它与溶液中自由氢离子构成的活性酸共同组成土壤酸度。","tag":"土壤化学性质"},{"id":"soil-b074","type":"judge","stage":1,"stem":"土壤盐基饱和度越高，说明交换性盐基离子占比越小，土壤酸性越强。","options":["正确","错误"],"answer":[1],"explain":"该说法错误。盐基饱和度是交换性盐基离子占阳离子交换量的百分比，饱和度越高说明盐基离子占比越大、氢铝离子越少，土壤酸性越弱、越接近中性至微碱性。饱和度高与酸性强恰好相反。","tag":"土壤化学性质"},{"id":"soil-b076","type":"judge","stage":1,"stem":"土壤的潜在肥力可以不经过转化而直接供给植物吸收利用。","options":["正确","错误"],"answer":[1],"explain":"该说法错误。潜在肥力指以难溶或未分解形态存在的养分和肥力条件，须经风化、矿化或活化转化后才能被植物吸收，例如有机质中的氮须矿化为速效氮。能直接供植物利用的是有效肥力。","tag":"土壤肥力"},{"id":"soil-b083","type":"judge","stage":1,"stem":"盐土以交换性钠含量高为特征，碱土则以可溶性盐大量积累为特征。","options":["正确","错误"],"answer":[1],"explain":"该说法错误，把两者特征颠倒了。盐土的特征是可溶性盐（氯化物、硫酸盐）大量积累；碱土的特征是交换性钠占阳离子交换量比例高、碱化度大，可溶性盐含量不一定高。","tag":"土壤盐碱化"},{"id":"soil-b090","type":"judge","stage":1,"stem":"在坡地草地上顺坡纵向放牧会加剧水土流失，而沿等高线实行带状轮牧可以减轻土壤侵蚀。","options":["正确","错误"],"answer":[0],"explain":"该说法正确。顺坡放牧形成纵向践踏通道，径流易集中下泻，加剧面蚀和沟蚀；沿等高线带状轮牧让草带拦截径流、沉积泥沙，从而减轻侵蚀。这体现了草地利用方式对土壤保护的直接影响。","tag":"草地土壤管理"},{"id":"soil-b095","type":"judge","stage":1,"stem":"人为活动不属于自然成土因素，因此耕作对土壤性质没有影响。","options":["正确","错误"],"answer":[1],"explain":"该说法错误。人为活动虽不在五大自然成土因素之列，但耕作、施肥、灌溉能快速改变土壤有机质、结构和养分状况，是重要的成土因素，作用强度常超过自然因素。","tag":"土壤成土因素"},{"id":"soil-b099","type":"judge","stage":1,"stem":"土壤质地是指土壤中各级土粒的相对比例，是土壤较稳定的物理性质。","options":["正确","错误"],"answer":[0],"explain":"该说法正确。质地决定于土粒的机械组成，受母质影响大，短期内耕作、施肥难以明显改变，因此是较稳定的物理性质，也是土壤分类的重要依据。","tag":"土壤物理性质"},{"id":"soil-b107","type":"judge","stage":1,"stem":"土壤含水量越高，植物可吸收利用的水分就越多。","options":["正确","错误"],"answer":[1],"explain":"该说法错误。植物利用的是有效水，即田间持水量与凋萎系数之间的水分；含水量过高时土壤通气不良，根系呼吸受抑，可利用的水分反而减少。","tag":"土壤水分"},{"id":"soil-b112","type":"judge","stage":1,"stem":"吸湿水含量的多少主要取决于土壤质地和空气相对湿度。","options":["正确","错误"],"answer":[0],"explain":"该说法正确。土粒越细、比表面越大，吸附水汽的能力越强；空气相对湿度越高，土粒吸附的水汽也越多。因此质地和相对湿度共同决定吸湿水含量。","tag":"土壤水分"},{"id":"soil-b116","type":"judge","stage":1,"stem":"土壤溶液中氢离子浓度越高，土壤pH值越大。","options":["正确","错误"],"answer":[1],"explain":"该说法错误。pH是氢离子活度的负对数，氢离子浓度越高，pH值越小，土壤越酸。氢离子浓度降低时pH才升高，二者呈相反变化。","tag":"土壤化学性质"},{"id":"soil-b120","type":"judge","stage":1,"stem":"土壤肥力按其形成过程可分为自然肥力和人工肥力。","options":["正确","错误"],"answer":[0],"explain":"该说法正确。自然肥力是土壤在自然成土过程中形成的，人工肥力是人类耕作、施肥、灌溉等培育出来的，二者共同构成有效肥力。","tag":"土壤肥力"},{"id":"soil-b125","type":"judge","stage":1,"stem":"盐碱土改良时只需灌水淋洗，不必考虑排水。","options":["正确","错误"],"answer":[1],"explain":"该说法错误。灌水淋洗必须与排水结合，否则淋洗出的盐分随毛管水回升，并抬高地下水位，反而加重盐碱化。排水是洗盐的前提条件。","tag":"土壤盐碱化"},{"id":"soil-b130","type":"judge","stage":1,"stem":"草地长期过度放牧会使土壤容重增大、孔隙度减小。","options":["正确","错误"],"answer":[0],"explain":"该说法正确。过牧使植被盖度下降、牲畜践踏加剧，表土被压实，容重增大、总孔隙度减小，通气透水性变差，进而加速草地退化。","tag":"草地土壤管理"},{"id":"soil-b135","type":"judge","stage":1,"stem":"草地实行免耕或少耕可减少机械对土壤结构的破坏，有利于保持有机质。","options":["正确","错误"],"answer":[0],"explain":"该说法正确。免耕少耕减少翻耕扰动和机械压实，保护团粒结构与地表覆盖，减少有机质矿化损失，是草地和人工草地土壤管理的重要措施。","tag":"草地土壤管理"},{"id":"soil-i001","type":"single","stage":2,"stem":"东北草原黑土有机质含量明显高于华北平原耕地，从成土因素分析，最主要的原因是","options":["草原区降水丰沛，淋溶作用强","草原区成土母质富含有机质","草原区地形平坦，水土流失轻微","草原区气温低，微生物分解有机质的速度较慢"],"answer":[3],"explain":"低温抑制微生物活性，有机质分解慢于积累，故含量高，D正确。降水多、淋溶强反而不利于有机质保存，A错；成土母质本身几乎不含有机质，B错；地形平坦只能减少侵蚀，不是主要原因，C错。","tag":"土壤成土因素"},{"id":"soil-i002","type":"single","stage":2,"stem":"由玄武岩风化物发育的土壤与由花岗岩风化物发育的土壤相比，前者通常","options":["石英砂粒多，通透性好","盐基饱和度低，酸性强","黏粒含量较高，矿质养分较丰富","土层浅薄，发育程度低"],"answer":[2],"explain":"玄武岩富含铁镁矿物、易风化，风化物黏粒多、盐基丰富，C正确。花岗岩富含石英，风化后砂粒多、盐基少、酸性强，A、B说的是花岗岩风化物；土层厚薄主要取决于地形与时间，D缺乏依据。","tag":"土壤成土因素"},{"id":"soil-i003","type":"single","stage":2,"stem":"土壤发育由幼年阶段进入成熟阶段的典型标志是","options":["剖面层次分化明显，黏化层或淀积层形成","母质中仍保留大量原生矿物","土壤中砾石含量明显增多","土壤颜色变浅、有机质迅速下降"],"answer":[0],"explain":"成熟土壤剖面发生层分化清晰，黏粒淀积层、钙积层等形成，A正确。原生矿物多、砾石多说明风化和发育弱，属幼年土特征，B、C错；有机质迅速下降多与侵蚀或退化有关，D错。","tag":"土壤成土因素"},{"id":"soil-i004","type":"single","stage":2,"stem":"在草地土壤中，蚯蚓等土壤动物的主要成土作用是","options":["固定大气氮素，直接增加土壤氮库","分解木质素，构成腐殖质的主体","翻动、混合有机残体与矿质土粒，改善孔隙状况","分泌碳酸钙，促进钙积层形成"],"answer":[2],"explain":"土壤动物取食、搬运和排泄，把有机残体与矿质土粒混合，形成团聚体并增加孔隙，C正确。固氮依靠固氮微生物，A错；木质素主要由真菌分解，B错；钙积层是碳酸钙淋溶淀积的产物，D错。","tag":"土壤成土因素"},{"id":"soil-i005","type":"single","stage":2,"stem":"与同气候带的森林土壤相比，草原土壤腐殖质层的典型特点是","options":["较薄，腐殖质以富里酸为主","较厚，但呈强酸性、盐基饱和度低","几乎不积累腐殖质","较厚，颜色较深，盐基饱和度较高"],"answer":[3],"explain":"草原草本根系密集、每年大量死亡分解，形成深厚暗色腐殖质层，且淋溶较弱、盐基保留多，D正确。森林土壤凋落物集中地表、淋溶强，腐殖质层薄且以富里酸为主、酸性强，A、B说反；C明显错误。","tag":"土壤成土因素"},{"id":"soil-i009","type":"single","stage":2,"stem":"某土壤湿时用手搓捻有明显砂感，不能搓成细条，干时松散易碎，其质地最可能是","options":["砂土","壤土","黏土","重黏土"],"answer":[0],"explain":"砂粒多则搓捻有砂感、黏结性差，湿时搓不成条、干时松散，属砂土，A正确。壤土湿时可搓成短条、有一定黏结性，B错；黏土湿时能搓成细长条并可弯成圆环，C、D错。","tag":"土壤物理性质"},{"id":"soil-i010","type":"single","stage":2,"stem":"草地长期增施腐熟有机肥后，表层土壤团粒结构明显增多，其直接原因是","options":["土壤黏粒被大量淋洗到下层","有机质与钙、镁等多价阳离子形成胶结物质，促进土粒团聚","土壤交换性钠离子含量升高","土壤孔隙被细土粒填充，土粒排列更紧密"],"answer":[1],"explain":"有机质分解产生的多糖和腐殖质与钙、镁等阳离子胶结土粒，形成水稳性团聚体，B正确。黏粒下移会使表层结构变差，A错；交换性钠升高导致土粒分散，C错；孔隙被填充属于板结，D错。","tag":"土壤物理性质"},{"id":"soil-i011","type":"single","stage":2,"stem":"某草地土壤田间持水量为25%（质量百分数），容重为1.2 g/cm³，其毛管孔隙度约为","options":["21%","25%","30%","36%"],"answer":[2],"explain":"毛管孔隙度＝田间持水量（质量百分数）×容重＝25%×1.2＝30%，C正确。直接把质量百分数25%当作孔隙度，漏掉容重换算，B错；21%与36%为错误换算结果，A、D错。","tag":"土壤物理性质"},{"id":"soil-i012","type":"single","stage":2,"stem":"关于土壤容重与土壤比重区别的叙述，正确的是","options":["容重是单位体积原状土壤的干重，比重是单位体积固相物质的干重","容重只与固相物质有关，比重才包含孔隙","两者数值相同，只是单位不同","容重一定大于比重"],"answer":[0],"explain":"容重的体积包含孔隙，数值较小；比重的体积只计固相，数值常为2.6～2.7 g/cm³，A正确。B把二者说反；因含孔隙，容重恒小于比重，C、D错。","tag":"土壤物理性质"},{"id":"soil-i013","type":"single","stage":2,"stem":"与砂质土相比，黏质土表层土壤的温度变化特点是","options":["升温快、昼夜温差大","升温慢、昼夜温差小","升温慢、昼夜温差大","升温和降温都与砂质土相同"],"answer":[1],"explain":"黏质土含水量高、热容量大，升温和降温都较缓慢，昼夜温差小，B正确。砂质土含水量低、热容量小，升温快、温差大，A描述的是砂质土；C、D不符合热容量规律。","tag":"土壤物理性质"},{"id":"soil-i014","type":"single","stage":2,"stem":"草地长期过牧后表层土壤容重由1.1 g/cm³增至1.5 g/cm³，其直接后果是","options":["总孔隙度下降，通气透水性变差","总孔隙度上升，保水性增强","毛管孔隙度明显增加","土壤有机质含量随之升高"],"answer":[0],"explain":"容重由1.1增到1.5 g/cm³说明土壤被压实，总孔隙度相应下降，通气透水变差，A正确。孔隙度随容重增大而减小，B、C方向相反；过牧使凋落物减少、有机质下降，D错。","tag":"土壤物理性质"},{"id":"soil-i018","type":"single","stage":2,"stem":"在土壤各种形态的水中，植物吸收利用最主要、最有效的是","options":["吸湿水","膜状水","毛管水","重力水"],"answer":[2],"explain":"毛管水受毛管力保持、移动自由，能被植物充分吸收，C正确。吸湿水被土粒牢固吸附，植物不能利用，A错；膜状水移动缓慢、只能少量利用，B错；重力水很快下渗流失，D错。","tag":"土壤水分"},{"id":"soil-i019","type":"single","stage":2,"stem":"草地表层土壤板结后，一次中等强度降水的水分去向最可能是","options":["入渗量增加，深层贮水增多","入渗速率不变，但蒸发加强","水分全部被表层土粒吸附成为吸湿水","入渗速率下降，地表径流增加"],"answer":[3],"explain":"板结使表层孔隙减少、导水能力下降，入渗速率降低，多余降水形成地表径流，D正确。入渗量不会增加，A错；板结主要影响入渗而非蒸发，B错；表层吸附的吸湿水数量极少，C错。","tag":"土壤水分"},{"id":"soil-i020","type":"single","stage":2,"stem":"在土壤水分特征曲线上，随着土壤含水量降低，土壤水吸力（基质吸力）的变化是","options":["逐渐减小","逐渐增大","保持不变","先增大后减小"],"answer":[1],"explain":"含水量降低时水膜变薄、弯月面曲率增大，基质吸力随之增大，B正确，这也是旱季植物吸水困难的原因。A方向相反；水分特征曲线是单调曲线，C、D错。","tag":"土壤水分"},{"id":"soil-i021","type":"single","stage":2,"stem":"某草地土壤透水性较差，一次灌溉水量过大，最容易造成的后果是","options":["土壤含水量长期稳定在田间持水量","土壤毛管孔隙度显著提高","土壤盐分随毛管水大量表聚","水分深层渗漏，养分随之淋失"],"answer":[3],"explain":"透水性差的土壤一次灌水过多，超过田间持水量的水分向下渗漏并带走可溶性养分，D正确。过量灌溉不能稳定维持田间持水量，A错；毛管孔隙度由结构决定，B错；盐分表聚需蒸发强且地下水位高，C错。","tag":"土壤水分"},{"id":"soil-i025","type":"single","stage":2,"stem":"盐基饱和度高的土壤，其一般特征是","options":["交换性钙、镁为主，pH较高，酸性弱","交换性氢、铝为主，pH较低","阳离子交换量一定很小","土壤质地一定很粗"],"answer":[0],"explain":"盐基饱和度高说明交换性钙、镁、钾等占交换位点多，氢、铝少，酸性弱、pH较高，A正确。氢铝为主是盐基不饱和酸性土的特征，B错；盐基饱和度与CEC大小、质地无必然联系，C、D错。","tag":"土壤化学性质"},{"id":"soil-i026","type":"single","stage":2,"stem":"南方酸性红壤草地上施用石灰的主要作用是","options":["增加土壤可溶性盐含量","中和土壤酸性，提高盐基饱和度并减轻铝毒","使阳离子交换量提高到最大值","杀灭土壤中的固氮微生物"],"answer":[1],"explain":"石灰中和交换性酸、补充钙并提高盐基饱和度，同时降低活性铝的毒害，B正确。施石灰不会增加可溶性盐，A错；CEC主要由有机质和黏粒决定，C错；调节pH有利于微生物活动，D错。","tag":"土壤化学性质"},{"id":"soil-i027","type":"single","stage":2,"stem":"下列土壤中，对酸碱变化缓冲能力最强的是","options":["粗砂质土","有机质极少的砾质土","阳离子交换量很小的砂土","有机质含量高的黏壤土"],"answer":[3],"explain":"缓冲性主要来自黏粒和有机质的交换位点及弱酸解离，有机质含量高的黏壤土缓冲能力最强，D正确。砂土、砾质土黏粒与有机质都少、CEC小，缓冲能力弱，A、B、C均错。","tag":"土壤化学性质"},{"id":"soil-i028","type":"single","stage":2,"stem":"草地长期积水后土壤氧化还原电位下降，最可能出现的情况是","options":["铁、锰以高价氧化物形态大量淀积","有机质分解速度明显加快","产生亚铁、硫化氢等还原性物质，根系受害","硝态氮含量显著升高"],"answer":[2],"explain":"渍水缺氧使氧化还原电位下降，高价铁锰被还原，硫酸盐还原产生硫化氢，毒害根系，C正确。高价氧化物淀积发生在通气良好的氧化条件，A错；厌氧分解缓慢，B错；反硝化使硝态氮减少，D错。","tag":"土壤化学性质"},{"id":"soil-i032","type":"single","stage":2,"stem":"某草地土壤养分全量分析结果较高，但牧草生长仍然不良，最可能的原因是","options":["土壤养分总量不足","土壤中缺少固氮微生物","土壤有机质含量过低","土壤紧实、通气不良，根系发育和养分吸收受限"],"answer":[3],"explain":"养分全量高说明潜在供应充足，生长不良多因物理性状差限制了根系生长与吸收，D正确。A、C与全量较高矛盾；固氮微生物只影响氮素来源，不是普遍限制因素，B错。","tag":"土壤肥力"},{"id":"soil-i033","type":"single","stage":2,"stem":"关于土壤肥力与土壤生产力关系的叙述，正确的是","options":["肥力越高，生产力一定越高","肥力是生产力的基础，生产力还受气候和栽培管理影响","生产力高的土壤，肥力必然很高","二者含义完全相同，可以互相替代"],"answer":[1],"explain":"肥力反映土壤供应水肥气热的能力，生产力是综合产出，还受气候、品种和管理制约，B正确。肥力好的土壤若遇干旱或管理粗放仍会低产，A、C过于绝对；二者不能互相替代，D错。","tag":"土壤肥力"},{"id":"soil-i034","type":"single","stage":2,"stem":"以碳酸钠、碳酸氢钠为主的苏打盐碱土，其典型特征是","options":["pH高、碱化度大，土粒分散、物理性质差","pH低、呈酸性，盐基饱和度低","含盐量高但pH中性，土粒团聚良好","交换性钠极少，土壤结构稳定"],"answer":[0],"explain":"碳酸钠水解产生强碱性，pH常达9以上，交换性钠使土粒分散、结构破坏、透水性差，A正确。苏打盐碱土不会呈酸性，B错；其碱化明显、结构差，C、D错。","tag":"土壤盐碱化"},{"id":"soil-i035","type":"single","stage":2,"stem":"土壤碱化度（ESP）是指","options":["可溶性盐总量占干土重的百分率","土壤含水量占田间持水量的百分率","交换性钠离子占阳离子交换量的百分率","交换性钙镁占阳离子交换量的百分率"],"answer":[2],"explain":"碱化度是交换性钠占阳离子交换量的百分比，是划分碱土的核心指标，常以15%为界，C正确。A是含盐量，B是相对含水量，D是盐基饱和度的一部分，均不符。","tag":"土壤盐碱化"},{"id":"soil-i036","type":"single","stage":2,"stem":"在蒸发强烈、地下水位高的盐碱地上，采取井灌井排并配合渠道防渗，主要目的是","options":["提高地下水位，保证牧草水分供应","增加土壤可溶性盐含量以改良结构","加快土壤有机质分解","降低地下水位，抑制盐分随毛管水向表层积累"],"answer":[3],"explain":"井灌井排抽水降低地下水位，使毛管上升水流难以到达表层，配合防渗减少补给，从而抑制返盐，D正确。提高水位会加重盐分表聚，A错；增加盐分与改良目标相反，B错；降低水位并非为促进矿化，C错。","tag":"土壤盐碱化"},{"id":"soil-i037","type":"single","stage":2,"stem":"在盐碱草地上种植碱茅、披碱草等耐盐牧草，对土壤改良的主要作用是","options":["通过根系吸收并带走全部盐分","覆盖地面减少蒸发，根系改善结构并增加有机质","迅速把土壤pH降到中性","使土壤交换性钠完全消失"],"answer":[1],"explain":"耐盐牧草冠层覆盖减少蒸发、抑制返盐，根系穿插改善通透性，残体分解提高有机质，B正确。植物带走盐分数量有限，A夸大作用；pH和交换性钠只能逐步改善，C、D错。","tag":"土壤盐碱化"},{"id":"soil-i041","type":"single","stage":2,"stem":"与连续自由放牧相比，划区轮牧对草地土壤的有利影响主要是","options":["牧草有恢复期，减少践踏压实，保持结构和有机质","家畜集中踩踏，使表层容重明显增大","加快凋落物分解，有机质迅速下降","使土壤水分蒸发显著增强"],"answer":[0],"explain":"划区轮牧让每区有休牧恢复期，牧草再生好、覆盖度高，践踏减轻，容重不易升高、有机质得以保持，A正确。集中踩踏和有机质下降是连续自由放牧的表现，B、C错；覆盖度提高会减弱蒸发，D错。","tag":"草地土壤管理"},{"id":"soil-i042","type":"single","stage":2,"stem":"草地施用磷肥时采用条施或与有机肥混施，主要目的是","options":["促进磷肥随水下渗到深层","减少磷被土壤固定，提高当季有效性","提高土壤pH以活化磷","加快磷肥的挥发损失"],"answer":[1],"explain":"磷在土壤中移动性小、易被铁铝或钙固定，集中条施可减少与土粒的接触面，有机肥中的有机酸还能络合铁铝，B正确。磷几乎不随水下渗，A错；施磷不以提高pH为目的，C错；磷肥不会挥发，D错。","tag":"草地土壤管理"},{"id":"soil-i043","type":"single","stage":2,"stem":"退化草地补播前进行轻度耙地（划破草皮），其主要作用是","options":["彻底清除原有植被，减少种间竞争","把土壤pH调到适宜范围","改善表层通气透水状况，使种子与土壤密接","提高土壤盐分含量"],"answer":[2],"explain":"轻度耙地打破板结层、增加表层孔隙，开沟覆土又使种子与土壤密接，利于出苗，C正确。补播不宜彻底清除原有植被，A过头；耙地不改变pH和盐分，B、D错。","tag":"草地土壤管理"},{"id":"soil-i044","type":"single","stage":2,"stem":"草地施用人畜粪肥前需要充分腐熟，主要原因是","options":["腐熟后养分含量会成倍提高","腐熟可使粪肥中的盐分完全消失","腐熟能把有机质全部转化为无机盐","避免烧苗、减少虫卵和杂草种子，并防止养分损失"],"answer":[3],"explain":"未腐熟粪肥在土壤中二次发酵产生高温和有机酸，易烧根伤苗，还会带入虫卵、草籽，腐熟后也能减少氨挥发损失，D正确。腐熟不增加养分总量，A错；盐分不会消失，B错；腐熟是腐殖化与矿化的平衡，C错。","tag":"草地土壤管理"},{"id":"soil-i045","type":"single","stage":2,"stem":"草原陡坡地开垦为农田后，表层土壤有机质迅速下降，主要原因是","options":["水土流失加剧，且耕作促进有机质矿化","降水增多使淋溶作用加强","土壤质地由黏变砂","地下水位上升"],"answer":[0],"explain":"开垦破坏植被与团聚体，坡地水土流失带走富含有机质的表土，频繁耕作又提高通气性、加速矿化，A正确。降水条件未改变，B错；质地短期不会因开垦改变，C错；坡地开垦通常降低地下水位，D错。","tag":"草地土壤管理"},{"id":"soil-i048","type":"single","stage":2,"stem":"发育在石灰岩风化残积物上的土壤，与发育在花岗岩风化残积物上的土壤相比，其典型差异是","options":["富含石英砂粒，质地偏砂，酸性较强","富含钙镁，pH偏高，质地较黏","矿物组成相同，仅土层厚度不同","富含铁铝氧化物，盐基饱和度低"],"answer":[1],"explain":"石灰岩以碳酸钙为主，风化残积物富含钙镁，发育的土壤盐基饱和度高、pH偏碱、黏粒较多；花岗岩富含石英和长石，风化物砂粒多、易淋溶而偏酸，A、D恰好说反，C忽视了母质对矿物组成的决定作用。","tag":"土壤成土因素"},{"id":"soil-i049","type":"single","stage":2,"stem":"在年均温相近的条件下，年降水量由400 mm增至800 mm，草原土壤的淋溶作用和盐基饱和度将发生的变化是","options":["淋溶增强，盐基饱和度下降","淋溶增强，盐基饱和度上升","淋溶减弱，盐基饱和度下降","淋溶减弱，盐基饱和度上升"],"answer":[0],"explain":"降水增多使下渗水量加大，钙、镁、钾、钠等盐基离子被淋出剖面，盐基饱和度下降、土壤趋于酸性；B项把淋溶与盐基累积混为一谈，降水减少、蒸发占优时才会出现盐基表聚和饱和度升高。","tag":"土壤成土因素"},{"id":"soil-i050","type":"single","stage":2,"stem":"在山地丘陵区，从坡顶到坡脚，土壤厚度与水分状况的一般变化趋势是","options":["土层由厚变薄，水分由多到少","土层与水分均逐渐减少","土层由薄变厚，水分由少到多","土层与水分均无明显变化"],"answer":[2],"explain":"坡顶侵蚀强，成土物质易流失，土层薄而水分少；坡脚接受上坡搬运来的细土和径流，土层深厚、水分充足。A项把物质搬运方向弄反，D项忽视了地形对侵蚀和水分再分配的调控作用。","tag":"土壤成土因素"},{"id":"soil-i051","type":"single","stage":2,"stem":"在母质和气候相同的条件下，两处相邻阶地中形成较早、地势较低且长期稳定的阶地，其土壤剖面通常","options":["发育程度更低，仍保留母岩特征","层次分化更弱，腐殖质层更薄","与年轻阶地完全一致","发育程度更高，层次分化更明显"],"answer":[3],"explain":"时间因素决定土壤发育程度，成土时间越长，淋溶、淀积和层次分化越充分，低平稳定部位又少受侵蚀；A、B描述的是年轻阶地或侵蚀强烈地段的特点，C否认了时间与地形的作用。","tag":"土壤成土因素"},{"id":"soil-i055","type":"single","stage":2,"stem":"草地表层土壤被机械或牲畜压实后，下列变化正确的是","options":["容重增大，总孔隙度减小，透水性降低","容重减小，总孔隙度增大，透水性提高","容重增大，总孔隙度增大，透水性降低","容重减小，总孔隙度减小，透水性提高"],"answer":[0],"explain":"压实使单位体积内固体颗粒增多，容重增大，孔隙被压缩而总孔隙度减小，大孔隙减少使透水通气能力下降；B项把压实与疏松的效果混淆，C项中容重与孔隙度不可能同时增大。","tag":"土壤物理性质"},{"id":"soil-i056","type":"single","stage":2,"stem":"评价草地土壤结构好坏时，最能反映其抗蚀性和抗板结能力的指标是","options":["土壤中砂粒的百分含量","土壤绝对含水量","水稳性大团聚体（大于0.25 mm）的含量","土壤中砾石所占的比例"],"answer":[2],"explain":"水稳性大团聚体遇水不易分散，是结构稳定性的核心指标，含量高则土壤抗蚀、抗板结且孔性良好；A、D只反映颗粒组成，与结构稳定性没有直接对应关系，B是水分状况而非结构指标。","tag":"土壤物理性质"},{"id":"soil-i057","type":"single","stage":2,"stem":"野外用手搓法判断质地，土壤湿润后能搓成细条并弯成圆环而不产生裂纹，该土壤最可能是","options":["砂土","黏土","砂壤土","砾质土"],"answer":[1],"explain":"黏土黏粒含量高，黏结性和塑性最强，可搓成细长条并弯环不断；砂土几乎搓不成条，砂壤土只能搓成短条且弯环即断，砾质土含粗颗粒更易散裂。","tag":"土壤物理性质"},{"id":"soil-i058","type":"single","stage":2,"stem":"牧草根系在通气不良的草地上生长受阻，其直接原因是","options":["土壤温度过低使根系停止生长","土壤溶液中二氧化碳不足","土壤中养分总量过少","缺氧抑制根系呼吸，吸收水分和养分的能力下降"],"answer":[3],"explain":"通气不良时氧气被根系和微生物消耗而补充缓慢，有氧呼吸受抑，吸水吸肥能力下降，还可能积累还原性物质；A、C不是通气不良的直接后果，B把氧气与二氧化碳的作用混淆了。","tag":"土壤物理性质"},{"id":"soil-i059","type":"single","stage":2,"stem":"某土壤比重明显高于一般矿质土壤的常见值，最可能的原因是","options":["富含铁镁矿物等重矿物","含有较多未分解的有机质","具有较大的总孔隙度","含有大量新鲜的植物根系"],"answer":[0],"explain":"土壤比重由固体颗粒的矿物组成决定，铁镁矿物比重较大可使土壤比重升高；有机质比重仅1.3～1.5，含量高反而降低比重，孔隙度和根系属于孔性与生物因素，不改变比重。","tag":"土壤物理性质"},{"id":"soil-i064","type":"single","stage":2,"stem":"黏土的有效含水量范围常较砂土宽，但植物实际可利用的水分并不一定多，主要原因是","options":["黏土中毛管孔隙太少，水分难以移动","黏土吸持水分的力量大，相当部分水分难以被吸收","黏土中重力水含量过高","黏土的凋萎系数接近于零"],"answer":[1],"explain":"黏土比表面积大、吸附力强，田间持水量和凋萎系数都较高，二者差值虽大，但范围内相当部分水分受吸力束缚、移动缓慢；A错误，黏土毛管孔隙多而非少，C、D与黏土的水分性质不符。","tag":"土壤水分"},{"id":"soil-i065","type":"single","stage":2,"stem":"生产上常把田间持水量作为旱地灌溉的上限，其主要依据是","options":["超过田间持水量的水分形成重力水向下渗漏损失","田间持水量时土壤溶液浓度最高","超过田间持水量后毛管水停止移动","田间持水量在数值上等于凋萎系数"],"answer":[0],"explain":"田间持水量是毛管悬着水达到最大时的含水量，超过此值的水分不能被毛管保持，会以重力水形式渗漏并带走养分；B、C与水分常数含义不符，D混淆了田间持水量与凋萎系数。","tag":"土壤水分"},{"id":"soil-i066","type":"single","stage":2,"stem":"草地表层出现结皮和板结后，降水在土壤中的分配将发生的变化是","options":["入渗增加，地表径流减少，土壤蓄水量上升","入渗和地表径流均增加","入渗减少，地表径流增加，土壤蓄水量下降","入渗和地表径流均减少"],"answer":[2],"explain":"结皮封闭表层孔隙、降低入渗速率，降水来不及下渗便形成地表径流，土壤蓄水减少并加剧侵蚀；A项与结皮的水文效应正好相反，B、C不符合水量平衡关系。","tag":"土壤水分"},{"id":"soil-i067","type":"single","stage":2,"stem":"北方一些草地春季解冻时地表出现“返浆”现象，其水分主要来自","options":["春季降水的大量补给","地下水通过大孔隙直接上涌","植物根系的吐水","冬季深层土壤水分向冻结层迁移，解冻后聚集于表层"],"answer":[3],"explain":"冻结过程中温度梯度使水分向冻结锋面迁移，解冻后这部分水分留在表层，形成返浆；春季降水通常不多，A不成立，B混淆了毛管水与重力水运动，C与土壤水分来源无关。","tag":"土壤水分"},{"id":"soil-i070","type":"single","stage":2,"stem":"土壤中吸附交换能力最强、对保肥贡献最大的胶体是","options":["石英等原生矿物颗粒","有机无机复合胶体","游离的碳酸钙粉末","土壤溶液中的中性分子"],"answer":[1],"explain":"有机无机复合胶体兼具腐殖质的高电荷密度和黏土矿物的稳定结构，比表面大、交换量高，是保肥的核心；A、C表面电荷少，D呈电中性，都不能进行阳离子交换。","tag":"土壤化学性质"},{"id":"soil-i071","type":"single","stage":2,"stem":"草地上长期大量施用铵态氮肥后表层土壤pH下降，其主要原因是","options":["铵的硝化作用释放氢离子，同时铵离子交换出盐基离子","铵态氮肥本身呈强碱性","硝态氮被还原为氮气逸出","有机质迅速分解释放大量钙镁"],"answer":[0],"explain":"铵在硝化过程中产生氢离子，植物和微生物吸收铵时也会释放氢离子并代换出盐基离子，使盐基饱和度下降、pH降低；B与铵态氮肥的性质相反，C、D不会导致土壤酸化。","tag":"土壤化学性质"},{"id":"soil-i072","type":"single","stage":2,"stem":"石灰性土壤中磷的有效性通常较低，其主要原因是","options":["磷酸根被铁铝氧化物强烈固定","土壤pH过低使磷酸根被质子化","磷酸根与钙形成难溶性磷酸钙盐","土壤有机质含量过高固定了磷"],"answer":[2],"explain":"石灰性土壤富含碳酸钙、pH偏高，可溶性磷酸根易转化为溶解度很低的磷酸钙盐而失去有效性；A是酸性土壤的固定机制，B与石灰性土壤pH偏高的实际相反，D不是主要原因。","tag":"土壤化学性质"},{"id":"soil-i073","type":"single","stage":2,"stem":"长期渍水的草地土壤中，对牧草根系产生毒害的物质主要是","options":["硝酸根和硫酸根","碳酸钙和碳酸氢钙","交换性钙和镁","二价铁、硫化氢和低分子有机酸"],"answer":[3],"explain":"渍水后氧气耗尽，土壤进入还原状态，铁被还原为二价铁，硫酸盐还原产生硫化氢，有机质厌氧分解积累有机酸，均毒害根系；A、B、C是氧化状态下的正常成分。","tag":"土壤化学性质"},{"id":"soil-i077","type":"single","stage":2,"stem":"某草地土壤养分全量分析结果较高，但牧草产量长期偏低，最可能的原因是","options":["养分多处于难利用状态，且水、气、热不协调","土壤中完全不含养分","牧草品种过于耐瘠薄","土壤质地过粗使养分全部淋失"],"answer":[0],"explain":"全量养分只反映潜在肥力，若养分释放慢、有效性低，又存在水分不足或通气不良等限制，有效肥力仍然偏低；B与全量较高相矛盾，C、D无法解释全量高而产量低的矛盾。","tag":"土壤肥力"},{"id":"soil-i078","type":"single","stage":2,"stem":"草地土壤中蚯蚓数量多、活动旺盛，通常说明该土壤","options":["盐分含量过高，pH偏碱","长期渍水，氧气不足","有机质较丰富，结构良好，通气透水","质地粗，保水能力差"],"answer":[2],"explain":"蚯蚓以有机残体为食，活动时疏松土壤、促进团聚体形成，数量多表明有机质充足、孔性与通气状况良好；A、B、D所描述的逆境都会抑制蚯蚓的生存和繁殖。","tag":"土壤肥力"},{"id":"soil-i080","type":"single","stage":2,"stem":"某草地地下水位仅1 m左右，蒸发强烈，表层已明显积盐，改良时应优先采取的措施是","options":["大量灌水冲洗而不设排水","建立排水系统，把地下水位降到临界深度以下","增施生理碱性肥料","深翻把盐分埋入深层"],"answer":[1],"explain":"地下水位浅是盐分表聚的根源，必须通过明沟或暗管排水把水位控制在临界深度以下，再配合灌水淋盐；A会抬升水位加重返盐，C、D都不能消除盐分的来源。","tag":"土壤盐碱化"},{"id":"soil-i081","type":"single","stage":2,"stem":"碱土施用石膏改良的主要作用是","options":["直接溶解并淋洗表层可溶性盐","提高土壤pH以抑制盐分上升","增加毛管孔隙，促进返盐","以钙离子代换交换性钠，降低碱化度并改善结构"],"answer":[3],"explain":"碱土的核心问题是交换性钠使土粒分散、结构恶化，石膏提供的钙离子把钠代换下来，随排水排出后碱化度和pH下降、结构恢复；A是盐土冲洗的作用，B、C方向与改良目标相反。","tag":"土壤盐碱化"},{"id":"soil-i082","type":"single","stage":2,"stem":"盐土采用灌水冲洗改良时必须配套排水设施，主要原因是","options":["防止地下水位抬升，避免盐分重新返回根层","冲洗水会溶解全部土壤矿物","排水可以提高土壤温度","排水能直接中和土壤碱性"],"answer":[0],"explain":"只灌不排会使地下水位抬高，毛管水上升把盐分带回表层，形成次生盐渍化；排水既带走淋洗出的盐分，又控制水位。B、C、D都不是冲洗必须配套排水的原因。","tag":"土壤盐碱化"},{"id":"soil-i083","type":"single","stage":2,"stem":"以硫酸钠为主的盐土对植物的危害一般小于以氯化钠为主的盐土，主要原因是","options":["硫酸钠完全不溶于水","硫酸钠能直接被植物吸收利用","硫酸钠溶解度较低，产生的渗透胁迫相对较小","硫酸钠使土壤pH显著降低"],"answer":[2],"explain":"硫酸盐溶解度低于氯化物，同等盐量下土壤溶液浓度和渗透压较低，对根系吸水的抑制较轻；A过于绝对，B、D与硫酸钠的实际性质不符，但硫酸钠结晶膨胀仍会破坏结构。","tag":"土壤盐碱化"},{"id":"soil-i084","type":"single","stage":2,"stem":"盐碱草地上增施腐熟有机肥能减轻盐害，其主要原因是","options":["有机肥中的盐分中和了土壤中的盐","改善结构、增加孔隙，抑制毛管水强烈上升和盐分表聚","有机肥使土壤pH迅速降到酸性","有机肥完全阻止了水分蒸发"],"answer":[1],"explain":"有机质促进团聚体形成、改善孔性，切断毛管连续性，减少蒸发引起的盐分表聚，同时提高养分供应与缓冲能力；A、C、D夸大或歪曲了有机肥的实际作用。","tag":"土壤盐碱化"},{"id":"soil-i087","type":"single","stage":2,"stem":"草地灌溉采用小定额多次灌溉比一次大水漫灌更合理，主要好处是","options":["使土壤含水量长期保持饱和","增加地表径流以冲刷盐分","降低土壤热容量","减少深层渗漏和养分淋失，避免地下水位抬升"],"answer":[3],"explain":"小定额灌溉按需补水，水分主要保持在根层毛管孔隙中，深层渗漏少，养分淋失和地下水位抬升的风险小；A、B与合理灌溉目标相反，C与灌溉的水热效应无关。","tag":"草地土壤管理"},{"id":"soil-i088","type":"single","stage":2,"stem":"南方酸性草地上施用石灰的主要作用是","options":["中和土壤酸性，提高盐基饱和度和养分有效性","降低土壤pH，抑制杂草生长","增加土壤可溶性盐含量","把土壤阳离子交换量提高到无限大"],"answer":[0],"explain":"石灰中和活性酸和潜性酸，补充钙、镁等盐基离子，提高盐基饱和度，减轻铝毒并改善磷等养分的有效性；B方向相反，C、D不符合石灰的作用机理。","tag":"草地土壤管理"},{"id":"soil-i089","type":"single","stage":2,"stem":"在风蚀严重的草地上营造防护林带并保留牧草残茬，其主要作用是","options":["提高地下水位以补充土壤水分","增加土壤盐分积累","降低近地表风速，减少风蚀并截留积雪增加水分","加快有机质分解"],"answer":[2],"explain":"林带和残茬削弱近地表风速，使风蚀输沙能力下降，同时拦截积雪、减少蒸发，改善土壤水分状况；A、B、D都不是防护林带和残茬的主要作用。","tag":"草地土壤管理"},{"id":"soil-i090","type":"single","stage":2,"stem":"长期放牧的草地中，牲畜饮水点附近土壤退化最严重，主要原因是","options":["该处地下水位下降导致干旱","践踏压实强烈，养分富集，植被被反复采食破坏","该处土壤母质最差","该处降水量最少"],"answer":[1],"explain":"牲畜集中往返与停留造成强烈践踏，土壤压实、孔隙减少，粪尿使养分局部富集，植被反复采食后难以恢复；A、C、D把管理因素造成的问题归因于自然条件。","tag":"草地土壤管理"},{"id":"soil-i091","type":"single","stage":2,"stem":"与适度放牧相比，长期过度放牧使草地土壤有机碳含量下降，其主要机制是","options":["土壤黏粒含量迅速升高","土壤pH急剧升高","土壤动物活动完全停止","地上生物量和根系碳输入减少，侵蚀与呼吸损失增加"],"answer":[3],"explain":"过牧使植被盖度和根系更新减弱，进入土壤的有机碳减少，同时地表裸露加剧侵蚀、微生物分解旺盛，碳输出增加；A、B、C都不是过牧导致有机碳下降的主要机制。","tag":"草地土壤管理"},{"id":"soil-s09","type":"single","stem":"某草地表层土壤容重为1.3 g/cm³，比重为2.65 g/cm³，其总孔隙度约为","options":["40.0%","50.9%","60.2%","70.0%"],"answer":[1],"explain":"总孔隙度=1-容重/比重=1-1.3/2.65≈50.9%，说明该表层结构较紧实；40.0%对应容重约1.59 g/cm³，60.2%对应容重约1.05 g/cm³，均与题设不符。","tag":"土壤物理性质","level":2,"stage":2,"standard":true},{"id":"soil-s11","type":"single","stem":"植物永久凋萎点对应的土壤含水量（凋萎系数）主要受下列哪一因素影响","options":["土壤质地，黏质土的凋萎系数高于砂质土","土壤酸碱反应","土壤碳酸钙含量","土壤氧化还原电位"],"answer":[0],"explain":"凋萎系数是植物永久凋萎时土壤尚能保持的水量，受土壤吸力和比表面控制；黏粒越多、吸附越强，凋萎系数越高，黏土可达15%~20%，砂土仅3%~6%。","tag":"土壤水分","level":2,"stage":2,"standard":true},{"id":"soil-s12","type":"single","stem":"对牧草而言，土壤有效水的范围是","options":["田间持水量与凋萎系数之间的水分","饱和含水量与田间持水量之间的水分","毛管水与重力水的总和","吸湿水与膜状水"],"answer":[0],"explain":"有效水为田间持水量与凋萎系数之间的水分，牧草主要吸收其中的毛管水；饱和含水量与田间持水量之间为重力水，易渗漏损失，吸湿水与膜状水则难以被植物利用。","tag":"土壤水分","level":2,"stage":2,"standard":true},{"id":"soil-s15","type":"single","stem":"下列关于土壤有机质作用的叙述，错误的是","options":["是植物氮、磷、硫等养分的重要来源","能改善土壤结构，提高保水保肥能力","分解产生的有机酸可促进矿物风化与养分释放","有机质含量越高，土壤pH必然越低"],"answer":[3],"explain":"有机质是氮磷硫等养分的重要来源，并能改善结构、提高保水保肥性；其分解产生的有机酸虽可降低pH，但有机质本身近中性，且受盐基饱和程度影响，“必然越低”过于绝对，故D错误。","tag":"土壤化学性质","level":2,"stage":2,"standard":true},{"id":"soil-s18","type":"single","stem":"盐碱土改良的综合措施是","options":["只大量施用化肥以提高产量","以排水为前提，结合洗盐、增施有机肥和种植耐盐牧草","只种植耐盐植物而不采取排水措施","大量施用石灰中和土壤碱性"],"answer":[1],"explain":"盐碱土改良须“排水为前提、洗盐为核心、培肥为基础”，并配合种植耐盐牧草与合理灌溉；只施化肥、只种植物不排水或单施石灰，均不能有效降低根层盐分或交换性钠。","tag":"土壤盐碱化","level":2,"stage":2,"standard":true},{"id":"soil-s19","type":"single","stem":"围栏封育对退化草地土壤的主要影响是","options":["降低土壤有机质含量","提高植被盖度，促进有机质积累与团粒结构形成","增大土壤容重，加剧土壤板结","加剧风蚀水蚀，使土层变薄"],"answer":[1],"explain":"围栏封育可提高植被盖度与凋落物归还量，促进有机质积累和水稳性团聚体形成，降低容重、减轻侵蚀；有机质下降与容重增加是过牧退化的表现，故A、C、D错误。","tag":"草地土壤管理","level":2,"stage":2,"standard":true},{"id":"soil-i006","type":"multi","stage":2,"stem":"关于五大自然成土因素作用的叙述，正确的有","options":["气候通过水热条件控制矿物风化强度与有机质分解速度","母质决定土壤初始的矿质组成和养分基础","地形通过影响水热再分配和物质迁移间接影响成土过程","成土时间越长，土壤肥力必然越高"],"answer":[0,1,2],"explain":"气候、母质、地形分别从水热条件、矿质基础和物质再分配影响成土过程，A、B、C正确。时间延长只表明发育程度高，若气候或利用方式不利，肥力可能很低甚至退化，D把时间等同于肥力，错误。","tag":"土壤成土因素"},{"id":"soil-i007","type":"multi","stage":2,"stem":"关于生物因素在成土过程中的作用，叙述正确的有","options":["植被类型改变不会影响土壤有机质含量","植物根系分泌有机酸，可加速矿物风化","土壤动物的取食和排泄促进有机残体与矿质土粒混合","微生物分解有机残体，释放养分并合成腐殖质"],"answer":[1,2,3],"explain":"根系分泌有机酸加速矿物风化，土壤动物取食排泄促进混土，微生物分解残体并合成腐殖质，B、C、D正确。植被类型决定有机残体的数量与质量，草甸与针叶林下有机质差别显著，A错误。","tag":"土壤成土因素"},{"id":"soil-i015","type":"multi","stage":2,"stem":"下列因素中，会使土壤容重减小的有","options":["增施有机肥，提高有机质含量","改善结构，形成较多水稳性团聚体","机械压实或长期过牧践踏","增加土壤中粗砂粒的比例"],"answer":[0,1],"explain":"有机质密度小并能形成疏松团聚体，结构改善后孔隙增多，二者都使容重减小，A、B正确。机械压实和践踏排出孔隙，容重增大，C错；粗砂粒多则排列紧密，容重通常增大，D错。","tag":"土壤物理性质"},{"id":"soil-i016","type":"multi","stage":2,"stem":"关于土壤孔隙类型及其功能的叙述，正确的有","options":["通气孔隙孔径较大，主要起通气排水作用","毛管孔隙靠毛管力保持水分，是植物吸水的主要场所","非活性孔隙中的水分植物难以吸收利用","总孔隙度越大，通气孔隙所占比例一定越高"],"answer":[0,1,2],"explain":"通气孔隙通气排水、毛管孔隙持水供水、非活性孔隙中的水难以利用，三种孔隙的功能区别即A、B、C所述。总孔隙度高不等于通气孔隙多，若以毛管孔隙为主仍会通气不良，D错误。","tag":"土壤物理性质"},{"id":"soil-i022","type":"multi","stage":2,"stem":"下列措施中，能提高草地土壤有效水贮量的有","options":["增施有机肥，促进团粒结构形成","深耕打破犁底层，加厚疏松耕层","地表覆盖秸秆，减少无效蒸发","大量施用石灰，把pH提高到8以上"],"answer":[0,1,2],"explain":"改善结构、加厚疏松耕层可增大持水孔隙和根系吸水空间，覆盖减少无效蒸发，A、B、C都能提高有效水贮量。大量施石灰把pH提到8以上会降低养分有效性并破坏结构，D错。","tag":"土壤水分"},{"id":"soil-i023","type":"multi","stage":2,"stem":"某砂质土田间持水量为18%、凋萎系数为6%，下列分析正确的有","options":["该土壤有效水含量约为12个百分点","有效水占田间持水量的比例约为67%","与黏土相比，砂土的有效水上限通常较低","该土壤的凋萎系数高于一般黏土"],"answer":[0,1,2],"explain":"有效水=18%-6%=12个百分点，占田间持水量的12/18≈67%；砂土田间持水量通常低于黏土，故有效水上限较低。黏土凋萎系数一般高于砂土，第四项错误。","tag":"土壤水分"},{"id":"soil-i029","type":"multi","stage":2,"stem":"下列措施中，能提高土壤阳离子交换量、增强保肥能力的有","options":["增施有机肥料，提高有机质含量","客土掺黏，增加细粒矿物含量","长期过量施用生理酸性铵态氮肥","频繁大水漫灌，淋洗盐基离子"],"answer":[0,1],"explain":"CEC主要取决于有机质和黏粒的数量与类型，增施有机肥和客土掺黏都能增加交换位点，A、B正确。生理酸性肥料长期施用会淋失盐基，C错；大水漫灌淋洗带走交换性盐基，D错。","tag":"土壤化学性质"},{"id":"soil-i030","type":"multi","stage":2,"stem":"关于土壤酸碱性的叙述，正确的有","options":["土壤酸化主要由盐基离子被淋洗和致酸离子增多引起","pH降低会提高铁、铝、锰的溶解度","长期施用铵态氮肥可使土壤逐渐酸化","pH越高，土壤中磷的有效性越高"],"answer":[0,1,2],"explain":"盐基淋失与氢铝增加是酸化的实质，酸化提高铁、铝、锰的溶解度，铵态氮硝化产酸也会致酸，A、B、C正确。pH过高时磷被钙固定，有效性下降，D错误。","tag":"土壤化学性质"},{"id":"soil-i038","type":"multi","stage":2,"stem":"下列情况中，容易引起草地次生盐渍化的有","options":["大水漫灌且排水不畅，使地下水位抬高","蒸发强烈，盐分随毛管水在表层积累","地下水位长期低于临界深度","长期种植耐盐牧草并配合排水"],"answer":[0,1],"explain":"次生盐渍化的实质是水盐运动失衡，灌排不当抬高地下水位、强烈蒸发使盐分表聚都会导致返盐，A、B正确。地下水位低于临界深度不会引起毛管返盐，C错；种植耐盐牧草配合排水是改良措施，D错。","tag":"土壤盐碱化"},{"id":"soil-i046","type":"multi","stage":2,"stem":"下列措施中，有利于减轻草地土壤板结与紧实的有","options":["控制放牧强度，实行划区轮牧","适时耙松表层，打破结皮和紧实层","增施有机肥，促进团粒结构形成","增加家畜践踏强度以破碎土块"],"answer":[0,1,2],"explain":"控制放牧强度、耙松表层打破结皮紧实层、增施有机肥改善结构，都能降低容重、恢复孔隙，A、B、C正确。增加家畜践踏强度只会进一步压实土壤、加重板结，D错。","tag":"草地土壤管理"},{"id":"soil-i052","type":"multi","stage":2,"stem":"下列情形中，能说明地形对成土过程产生影响的有","options":["坡顶土层薄，坡脚土层深厚","地形通过改变母质的矿物成分决定土壤类型","阳坡与阴坡的土壤水热状况和植被类型不同","不同海拔高度形成不同的土壤垂直带"],"answer":[0,2,3],"explain":"地形通过再分配水热和成土物质影响成土过程，坡位分异、坡向水热差异和海拔垂直分异都是其表现；B项错误，地形只能搬运、堆积母质，不能改变母质本身的矿物组成。","tag":"土壤成土因素"},{"id":"soil-i053","type":"multi","stage":2,"stem":"关于气候因素对土壤形成影响的叙述，正确的有","options":["高温多雨有利于矿物彻底分解和盐基离子淋失","干旱区蒸发强烈，盐分易在表层积聚","寒冷地区微生物活性低，有机质分解慢而易于积累","降水量越大，土壤有机质含量必然越高"],"answer":[0,1,2],"explain":"水热条件决定风化强度、淋溶程度和有机质分解速度，A、B、C分别对应湿热、干旱和寒冷条件下的成土特点；D项错误，降水过多时淋溶与分解都旺盛，有机质反而难以积累。","tag":"土壤成土因素"},{"id":"soil-i060","type":"multi","stage":2,"stem":"关于土壤热性质及其影响的叙述，正确的有","options":["砂土热容量小、导热快，昼夜温差较大","土壤含水量增加后热容量增大，升温变慢","地面覆盖枯草层可减小表层温度的剧烈变化","土壤颜色越浅，吸收太阳辐射越多，升温越快"],"answer":[0,1,2],"explain":"热容量和导热率决定土温变化幅度，砂土缺水、热容量小而升温降温都快，增湿后热容量增大升温趋缓，覆盖层可隔热保温；D项错误，颜色越深吸收辐射越多、升温越快。","tag":"土壤物理性质"},{"id":"soil-i061","type":"multi","stage":2,"stem":"关于土壤物理机械性（黏结性、黏着性、塑性）与耕作的叙述，正确的有","options":["黏粒含量越高，黏结性和黏着性越强","土壤过湿时黏着性大，耕作易形成大土块","塑性是土壤在一定含水量下受外力变形后保持形状的能力","含水量越高土壤耕作阻力越小，耕性越好"],"answer":[0,1,2],"explain":"黏结性、黏着性和塑性都随黏粒和含水量增加而增强，过湿耕作会挤压成块并破坏结构，A、B、C正确；D项错误，含水量过高时黏着性和塑性显著增大，耕作阻力反而增加。","tag":"土壤物理性质"},{"id":"soil-i068","type":"multi","stage":2,"stem":"关于不同质地土壤水分特性的叙述，正确的有","options":["砂土通气透水好，保水能力差","黏土田间持水量高，但有效水比例较低","壤土的毛管孔隙与大孔隙比例较适宜，有效水含量常较高","砂土凋萎系数高，有效水范围宽"],"answer":[0,1,2],"explain":"质地决定孔隙组成，砂土大孔隙多而保水差，黏土毛管孔隙多、持水量高但束缚水比例大，壤土孔隙比例适中、有效水常最多；D项错误，砂土凋萎系数低，有效水范围窄。","tag":"土壤水分"},{"id":"soil-i074","type":"multi","stage":2,"stem":"酸性土壤、石灰性土壤与有机质丰富的土壤，其养分有效性表现不同。下列判断正确的有","options":["酸性土壤中磷易被铁铝固定而降低有效性","土壤pH越高，各种养分的有效性都越高","钾的有效性主要取决于交换性钾含量和黏土矿物类型","有机质矿化可释放速效氮、磷供植物吸收"],"answer":[0,2,3],"explain":"养分有效性受pH、吸附固定和有机质矿化共同影响，酸性土固磷、交换性钾决定供钾、矿化释放速效养分均正确；B项错误，pH过高会使铁、锰、锌、磷等养分有效性下降。","tag":"土壤化学性质"},{"id":"soil-i075","type":"multi","stage":2,"stem":"关于土壤缓冲性及其来源的叙述，正确的有","options":["缓冲性主要来自土壤胶体吸附的交换性离子","碳酸钙对进入土壤的酸性物质具有中和缓冲作用","有机质含量高的土壤缓冲能力通常较强","砂土缓冲性一般强于黏土，因此不易酸化"],"answer":[0,1,2],"explain":"交换性离子、碳酸盐和有机质是土壤缓冲体系的主要组成，可使pH变化趋于平缓；D项错误，砂土胶体少、缓冲能力弱，连续施用酸性或生理酸性肥料更易酸化。","tag":"土壤化学性质"},{"id":"soil-i085","type":"multi","stage":2,"stem":"关于盐碱土水盐运动与调控的叙述，正确的有","options":["干旱区蒸发与降水之比大，盐分易向表层积聚","把地下水位控制在临界深度以下是防止次生盐渍化的关键","覆盖秸秆或地膜可减少蒸发，抑制返盐","只灌不排的大水漫灌是改良盐土最经济有效的方法"],"answer":[0,1,2],"explain":"蒸发强、地下水位浅和毛管水上升是盐分表聚的几个环节，控制水位与覆盖抑蒸分别切断了其中环节；D项错误，只灌不排会抬高地下水位，反而引起次生盐渍化。","tag":"土壤盐碱化"},{"id":"soil-i092","type":"multi","stage":2,"stem":"关于退化草地土壤改良措施的叙述，正确的有","options":["围栏封育可减少践踏和采食，为植被与土壤恢复提供条件","补播豆科牧草可增加氮素输入并改善地表覆盖","深翻晒垡是恢复退化草地最经济有效的普遍措施","施用有机肥可改善结构、提高保水保肥能力"],"answer":[0,1,3],"explain":"封育、补播和施有机肥分别从减少干扰、增加氮输入和改善结构入手，是退化草地常用的综合措施；C项错误，深翻会破坏土壤结构、加剧风蚀水蚀，在半干旱草地不宜普遍采用。","tag":"草地土壤管理"},{"id":"soil-m01","type":"multi","stem":"下列措施中，有利于改善土壤结构、提高土壤孔隙度的有","options":["长期大水漫灌","增施有机肥","合理轮作与种植绿肥","适度深耕与晒垡"],"answer":[1,2,3],"explain":"增施有机肥、轮作绿肥和适度深耕晒垡均能促进水稳性团聚体形成、改善孔隙状况；长期大水漫灌会破坏结构、造成板结和养分淋失，故A错误。","tag":"土壤物理性质","level":2,"stage":2,"standard":true},{"id":"soil-i008","type":"judge","stage":2,"stem":"在五大自然成土因素中，气候是决定土壤有机质含量的唯一因素。","options":["正确","错误"],"answer":[1],"explain":"气候的水热条件只决定有机质积累与分解的总趋势，植被类型、母质质地、地形水分状况和利用方式都会影响有机质含量，故“唯一因素”的说法错误。同一气候带内草甸土与风沙土的有机质差异即可说明。","tag":"土壤成土因素"},{"id":"soil-i017","type":"judge","stage":2,"stem":"土壤容重是单位体积原状土壤（包括孔隙）烘干后的重量，其数值一般小于土壤比重。","options":["正确","错误"],"answer":[0],"explain":"该陈述正确。容重的体积包含孔隙，故数值多为1.0～1.6 g/cm³；比重只计固相物质，数值约2.6～2.7 g/cm³，二者不能混用。常见的错误是把容重与比重的定义互换。","tag":"土壤物理性质"},{"id":"soil-i024","type":"judge","stage":2,"stem":"土壤含水量越低，土壤水吸力越大，植物根系吸水越困难。","options":["正确","错误"],"answer":[0],"explain":"该陈述正确。含水量下降使水膜变薄、毛管弯月面曲率增大，基质吸力升高；当吸力达到约1.5 MPa时，植物无法吸水而永久凋萎，该含水量即凋萎系数。","tag":"土壤水分"},{"id":"soil-i031","type":"judge","stage":2,"stem":"土壤胶体一般带负电荷，主要吸附钙、镁、钾等阳离子，对氯离子和硝酸根的吸附很弱。","options":["正确","错误"],"answer":[0],"explain":"该陈述正确。带负电的胶体通过静电引力吸附交换性阳离子，阴离子受排斥，只能产生很弱的专性吸附，故氯离子、硝酸根易随水淋失，这也是硝态氮肥保肥性差的原因。","tag":"土壤化学性质"},{"id":"soil-i039","type":"judge","stage":2,"stem":"盐土与碱土的主要区别在于，盐土含大量可溶性盐而交换性钠占CEC的比例不高。","options":["正确","错误"],"answer":[0],"explain":"该陈述正确。盐土以可溶性盐富集为主，碱化度通常低于15%，pH不一定很高；碱土则以交换性钠高、碱化度大于15%、pH高、土粒分散为特征。","tag":"土壤盐碱化"},{"id":"soil-i040","type":"judge","stage":2,"stem":"只要土壤含盐量高，施用石膏都能取得良好的改良效果。","options":["正确","错误"],"answer":[1],"explain":"石膏的作用是提供钙以置换交换性钠，适用于碱土和钠质盐土；以氯化钠、硫酸钠为主的盐土应首先排水洗盐、降低地下水位，单施石膏效果有限，故该陈述错误。","tag":"土壤盐碱化"},{"id":"soil-i047","type":"judge","stage":2,"stem":"草地土壤有机质主要来自地上凋落物，死亡根系和根系分泌物的贡献很小。","options":["正确","错误"],"answer":[1],"explain":"草地上草本植物根系密集、更新快，根系死亡残体与分泌物是土壤有机质的主要来源，其贡献常超过地上凋落物，且有利于团聚体形成，故该陈述错误。","tag":"草地土壤管理"},{"id":"soil-i054","type":"judge","stage":2,"stem":"同一气候带内，只要母质
