"ecology-i012","type":"judge","stage":2,"stem":"在集合种群中，若局域种群的灭绝速率持续高于再定居速率，则整个集合种群将逐渐消失。","options":["正确","错误"],"answer":[0],"explain":"集合种群的存续取决于局域灭绝与再定居的平衡，再定居不断补充消失的局域种群。当灭绝速率持续高于再定居速率时，被占据的斑块数不断减少，最终整个集合种群消失，该陈述正确。","tag":"种群生态"},{"id":"ecology-i022","type":"judge","stage":2,"stem":"群落的物种丰富度一般随纬度升高而增加。","options":["正确","错误"],"answer":[1],"explain":"热带地区水热条件优越、生境稳定且演化历史久远，物种丰富度最高，随纬度升高丰富度总体下降。该陈述把规律说反了，正确表述应为群落的物种丰富度一般随纬度升高而降低。","tag":"群落生态"},{"id":"ecology-i023","type":"judge","stage":2,"stem":"初生演替与次生演替的主要区别在于演替开始时的基质条件和原有植被与土壤是否存在。","options":["正确","错误"],"answer":[0],"explain":"初生演替开始于从未有植被覆盖、或原有植被与土壤被彻底破坏的裸地，次生演替则发生在土壤和繁殖体基本保留的次生裸地，二者的区别正在于起始基质条件，该陈述正确。","tag":"群落生态"},{"id":"ecology-i037","type":"judge","stage":2,"stem":"能量金字塔在任何生态系统中都不会出现倒置。","options":["正确","错误"],"answer":[0],"explain":"能量沿食物链逐级递减，每一营养级所固定的能量总是少于其下一营养级，因此能量金字塔始终正立。数量金字塔和生物量金字塔可能倒置，但能量金字塔不会，该陈述正确。","tag":"生态系统"},{"id":"ecology-i038","type":"judge","stage":2,"stem":"生态系统中的分解者只包括细菌和真菌两大类。","options":["正确","错误"],"answer":[1],"explain":"分解者还包括蚯蚓、粪金龟和马陆等食碎屑动物以及部分原生动物，它们通过破碎和取食加速有机物分解。把分解者限定为细菌和真菌两类缩小了其范围，故该陈述错误。","tag":"生态系统"},{"id":"ecology-i046","type":"judge","stage":2,"stem":"草地长期过度放牧会使植被由多年生优良禾草向一年生杂类草和毒害草转变。","options":["正确","错误"],"answer":[0],"explain":"过度放牧持续削弱多年生禾草的贮藏养分和再生能力，使其丧失优势地位，而家畜不喜食的毒害草和一年生杂类草得以扩张，形成退化演替。这一方向符合放牧退化的一般规律，该陈述正确。","tag":"草原生态"},{"id":"ecology-i047","type":"judge","stage":2,"stem":"围封禁牧的时间越长，草地的生产力和物种多样性就越高。","options":["正确","错误"],"answer":[1],"explain":"围封初期草地恢复明显，但长期禁牧会造成枯落物大量积累、光照不足和养分循环变慢，反而使生产力和多样性下降。因此围封时间并非越长越好，应根据草地状况适时利用，该陈述错误。","tag":"草原生态"},{"id":"ecology-i058","type":"judge","stage":2,"stem":"某动物种群中雄性个体过多、雌性个体过少，种群出生率明显下降，说明性比是影响种群数量变动的因素之一。","options":["正确","错误"],"answer":[0],"explain":"陈述正确。性比决定能参与繁殖的雌雄个体数量，雌性过少时有效繁殖个体不足，出生率下降，进而影响种群数量变动。若认为性比与种群动态无关，则忽视了繁殖个体数量对出生率的直接限制。","tag":"种群生态"},{"id":"ecology-i069","type":"judge","stage":2,"stem":"两个物种的生态位重叠越多，它们之间的竞争通常越激烈，长期共存的可能性越小。","options":["正确","错误"],"answer":[0],"explain":"陈述正确。生态位重叠意味着对相同资源有共同需求，重叠程度越大竞争越激烈，若资源不足以支持双方，竞争力弱者可能被排除而难以长期共存。但若资源充足或发生生态位分化，二者仍可共存。","tag":"群落生态"},{"id":"ecology-i070","type":"judge","stage":2,"stem":"群落中物种数目越多，其物种多样性指数就一定越高。","options":["正确","错误"],"answer":[1],"explain":"陈述错误。物种多样性由物种丰富度和均匀度共同决定，若物种数目多但个体高度集中于少数种，多样性指数可能低于物种数少而分布均匀的群落。因此仅凭物种数目不能断定多样性指数一定更高。","tag":"群落生态"},{"id":"ecology-i083","type":"judge","stage":2,"stem":"生态系统的总初级生产量扣除植物自身呼吸消耗后的部分，称为净初级生产量。","options":["正确","错误"],"answer":[0],"explain":"陈述正确。总初级生产量是植物光合固定的有机物质总量，其中一部分用于植物呼吸消耗，剩余部分即净初级生产量，可供消费者和分解者利用，也可积累为现存量。二者的关系常写作净初级生产量等于总初级生产量减呼吸量。","tag":"生态系统"},{"id":"ecology-i084","type":"judge","stage":2,"stem":"分解者分解有机物释放的能量可重新被生产者固定利用，因此生态系统中的能量流动是可循环的。","options":["正确","错误"],"answer":[1],"explain":"陈述错误。分解者释放的能量大部分以热能散失，不能再被生产者利用；生产者只能固定太阳能。能量流动是单向、逐级递减的，只有物质可以循环，把能量流动说成可循环混淆了能量与物质的特点。","tag":"生态系统"},{"id":"ecology-i092","type":"judge","stage":2,"stem":"只要围封禁牧的时间足够长，任何退化草地都能自行恢复到原始状态，无须采取其他措施。","options":["正确","错误"],"answer":[1],"explain":"陈述错误。围封禁牧对轻中度退化草地效果较好，但重度退化草地的土壤种子库和表土已严重损失，仅靠围封难以恢复，需配合补播、松土、施肥等措施。把围封说成万能措施，忽视了退化程度和土壤条件的差异。","tag":"草原生态"},{"id":"ecology-i093","type":"judge","stage":2,"stem":"草原上的蝗虫、鼠类等消费者不仅取食植物，也参与物质循环和能量流动，其数量变化会影响植物群落组成。","options":["正确","错误"],"answer":[0],"explain":"陈述正确。消费者通过取食改变植物种群的数量和竞争关系，其遗体、粪便经分解者分解后把物质归还土壤，同时能量沿食物链传递，因此蝗虫、鼠类既影响群落组成，也是物质循环与能量流动的环节。","tag":"草原生态"},{"id":"ecology-a001","type":"single","stage":3,"stem":"用标记重捕法调查某草地黄鼠种群：第一次捕获并标记80只，释放后重捕120只，其中带标记的16只。调查区域面积为20 hm²，标记个体与未标记个体已充分混合。该区域黄鼠的种群密度约为","options":["20只/hm²","30只/hm²","40只/hm²","60只/hm²"],"answer":[1],"explain":"先求总数N=(M×C)/R=80×120÷16=600只，再除以面积20 hm²得30只/hm²。只算出600只而忘记除以面积，就会误选60只/hm²。","tag":"种群生态"},{"id":"ecology-a002","type":"single","stage":3,"stem":"某种昆虫在食物充足、无天敌的条件下，每代种群数量为上一代的3倍，起始数量为50只。按此周限增长率计算，经过4代后该种群数量为","options":["1350只","2025只","4050只","12150只"],"answer":[2],"explain":"Nt=N0×λ^t=50×3^4=50×81=4050只。1350只是按3代计算，12150只把代数按5代计算，均混淆了周限增长率与增长代数。","tag":"种群生态"},{"id":"ecology-a004","type":"single","stage":3,"stem":"两种草履虫在相同条件下混合培养，甲、乙的环境容纳量分别为300和100；就资源消耗而言，1只乙相当于0.5只甲，1只甲相当于2只乙。按洛特卡-沃尔泰拉竞争模型判断，长期培养的结果最可能是","options":["甲胜出，乙被排除","乙胜出，甲被排除","二者稳定共存","二者均逐渐消失"],"answer":[0],"explain":"乙单独存在时甲仍能增长（300-0.5×100>0），而甲饱和时乙的增长率为负（100-2×300<0），故甲胜出、乙被排除。两者稳定共存需两个方向的不等式同时成立。","tag":"种群生态"},{"id":"ecology-a005","type":"single","stage":3,"stem":"某景观中某种蝴蝶分布于相互隔离的若干斑块，每年约有15%的局部种群灭绝，同时有15%的空白斑块被重新占据。若迁入与灭绝速率保持这一水平，则该集合种群的斑块占有率","options":["持续上升至100%","下降至零并保持","在0与100%之间无规律波动","稳定在约50%"],"answer":[3],"explain":"平衡占有率p*=c/(c+e)=0.15/(0.15+0.15)=50%。占有率高于50%时灭绝数多于迁入数，低于50%时反之，故稳定于50%。","tag":"种群生态"},{"id":"ecology-a007","type":"single","stage":3,"stem":"某啮齿动物种群密度过高时，个体间争斗加剧，肾上腺皮质激素水平升高，导致繁殖受抑、死亡率上升，密度随之回落。这种调节属于","options":["外源性的气候调节","与密度无关的调节","外源性的食物调节","内源性的内分泌调节"],"answer":[3],"explain":"该调节由种群密度升高引发的个体内分泌反应实现，属于内源性自动调节。气候与食物属外源性因素，其作用不依赖这种生理反馈，故不选。","tag":"种群生态"},{"id":"ecology-a009","type":"single","stage":3,"stem":"某动物生命表显示，1000个新生个体中第1年存活950个、第5年存活900个、第10年存活100个。该种群的存活曲线最接近","options":["Ⅱ型（对角线型）","Ⅲ型（凹型）","Ⅰ型（凸型）","无法归入任何类型"],"answer":[2],"explain":"该种群早期和中期存活率都很高，死亡集中在生命后期，符合Ⅰ型凸型曲线。Ⅱ型各龄期死亡率相近，Ⅲ型幼体死亡率极高，均与表中数据不符。","tag":"种群生态"},{"id":"ecology-a011","type":"single","stage":3,"stem":"某种群净生殖率R0为2.4，世代时间T为4年。按r≈lnR0/T估算，该种群的内禀增长率约为","options":["0.15/年","0.22/年","0.35/年","0.60/年"],"answer":[1],"explain":"r≈lnR0/T=ln2.4÷4≈0.875÷4≈0.22/年。0.35是把(R0-1)/T当作内禀增长率，0.60是直接把R0除以T的误算。","tag":"种群生态"},{"id":"ecology-a012","type":"single","stage":3,"stem":"某一年生草本种群的年龄结构中，幼龄个体占62%，中龄个体占24%，老龄个体占14%，各龄期存活率相近。据此推测该种群未来的数量变化趋势最可能是","options":["迅速增长","保持稳定","缓慢下降","急剧衰退"],"answer":[0],"explain":"幼龄个体比例远高于中老龄，属增长型年龄结构，补充量大于死亡量，数量将迅速增长。稳定型各龄期比例接近，衰退型幼龄个体比例低，故其余选项不符。","tag":"种群生态"},{"id":"ecology-a014","type":"single","stage":3,"stem":"调查某草甸时，样方面积由1 m²扩大到16 m²，记录到的植物种数由8种增至20种。若继续扩大样方面积，种数的变化趋势最可能是","options":["增加逐渐变缓并趋于稳定","按相同速度直线增加","保持不变而停在20种","先减少而后再增加"],"answer":[0],"explain":"种-面积曲线呈先陡后缓的饱和趋势，当样方面积包含群落大多数物种时趋于稳定，该面积即最小表现面积。直线增加忽略了生境异质性有限。","tag":"群落生态"},{"id":"ecology-a015","type":"single","stage":3,"stem":"甲、乙两个草地样地各记录到40种植物，两地共有种为20种。按Jaccard相似性系数计算，两样地植物组成的相似程度约为","options":["0.25","0.33","0.50","0.67"],"answer":[1],"explain":"Jaccard系数=c/(a+b-c)=20/(40+40-20)=0.33。0.50是按Sørensen系数2c/(a+b)计算的结果，0.25与0.67则是分母代入错误。","tag":"群落生态"},{"id":"ecology-a017","type":"single","stage":3,"stem":"对同一地区多个草原群落的样地数据进行排序（ordination），其主要目的是","options":["确定群落的分类等级","统计群落中的物种总数","测定群落的光合速率","揭示群落沿环境梯度的变化规律"],"answer":[3],"explain":"排序把样地按相似性排布在二维或三维空间中，用以揭示群落沿水分、热量等环境梯度的连续变化。分类（如划分群丛）解决归属问题，与排序目的不同。","tag":"群落生态"},{"id":"ecology-a019","type":"single","stage":3,"stem":"某草原自然保护区因道路和农田扩张被分割成许多面积缩小、彼此隔离的生境斑块。长期来看，斑块内植物物种丰富度最可能","options":["下降，因为迁入减少、局部灭绝增加","上升，因为斑块内竞争减弱","上升，因为边缘生境增加","保持不变，因为区域物种库未变"],"answer":[0],"explain":"斑块面积缩小使种群变小、灭绝风险升高，隔离又降低繁殖体迁入，平衡物种数下降。边缘可能增加少数边缘种，但不足以抵消总体下降。","tag":"群落生态"},{"id":"ecology-a020","type":"single","stage":3,"stem":"某潮间带群落中，海星大量捕食竞争力强的贻贝。移除海星后，贻贝占据大部分岩石表面，群落物种数由15种降至8种。该海星在群落中属于","options":["优势种","建群种","关键种","先锋种"],"answer":[2],"explain":"关键种的多度不一定高，但其活动显著影响群落结构与其他物种的存留；移除海星导致物种数骤降正是其作用的体现。优势种强调数量与覆盖度优势，与此不符。","tag":"群落生态"},{"id":"ecology-a021","type":"single","stage":3,"stem":"在弃耕地开始的次生演替过程中，群落地上生物量与净初级生产力的变化趋势一般是","options":["生物量与净初级生产力同步持续升高","生物量先降后升，净初级生产力持续升高","生物量持续增加，净初级生产力先升高后趋缓","生物量和净初级生产力都持续下降"],"answer":[2],"explain":"演替中生物量随群落结构复杂化而累积增加，净初级生产力在叶面积和养分供应增加时上升，接近顶极时因呼吸消耗增大而趋缓。二者并非始终同步升高。","tag":"群落生态"},{"id":"ecology-a023","type":"single","stage":3,"stem":"某群落仅由两个物种组成，两物种个体数各占50%。按Shannon指数公式H=-ΣPi·lnPi计算，该群落的多样性指数约为","options":["0.35","0.69","1.00","2.00"],"answer":[1],"explain":"H=-(0.5ln0.5+0.5ln0.5)=ln2≈0.69。1.00是改用log2计算的结果，2.00是把物种数直接当作指数值，均属概念混淆。","tag":"群落生态"},{"id":"ecology-a025","type":"single","stage":3,"stem":"某草原样地中，一个物种的相对密度为30%、相对频度为20%、相对盖度为40%。按重要值=（相对密度+相对频度+相对盖度）/3计算，该种的重要值为","options":["20%","30%","40%","90%"],"answer":[1],"explain":"重要值=(30%+20%+40%)/3=30%。90%是三项之和未除以3，20%与40%分别是相对频度与相对盖度，说明其混淆了分项与综合指标。","tag":"群落生态"},{"id":"ecology-a026","type":"single","stage":3,"stem":"某草地植物净初级生产量为9000 kJ/(m²·a)，草食动物同化量为900 kJ/(m²·a)。草食动物对植物净生产量的利用效率约为","options":["1%","10%","20%","90%"],"answer":[1],"explain":"能量转化效率=草食动物同化量÷植物净初级生产量=900÷9000=10%。90%是未考虑呼吸消耗的误解，1%与20%为数量级或比例计算错误。","tag":"生态系统"},{"id":"ecology-a027","type":"single","stage":3,"stem":"某草原0~30 cm土层土壤容重为1.3 g/cm³，有机碳含量为12 g/kg。该土层每公顷（1 hm²）的有机碳储量约为","options":["4.7 t","15.6 t","46.8 t","156 t"],"answer":[2],"explain":"土体质量=10⁴ m²×0.3 m×1.3 t/m³=3900 t，再乘0.012得46.8 t。15.6 t是把土层厚度按0.1 m计算的结果。","tag":"生态系统"},{"id":"ecology-a029","type":"single","stage":3,"stem":"某生态系统净初级生产量为7200 g/(m²·a)，异养呼吸消耗有机物折合7500 g/(m²·a)。据此判断该系统","options":["是碳汇，净积累约300 g/(m²·a)","是碳汇，净积累约7200 g/(m²·a)","碳收支平衡，不吸收也不释放","是碳源，向大气净释放约300 g/(m²·a)"],"answer":[3],"explain":"净生态系统生产力=净初级生产量-异养呼吸=7200-7500=-300 g/(m²·a)，负值表示系统净释放碳，属碳源。正值才为碳汇，故其余选项错误。","tag":"生态系统"},{"id":"ecology-a031","type":"single","stage":3,"stem":"某草地长期大量施用铵态氮肥后，表层土壤pH明显下降。其主要原因是","options":["反硝化作用产生氮气","氨挥发带走了土壤中的氢氧根","铵态氮经硝化作用释放氢离子","共生固氮消耗了土壤中的氢离子"],"answer":[2],"explain":"硝化细菌把铵氧化为亚硝酸盐和硝酸盐时释放H⁺，长期施用铵态氮肥会加剧酸化。反硝化产氮气与固氮消耗H⁺均不导致明显pH下降。","tag":"生态系统"},{"id":"ecology-a032","type":"single","stage":3,"stem":"某保护区为保护有蹄类而彻底清除狼群，此后鹿群数量激增，幼树被大量啃食，河岸植被明显退化。这一现象最能说明","options":["营养级联效应","生物放大作用","生态位分化","演替的促进模型"],"answer":[0],"explain":"顶级捕食者被移除后，其效应沿食物链向下传递，使植被层受到抑制，即营养级联。生物放大指污染物沿食物链富集，与捕食调控无关。","tag":"生态系统"},{"id":"ecology-a034","type":"single","stage":3,"stem":"某浅水湖泊在营养盐输入长期超过某一水平后，藻类占据优势、水体浑浊；即使大幅削减外源营养盐，仍长期维持浑浊状态。这一现象说明","options":["生态系统存在替代稳定状态与恢复力阈值","生态系统的抵抗力稳定性很低","物质循环在该湖泊中已经停止","该湖泊已进入初生演替阶段"],"answer":[0],"explain":"系统越过阈值后进入以藻类为主的替代稳态，内部反馈（如底泥磷释放）使其自我维持，故削减外源输入后仍难恢复，体现恢复力阈值而非循环停止。","tag":"生态系统"},{"id":"ecology-a035","type":"single","stage":3,"stem":"与热带雨林相比，温带草原生态系统在遭受同等程度破坏后，其稳定性特点一般是","options":["抵抗力稳定性较高，恢复力稳定性较低","抵抗力稳定性较低，恢复力稳定性较高","抵抗力与恢复力稳定性都较高","抵抗力与恢复力稳定性都较低"],"answer":[1],"explain":"温带草原物种组成较简单、层次少，抵抗力较低，但更新快，受损后恢复较快；热带雨林结构复杂，抵抗力高而恢复慢，故其余组合不成立。","tag":"生态系统"},{"id":"ecology-a037","type":"single","stage":3,"stem":"某草地控制实验显示，随植物物种数由1种增加到8种，群落地上生产力提高，且生产力的年际波动减小。该结果支持","options":["物种越多竞争越强，生产力必然下降","物种多样性对生产力没有影响","群落演替必然使物种多样性升高","生物多样性提高可增强生态系统功能与稳定性"],"answer":[3],"explain":"物种增多使功能互补与补偿效应增强，从而提高生产力并缓冲环境波动。竞争加剧导致生产力下降与实验结果相反，演替方向也不是该实验的结论。","tag":"生态系统"},{"id":"ecology-a039","type":"single","stage":3,"stem":"某牧场有天然草地500 hm²，可食牧草单产为3000 kg/(hm²·a)，牧草利用率按60%计，每只羊每年需干草750 kg。该牧场的理论载畜量约为","options":["800只","1000只","1200只","2000只"],"answer":[2],"explain":"理论载畜量=面积×单产×利用率÷每只羊年需草量=500×3000×0.6÷750=1200只。800只与1000只为计算错误，2000只忽略了60%的利用率。","tag":"草原生态"},{"id":"ecology-a041","type":"single","stage":3,"stem":"某重度退化草原围封3年后植被盖度有所回升，但优良禾草比例仍然很低；调查发现土壤种子库中主要为一年生杂类草。据此判断限制恢复的关键因素是","options":["土壤种子库中优良牧草种源不足","围封时间过短导致光照不足","放牧家畜数量过多","土壤温度过低"],"answer":[0],"explain":"地上植被恢复依赖种源，种子库以一年生杂类草为主，优良禾草缺乏繁殖体，故单纯围封难以恢复其比例，需补播。围封已排除放牧影响，C不成立。","tag":"草原生态"},{"id":"ecology-a042","type":"single","stage":3,"stem":"以现有植物群落与原生顶极群落的相似程度为核心、评价草地退化程度的评定方法称为","options":["基况评价","载畜量评价","土壤肥力评价","生产力梯度评价"],"answer":[0],"explain":"基况评价通过现存量、种类组成与原生顶极群落的相似程度判断草地基况与退化程度。载畜量评价关注放牧利用强度，肥力评价针对土壤，均不等同于基况。","tag":"草原生态"},{"id":"ecology-a044","type":"single","stage":3,"stem":"某草原连续5年重度放牧后，0~30 cm土层有机碳含量下降18%，土壤容重增加12%。最可能的原因是","options":["降水增多使有机碳被大量淋溶","地下根系生物量显著增加并加快分解","土壤动物活动增强使有机碳迅速累积","凋落物输入减少，且牲畜践踏使土壤紧实、通气性下降"],"answer":[3],"explain":"重牧减少凋落物与根系归还，践踏压实土壤、降低通气性，碳输入减少超过分解变化，故有机碳下降。淋溶和根系增加与题干变化方向相反。","tag":"草原生态"},{"id":"ecology-a045","type":"single","stage":3,"stem":"某内陆干旱区退化草地表层土壤盐分高、植被盖度仅15%。下列措施中最不宜采用的是","options":["围封禁牧，减少牲畜干扰","补播耐盐碱的乡土草种","营造灌木防风带，减轻风蚀","大水漫灌洗盐后立即进行重度放牧"],"answer":[3],"explain":"大水漫灌后立即重牧会使土壤再度返盐，幼苗又被啃食践踏，几乎无法恢复。围封、补播耐盐乡土种和营造灌木带均为干旱区退化草地可行的修复措施。","tag":"草原生态"},{"id":"ecology-a047","type":"single","stage":3,"stem":"在适度放牧的草原上，根茎型禾草往往比丛生型禾草恢复更快，其主要原因是","options":["根茎型禾草的种子产量更高","根茎可在地下横向扩展并进行无性繁殖，采食后恢复快","根茎型禾草更耐荫蔽","根茎型禾草的根系分布更浅"],"answer":[1],"explain":"根茎型禾草依靠地下根茎扩展和营养繁殖，采食后可由根茎上的芽迅速再生；丛生型禾草以分蘖为主，恢复相对较慢，故其余选项不成立。","tag":"草原生态"},{"id":"ecology-a006","type":"multi","stage":3,"stem":"关于种群的空间分布格局与数量调查，下列说法正确的有","options":["均匀分布常由资源竞争或人工控制形成","聚集分布是自然界中最常见的分布格局","样方法适用于活动能力强、活动范围大的动物","用样本方差与均值的比值可初步判断种群的分布型"],"answer":[0,1,3],"explain":"均匀分布多由竞争或人工控制形成，聚集分布在自然界最常见，方差与均值之比可判别分布型。活动能力强、范围大的动物宜用标记重捕法，故C错误。","tag":"种群生态"},{"id":"ecology-a010","type":"multi","stage":3,"stem":"关于生命表与种群统计参数，下列说法正确的有","options":["动态生命表通过追踪同一批个体从出生到死亡的历程编制","静态生命表适用于寿命较长、世代重叠的动物","生命表中的平均期望寿命在各年龄段都相等","净生殖率表示每个雌体一生平均产生的雌性后代数"],"answer":[0,1,3],"explain":"动态生命表跟踪同生群，静态生命表由同一时刻各龄个体数推算、适合寿命长的动物；净生殖率表示每雌一生平均产雌数。期望寿命随年龄而变，故C错误。","tag":"种群生态"},{"id":"ecology-a018","type":"multi","stage":3,"stem":"关于群落物种多样性的不同层次，下列说法正确的有","options":["物种丰富度是群落多样性测度的唯一指标","α多样性反映同一群落内的物种丰富度和均匀度","β多样性反映不同群落之间物种组成的差异程度","γ多样性可理解为区域尺度上的物种多样性"],"answer":[1,2,3],"explain":"α多样性描述群落内部，β多样性描述群落间组成差异，γ多样性描述区域总体多样性。仅用丰富度忽略了均匀度，不能完整反映多样性，故A错误。","tag":"群落生态"},{"id":"ecology-a024","type":"multi","stage":3,"stem":"某山地草甸从山麓到山顶分布着不同的植物群落，下列分析正确的有","options":["海拔变化引起水热条件差异，是群落分异的重要原因","不同海拔的群落可构成垂直带谱","相邻群落之间常存在过渡带","各海拔群落的物种组成完全相同"],"answer":[0,1,2],"explain":"海拔升高引起水热条件变化，群落随之分异并形成垂直带谱；相邻群落间常有过渡带。各海拔群落的物种组成不同，第四项错误。","tag":"群落生态"},{"id":"ecology-a030","type":"multi","stage":3,"stem":"关于食物网与营养级，下列说法正确的有","options":["同一食物网中一种生物只能占据一个营养级","食物网中某个物种的消失可能通过营养级联影响多个营养级","营养级越多，最高营养级所能获得的能量通常越少","食物网的复杂程度会影响生态系统的稳定性"],"answer":[1,2,3],"explain":"营养级间能量逐级递减，食物网越复杂，某物种消失的影响可沿多条路径传递；杂食动物可同时占据多个营养级，故A错误。","tag":"生态系统"},{"id":"ecology-a036","type":"multi","stage":3,"stem":"关于生态系统服务功能与生态足迹，下列说法正确的有","options":["生态系统服务可包括供给、调节、支持和文化服务","生态足迹越大，说明人类对生态系统服务的需求越小","碳足迹是生态足迹的组成部分之一","保护生物多样性与维持生态系统服务功能密切相关"],"answer":[0,2,3],"explain":"生态足迹衡量人类占用的生态生产性面积，数值越大说明需求越大，故B错误；碳足迹是其组成部分，生物多样性是多项服务的基础，A、C、D正确。","tag":"生态系统"},{"id":"ecology-a043","type":"multi","stage":3,"stem":"关于草原生态系统的服务功能与合理利用，下列说法正确的有","options":["草原具有防风固沙、涵养水源和固碳等生态功能","草原生产力受降水、土壤和放牧强度等因素共同影响","提高载畜量是同时提高草原生产力和生态效益的最有效途径","草原碳主要储存在土壤有机碳中，其储量通常大于地上生物量碳"],"answer":[0,1,3],"explain":"草原碳以土壤有机碳为主，并兼具防风固沙、涵养水源和固碳功能；超载放牧引起退化、降低生态效益，故C错误。","tag":"草原生态"},{"id":"ecology-m03","type":"multi","stem":"关于生态系统的物质循环，下列说法正确的有","options":["碳、氮、水等物质可在生物群落与无机环境之间反复利用","碳、氮、水等物质的循环具有全球性","能量可随物质循环被反复利用","分解者把有机物分解为无机物，促进物质循环"],"answer":[0,1,3],"explain":"物质循环中元素从无机环境进入生物群落，再返回无机环境，可被反复利用，且碳、氮、水循环具有全球性；分解者将有机物矿化，推动物质归还。能量流动是单向、递减的，不能随物质循环反复利用，故C错误。","tag":"生态系统","level":3,"stage":3,"standard":true},{"id":"ecology-m04","type":"multi","stem":"某退化草原采取围封禁牧、补播乡土草种和按载畜量轮牧等措施。下列分析正确的有","options":["围封禁牧有利于植被自然恢复，但长期完全禁牧可能积累凋落物、抑制幼苗更新","补播乡土草种通常比引入外来速生种更有利于群落长期稳定","载畜量应依据草地产草量和利用率确定，并为草场留出恢复时间","退化草地只能依靠自然演替恢复，人工措施没有作用"],"answer":[0,1,2],"explain":"围封可减少采食和践踏，促进恢复，但长期禁牧可能使凋落物过厚、抑制更新；乡土草种适应本地环境，利于群落稳定；载畜量应种草定畜并轮牧。人工补播、施肥等措施能加速恢复，故D错误。","tag":"草原生态","level":3,"stage":3,"standard":true},{"id":"ecology-m05","type":"multi","stem":"关于生态系统稳定性，下列说法正确的有","options":["热带雨林抵抗力稳定性高，但遭破坏后恢复较慢","抵抗力稳定性与恢复力稳定性在任何生态系统中都呈正相关","引入外来物种可能降低本地生态系统的稳定性","生态系统自我调节能力与营养结构复杂程度无关"],"answer":[0,2],"explain":"热带雨林营养结构复杂，抵抗力稳定性高，但恢复力稳定性较低；外来物种入侵可能挤占本地物种生态位，降低稳定性。抵抗力与恢复力稳定性常呈负相关，自我调节能力与营养结构复杂程度有关，故B、D错误。","tag":"生态系统","level":3,"stage":3,"standard":true},{"id":"ecology-a003","type":"judge","stage":3,"stem":"若某种群的周限增长率λ小于1，在其他条件不变时，该种群数量将逐代减少。","options":["正确","错误"],"answer":[0],"explain":"周限增长率是相邻两代数量之比，λ大于1时种群增长，等于1时数量稳定，小于1时逐代减少，故该陈述正确。","tag":"种群生态"},{"id":"ecology-a008","type":"judge","stage":3,"stem":"在其他条件相同时，种群的性比偏离1∶1越远，其出生率通常越低。","options":["正确","错误"],"answer":[0],"explain":"出生率主要取决于雌体数量与交配机会，性比偏雄时有效繁殖雌体减少，出生率随之下降；偏雌时虽雌体较多，但受精机会受限，出生率同样不高，故该陈述正确。","tag":"种群生态"},{"id":"ecology-a013","type":"judge","stage":3,"stem":"用标记重捕法估计种群数量时，若标记物容易脱落，则所得估计值会偏高。","options":["正确","错误"],"answer":[0],"explain":"标记脱落使重捕个体中带标记的比例偏小，而估算式N=(M×C)/R中分母减小，估计值因而偏大，故该陈述正确。","tag":"种群生态"},{"id":"ecology-a016","type":"judge","stage":3,"stem":"群落演替中的先锋物种种子产量大、扩散能力强，并能在演替后期的郁闭群落中长期占优势。","options":["正确","错误"],"answer":[1],"explain":"先锋物种多为r对策者，易在裸地定居，但竞争能力弱，随群落郁闭、光照减弱会被耐荫的后期物种取代，不能长期占优势，故该陈述错误。","tag":"群落生态"},{"id":"ecology-a022","type":"judge","stage":3,"stem":"群落中物种数目越多，其Shannon多样性指数就一定越高。","options":["正确","错误"],"answer":[1],"explain":"Shannon指数同时取决于物种丰富度和均匀度；若物种数多而少数种占绝对优势，指数可能低于物种数较少但分布均匀的群落，故该陈述错误。","tag":"群落生态"},{"id":"ecology-a028","type":"judge","stage":3,"stem":"化石燃料燃烧释放的二氧化碳是大气二氧化碳浓度升高的重要原因，而陆地生态系统通过光合作用可部分抵消这一增加。","options":["正确","错误"],"answer":[0],"explain":"化石燃料燃烧是大气CO₂升高的重要人为源，陆地植被光合固定CO₂形成碳汇，能部分抵消排放，故该陈述正确。","tag":"生态系统"},{"id":"ecology-a033","type":"judge","stage":3,"stem":"生态系统的抵抗力稳定性与恢复力稳定性总是同时升高。","options":["正确","错误"],"answer":[1],"explain":"二者常呈相反趋势：结构复杂、抵抗力强的系统往往恢复较慢，如热带雨林抵抗力高而恢复力低，草原则相反，故该陈述错误。","tag":"生态系统"},{"id":"ecology-a038","type":"judge","stage":3,"stem":"水体富营养化时藻类大量繁殖会使水体溶解氧持续升高，有利于鱼类生存。","options":["正确","错误"],"answer":[1],"explain":"藻类夜间呼吸及死亡后被微生物分解都消耗溶解氧，水华又遮挡光照、抑制造氧，溶解氧因而下降而非升高，故该陈述错误。","tag":"生态系统"},{"id":"ecology-a040","type":"judge","stage":3,"stem":"在草甸草原上，为促进根茎型禾草更新，应每年进行划破草皮和深松土，作业频度越高效果越好。","options":["正确","错误"],"answer":[1],"explain":"划破草皮可改善通气、促进根茎型禾草更新，但频繁深松会破坏草皮、引起风蚀和水分损失，一般需间隔数年并控制强度，故该陈述错误。","tag":"草原生态"},{"id":"ecology-a046","type":"judge","stage":3,"stem":"载畜量是指在维持草地生产力不退化、草畜平衡的前提下，单位面积草地可长期承载的家畜数量。","options":["正确","错误"],"answer":[0],"explain":"载畜量强调在草地生产力不退化、草畜平衡的前提下可长期维持的家畜数量，是确定合理放牧强度的依据，超过该数量即为超载，故该陈述正确。","tag":"草原生态"}];

function readRaw(){
  var raw = null;
  try { if (window.AndroidStore) raw = AndroidStore.get(STORE_KEY); } catch (e) {}
  if (!raw) { try { raw = localStorage.getItem(STORE_KEY); } catch (e) {} }

    if (!raw) { try { raw = localStorage.getItem(OLD_KEY); } catch (e) {} }
  }

function loadStore(){

  if (!raw) return;
  try {
    var d = JSON.parse(raw) || {};
    store.rec = d.rec || {};
    store.wrong = d.wrong || {};

    store.flag = d.flag || {};

/* ===================== 工具 ===================== */
function $(sel, root){ return (root || document).querySelector(sel); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function explainOf(q){
  return String(q.explain || "").replace(/^解析[：:]\s*/, "");
}
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function shuffle(a){
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function take(a, n){
  return shuffle(a).slice(0, Math.min(n, a.length));
}
function sameSet(a, b){
  if (!a || !b || a.length !== b.length) return false;
  var x = a.slice().sort(function(m,n){return m-n;});
  var y = b.slice().sort(function(m,n){return m-n;});
  for (var i = 0; i < x.length; i++) if (x[i] !== y[i]) return false;
  return true;
}
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  return pad2(Math.floor(sec / 60)) + ":" + pad2(sec % 60);
}
function fmtDate(ts){
  var d = new Date(ts);
  return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function dateKey(d){
  d = d || new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function hashStr(s){
  var h = 2166136261;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleR(arr, rnd){
  arr = arr.slice();
  for (var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

var toastTimer = null;
function toast(msg){
  var el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1800);
}

/* ===================== 统计 ===================== */
function calcStats(list){
  var done = 0, c = 0, w = 0;
  list.forEach(function(q){
    var r = store.rec[q.id];
    if (r){ done++; c += r.c; w += r.w; }
  });
  var total = c + w;
  return { total: list.length, done: done, correct: c, wrong: w,
           acc: total ? Math.round(c * 100 / total) : 0 };
}
function courseStats(cid){ return calcStats(BY_COURSE[cid] || []); }
function stageStats(cid, stage){ return calcStats(BY_STAGE[cid][stage] || []); }
function stageOverall(stage){
  var list = [];
  COURSE_ORDER.forEach(function(c){ list = list.concat(BY_STAGE[c][stage] || []); });
  return calcStats(list);
}
function totalStats(){
  var done = 0, c = 0, w = 0;
  Object.keys(store.rec).forEach(function(id){
    if (!QMAP[id]) return;
    done++; c += store.rec[id].c; w += store.rec[id].w;
  });
  var total = c + w;
  return { done: done, correct: c, wrong: w, answered: total,
           acc: total ? Math.round(c * 100 / total) : 0 };
}
function markRecord(q, ok){
  var r = store.rec[q.id] || (store.rec[q.id] = { c:0, w:0 });
  if (ok){
    r.c++;
    if (store.wrong[q.id]) { delete store.wrong[q.id]; toast("已移出错题本"); }
  } else {
    r.w++;
    store.wrong[q.id] = 1;
  }
  saveStore();
}

/* ===================== 每日一练 ===================== */
/* 以本地时间早上 6 点为每日边界：06:00 前算前一天 */
function dailyKey(ts){
  var d = new Date(ts || Date.now());
  d.setTime(d.getTime() - 6 * 3600 * 1000);
  return dateKey(d);
}
function prevDailyKey(){
  return dailyKey(Date.now() - 86400000);
}

function dailyDone(){ return store.daily.date === dailyKey(); }

function currentStreak(){
  if (!store.daily.date) return 0;
  if (store.daily.date !== dailyKey() && store.daily.date !== prevDailyKey()) return 0;
  return store.daily.streak || 0;
}

/* 真正随机：每科 2 题 + 全库补 2 题，保证四科覆盖 */
function randomDailyQueue(){
  var picked = [], used = {};
  COURSE_ORDER.forEach(function(cid){
    var pool = shuffle(BY_COURSE[cid] || []);
    for (var i = 0; i < 2 && i < pool.length; i++){
      used[pool[i].id] = 1;
      picked.push(pool[i]);
    }
  });
  var rest = shuffle(BANK.filter(function(q){ return !used[q.id]; }));
  for (var k = 0; k < rest.length && picked.length < 10; k++) picked.push(rest[k]);
  return shuffle(picked).slice(0, 10);
}

/* 兼容旧调用：现在返回一组随机题，具体当天题集由 ensureDailySet 管理 */
function dailyQueue(){ return randomDailyQueue(); }

/* 当天题集：setKey 记录所属 6 点日，qids 记录 10 题，退出再进可续做 */
function ensureDailySet(){
  var key = dailyKey();
  var ids = Array.isArray(store.daily.qids) ? store.daily.qids : [];
  var valid = ids.map(function(id){ return QMAP[id]; }).filter(Boolean);
  if (store.daily.setKey !== key || valid.length !== 10){
    var qs = randomDailyQueue();
    store.daily.setKey = key;
    store.daily.qids = qs.map(function(q){ return q.id; });
    saveStore();
    return qs;
  }
  return valid;
}

function startDaily(){
  var done = dailyDone();
  var qs = done ? randomDailyQueue() : ensureDailySet();
  startPractice(qs, done ? "每日一练（再练）" : "每日一练", null, { mode:"daily" });
}

function markDaily(){
  var today = dailyKey();
  if (store.daily.date === today) return;
  var yesterday = prevDailyKey();
  store.daily.streak = store.daily.date === yesterday ? (store.daily.streak || 0) + 1 : 1;
  store.daily.date = today;
  saveStore();
}

function newSession(mode, queue, title, cid, opts){
  opts = opts || {};
  app.session = {
    mode: mode, queue: queue, idx:0, ans:{}, title:title,
    start: Date.now(), duration: opts.duration || 0, left: opts.duration || 0,
    cid: cid || null, stage: opts.stage || 0, finished:false, timerId:null,
    perQuestion: opts.perQuestion || 0, qLeft: opts.perQuestion || 0
  };
}

function startPractice(queue, title, cid, opts){
  if (!queue.length){ toast("该分类暂无题目"); return; }
  newSession((opts && opts.mode) || "practice", queue, title, cid, opts);
  go("quiz");
}

function startFlash(queue, title, cid){

  newSession("flash", queue, title, cid);

}

  } else if (kind === "quick"){
    queue = buildPaper({ 1:5, 2:3, 3:2 });
    title = "快速模考"; duration = 1800;
  } else if (kind === "standard"){
    queue = standardQueue();
    title = "标准卷"; duration = 3600;
  } else if (kind === "stage"){
    queue = stagePaper(stage);
    title = STAGES[stage].name + "闯关"; duration = 2400;
  } else if (kind === "quickfire"){
    queue = take(BANK.filter(function(q){ return q.type === "single"; }), 20);
    title = "抢答模式"; mode = "quickfire"; perQ = 15;
  }
  if (!queue.length){ toast("题库不足"); return; }
  newSession(mode, queue, title, null, { duration:duration, stage:stage || 0, perQuestion:perQ });
  go("quiz");
  if (duration > 0) startExamTimer();
  if (perQ > 0) startQTimer();
}

function buildPaper(counts){
  var q = [];
  COURSE_ORDER.forEach(function(cid){
    [1, 2, 3].forEach(function(s){
      q = q.concat(take(BY_STAGE[cid][s] || [], counts[s]));
    });
  });
  return q;
}
function stagePaper(stage){
  var per = [13, 13, 12, 12], q = [];
  COURSE_ORDER.forEach(function(cid, i){
    q = q.concat(take(BY_STAGE[cid][stage] || [], per[i]));
  });
  return q;
}
function standardQueue(){
  var order = { single:0, multi:1, judge:2 };
  return STANDARD.slice().sort(function(a, b){
    var ca = COURSE_ORDER.indexOf(courseOf(a)), cb = COURSE_ORDER.indexOf(courseOf(b));
    if (ca !== cb) return ca - cb;
    if (order[a.type] !== order[b.type]) return order[a.type] - order[b.type];
    return a.id.localeCompare(b.id);
  });
}

function curQ(){ return app.session.queue[app.session.idx]; }
function ensureAns(q){
  var a = app.session.ans[q.id];
  if (!a) a = app.session.ans[q.id] = { sel:[], checked:false, correct:false, timeout:false };
  return a;
}

function startExamTimer(){
  var s = app.session;
  if (!s || s.mode !== "exam") return;
  stopTimer();
  s.timerId = setInterval(function(){
    if (!app.session || app.session !== s || s.finished){ stopTimer(); return; }
    s.left = Math.max(0, s.duration - Math.round((Date.now() - s.start) / 1000));
    var el = $("#timerText");
    if (el) el.textContent = fmtTime(s.left);
    if (s.left <= 0){
      stopTimer();
      toast("考试时间到，自动交卷");
      finishSession(true);
    }
  }, 1000);
}

function startQTimer(){
  var s = app.session;
  if (!s || s.mode !== "quickfire") return;
  stopTimer();
  s.qStart = Date.now();
  s.qLeft = s.perQuestion;
  var el = $("#qtimer");
  if (el) el.textContent = s.qLeft;
  s.timerId = setInterval(function(){
    if (!app.session || app.session !== s || s.finished){ stopTimer(); return; }
    s.qLeft = Math.max(0, s.perQuestion - Math.round((Date.now() - s.qStart) / 1000));
    var e = $("#qtimer");
    if (e) e.textContent = s.qLeft;
    if (s.qLeft <= 0){
      stopTimer();
      timeoutCurrent();
    }
  }, 250);
}

function stopTimer(){
  var s = app.session;
  if (s && s.timerId){ clearInterval(s.timerId); s.timerId = null; }
}

/* ===================== 答题 ===================== */
function chooseOption(i){
  var s = app.session;
  if (!s || s.mode === "flash") return;
  var q = curQ(), a = ensureAns(q);
  if (a.checked) return;
  if (q.type === "single" || q.type === "judge"){
    a.sel = [i];
    if (s.mode === "exam"){ refreshQuiz(true); return; }
    a.checked = true;
    grade(q, a);
    if (s.mode === "quickfire") stopTimer();
    refreshQuiz(false, true);
  } else {
    var pos = a.sel.indexOf(i);
    if (pos >= 0) a.sel.splice(pos, 1); else a.sel.push(i);
    a.sel.sort(function(x,y){ return x - y; });
    refreshQuiz(true);
  }
}

function submitMulti(){
  var s = app.session, q = curQ(), a = ensureAns(q);
  if (!a.sel.length){ toast("请至少选择一项"); return; }
  a.checked = true;
  grade(q, a);
  if (s.mode === "quickfire") stopTimer();
  refreshQuiz(false, true);
}

function grade(q, a){
  var ok = sameSet(a.sel, q.answer);
  a.correct = ok;
  markRecord(q, ok);
}

function timeoutCurrent(){
  var s = app.session;
  if (!s || s.finished) return;
  var q = curQ(), a = ensureAns(q);
  if (a.checked) return;
  a.checked = true;
  a.correct = false;
  a.timeout = true;
  markRecord(q, false);
  toast("超时未答");
  refreshQuiz(false, true);
}

function refreshQuiz(keepScroll, scrollToExplain){
  var y = window.scrollY;
  renderChrome();
  var main = $("#main");
  main.innerHTML = "";
  viewQuiz(main);
  main.classList.remove("has-tab");
  $("#tabbar").style.display = "none";
  window.scrollTo(0, keepScroll ? y : 0);
  if (scrollToExplain){
    var ex = main.querySelector(".explain");
    if (ex && ex.getBoundingClientRect().top > window.innerHeight - 80){
      ex.scrollIntoView({ block:"nearest" });
    }
  }
}

  var html = '<div class="q-progress"><i style="width:' + Math.round(n * 100 / total) + '%"></i></div>';

  html += '<div class="opts' + (isJudge ? " judge" : "") + '">';

  for (var i = 0; i < q.options.length; i++){
    var correct = q.answer.indexOf(i) >= 0;

    if (isFlash){
      if (correct) cls += " correct";

    } else if (a.sel.indexOf(i) >= 0){
      cls += " selected";
    }
    var k = isJudge ? (i === 0 ? "✓" : "✗")

    html += '<button class="' + cls + '" data-opt="' + i + '">' +

  }
  html += '</div>';

  if (isFlash){
    html += '<div class="fb ok">答案：' + answerText(q) + '</div>';
    html += '<div class="explain"><b>解析</b><p>' + esc(explainOf(q)) + '</p></div>';
  } else if (a.checked){
    html += '<div class="fb ' + (a.correct ? "ok" : "no") + '">' +
      (a.correct ? "✓ 回答正确" : (a.timeout ? "✕ 超时未答" : "✕ 回答错误") + ' · 正确答案 ' + answerText(q)) + '</div>';
    html += '<div class="explain"><b>解析</b><p>' + esc(explainOf(q)) + '</p>' +
      '<p class="ansline">正确答案：' + answerText(q) + '</p></div>';

    html += '<p class="quick-tip">' + (isJudge ? "判断对错" : "点击选项作答") + ' · 超时自动判错</p>';
  }

  html += '<div class="q-footer">';
  if (isFlash){
    html += '<div class="quiz-actions">' +
      '<button class="btn ghost" id="prevBtn"' + (s.idx === 0 ? " disabled" : "") + '>上一题</button>' +
      (s.idx === total - 1 ? '<button class="btn primary" id="finishBtn">完成</button>'
                           : '<button class="btn primary" id="nextBtn">下一题</button>') +
    '</div>';
  } else if (isExam){
    html += '<div class="quiz-actions">' +
      '<button class="btn ghost" id="prevBtn"' + (s.idx === 0 ? " disabled" : "") + '>上一题</button>' +
      '<button class="btn ghost" id="sheetBtn">答题卡</button>' +
      (s.idx === total - 1 ? '<button class="btn primary" id="submitBtn">交卷</button>'
                           : '<button class="btn primary" id="nextBtn">下一题</button>') +
    '</div>';
  } else if (isQuick){
    if (!a.checked){
      html += '<div class="muted" style="text-align:center;padding:8px 0">' + (isJudge ? "判断对错" : "点击选项作答") + '，超时自动判错</div>';
    } else if (s.idx < total - 1){
      html += '<button class="btn primary" id="nextBtn">下一题</button>';
    } else {
      html += '<button class="btn primary" id="finishBtn">查看成绩</button>';
    }
  } else {
    if (!a.checked && q.type === "multi"){
      html += '<button class="btn primary" id="multiSubmit">提交答案（已选 ' + a.sel.length + ' 项）</button>';
    } else if (!a.checked){
      html += '<div class="muted" style="text-align:center;padding:6px 0">点击选项后自动判定</div>';
    } else if (s.idx < total - 1){
      html += '<button class="btn primary" id="nextBtn">下一题</button>';
    } else {
      html += '<button class="btn primary" id="finishBtn">查看结果</button>';
    }
    if (s.idx > 0){
      html += '<div style="text-align:center;margin-top:8px"><button class="mini" id="prevBtn2">上一题</button></div>';
    }
    html += '<div style="text-align:center;margin-top:8px"><button class="mini" id="mapBtn">题目目录</button></div>';
  }
  html += '</div>';
  main.innerHTML = html;

  var optBtns = main.querySelectorAll(".opt");
  for (var j = 0; j < optBtns.length; j++){
    optBtns[j].onclick = function(){ chooseOption(parseInt(this.getAttribute("data-opt"), 10)); };
  }

  var next = $("#nextBtn");
  if (next) next.onclick = function(){
    if (s.idx < s.queue.length - 1){
      s.idx++;
      refreshQuiz(false);
      if (s.mode === "quickfire") startQTimer();
    } else finishSession(false);
  };
  var prev = $("#prevBtn");
  if (prev) prev.onclick = function(){
    if (s.idx > 0){ s.idx--; refreshQuiz(false); }
  };

function confirmPracticeFinish(){
  var s = app.session;
  if (!s) return;
  var unanswered = [];
  for (var i = 0; i < s.queue.length; i++){
    var a = s.ans[s.queue[i].id];
    if (!(a && a.checked)) unanswered.push(i);
  }
  if (!unanswered.length){ finishSession(false); return; }
  modal('<h3>还有 ' + unanswered.length + ' 题未答</h3>' +
    '<p class="mtext">可以先补做，也可以直接查看结果；未答题按错处理。</p>' +
    '<div class="mbtns"><button class="btn ghost" id="pfBack">继续补做</button>' +
    '<button class="btn primary" id="pfOk">仍然查看结果</button></div>');
  $("#pfBack").onclick = function(){
    closeModal();
    s.idx = unanswered[0];
    refreshQuiz(false);
  };
  $("#pfOk").onclick = function(){ closeModal(); finishSession(false); };
}

function confirmSubmit(){
  var s = app.session;
  if (!s || s.mode !== "exam") return;
  var answered = Object.keys(s.ans).filter(function(id){
    return s.ans[id].sel && s.ans[id].sel.length > 0;
  }).length;
  var left = s.queue.length - answered;
  confirmBox("确认交卷？", "已答 " + answered + " 题" + (left ? "，" + left + " 题未答" : "，全部作答完毕") + "。交卷后不可修改。", "交卷", function(){
    finishSession(false);
  });
}

/* ===================== 结束与结果 ===================== */
function finishSession(auto){
  var s = app.session;
  if (!s || s.finished) return;
  s.finished = true;
  stopTimer();

  if (s.mode === "flash"){
    var fc = s.cid;
    app.session = null;
    go(fc ? "course" : "home", fc ? { cid:fc } : {});
    return;
  }

  var correct = 0, wrongList = [], per = {}, perStage = {}, answeredCount = 0;
  COURSE_ORDER.forEach(function(c){ per[c] = { total:0, correct:0 }; });
  [1, 2, 3].forEach(function(x){ perStage[x] = { total:0, correct:0 }; });

  s.queue.forEach(function(q){
    var a = s.ans[q.id];
    var ok = !!(a && a.sel && a.sel.length && sameSet(a.sel, q.answer));
    if (a && (a.checked || (a.sel && a.sel.length))) answeredCount++;
    if (ok) correct++; else wrongList.push(q);
    var c = courseOf(q);
    if (per[c]) { per[c].total++; if (ok) per[c].correct++; }
    if (perStage[stageOf(q)]) { perStage[stageOf(q)].total++; if (ok) perStage[stageOf(q)].correct++; }
  });

  if (s.mode === "exam" || s.mode === "quickfire"){
    s.queue.forEach(function(q){
      var a = s.ans[q.id];
      var ok = !!(a && a.sel && a.sel.length && sameSet(a.sel, q.answer));
      var r = store.rec[q.id] || (store.rec[q.id] = { c:0, w:0 });
      if (ok){ r.c++; delete store.wrong[q.id]; }
      else { r.w++; store.wrong[q.id] = 1; }
    });
    store.attempts.unshift({
      t: Date.now(), mode: s.title, total: s.queue.length,
      correct: correct, seconds: Math.round((Date.now() - s.start) / 1000)
    });
    store.attempts = store.attempts.slice(0, 30);
  }

  var dailyComplete = s.mode === "daily" && answeredCount === s.queue.length;
  if (dailyComplete) markDaily();

  saveStore();
  app.result = {
    mode: s.mode, title: s.title, total: s.queue.length, correct: correct,
    answered: answeredCount, dailyComplete: dailyComplete,
    acc: s.queue.length ? Math.round(correct * 100 / s.queue.length) : 0,
    seconds: Math.round((Date.now() - s.start) / 1000),
    per: per, perStage: perStage, wrong: wrongList, ts: Date.now()
  };
  app.session = null;
  go("result");
}

/* ===================== 错题 / 收藏 / 纠错 ===================== */
var wrongTab = "wrong";
var wrongFilter = { cid:"all", stage:0 };

function filteredIds(kind){
  var src = kind === "wrong" ? store.wrong : kind === "star" ? store.star : store.flag;
  var ids = Object.keys(src || {}).filter(function(id){ return !!QMAP[id]; });
  ids = ids.filter(function(id){
    var q = QMAP[id];
    if (wrongFilter.cid !== "all" && courseOf(q) !== wrongFilter.cid) return false;
    if (wrongFilter.stage && stageOf(q) !== wrongFilter.stage) return false;
    return true;
  });
  ids.sort(function(a, b){
    var qa = QMAP[a], qb = QMAP[b];
    var ca = COURSE_ORDER.indexOf(courseOf(qa)), cb = COURSE_ORDER.indexOf(courseOf(qb));
    if (ca !== cb) return ca - cb;
    if (stageOf(qa) !== stageOf(qb)) return stageOf(qa) - stageOf(qb);
    return a.localeCompare(b);
  });
  return ids;
}

function viewWrong(main){
  var all = { wrong:countIds(store.wrong), star:countIds(store.star), flag:countIds(store.flag) };
  var html = '<div class="seg">' +
    '<button data-seg="wrong" class="' + (wrongTab === "wrong" ? "on" : "") + '">错题 ' + all.wrong + '</button>' +
    '<button data-seg="star" class="' + (wrongTab === "star" ? "on" : "") + '">收藏 ' + all.star + '</button>' +
    '<button data-seg="flag" class="' + (wrongTab === "flag" ? "on" : "") + '">纠错 ' + all.flag + '</button>' +

    '<button class="fchip ' + (wrongFilter.cid === "all" ? "on" : "") + '" data-cid="all">全部课程</button>';

    html += '<button class="fchip ' + (wrongFilter.cid === c ? "on" : "") + '" data-cid="' + c + '">' + COURSES[c].name + '</button>';
  });
  html += '</div><div class="filterbar">' +
    '<button class="fchip ' + (!wrongFilter.stage ? "on" : "") + '" data-stage="0">全部阶段</button>';

  var ids = filteredIds(wrongTab);

    var emptyText = wrongTab === "wrong" ? "暂无错题，继续保持"
      : wrongTab === "star" ? "还没有收藏题目，答题时点右上角 ☆ 收藏"
      : "还没有纠错标记，答题时点右上角 ⚑ 标记可疑题";
    html += '<div class="empty"><b>' + (wrongTab === "wrong" ? "✓" : wrongTab === "star" ? "☆" : "⚑") + '</b><p>' + emptyText + '</p></div>';
  } else {
    html += '<div class="toolbar"><span class="muted">共 ' + ids.length + ' 题</span><span class="toolbar-btns">' +
      '<button class="mini" id="retrainAll">' + (wrongTab === "wrong" ? "重练全部" : wrongTab === "star" ? "刷收藏题" : "按顺序重练") + '</button>' +
      '<button class="mini" id="exportBtn">导出</button></span></div>';
    html += '<div class="list">';
    ids.forEach(function(id){
      var q = QMAP[id];
      html += '<button class="row" data-qid="' + id + '"><span class="grow">' +
        '<span class="stem2">' + esc(q.stem) + '</span>' +
        '<span class="meta"><span class="chip light">' + courseName(q) + '</span>' +
        '<span class="chip stage' + stageOf(q) + '">' + stageName(q) + '</span>' +
        '<span>' + typeName(q) + '</span></span>' +
        '</span><span class="arrow">›</span></button>';
    });
    html += '</div>';
  }
  html += '<p class="tip" style="margin-top:16px">答错自动收录；在练习或模考中答对一次，即自动移出错题本。纠错标记用于队内审题，导出的清单只含 ID 和题干。</p>';

  for (var i = 0; i < segs.length; i++){
    segs[i].onclick = function(){ wrongTab = this.getAttribute("data-seg"); render(); };
  }

  for (var j = 0; j < chips.length; j++){
    chips[j].onclick = function(){ wrongFilter.cid = this.getAttribute("data-cid"); render(); };
  }
  var schips = main.querySelectorAll("[data-stage]");
  for (var k = 0; k < schips.length; k++){
    schips[k].onclick = function(){ wrongFilter.stage = parseInt(this.getAttribute("data-stage"), 10); render(); };
  }
  var rows = main.querySelectorAll("[data-qid]");
  for (var m = 0; m < rows.length; m++){
    rows[m].onclick = function(){ showQuestionDetail(QMAP[this.getAttribute("data-qid")]); };

function openExport(kind, ids){
  var title = kind === "wrong" ? "错题清单" : kind === "star" ? "收藏清单" : "纠错清单";
  var head = "草学刷题 · " + title + "\n";
  head += "导出时间：" + fmtDate(Date.now()) + " · 共 " + ids.length + " 题\n";
  head += "--------------------------------\n";
  var body = ids.map(function(id, i){
    var q = QMAP[id];
    var s = (i + 1) + ". [" + q.id + "] " + courseName(q) + " · " + stageName(q) + " · " + typeName(q) + "\n";
    s += q.stem + "\n";
    if (kind !== "flag"){
      s += "正确答案：" + answerText(q) + "\n";
      s += "解析：" + explainOf(q) + "\n";
    } else {
      s += "标记原因：待核对题干/答案\n";
    }
    return s;
  }).join("\n");
  var text = head + body;
  modal('<h3>' + title + '</h3><p class="mtext">' + ids.length + ' 题 · 可复制后发到群里核对。</p>' +
    '<textarea class="export-area" id="exportText" readonly></textarea>' +
    '<div class="mbtns"><button class="btn ghost" id="copyBtn">复制</button>' +
    '<button class="btn primary" id="exportClose">关闭</button></div>');
  $("#exportText").value = text;
  $("#copyBtn").onclick = function(){ copyText(); };
  $("#exportClose").onclick = closeModal;
}

function copyText(){
  var ta = $("#exportText");
  if (!ta) return;
  try {
    if (window.AndroidStore && AndroidStore.copy){
      AndroidStore.copy(ta.value);
      toast("已复制到剪贴板");
      return;
    }
  } catch (e) {}
  ta.focus();
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  if (ok) toast("已复制到剪贴板");
  else { toast("已选中，请长按复制"); }
}

function trendSvg(){
  var list = (store.attempts || []).slice(0, 10).sort(function(a, b){ return a.t - b.t; });
  if (list.length < 2) return '<p class="muted" style="padding:8px 0">完成 2 次以上模考后显示正确率走势。</p>';
  var w = 320, h = 120, pad = 14;
  var pts = list.map(function(a, i){
    var acc = a.total ? a.correct / a.total : 0;
    return {
      x: pad + i * (w - 2 * pad) / (list.length - 1),
      y: h - pad - acc * (h - 2 * pad),
      acc: Math.round(acc * 100)
    };
  });
  var lines = [0, 0.5, 1].map(function(v){
    var y = h - pad - v * (h - 2 * pad);
    return '<line x1="' + pad + '" y1="' + y + '" x2="' + (w - pad) + '" y2="' + y + '" stroke="currentColor" stroke-opacity=".12"/>' +
      '<text x="2" y="' + (y + 3) + '" font-size="9" fill="currentColor" fill-opacity=".45">' + Math.round(v * 100) + '</text>';
  }).join("");
  var poly = pts.map(function(p){ return p.x + "," + p.y; }).join(" ");
  var dots = pts.map(function(p){
    return '<circle cx="' + p.x + '" cy="' + p.y + '" r="3" fill="#2f7d4f"/>';
  }).join("");
  var last = pts[pts.length - 1];
  return '<svg class="trend-svg" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' + lines +
    '<polyline points="' + poly + '" fill="none" stroke="#2f7d4f" stroke-width="2" stroke-linejoin="round"/>' +
    dots + '<text x="' + (last.x - 6) + '" y="' + (last.y - 8) + '" font-size="11" font-weight="600" fill="#2f7d4f">' + last.acc + '%</text></svg>';
}

function viewKnowledge(main){
  var cid = app.params.cid || "botany";
  if (!KNOWLEDGE[cid]) cid = "botany";
  var html = '<div class="seg">';
  COURSE_ORDER.forEach(function(c){
    html += '<button data-kb="' + c + '" class="' + (cid === c ? "on" : "") + '">' + COURSES[c].name + '</button>';
  });
  html += '</div>';
  (KNOWLEDGE[cid] || []).forEach(function(card){
    html += '<div class="kb-card"><h3>' + esc(card.title) + '</h3><ul>';
    card.points.forEach(function(p){ html += '<li>' + esc(p) + '</li>'; });
    html += '</ul></div>';
  });
  html += '<div class="tip">考前 10 分钟快速过一遍；配合「背题模式」效果更好。</div>';
  main.innerHTML = html;
  var btns = main.querySelectorAll("[data-kb]");
  for (var i = 0; i < btns.length; i++){
    btns[i].onclick = function(){ go("knowledge", { cid:this.getAttribute("data-kb") }); };
  }
}

/* ===================== 题目详情 ===================== */
function showQuestionDetail(q){
  if (!q) return;
  var flagged = !!store.flag[q.id];
  var html = '<div class="q-meta"><span class="chip">' + courseName(q) + '</span>' +
    '<span class="chip light">' + typeName(q) + '</span>' +
    '<span class="chip stage' + stageOf(q) + '">' + stageName(q) + '</span>' +
    (q.standard ? '<span class="chip amber">标准卷</span>' : '') +
    '<span class="chip light">' + esc(q.tag) + '</span></div>';
  html += '<h3 class="d-stem">' + esc(q.stem) + '</h3><div class="d-opts">';
  q.options.forEach(function(o, i){
    html += '<div class="d-opt' + (q.answer.indexOf(i) >= 0 ? " ok" : "") + '"><span class="k">' +
      (q.type === "judge" ? (i === 0 ? "✓" : "✗") : "ABCD".charAt(i)) + '</span>' + esc(o) + '</div>';
  });
  html += '</div><div class="explain" style="margin-top:0"><b>解析</b><p>' + esc(explainOf(q)) + '</p>' +
    '<p class="ansline">正确答案：' + answerText(q) + '</p></div>' +
    '<div class="mbtns"><button class="btn ghost" id="detailClose">关闭</button>' +
    '<button class="btn ghost" id="detailFlag">' + (flagged ? "取消纠错" : "标记纠错") + '</button>' +
    '<button class="btn primary" id="detailPractice">练习本题</button></div>';
  modal(html);
  $("#detailClose").onclick = closeModal;
  $("#detailPractice").onclick = function(){
    closeModal();
    startPractice([q], "单题练习");
  };
  $("#detailFlag").onclick = function(){
    if (store.flag[q.id]) { delete store.flag[q.id]; toast("已取消纠错标记"); }
    else { store.flag[q.id] = 1; toast("已标记纠错"); }
    saveStore();
    closeModal();
    if (app.view === "wrong") render();
  };
}

/* ===================== 弹层 ===================== */
function modal(html){
  var root = $("#modalRoot");
  root.innerHTML = '<div class="mask"><div class="sheet">' + html + '</div></div>';
  root.classList.add("show");
  var mask = root.querySelector(".mask");
  mask.onclick = function(e){ if (e.target === mask) closeModal(); };
}
function closeModal(){
  var root = $("#modalRoot");
  root.classList.remove("show");
  root.innerHTML = "";
}
function confirmBox(title, text, okText, onOk){
  modal('<h3>' + esc(title) + '</h3><p class="mtext">' + esc(text) + '</p>' +
    '<div class="mbtns"><button class="btn ghost" id="mCancel">取消</button>' +
    '<button class="btn primary" id="mOk">' + esc(okText || "确定") + '</button></div>');
  $("#mCancel").onclick = closeModal;
  $("#mOk").onclick = function(){ closeModal(); onOk(); };
}

/* ===================== 退出与返回 ===================== */
function confirmExit(){
  var s = app.session;
  if (!s) { go("home"); return; }
  var msg = s.mode === "exam" ? "退出后本次成绩不会保存，已答内容将丢失。"
    : s.mode === "quickfire" ? "退出后本次抢答成绩不会保存。"
    : s.mode === "flash" ? "退出背题模式？"
    : s.mode === "daily" ? "退出后今日一练不会记为完成。"
    : "已作答的题目仍会计入错题本与统计。";
  confirmBox(s.mode === "exam" ? "退出考试？" : "退出练习？", msg, "退出", function(){
    stopTimer();
    var cid = app.session && app.session.cid;
    var mode = app.session && app.session.mode;
    app.session = null;
    if (mode === "exam" || mode === "quickfire") go("exam");
    else if (cid) go("course", { cid:cid });
    else go("home");
  });
}

window.handleBack = function(){
  if ($("#modalRoot").classList.contains("show")) { closeModal(); return true; }
  var v = app.view;
  if (v === "quiz"){ confirmExit(); return true; }
  if (v === "home") return false;
  if (v === "course" || v === "knowledge") { go("home"); return true; }
  if (v === "result"){
    if (app.result && (app.result.mode === "exam" || app.result.mode === "quickfire")) { go("exam"); return true; }
    go("home"); return true;
  }
  go("home");
  return true;
};

/* ===================== 启动 ===================== */
function bindChrome(){
  $("#backBtn").onclick = function(){ window.handleBack(); };
  var tabs = document.querySelectorAll("#tabbar button");
  for (var i = 0; i < tabs.length; i++){
    tabs[i].onclick = function(){
      var t = this.getAttribute("data-tab");
      go(t === "home" ? "home" : t);
    };
  }
}

loadStore();
applySettings();
bindChrome();
render();


</script>
