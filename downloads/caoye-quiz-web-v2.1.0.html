<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2f7d4f">
<meta name="format-detection" content="telephone=no">
<title>草学刷题</title>
<style>
:root{
  --bg:#f3f6f3; --card:#ffffff; --ink:#1d2a22; --sub:#6b7a70; --line:#e2e9e3;
  --pri:#2f7d4f; --pri-dark:#256b41; --soft:#e8f3ec; --red:#c0392b; --red-soft:#fdeceb;
  --amber:#a66a12; --amber-soft:#fdf3e0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* 顶栏 */
#topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  height:56px;padding:0 10px 0 6px;background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);backdrop-filter:saturate(180%) blur(8px);
}
.iconbtn{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:28px;line-height:1;border-radius:10px;display:flex;align-items:center;justify-content:center;
  padding:0;flex:none;
}
.iconbtn:active{background:#eef3ef}
#backBtn{visibility:hidden}
.tb-title{flex:1;min-width:0}
.tb-title h1{margin:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title p{margin:1px 0 0;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-action{flex:none;display:flex;align-items:center;gap:6px}
.star{font-size:22px;color:#b9c6bd}
.star.on{color:#e0a51f}
.linkbtn{border:0;background:transparent;color:var(--red);font-size:14px;padding:8px 10px;border-radius:8px}
.linkbtn:active{background:var(--red-soft)}

main{flex:1;padding:14px 14px 30px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
main.has-tab{padding-bottom:calc(86px + env(safe-area-inset-bottom))}

/* 通用 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec-head h3{margin:0;font-size:15px;font-weight:600}
.sec-head span{font-size:12px;color:var(--sub)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--pri-dark);font-size:12px;line-height:1.5}
.chip.light{background:#f0f3f1;color:var(--sub)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  min-height:48px;padding:0 16px;border-radius:12px;border:1px solid transparent;
  font-size:16px;font-weight:500;background:#fff;color:var(--ink);
}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--pri);color:#fff}
.btn.primary:active{background:var(--pri-dark)}
.btn.ghost{border-color:var(--line);background:#fff}
.btn.danger{color:var(--red);border-color:#f2d6d2;background:#fff}
.btn[disabled]{opacity:.45}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.muted{color:var(--sub);font-size:13px}
.empty{text-align:center;padding:46px 20px;color:var(--sub)}
.empty b{display:block;font-size:38px;margin-bottom:8px}
.empty p{margin:0;font-size:14px}

/* 首页 */
.hero{
  border-radius:18px;padding:20px 18px 18px;color:#fff;
  background:linear-gradient(135deg,#2f7d4f 0%,#245f3d 100%);
}
.hero .eyebrow{margin:0 0 6px;font-size:11px;opacity:.85;letter-spacing:.2px}
.hero h2{margin:0 0 6px;font-size:23px;font-weight:700;letter-spacing:.5px}
.hero .hero-sub{margin:0;font-size:13px;opacity:.9}
.hero-grid{display:flex;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22)}
.hero-grid div{flex:1;display:flex;flex-direction:column}
.hero-grid b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-grid span{font-size:11px;opacity:.85;margin-top:2px}
.course-list{display:flex;flex-direction:column;gap:10px}
.course{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;
}
.course:active{background:#fafcfa}
.course .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;flex:none}
.course .info{flex:1;min-width:0}
.course .info b{display:block;font-size:16px;font-weight:600}
.course .info span{display:block;font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course .bar{height:4px;background:#eef2ee;border-radius:99px;margin-top:8px;overflow:hidden}
.course .bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.course .pct{flex:none;text-align:right;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.course .pct b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.arrow{color:#b6c2b9;font-size:20px;margin-left:2px}
.tip{margin-top:18px;padding:13px 14px;border-radius:12px;background:#fff;border:1px dashed #d8e3da;font-size:12px;color:var(--sub);line-height:1.7}

/* 课程详情 */
.course-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.course-head .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.course-head h2{margin:0;font-size:20px}
.course-head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
.stat3{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 0;margin-bottom:18px}
.stat3 div{flex:1;text-align:center;border-left:1px solid var(--line)}
.stat3 div:first-child{border-left:0}
.stat3 b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat3 span{font-size:11px;color:var(--sub)}
.practice-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.practice-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px}
.practice-item:active{background:#fafcfa}
.practice-item .n{margin-left:auto;font-size:12px;color:var(--sub)}
.tag-list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tag-row{display:flex;align-items:center;padding:13px 14px;border:0;border-top:1px solid var(--line);border-radius:0;width:100%;background:#fff;color:var(--ink);font-size:14px;text-align:left;font-family:inherit}
.tag-row:first-child{border-top:0}
.tag-row:active{background:#fafcfa}
.tag-row .cnt{margin-left:auto;color:var(--sub);font-size:12px}

/* 题目 */
.q-progress{height:4px;background:#e6ece7;border-radius:99px;overflow:hidden;margin:2px 0 16px}
.q-progress i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .2s}
.q-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stem{margin:0 0 16px;font-size:17px;line-height:1.7;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);
  font-size:15px;line-height:1.6;
}
.opt:active{background:#fafcfa}
.opt .k{
  flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #c7d4ca;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--sub);
  margin-top:1px;
}
.opt.multi .k{border-radius:6px}
.opt.selected{border-color:var(--pri);background:var(--soft)}
.opt.selected .k{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.correct{border-color:var(--pri);background:var(--soft)}
.opt.correct .k{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.wrong{border-color:#e3a49c;background:var(--red-soft)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.opt.locked{opacity:1}
.fb{margin-top:16px;padding:11px 14px;border-radius:10px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center}
.fb.ok{background:var(--soft);color:var(--pri-dark)}
.fb.no{background:var(--red-soft);color:var(--red)}
.explain{margin-top:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.75;color:#33443a}
.explain b{color:var(--ink);margin-right:4px}
.explain p{margin:0}
.explain .ansline{margin-top:8px;color:var(--pri-dark);font-size:13px}
.q-footer{position:sticky;bottom:0;padding:12px 0 0;margin-top:18px;background:linear-gradient(to bottom,rgba(243,246,243,0),var(--bg) 40%)}
.q-footer .btn{box-shadow:0 2px 10px rgba(47,125,79,.18)}
.q-footer .btn.ghost{box-shadow:none}

/* 模考 */
.exam-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.exam-card h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.exam-card .desc{margin:8px 0 14px;font-size:13px;color:var(--sub);line-height:1.7}
.exam-facts{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.exam-facts span{font-size:12px;color:var(--sub);background:#f3f6f3;border-radius:6px;padding:4px 8px}
.exam-note{margin-top:16px;font-size:12px;color:var(--sub);line-height:1.8}
.exam-note b{color:var(--amber)}

/* 答题卡 */
.sheet-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0 4px}
.sheet-grid button{
  height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:13px;font-variant-numeric:tabular-nums;
}
.sheet-grid button.done{background:var(--soft);border-color:#cfe4d7;color:var(--pri-dark)}
.sheet-grid button.cur{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.sheet-legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:10px}
.sheet-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* 列表 */
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:13px 14px;border:0;border-top:1px solid var(--line);border-radius:0;text-align:left;width:100%;background:#fff;color:var(--ink);font-family:inherit}
.row:first-child{border-top:0}
.row:active{background:#fafcfa}
.row .grow{flex:1;min-width:0}
.row .stem2{font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .meta{display:flex;gap:6px;align-items:center;margin-top:5px}
.row .meta span{font-size:11px;color:var(--sub)}
.seg{display:flex;background:#e9efe9;border-radius:10px;padding:3px;margin:2px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.toolbar .muted{font-size:12px}
.mini{border:0;background:var(--soft);color:var(--pri-dark);font-size:13px;padding:7px 12px;border-radius:8px}
.mini:active{background:#d9ebdf}

/* 统计 */
.big-stat{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 0;margin-bottom:14px}
.big-stat div{flex:1;text-align:center;border-left:1px solid var(--line)}
.big-stat div:first-child{border-left:0}
.big-stat b{display:block;font-size:23px;font-variant-numeric:tabular-nums}
.big-stat span{font-size:11px;color:var(--sub)}
.stat-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.stat-row:first-child{border-top:0}
.stat-row .name{width:88px;font-size:14px}
.stat-row .track{flex:1;height:7px;background:#eef2ee;border-radius:99px;overflow:hidden}
.stat-row .track i{display:block;height:100%;background:var(--pri);border-radius:99px}
.stat-row .num{width:46px;text-align:right;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.attempt{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:13px}
.attempt:first-child{border-top:0}
.attempt b{font-size:15px;font-variant-numeric:tabular-nums}
.attempt span{color:var(--sub);font-size:12px}

/* 弹层 */
#modalRoot{position:fixed;inset:0;z-index:50;display:none}
#modalRoot.show{display:block}
.mask{position:absolute;inset:0;background:rgba(20,32,25,.45);display:flex;align-items:flex-end;justify-content:center;padding:0 0 env(safe-area-inset-bottom)}
.sheet{
  width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;
  padding:20px 18px 24px;animation:up .18s ease-out;
}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet h3{margin:0 0 10px;font-size:17px}
.sheet .mtext{margin:0 0 18px;font-size:14px;color:var(--sub);line-height:1.7}
.mbtns{display:flex;gap:10px;margin-top:16px}
.mbtns .btn{flex:1}
.d-stem{font-size:16px;line-height:1.65;margin:10px 0 12px}
.d-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.d-opt{padding:9px 11px;border-radius:9px;border:1px solid var(--line);font-size:13.5px;line-height:1.55;color:#46564b}
.d-opt.ok{border-color:#cfe4d7;background:var(--soft);color:var(--pri-dark);font-weight:500}
.d-opt .k{font-weight:600;margin-right:5px}
#toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(8px);
  background:rgba(29,42,34,.92);color:#fff;font-size:13px;padding:9px 15px;border-radius:20px;
  opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:80vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 底部导航 */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  max-width:560px;margin:0 auto;background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:saturate(180%) blur(8px);
}
#tabbar button{
  flex:1;border:0;background:transparent;color:#8b9a90;padding:8px 0 7px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;
}
#tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabbar button.on{color:var(--pri);font-weight:600}
.quiz-actions{display:flex;gap:8px;margin-top:18px}
.quiz-actions .btn{flex:1}

/* ===================== v2：阶段 / 首页卡片 ===================== */
.chip.stage1{background:#e6f2ea;color:#256b41}
.chip.stage2{background:#fdf3e0;color:#a66a12}
.chip.stage3{background:#f6e9f0;color:#8a4b6b}
.main-badge{display:inline-block;font-style:normal;font-size:10px;font-weight:600;color:#a66a12;background:#fdf3e0;border-radius:4px;padding:1px 5px;vertical-align:1px}
.iconbtn.flag{font-size:17px;color:#b9c6bd}
.iconbtn.flag.on{color:#a66a12}

.daily-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:14px}
.daily-card:active{background:#fafcfa}
.daily-ico{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--pri-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none}
.daily-card .grow{flex:1;min-width:0}
.daily-card b{display:block;font-size:15px}
.daily-card .grow span{font-size:12px;color:var(--sub);display:block;margin-top:2px}
.daily-go{font-size:13px;color:var(--pri);font-weight:600;flex:none}

.standard-card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;background:linear-gradient(135deg,#eef7f1,#e3f0e8);border:1px solid #d5e8dc;border-radius:14px;padding:14px;margin-top:10px}
.standard-card b{font-size:15px}
.standard-card>span:last-child{font-size:12px;color:var(--sub)}
.standard-card .std-tag{background:#2f7d4f;color:#fff;font-size:10px;padding:2px 7px;border-radius:4px;letter-spacing:.5px}

.linkcard{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:12px;text-align:left;color:var(--ink)}
.linkcard:active{background:#fafcfa}
.linkcard b{display:block;font-size:14px}
.linkcard em{display:block;font-style:normal;font-size:11px;color:var(--sub);margin-top:2px}
.stage-mini{display:block;font-size:10.5px;color:#93a297;margin-top:5px}

.stage-card{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px}
.stage-card:active{background:#fafcfa}
.stage-badge{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.stage-badge.s1{background:#e6f2ea;color:#256b41}
.stage-badge.s2{background:#fdf3e0;color:#a66a12}
.stage-badge.s3{background:#f6e9f0;color:#8a4b6b}
.stage-card .grow{flex:1;min-width:0}
.stage-card .grow b{font-size:14px}
.stage-meta{display:block;font-size:11px;color:var(--sub);margin:2px 0 6px}
.stage-card .bar{height:4px;background:#eef2ee;border-radius:99px;overflow:hidden}
.stage-card .bar i{display:block;height:100%;border-radius:99px}
.stage-card .mini{flex:none}

.standard-line{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;color:var(--ink)}
.standard-line:active{background:#fafcfa}
.standard-line b{display:block;font-size:14px}
.standard-line em{font-style:normal;font-size:11px;color:var(--sub);display:block;margin-top:2px}
.spec-row .btn{font-size:14px;padding:0 6px}

/* 筛选 */
.filterbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.fchip{flex:none;border:1px solid var(--line);background:#fff;color:var(--sub);padding:6px 10px;border-radius:999px;font-size:12px}
.fchip.on{background:var(--soft);border-color:#cfe4d7;color:var(--pri-dark);font-weight:600}
.toolbar-btns{display:flex;gap:6px}

/* 判断题 */
.opts.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.judge .opt{justify-content:center;padding:16px 10px;font-size:17px}
.opts.judge .opt .k{display:none}
.quick-tip{text-align:center;font-size:13px;color:var(--amber);margin:14px 0 0}
.quick-tip b{font-size:16px}

/* 导出 */
.export-area{width:100%;height:230px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;line-height:1.6;resize:none;background:#f8faf8;color:var(--ink);font-family:inherit}

/* 趋势 */
.trend-svg{width:100%;height:auto;color:var(--ink);margin:6px 0 4px}

/* 设置 */
.set-label{font-size:12px;color:var(--sub);margin:12px 0 6px}
.seg.small{padding:3px;margin:0}
.seg.small button{padding:7px 3px;font-size:12px}

/* 考点速查 */
.kb-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.kb-card h3{margin:0 0 6px;font-size:15px}
.kb-card ul{margin:0;padding-left:18px;color:#3a4a40;font-size:13.5px;line-height:1.8}
.kb-card li{margin:2px 0}

/* ===================== v2：深色模式 ===================== */
body.dark{
  --bg:#121814; --card:#1b241e; --ink:#e6efe9; --sub:#9aab9f; --line:#2a362e;

<script>
"use strict";

var BANK = [{"id":"botany-b001","type":"single","stage":1,"stem":"植物细胞中储存遗传物质、控制细胞代谢和遗传活动的中心结构是","options":["细胞核","核糖体","高尔基体","液泡"],"answer":[0],"explain":"细胞核内的染色质携带DNA，是遗传信息储存和基因表达的调控中心。核糖体是蛋白质合成的场所，高尔基体参与分泌物的形成和细胞壁成分的加工，液泡主要起贮藏和渗透调节作用。","tag":"细胞与组织"},{"id":"botany-b002","type":"single","stage":1,"stem":"植物细胞中，不含色素、主要起贮藏作用的质体是","options":["叶绿体","有色体","白色体","线粒体"],"answer":[2],"explain":"白色体不含色素，其中的造粉体专门贮藏淀粉。叶绿体含叶绿素进行光合作用，有色体含类胡萝卜素使花果呈现黄橙色，线粒体是呼吸作用的场所而不是质体。","tag":"细胞与组织"},{"id":"botany-b003","type":"single","stage":1,"stem":"植物细胞初生壁的主要成分是","options":["木质素和纤维素","纤维素和果胶","木栓质和纤维素","蛋白质和果胶"],"answer":[1],"explain":"初生壁是细胞生长过程中形成的薄壁层，主要由纤维素、半纤维素和果胶构成，具有一定延展性。木质素主要沉积在次生壁中，木栓质是木栓化细胞壁的成分，蛋白质并非细胞壁的主要结构物质。","tag":"细胞与组织"},{"id":"botany-b004","type":"single","stage":1,"stem":"相邻植物细胞之间进行物质运输和信息传递的细胞质通道是","options":["纹孔","筛孔","气孔","胞间连丝"],"answer":[3],"explain":"胞间连丝是穿过细胞壁、连接相邻生活细胞原生质体的细胞质通道，可运输物质和传递信息。纹孔只是次生壁局部不加厚形成的薄壁区域，筛孔位于筛管分子端壁，气孔是表皮上的通气结构。","tag":"细胞与组织"},{"id":"botany-b005","type":"single","stage":1,"stem":"茎和叶柄表皮下方的机械组织中，细胞壁仅在角隅处加厚、细胞仍保持生活状态的是","options":["厚角组织","厚壁组织","石细胞","纤维"],"answer":[0],"explain":"厚角组织的细胞壁在角隅处不均匀加厚，细胞保持生活状态，既有支持作用又具可塑性，常见于幼茎和叶柄。厚壁组织细胞壁全面次生加厚并木化，成熟时多为死细胞；石细胞和纤维都属于厚壁组织。","tag":"细胞与组织"},{"id":"botany-b009","type":"single","stage":1,"stem":"主根发达、主根与侧根区别明显，由胚根直接发育形成的根系称为","options":["须根系","直根系","不定根系","气生根"],"answer":[1],"explain":"由胚根发育成的主根发达，主根与侧根区别明显，这种根系为直根系，多见于双子叶植物。须根系由茎基部的不定根形成，无明显主根；不定根指发生于茎、叶等部位的根，气生根是生长在空气中的不定根。","tag":"营养器官"},{"id":"botany-b010","type":"single","stage":1,"stem":"双子叶植物根初生结构中，皮层最内一层、细胞壁常具凯氏带加厚的细胞层是","options":["中柱鞘","皮层薄壁细胞","内皮层","维管形成层"],"answer":[2],"explain":"双子叶植物根的初生结构中，皮层最内一层细胞为内皮层，其径向壁和横向壁常有凯氏带加厚。中柱鞘位于内皮层以内、紧靠维管柱外围；形成层属于次生分生组织，不是初生结构中的层次。","tag":"营养器官"},{"id":"botany-b011","type":"single","stage":1,"stem":"双子叶植物茎的初生结构中，维管束的排列方式是","options":["散生于基本组织中","排成内外两轮","集中分布于髓部","排列成一圈，束间有髓射线"],"answer":[3],"explain":"双子叶植物茎的初生结构中，维管束排列成一圈，束与束之间由髓射线相隔。禾本科等单子叶植物茎的维管束散生于基本组织中，且一般没有维管形成层，不能进行明显的次生生长。","tag":"营养器官"},{"id":"botany-b012","type":"single","stage":1,"stem":"叶片中靠近上表皮、细胞呈长柱形且排列紧密、含叶绿体较多的组织是","options":["栅栏组织","海绵组织","输导组织","厚角组织"],"answer":[0],"explain":"栅栏组织细胞呈长柱形，垂直于叶表皮紧密排列，含叶绿体多，是光合作用最活跃的部位。海绵组织细胞形状不规则、间隙大，位于下表皮一侧；输导组织和厚角组织都不属于叶肉。","tag":"营养器官"},{"id":"botany-b013","type":"single","stage":1,"stem":"判断一片叶是单叶还是复叶，主要依据是","options":["叶片面积的大小","叶柄基部有无腋芽、是否具叶轴","叶脉是网状还是平行","叶缘是否具有锯齿"],"answer":[1],"explain":"复叶的总叶柄即叶轴上着生的小叶基部没有腋芽，而单叶的叶柄基部有腋芽，这是判断的主要依据。叶片大小、叶脉类型和叶缘锯齿在不同植物中变化很大，不能作为区分单叶与复叶的标准。","tag":"营养器官"},{"id":"botany-b014","type":"single","stage":1,"stem":"小麦、水稻等禾本科植物茎基部节上腋芽形成的分枝方式称为","options":["单轴分枝","合轴分枝","分蘖","二叉分枝"],"answer":[2],"explain":"禾本科植物茎基部节密集，节上的腋芽形成分蘖，并从基部产生不定根，如小麦、水稻。单轴分枝和合轴分枝是木本植物的分枝方式，二叉分枝多见于低等植物和蕨类植物。","tag":"营养器官"},{"id":"botany-b015","type":"single","stage":1,"stem":"豆科植物根部的根瘤是由什么形成的","options":["真菌菌丝与根形成的共生体","土壤线虫刺激根细胞形成","根系分泌物在根表沉积","根瘤菌侵入根毛后刺激皮层细胞分裂"],"answer":[3],"explain":"豆科植物根瘤是根瘤菌侵入根毛后，刺激根部皮层细胞分裂形成的共生结构，可固定空气中的氮。菌根是真菌与根形成的共生体，线虫刺激形成的是虫瘿，根系分泌物沉积也不能形成根瘤。","tag":"营养器官"},{"id":"botany-b021","type":"single","stage":1,"stem":"花萼与花冠合称为","options":["花被","花托","副萼","花萼筒"],"answer":[0],"explain":"花萼与花冠合称花被，是花的外轮不育部分，具有保护花蕊和吸引昆虫传粉的作用。花托是花各部分着生的部位，副萼是萼片外的额外一轮小片，花萼筒由萼片基部连合形成。","tag":"生殖器官"},{"id":"botany-b022","type":"single","stage":1,"stem":"雄蕊的组成部分是","options":["花药和花托","花药和花丝","柱头和花丝","花萼和花冠"],"answer":[1],"explain":"雄蕊由花药和花丝两部分组成，花药内的花粉囊产生花粉粒，花丝起支持作用。花托是花各部分着生的地方，柱头属于雌蕊，花萼和花冠合称花被，均不是雄蕊的组成部分。","tag":"生殖器官"},{"id":"botany-b023","type":"single","stage":1,"stem":"番茄的花萼、花冠和雄蕊着生在子房下方的花托上，子房仅底部与花托相连、其余部分游离，其子房位置和花称分别是","options":["下位子房、上位花","上位子房、周位花","上位子房、下位花","下位子房、下位花"],"answer":[2],"explain":"子房仅底部与花托相连、花被和雄蕊着生在子房下方时，子房为上位，这种花称下位花，如番茄。子房埋入花托、花被着生在子房上方则为下位子房、上位花；周位花的花托呈杯状，介于二者之间。","tag":"生殖器官"},{"id":"botany-b024","type":"single","stage":1,"stem":"花轴不分枝、花具柄、自下而上依次开放的花序是","options":["伞形花序","头状花序","柔荑花序","总状花序"],"answer":[3],"explain":"总状花序的花轴不分枝，花具柄，自下而上依次开放。伞形花序的花柄近等长、自花序轴顶端放射状伸出；头状花序的花密集着生于扁平花轴上；柔荑花序是下垂的穗状花序，常为单性花。","tag":"生殖器官"},{"id":"botany-b025","type":"single","stage":1,"stem":"大豆的果实成熟时沿背缝线和腹缝线开裂，这种果实类型是","options":["荚果","角果","蒴果","颖果"],"answer":[0],"explain":"荚果由单心皮发育而成，成熟时沿背缝线和腹缝线开裂，如大豆。角果由二心皮发育并具假隔膜，为十字花科特征；蒴果由多心皮组成；颖果的果皮与种皮愈合，是禾本科的果实类型。","tag":"生殖器官"},{"id":"botany-b026","type":"single","stage":1,"stem":"被子植物种子中，胚的组成包括","options":["胚芽、胚乳和子叶","胚芽、胚轴、胚根和子叶","种皮、胚和胚乳","胚芽、胚根和胚乳"],"answer":[1],"explain":"胚是种子的核心部分，由胚芽、胚轴、胚根和子叶四部分组成，将来发育成幼苗。胚乳是贮存养料的结构，种皮起保护作用，二者都不属于胚的组成部分。","tag":"生殖器官"},{"id":"botany-b030","type":"single","stage":1,"stem":"光合作用光反应阶段发生的具体场所是","options":["叶绿体基质","细胞质基质","类囊体薄膜","线粒体内膜"],"answer":[2],"explain":"光反应在叶绿体的类囊体薄膜上进行，色素吸收光能并完成水的光解和ATP、NADPH的生成。叶绿体基质是暗反应的场所，细胞质基质进行糖酵解，线粒体内膜是有氧呼吸电子传递的场所。","tag":"生理"},{"id":"botany-b031","type":"single","stage":1,"stem":"叶绿素主要吸收的光是","options":["绿光和黄光","红光和绿光","蓝紫光和黄光","红光和蓝紫光"],"answer":[3],"explain":"叶绿素主要吸收红光和蓝紫光，对绿光吸收很少，绿光被反射或透射，所以叶片呈绿色。类胡萝卜素主要吸收蓝紫光。绿光和黄光不是叶绿素的主要吸收波段，其余选项的组合均有错误。","tag":"生理"},{"id":"botany-b032","type":"single","stage":1,"stem":"光合作用暗反应中，C3的还原需要消耗","options":["ATP和NADPH","只有ATP","只有NADPH","水和叶绿素"],"answer":[0],"explain":"暗反应中二氧化碳被固定形成C3后，需要光反应提供的ATP和NADPH共同参与还原，才能生成糖类。只消耗ATP或只消耗NADPH的说法都不完整；水和叶绿素并不直接参与C3的还原过程。","tag":"生理"},{"id":"botany-b033","type":"single","stage":1,"stem":"植物细胞有氧呼吸中，三羧酸循环进行的场所是","options":["细胞质基质","线粒体基质","线粒体内膜","叶绿体基质"],"answer":[1],"explain":"有氧呼吸分三个阶段：糖酵解在细胞质基质中进行，三羧酸循环在线粒体基质中进行，电子传递链在线粒体内膜上完成。叶绿体基质是光合作用暗反应的场所，与呼吸作用无关。","tag":"生理"},{"id":"botany-b034","type":"single","stage":1,"stem":"植物细胞进行无氧呼吸产生酒精时，同时产生的物质是","options":["乳酸","氧气","二氧化碳","丙酮酸"],"answer":[2],"explain":"植物细胞进行酒精发酵时，葡萄糖被分解为酒精和二氧化碳，并释放少量能量。乳酸发酵的产物只有乳酸，不产生二氧化碳；氧气是无氧呼吸的抑制因素；丙酮酸是糖酵解的中间产物而非最终产物。","tag":"生理"},{"id":"botany-b035","type":"single","stage":1,"stem":"高大树木体内水分向上运输的主要动力是","options":["根压","毛细管作用","呼吸作用产生的压力","蒸腾拉力"],"answer":[3],"explain":"高大树木的水分上升主要靠蒸腾作用产生的拉力，它与水的内聚力共同维持导管中的连续水柱。根压只能使水分上升有限高度，伤流和吐水可证明其存在；毛细管作用和呼吸作用产生的压力都不足以解释水分上升。","tag":"生理"},{"id":"botany-b036","type":"single","stage":1,"stem":"下列元素中，属于植物必需微量元素的是","options":["铁","氮","磷","钾"],"answer":[0],"explain":"铁是植物必需的微量元素，参与叶绿素合成和多种氧化还原反应。氮、磷、钾在植物体内含量较高，属于大量元素；微量元素虽然含量少，却是植物正常生长发育不可缺少的。","tag":"生理"},{"id":"botany-b037","type":"single","stage":1,"stem":"生长素只能从植物体的形态学上端向形态学下端运输，这种方式称为","options":["横向运输","极性运输","被动运输","共质体运输"],"answer":[1],"explain":"生长素在植物体内只能从形态学上端向形态学下端运输，称为极性运输，是消耗能量的主动运输过程。横向运输发生在受单侧光或重力刺激时；被动运输和共质体运输都不能说明这种方向性。","tag":"生理"},{"id":"botany-b038","type":"single","stage":1,"stem":"日照长度超过一定临界日长才能开花的植物属于","options":["短日植物","日中性植物","长日植物","春化植物"],"answer":[2],"explain":"长日植物在日照长度超过一定临界日长时才能开花，如小麦、菠菜。短日植物要求日照短于临界日长；日中性植物开花对日照长度不敏感；春化植物指需要低温诱导才能开花的类型。","tag":"生理"},{"id":"botany-b039","type":"single","stage":1,"stem":"下列属于种子萌发必需外界条件的是","options":["强光和高温","肥沃的土壤和充足光照","无机盐和二氧化碳","充足的水分、适宜的温度和足够的氧气"],"answer":[3],"explain":"种子萌发需要充足的水分、适宜的温度和足够的氧气，三者缺一不可。强光和高温不是萌发的必要条件，多数种子在黑暗中也能萌发；肥沃土壤和无机盐影响幼苗生长，但不是萌发必需条件。","tag":"生理"},{"id":"botany-b046","type":"single","stage":1,"stem":"植物细胞中，控制物质进出细胞并具有选择透过性的结构是","options":["细胞膜","细胞壁","液泡膜","核膜"],"answer":[0],"explain":"细胞膜由磷脂双分子层和蛋白质组成，具有选择透过性，是控制物质进出细胞的主要屏障。细胞壁全透，不能起选择作用；液泡膜和核膜虽也是生物膜，但只控制液泡、细胞核与细胞质间的交换，并非细胞与外界的主要屏障。","tag":"细胞与组织"},{"id":"botany-b047","type":"single","stage":1,"stem":"马铃薯块茎细胞中，把糖分转化为淀粉并储存起来的质体是","options":["叶绿体","有色体","白色体","线粒体"],"answer":[2],"explain":"白色体不含色素，其中的造粉体能将糖转化为淀粉贮存，马铃薯块茎中即富含造粉体。叶绿体含叶绿素，进行光合作用；有色体含类胡萝卜素，使花瓣和果实呈黄橙色；线粒体是呼吸作用的场所，都不承担储淀粉功能。","tag":"细胞与组织"},{"id":"botany-b049","type":"single","stage":1,"stem":"茎和叶柄表皮下方的厚角组织，其细胞壁加厚的特点及主要功能是","options":["细胞壁全面木质化加厚，细胞成熟后死亡，主要起支持作用","细胞壁在角隅处不均匀加厚，细胞生活，既能支持又不妨碍器官伸长","细胞壁全面栓质化加厚，主要起防止水分散失的作用","细胞壁均匀加厚但不木质化，细胞内充满叶绿体，主要进行光合作用"],"answer":[1],"explain":"厚角组织的细胞壁在角隅处不均匀加厚，成分以纤维素和果胶为主，未木质化，细胞是生活的，因此既有支持作用，又能随器官伸长而扩展。全面木质化加厚、成熟后死亡是厚壁组织的特征，栓质化加厚则是木栓层的特征。","tag":"细胞与组织"},{"id":"botany-b050","type":"single","stage":1,"stem":"下列有关导管与筛管的比较，正确的是","options":["导管由生活细胞组成，筛管成熟后为死细胞","导管位于韧皮部，筛管位于木质部","导管运输有机物，筛管运输水和无机盐","导管是死细胞，筛管成熟后是无核的生活细胞"],"answer":[3],"explain":"导管分子成熟后原生质体解体，是死细胞，位于木质部，运输水和无机盐；筛管分子成熟后仍是生活细胞，但细胞核消失，位于韧皮部，运输有机物。前三项把二者的死活、所在部位和运输物质都说反或说错了。","tag":"细胞与组织"},{"id":"botany-b052","type":"single","stage":1,"stem":"植物细胞中，与细胞吸水膨胀、维持膨压关系最密切的细胞器是","options":["高尔基体","液泡","内质网","核糖体"],"answer":[1],"explain":"成熟植物细胞的中央大液泡中贮存细胞液，含糖、无机盐等溶质，通过渗透作用吸水使细胞膨压升高，从而维持细胞和器官的紧张状态。高尔基体参与细胞壁形成，内质网参与物质的合成和运输，核糖体是合成蛋白质的场所。","tag":"细胞与组织"},{"id":"botany-b055","type":"single","stage":1,"stem":"根尖中细胞不断分裂、使根不断伸长的部位是","options":["分生区","根冠","伸长区","成熟区"],"answer":[0],"explain":"分生区细胞具有旺盛的分裂能力，通过不断分裂增加细胞数目并推动根尖向前伸展，是根生长的根本原因。根冠只起保护作用，伸长区细胞主要进行伸长生长，成熟区细胞已分化出根毛，主要承担吸收功能。","tag":"营养器官"},{"id":"botany-b056","type":"single","stage":1,"stem":"双子叶植物茎进行次生生长时，产生次生木质部和次生韧皮部的结构是","options":["顶端分生组织","木栓形成层","居间分生组织","维管形成层"],"answer":[3],"explain":"维管形成层细胞不断分裂，向内产生次生木质部、向外产生次生韧皮部，使茎不断增粗。顶端分生组织使茎伸长，木栓形成层形成周皮，居间分生组织使禾本科茎的节间伸长，三者都不形成次生维管组织。","tag":"营养器官"},{"id":"botany-b058","type":"single","stage":1,"stem":"禾本科植物茎的横切面上，维管束的排列特点是","options":["整齐排列成一个环，环的外侧为韧皮部","集中分布在茎中央的髓部","散生于基本组织中，常排列成内外两轮","仅分布在表皮下方的皮层中"],"answer":[2],"explain":"禾本科植物茎内没有形成层，维管束散生于基本组织中，常排列成内外两轮，故C正确。维管束整齐排列成一个环是双子叶植物茎的典型特征，茎的中央为髓，维管束也不只分布于皮层之中。","tag":"营养器官"},{"id":"botany-b059","type":"single","stage":1,"stem":"叶片中栅栏组织与海绵组织相比，其主要特点是","options":["细胞排列疏松，含叶绿体较少","细胞呈长柱形、排列紧密、含叶绿体较多","细胞形状不规则，细胞间隙发达","位于下表皮之下，主要起保护作用"],"answer":[1],"explain":"栅栏组织紧靠上表皮，细胞呈长柱形、排列紧密、含叶绿体多，是光合作用的主要部位。海绵组织靠近下表皮，细胞形状不规则、排列疏松、间隙发达、叶绿体较少，两者均属叶肉，不属于保护组织。","tag":"营养器官"},{"id":"botany-b060","type":"single","stage":1,"stem":"根毛区表皮细胞外壁向外突起形成根毛，其主要意义是","options":["扩大吸收面积，增强对水分和无机盐的吸收","保护根尖免受机械损伤","增强根系对土壤的固着能力","贮藏光合作用制造的有机物"],"answer":[0],"explain":"根毛使表皮细胞的吸收表面积大大增加，显著提高根系吸收水分和无机盐的效率，故A正确。保护根尖的是根冠，固着作用主要靠根系的伸展，贮藏有机物主要由薄壁组织完成，都不是根毛的主要意义。","tag":"营养器官"},{"id":"botany-b062","type":"single","stage":1,"stem":"一个节上着生两片叶且左右相对排列的叶序称为","options":["互生","轮生","对生","丛生"],"answer":[2],"explain":"对生是指同一节上着生两片叶并左右相对，如丁香、薄荷。互生是每节只生一叶、交互排列；轮生是每节着生三片以上叶呈轮状；丛生是节间极度缩短使多片叶簇生一处，故C正确。","tag":"营养器官"},{"id":"botany-b064","type":"single","stage":1,"stem":"双子叶植物茎的初生结构中，由维管束、髓和髓射线共同构成的部分是","options":["表皮","皮层","中柱鞘","维管柱"],"answer":[3],"explain":"双子叶植物茎的初生结构由表皮、皮层和维管柱三部分组成，维管柱包括维管束、髓和髓射线，故D正确。表皮为保护组织，皮层以薄壁组织为主，中柱鞘是根初生结构中紧靠内皮层的一层细胞。","tag":"营养器官"},{"id":"botany-b065","type":"single","stage":1,"stem":"区分单叶与复叶的主要依据是","options":["叶柄上着生的是一个叶片还是多个小叶，以及小叶叶腋处有无芽","叶片的大小和形状","叶脉是网状脉还是平行脉","叶片边缘是否具有锯齿"],"answer":[0],"explain":"单叶的叶柄上只着生一个叶片，叶腋处有芽；复叶的总叶柄上着生多个小叶，小叶的叶腋处无芽，故A正确。叶形大小、脉序类型和叶缘特征在不同植物中变化很大，都不能作为区分单叶与复叶的依据。","tag":"营养器官"},{"id":"botany-b067","type":"single","stage":1,"stem":"一朵花中同时具有雄蕊和雌蕊的花称为","options":["单性花","中性花","两性花","无被花"],"answer":[2],"explain":"同时具有雄蕊和雌蕊的花为两性花，如桃和油菜的花。只具雄蕊或只具雌蕊的花为单性花；既无雄蕊又无雌蕊的花为中性花，如向日葵花序边缘的舌状花；无被花指缺少花被的花，与雄蕊雌蕊的有无无关。","tag":"生殖器官"},{"id":"botany-b068","type":"single","stage":1,"stem":"花药中产生花粉粒的结构是","options":["柱头","药室中的花粉母细胞","子房","花托"],"answer":[1],"explain":"花药是雄蕊花丝顶端的膨大部分，药室中的花粉母细胞（小孢子母细胞）经减数分裂形成花粉粒，故B正确。柱头接受花粉，子房内着生胚珠，花托是花各部分着生的地方，都不产生花粉。","tag":"生殖器官"},{"id":"botany-b070","type":"single","stage":1,"stem":"被子植物种子的胚由哪几部分组成","options":["胚乳、胚芽、胚根和种皮","子叶、胚乳和种皮","胚芽、胚轴和种皮","胚芽、胚轴、胚根和子叶"],"answer":[3],"explain":"胚是种子的主要部分，由胚芽、胚轴、胚根和子叶四部分组成，将来发育成幼苗。胚乳是胚发育时的营养组织，种皮是保护结构，两者都不属于胚，故A、B、C所列的组成都不正确。","tag":"生殖器官"},{"id":"botany-b072","type":"single","stage":1,"stem":"种子萌发所需的外界条件不包括","options":["充足的水分","适宜的温度","充足的光照","足够的氧气"],"answer":[2],"explain":"水分使种皮软化、酶活化，适宜温度保证酶促反应正常进行，氧气供应呼吸作用，三者是种子萌发必需的外界条件。多数种子萌发并不需要光照，有些种子在黑暗中萌发更好，故不包括充足的光照。","tag":"生殖器官"},{"id":"botany-b073","type":"single","stage":1,"stem":"传粉以后，花粉粒在柱头上萌发形成的结构及其作用是","options":["花粉管，把两个精子送入胚囊","花粉粒，落到柱头上完成传粉","珠孔，让花粉管进入胚珠","花药，产生并散出花粉粒"],"answer":[0],"explain":"花粉粒在柱头上萌发形成花粉管，花粉管沿花柱下行、经珠孔进入胚珠，把两个精子送入胚囊完成双受精。花粉粒是萌发的主体而不是产物，珠孔是胚珠上的孔道，花药是产生花粉的结构，都不是萌发形成的结构。","tag":"生殖器官"},{"id":"botany-b075","type":"single","stage":1,"stem":"光合作用的光反应发生在叶绿体的","options":["基质","类囊体薄膜","外膜","内膜"],"answer":[1],"explain":"光反应在类囊体薄膜上进行，膜上分布着光合色素、光系统和ATP合酶，可吸收光能并产生ATP和NADPH。叶绿体基质是暗反应固定二氧化碳的场所，外膜和内膜主要起界膜与物质运输作用。","tag":"生理"},{"id":"botany-b076","type":"single","stage":1,"stem":"光合作用暗反应固定二氧化碳的场所是","options":["类囊体腔","细胞质基质","线粒体基质","叶绿体基质"],"answer":[3],"explain":"暗反应即卡尔文循环，在叶绿体基质中进行，二氧化碳在此被RuBP固定并还原为糖类。类囊体腔和类囊体薄膜是光反应的部位，细胞质基质是糖酵解的场所，线粒体基质是三羧酸循环的场所。","tag":"生理"},{"id":"botany-b078","type":"single","stage":1,"stem":"有氧呼吸过程中，释放二氧化碳最多的阶段是","options":["第二阶段，丙酮酸与水反应被彻底分解","第一阶段，葡萄糖分解为丙酮酸","第三阶段，氢与氧结合生成水","三个阶段释放的二氧化碳一样多"],"answer":[0],"explain":"有氧呼吸第一阶段葡萄糖分解为丙酮酸，不释放二氧化碳；第二阶段丙酮酸与水反应彻底分解为二氧化碳和氢，释放全部二氧化碳；第三阶段氢与氧结合生成水并释放大量能量，但不产生二氧化碳，故A正确。","tag":"生理"},{"id":"botany-b079","type":"single","stage":1,"stem":"植物细胞发生质壁分离是指","options":["细胞核与细胞质分离","液泡与细胞质分离","原生质层与细胞壁分离","相邻两个细胞相互分离"],"answer":[2],"explain":"外界溶液浓度高于细胞液浓度时细胞失水，原生质层收缩并与细胞壁分离，称为质壁分离。细胞壁是全透性的，不随原生质层一起收缩；其余三项所描述的现象与质壁分离的概念无关。","tag":"生理"},{"id":"botany-b080","type":"single","stage":1,"stem":"高大树木将水分从根部运输到树冠的主要动力是","options":["根压","蒸腾拉力","毛细管作用","光合作用产生的拉力"],"answer":[1],"explain":"叶片蒸腾失水产生的水势差通过导管连续传递，形成蒸腾拉力，是高大树木向上运输水分的主要动力。根压力量有限，只能使水分上升有限高度；毛细管作用更弱；光合作用也不直接产生向上的拉力。","tag":"生理"},{"id":"botany-b081","type":"single","stage":1,"stem":"植物必需的大量元素中，被称为肥料三要素的是","options":["氮、磷、钙","氮、钾、铁","磷、钾、镁","氮、磷、钾"],"answer":[3],"explain":"植物对氮、磷、钾的需要量较大，土壤中常供应不足，生产上主要通过施肥补充，故称肥料三要素。钙、铁、镁虽也是必需元素，但需要量相对较少或土壤中一般并不缺乏，不属于三要素之列。","tag":"生理"},{"id":"botany-b083","type":"single","stage":1,"stem":"生长素促进细胞伸长生长的效应特点是","options":["低浓度促进，高浓度抑制","只促进，不产生抑制","只抑制，不产生促进","与浓度高低无关"],"answer":[0],"explain":"生长素促进细胞伸长的效应具有浓度两重性，一般低浓度促进、过高浓度抑制甚至伤害植物。不同器官对生长素的敏感程度也不同，根最敏感，芽次之，茎最不敏感，因此并非只促进或只抑制。","tag":"生理"},{"id":"botany-b085","type":"single","stage":1,"stem":"用赤霉素处理矮生豌豆可使其茎明显伸长，说明赤霉素能","options":["促进细胞分裂素的合成","促进细胞伸长、增加节间长度","抑制顶端优势","促进叶片和果实的脱落"],"answer":[1],"explain":"赤霉素能促进细胞伸长、增加节间长度，使矮生植株恢复高生，故B正确。促进细胞分裂是细胞分裂素的典型作用，顶端优势主要由生长素引起，促进器官脱落的是乙烯和脱落酸，都与赤霉素的这一效应不符。","tag":"生理"},{"id":"botany-b086","type":"single","stage":1,"stem":"干旱条件下，植物体内含量明显升高并能促进气孔关闭的激素是","options":["生长素","赤霉素","细胞分裂素","脱落酸"],"answer":[3],"explain":"干旱时脱落酸含量迅速升高，促使保卫细胞失水、气孔关闭以减少蒸腾，并提高植物的抗逆性。生长素和赤霉素主要促进生长，细胞分裂素促进细胞分裂并延缓衰老，都不会引起气孔关闭。","tag":"生理"},{"id":"botany-b088","type":"single","stage":1,"stem":"下列作物中，属于C4植物的是","options":["小麦","水稻","玉米","大豆"],"answer":[2],"explain":"玉米、甘蔗、高粱等为C4植物，叶肉细胞与维管束鞘细胞协同完成二氧化碳的固定，光合效率较高且光呼吸较弱。小麦、水稻和大豆都是C3植物，二氧化碳直接由RuBP固定，故C正确。","tag":"生理"},{"id":"botany-b091","type":"single","stage":1,"stem":"植物细胞中，合成蛋白质的细胞器是","options":["内质网","高尔基体","线粒体","核糖体"],"answer":[3],"explain":"核糖体是蛋白质合成的场所，游离核糖体合成胞内蛋白，附着在内质网上的核糖体合成分泌蛋白。内质网主要对蛋白质进行加工和运输，高尔基体参与加工、分类和分泌，线粒体是有氧呼吸的主要场所，三者均不能合成蛋白质。","tag":"细胞与组织"},{"id":"botany-b092","type":"single","stage":1,"stem":"植物茎、叶表皮细胞外壁发生角质化并形成角质层，其主要意义是","options":["减少水分散失并增强保护作用","增加表皮细胞的透水性","加快表皮细胞的分裂速度","促进有机物在体内的运输"],"answer":[0],"explain":"角质层由脂类物质沉积在表皮细胞外壁形成，透水性差，可减少水分蒸腾并抵御病菌侵入。B项说增加透水性正好相反；C项角质化是细胞分化成熟的表现，与分裂无关；D项有机物运输由韧皮部筛管完成。","tag":"细胞与组织"},{"id":"botany-b093","type":"single","stage":1,"stem":"植物薄壁组织中，细胞含较多叶绿体、能进行光合作用的组织称为","options":["贮藏组织","通气组织","同化组织","吸收组织"],"answer":[2],"explain":"含叶绿体、能进行光合作用的薄壁组织称同化组织，主要分布在叶肉中。贮藏组织以贮存营养物质为主；通气组织细胞间隙发达，利于气体贮存和运输；吸收组织如表皮毛，主要吸收水分和矿质，均不承担主要光合功能。","tag":"细胞与组织"},{"id":"botany-b094","type":"single","stage":1,"stem":"植物细胞有丝分裂过程中，着丝粒分裂、姐妹染色单体分开并移向两极发生在","options":["前期","中期","后期","末期"],"answer":[2],"explain":"后期着丝粒分裂，姐妹染色单体分开成为两条子染色体，在纺锤丝牵引下移向两极，细胞内染色体数目暂时加倍。前期染色质螺旋化成染色体，中期染色体排列在赤道板上，末期形成两个子核，均不发生着丝粒分裂。","tag":"细胞与组织"},{"id":"botany-b095","type":"single","stage":1,"stem":"植物细胞中，专门贮藏淀粉的白色体称为","options":["造油体","蛋白体","叶绿体","造粉体"],"answer":[3],"explain":"白色体不含色素，按贮藏物质分为造粉体、造油体和蛋白体，其中造粉体专门贮藏淀粉。造油体贮藏油脂，蛋白体贮藏蛋白质；叶绿体含叶绿素，能进行光合作用，不属于贮藏淀粉的白色体。","tag":"细胞与组织"},{"id":"botany-b099","type":"single","stage":1,"stem":"由明显的主根和其侧根组成、主根发达的根系称为","options":["须根系","不定根系","气生根系","直根系"],"answer":[3],"explain":"直根系由胚根发育而成的主根和其侧根构成，主根明显，如棉花、大豆。须根系的主根出生后不久停止生长，由茎基部的不定根组成，如小麦、玉米；气生根是暴露在空气中的不定根。","tag":"营养器官"},{"id":"botany-b100","type":"single","stage":1,"stem":"着生于叶腋内、将来发育成侧枝或花的芽称为","options":["顶芽","不定芽","腋芽","花芽"],"answer":[2],"explain":"腋芽又称侧芽，着生于叶腋，可发育成侧枝或花。顶芽着生于枝条顶端，使枝条伸长；不定芽着生于根、叶或老茎等非叶腋部位；花芽是按发育结果划分的芽，与按着生位置划分的腋芽不是同一分类依据。","tag":"营养器官"},{"id":"botany-b101","type":"single","stage":1,"stem":"一个完整的叶由哪几部分组成","options":["叶片、叶柄和托叶","叶片、叶柄和叶鞘","叶片、叶舌和叶耳","叶片、叶脉和叶肉"],"answer":[0],"explain":"完全叶包括叶片、叶柄和托叶三部分，如桃、梨的叶，缺少其中任一部分即为不完全叶。叶鞘、叶舌、叶耳是禾本科植物叶的特有结构，叶脉和叶肉是叶片的内部结构，均不能与叶片、叶柄、托叶并列。","tag":"营养器官"},{"id":"botany-b102","type":"single","stage":1,"stem":"双子叶植物茎的初生结构中，位于表皮与维管柱之间、由薄壁细胞组成的部分是","options":["髓","皮层","维管束","周皮"],"answer":[1],"explain":"双子叶植物茎的初生结构由外向内依次为表皮、皮层和维管柱，皮层位于表皮与维管柱之间，主要由薄壁细胞组成，常含淀粉等贮藏物质。髓位于茎中央，维管束是维管柱的主要部分，周皮属于次生保护组织。","tag":"营养器官"},{"id":"botany-b103","type":"single","stage":1,"stem":"下列器官中，属于茎的变态的是","options":["甘薯的块根","马铃薯的块茎","胡萝卜的肉质直根","甜菜的块根"],"answer":[1],"explain":"马铃薯块茎上有芽眼（节）和退化鳞叶，具有茎的基本特征，属于地下茎的变态。甘薯、胡萝卜、甜菜的贮藏器官均由根发育而来，属于根的变态，其上没有芽眼和节，故不能选。","tag":"营养器官"},{"id":"botany-b104","type":"single","stage":1,"stem":"一个叶柄上只着生一个叶片、叶柄与叶片之间无关节的叶称为","options":["复叶","单叶","羽状复叶","掌状复叶"],"answer":[1],"explain":"单叶是一个叶柄上只生一个叶片、叶柄与叶片间无关节，落叶时二者一同脱落，如桃、棉花。复叶的叶轴上生多个小叶，小叶与叶轴间有关节，落叶时小叶先落；羽状复叶和掌状复叶都是复叶的类型。","tag":"营养器官"},{"id":"botany-b105","type":"single","stage":1,"stem":"叶片脱落后，在茎枝表面留下的痕迹称为","options":["叶痕","叶迹","芽鳞痕","皮孔"],"answer":[0],"explain":"叶痕是叶片脱落后在茎上留下的疤痕，叶痕内的点状突起为叶迹，是维管束的断痕。芽鳞痕是芽鳞脱落后留下的痕迹，可用来判断枝条年龄；皮孔是茎表面进行气体交换的通道，故B、C、D均不符合。","tag":"营养器官"},{"id":"botany-b111","type":"single","stage":1,"stem":"一朵花中，与果实和种子形成直接有关的结构是","options":["花萼和花冠","花托和花柄","苞片和蜜腺","雄蕊和雌蕊"],"answer":[3],"explain":"雄蕊产生花粉，雌蕊子房内有胚珠，经传粉、受精后子房发育成果实、胚珠发育成种子，故雄蕊和雌蕊是花的主要部分。花萼、花冠主要起保护和吸引传粉者的作用，花托、花柄只起支持作用。","tag":"生殖器官"},{"id":"botany-b112","type":"single","stage":1,"stem":"小麦的花序类型是","options":["总状花序","穗状花序","复穗状花序","圆锥花序"],"answer":[2],"explain":"小麦花序的主轴（穗轴）上着生许多小穗，每个小穗含数朵小花，小穗本身呈穗状排列，故为复穗状花序。总状花序的花有花柄；穗状花序的花无柄；圆锥花序主轴分枝，如水稻、燕麦。","tag":"生殖器官"},{"id":"botany-b113","type":"single","stage":1,"stem":"花粉粒在柱头上萌发后，花粉管伸入胚珠的途径是","options":["柱头→花柱→子房→胚珠","柱头→子房→花柱→胚珠","花柱→柱头→子房→胚珠","子房→花柱→柱头→胚珠"],"answer":[0],"explain":"花粉粒在柱头上萌发形成花粉管，花粉管沿花柱向下生长，经子房壁进入子房腔，再经珠孔进入胚珠，把精子送入胚囊。其余选项的路径顺序颠倒，花粉管不可能先到子房再经花柱，故错误。","tag":"生殖器官"},{"id":"botany-b114","type":"single","stage":1,"stem":"双子叶植物种子（如大豆）萌发时，子叶的主要功能是","options":["保护胚芽和胚根","贮藏并为幼苗提供营养","发育形成种皮","发育形成胚乳"],"answer":[1],"explain":"双子叶植物种子无胚乳或胚乳退化，营养物质主要贮藏在子叶中，萌发时子叶为幼苗提供养分；种皮由珠被发育，胚乳由受精极核发育，子叶不承担保护或形成种皮的功能。","tag":"生殖器官"},{"id":"botany-b115","type":"single","stage":1,"stem":"桃、杏的果实外果皮薄、中果皮肉质多汁、内果皮坚硬成核，这类果实属于","options":["浆果","核果","梨果","荚果"],"answer":[1],"explain":"核果由单心皮上位子房发育而成，外果皮薄、中果皮肉质、内果皮木质化形成硬核，桃、杏、李均属此类。浆果的果皮除表皮外均肉质多汁；梨果由下位子房与花托共同发育；荚果是豆科特有的干果。","tag":"生殖器官"},{"id":"botany-b120","type":"single","stage":1,"stem":"叶绿体中含量最多、主要吸收红光和蓝紫光的色素是","options":["类胡萝卜素","花青素","藻蓝素","叶绿素"],"answer":[3],"explain":"叶绿素包括叶绿素a和b，在叶绿体中含量最多，主要吸收红光和蓝紫光而反射绿光。类胡萝卜素也吸收蓝紫光但含量较少；花青素存在于液泡中，使花、果呈现红、蓝、紫色；藻蓝素主要存在于蓝藻等，不是高等植物叶绿体的主要色素。","tag":"生理"},{"id":"botany-b121","type":"single","stage":1,"stem":"光合作用光反应阶段为暗反应提供的物质是","options":["ATP和NADPH","ATP和CO2","O2和NADPH","C3和C5"],"answer":[0],"explain":"光反应在类囊体薄膜上进行，产生ATP和NADPH，二者用于暗反应中C3的还原。O2是光反应的副产物，释放到体外；CO2由外界吸入，参与暗反应的固定；C3、C5是暗反应的中间产物，不是光反应提供的。","tag":"生理"},{"id":"botany-b122","type":"single","stage":1,"stem":"光合作用释放的氧气来自","options":["二氧化碳","水","葡萄糖","叶绿素"],"answer":[1],"explain":"光反应中水在光下分解为氧气和NADPH，释放的O2全部来自水。CO2被固定后进入C3，其中的氧最终进入有机物；葡萄糖是光合产物；叶绿素是吸收光能的色素，不分解产生氧气。同位素标记实验可证明氧的来源。","tag":"生理"},{"id":"botany-b123","type":"single","stage":1,"stem":"植物细胞在缺氧条件下进行酒精发酵时，其产物是","options":["酒精和二氧化碳","乳酸","二氧化碳和水","丙酮酸和氧气"],"answer":[0],"explain":"植物细胞无氧呼吸在细胞质基质中进行，葡萄糖分解为丙酮酸后，在缺氧条件下被还原为酒精和CO2，并释放少量能量。乳酸发酵的产物只有乳酸，如马铃薯块茎、甜菜块根；产生CO2和水的是有氧呼吸。","tag":"生理"},{"id":"botany-b124","type":"single","stage":1,"stem":"夜间或蒸腾作用微弱时，植物根系仍能使水分沿导管上升，其主要动力是","options":["蒸腾拉力","毛细管作用","根压","光合作用"],"answer":[2],"explain":"根压是根系生命活动产生的压力，可将水压入导管，使植物在夜间或蒸腾微弱时仍能吸水，并常引起吐水。蒸腾拉力是白天蒸腾旺盛时水分上升的主要动力；毛细管作用力很小；光合作用与吸水无直接关系。","tag":"生理"},{"id":"botany-b125","type":"single","stage":1,"stem":"植物蒸腾作用的主要方式和主要部位分别是","options":["皮孔蒸腾、茎","角质层蒸腾、叶表皮","气孔蒸腾、叶片","吐水、叶尖"],"answer":[2],"explain":"蒸腾作用以气孔蒸腾为主，占蒸腾量的绝大部分，主要发生在叶片上。皮孔蒸腾量很小；角质层蒸腾只占少部分；吐水是水分以液态从叶尖或叶缘排出，不属于蒸腾，故A、B、D均不符合。","tag":"生理"},{"id":"botany-b126","type":"single","stage":1,"stem":"下列各组元素中，全部属于植物必需大量元素的是","options":["Fe、Mn、B","Zn、Cu、Mo","N、Fe、Mg","N、P、K"],"answer":[3],"explain":"植物必需的大量元素有C、H、O、N、P、K、Ca、Mg、S，N、P、K全部属于大量元素。A、B两组所列Fe、Mn、B、Zn、Cu、Mo均为微量元素，C组中Fe也属微量元素，故选D项。","tag":"生理"},{"id":"botany-b127","type":"single","stage":1,"stem":"能促进种子萌发、打破休眠并促进茎伸长的植物激素是","options":["生长素","赤霉素","脱落酸","乙烯"],"answer":[1],"explain":"赤霉素能打破种子和芽的休眠、促进种子萌发，并促进细胞伸长使茎秆伸长。生长素主要促进细胞伸长和生根，一般不打破休眠；脱落酸抑制萌发、促进休眠；乙烯促进果实成熟和器官脱落，与打破休眠无关。","tag":"生理"},{"id":"botany-b128","type":"single","stage":1,"stem":"能促进细胞分裂、诱导芽分化并延缓叶片衰老的植物激素是","options":["生长素","细胞分裂素","赤霉素","脱落酸"],"answer":[1],"explain":"细胞分裂素的主要作用是促进细胞分裂、诱导芽的分化，并能抑制叶绿素和蛋白质降解，延缓叶片衰老。生长素促进细胞伸长和生根；赤霉素促进茎伸长和种子萌发；脱落酸促进休眠和器官脱落，均不以延缓衰老为主。","tag":"生理"},{"id":"botany-b129","type":"single","stage":1,"stem":"作物缺磷时，植株的典型表现是","options":["植株矮小，老叶呈暗绿或紫红色","老叶从叶尖开始均匀发黄","幼叶发黄而叶脉仍绿","叶片边缘焦枯并出现褐斑"],"answer":[0],"explain":"磷在植物体内可再利用，缺磷时老叶中的磷转移到幼叶，老叶积累花青素而呈暗绿或紫红色，植株矮小、分蘖少。B项是缺氮的典型症状；C项多见于缺铁等难再利用元素；D项多为缺钾表现。","tag":"生理"},{"id":"botany-s01","type":"single","stem":"植物细胞壁中，把相邻细胞黏合在一起、主要成分为果胶类物质的层次是","options":["初生壁","胞间层（中层）","次生壁","角质层"],"answer":[1],"explain":"胞间层又称中层，位于相邻细胞壁的最外层，主要成分是果胶类物质，起黏合作用；初生壁以纤维素和果胶为主，次生壁常含木质素，角质层是表皮细胞外壁表面的角质膜。故选胞间层（中层）。","tag":"细胞与组织","level":1,"stage":1,"standard":true},{"id":"botany-s02","type":"single","stem":"花瓣呈现红色、紫色或蓝色，主要是由于色素存在于细胞的哪个部位","options":["细胞壁","叶绿体","液泡","细胞核"],"answer":[2],"explain":"花青素是水溶性色素，溶解在液泡内的细胞液中，随细胞液 pH 不同而呈现红、紫、蓝等颜色；叶绿体含叶绿素和类胡萝卜素，不能形成花青素；细胞壁和细胞核也不含此类色素。故选液泡。","tag":"细胞与组织","level":1,"stage":1,"standard":true},{"id":"botany-s03","type":"single","stem":"下列哪组特征是分生组织细胞通常具有的","options":["细胞大、壁厚、具大液泡","细胞壁木质化、原生质体消失","细胞小、壁薄、核大、液泡小而分散","细胞含大量叶绿体并排列成栅栏状"],"answer":[2],"explain":"分生组织细胞体积小、排列紧密、细胞壁薄、细胞质浓、细胞核大、液泡小而分散，分裂能力强；壁厚木质化、原生质体消失是厚壁组织的特征，含大量叶绿体并呈栅栏状排列是叶肉栅栏组织的特征。","tag":"细胞与组织","level":1,"stage":1,"standard":true},{"id":"botany-s05","type":"single","stem":"被子植物体内，运输水分和无机盐、运输有机物的结构分别是","options":["筛管、导管","导管、导管","筛管、筛管","导管、筛管"],"answer":[3],"explain":"导管由死细胞连接而成，位于木质部，运输根吸收的水分和无机盐；筛管是活细胞（成熟后无细胞核），位于韧皮部，运输光合作用制造的有机物。二者功能不能颠倒，故为导管、筛管。","tag":"细胞与组织","level":1,"stage":1,"standard":true},{"id":"botany-s06","type":"single","stem":"根尖中吸收水分和无机盐最活跃的部位是","options":["根冠","分生区","伸长区","根毛区（成熟区）"],"answer":[3],"explain":"根毛区表皮细胞向外突起形成根毛，大大增加吸收面积，且该区已分化出导管，吸收的水分和无机盐能及时运走，因而是吸收最活跃的部位；根冠起保护作用，分生区细胞分裂，伸长区细胞伸长。","tag":"营养器官","level":1,"stage":1,"standard":true},{"id":"botany-s09","type":"single","stem":"禾本科植物叶片上表皮中，与叶片卷曲有关的特化细胞是","options":["保卫细胞","泡状细胞（运动细胞）","栅栏组织","厚壁组织"],"answer":[1],"explain":"泡状细胞位于禾本科叶片上表皮，细胞较大、液泡大，常排列成纵行。干旱失水时泡状细胞收缩，使叶片向上卷曲，减少水分散失；保卫细胞控制气孔开闭，栅栏组织属叶肉，厚壁组织起支持作用。","tag":"营养器官","level":1,"stage":1,"standard":true},{"id":"botany-s11","type":"single","stem":"花程式 K(5)C5A(10)G1 中，括号表示同一轮器官合生。该花程式表示的花是","options":["单性花","无被花","单被花","两性花"],"answer":[3],"explain":"K 表示花萼、C 表示花冠、A 表示雄蕊、G 表示雌蕊，数字表示数目，括号表示合生。该花同时具有花萼、花冠、雄蕊和雌蕊，故为两性花、双被花；单性花缺少雄蕊或雌蕊，无被花和单被花则缺少花萼或花冠。","tag":"生殖器官","level":1,"stage":1,"standard":true},{"id":"botany-s13","type":"single","stem":"小麦种子萌发时，为胚提供营养的主要结构是","options":["子叶","胚乳","胚芽","种皮"],"answer":[1],"explain":"小麦是单子叶植物，种子具胚乳，胚乳中贮藏大量淀粉等营养物质，萌发时供胚利用；其子叶特化为盾片，主要起吸收和转运胚乳养分的作用；胚芽发育为茎叶，种皮起保护作用。","tag":"生殖器官","level":1,"stage":1,"standard":true},{"id":"botany-s14","type":"single","stem":"被子植物双受精过程中，一个精子与卵细胞结合，另一个精子与两个极核结合，后者发育成","options":["胚","种皮","胚乳","果皮"],"answer":[2],"explain":"双受精是被子植物特有现象：一个精子与卵细胞融合形成受精卵，发育为胚；另一个精子与两个极核融合形成受精极核，发育为胚乳。种皮由珠被发育而来，果皮由子房壁发育而来。","tag":"生殖器官","level":1,"stage":1,"standard":true},{"id":"botany-s15","type":"single","stem":"C4 植物叶片中，维管束鞘细胞较大、含叶绿体，并与周围叶肉细胞呈环状排列，这种结构称为","options":["栅栏组织","海绵组织","凯氏带","花环结构（Kranz 结构）"],"answer":[3],"explain":"C4 植物叶片的维管束鞘细胞较大且含叶绿体，外围叶肉细胞呈辐射状排列，形成花环状结构，是 C4 途径中 CO2 浓缩与卡尔文循环分工的结构基础；栅栏组织和海绵组织是叶肉的分化，凯氏带位于根的内皮层。","tag":"生理","level":1,"stage":1,"standard":true},{"id":"botany-s17","type":"single","stem":"植物细胞进行有氧呼吸的主要场所是","options":["细胞质基质","线粒体","叶绿体","液泡"],"answer":[1],"explain":"有氧呼吸第一阶段在细胞质基质中进行，第二、三阶段主要在线粒体基质和线粒体内膜上完成，因此线粒体是有氧呼吸的主要场所；叶绿体是光合作用的场所，液泡主要调节渗透压和贮藏物质。","tag":"生理","level":1,"stage":1,"standard":true},{"id":"botany-s20","type":"single","stem":"生产中常用乙烯利催熟香蕉，说明乙烯的主要生理作用是","options":["促进果实成熟","促进细胞伸长","促进种子萌发","抑制器官衰老"],"answer":[0],"explain":"乙烯是促进果实成熟的激素，能提高果皮中淀粉酶、果胶酶等活性，使果实变软变甜；乙烯利释放乙烯而起催熟作用。促进细胞伸长主要是赤霉素和生长素的作用，促进种子萌发的是赤霉素，乙烯促进衰老脱落而非抑制。","tag":"生理","level":1,"stage":1,"standard":true},{"id":"botany-b006","type":"multi","stage":1,"stem":"下列有关植物组织结构与功能的叙述，正确的是","options":["分生组织细胞排列紧密、壁薄，分裂能力强","厚壁组织细胞成熟时通常为死细胞，细胞壁次生加厚","表皮细胞外壁常具角质层，可减少水分散失","筛管分子成熟时为死细胞，承担有机物运输"],"answer":[0,1,2],"explain":"分生组织细胞小、壁薄、分裂能力强；厚壁组织成熟时壁次生加厚并木化，多为死细胞；表皮外壁的角质层可减少水分散失。筛管分子成熟后虽无细胞核，但仍是活细胞，负责有机物运输，故该项错误。","tag":"细胞与组织"},{"id":"botany-b016","type":"multi","stage":1,"stem":"下列有关根尖结构与功能的叙述，正确的是","options":["根冠位于根尖最前端，保护其后的分生区","分生区细胞分裂能力强，不断产生新细胞","根毛区已无根毛，主要进行水分运输","伸长区细胞显著伸长，是根尖伸长的主要动力"],"answer":[0,1,3],"explain":"根冠保护分生区，分生区不断分裂产生新细胞，伸长区细胞迅速伸长使根尖伸长。根毛区着生大量根毛，是吸收水分和无机盐的主要部位，并非无根毛，故该项错误。","tag":"营养器官"},{"id":"botany-b017","type":"multi","stage":1,"stem":"下列有关茎和叶结构的叙述，正确的是","options":["茎有节和节间，节上着生叶，叶腋内有腋芽","叶由叶片、叶柄和托叶组成，三者缺一不可","禾本科植物的叶由叶片和叶鞘组成，叶鞘顶端与叶片相接处有叶舌和叶耳","茎的次生生长主要由维管形成层的活动完成"],"answer":[0,2,3],"explain":"茎有节和节间，叶腋生腋芽；禾本科叶由叶片和叶鞘组成，叶鞘顶端与叶片相接处有叶舌、叶耳；茎的增粗主要靠维管形成层。叶不一定具有叶片、叶柄和托叶三部分，如禾本科叶无柄也无托叶，故该项错误。","tag":"营养器官"},{"id":"botany-b018","type":"multi","stage":1,"stem":"下列有关植物营养器官变态的叙述，正确的是","options":["甘薯块根有节和芽，属于根的变态","马铃薯块茎具芽眼和退化鳞叶，属于茎的变态","仙人掌的刺由叶变态而来，可减少水分散失","萝卜的肉质直根贮藏养料，属于根变态"],"answer":[1,2,3],"explain":"甘薯块根由不定根膨大形成，没有节和芽，属于根变态而不是茎变态，故该项错误。马铃薯块茎有芽眼和退化鳞叶，仙人掌的刺由叶变态而来，萝卜的肉质直根贮藏养料，三者都是营养器官变态。","tag":"营养器官"},{"id":"botany-b027","type":"multi","stage":1,"stem":"下列叙述中，符合花、果实和种子发育事实的是","options":["花托是花各部分着生的部位","胚珠受精后发育成种子，子房发育成果实","所有果实都由子房发育而来","玉米粒是果实，其果皮与种皮愈合不可分离"],"answer":[0,1,3],"explain":"花托是花各部分着生的部位；胚珠受精后发育成种子，子房发育成果实；玉米粒的果皮与种皮愈合，属于果实。果实并非都由子房发育而来，草莓等假果还有花托等部分参与形成，故该项错误。","tag":"生殖器官"},{"id":"botany-b040","type":"multi","stage":1,"stem":"下列有关光合作用与呼吸作用的叙述，正确的是","options":["光合作用合成有机物，呼吸作用分解有机物","光合作用在叶绿体中进行，呼吸作用只在线粒体中进行","光合作用只在光下进行，呼吸作用昼夜都进行","增加光照强度或提高二氧化碳浓度可提高光合速率"],"answer":[0,2,3],"explain":"光合作用合成有机物，呼吸作用分解有机物；光合作用需要光，呼吸作用昼夜进行；增强光照或提高二氧化碳浓度可提高光合速率。呼吸作用并非只在线粒体中进行，糖酵解在细胞质基质中进行，故该项错误。","tag":"生理"},{"id":"botany-b041","type":"multi","stage":1,"stem":"下列有关植物矿质营养的叙述，正确的是","options":["氮是蛋白质、核酸和叶绿素的组成元素","磷参与磷脂、核酸和ATP的组成","钾在植物体内可再利用，缺钾时老叶先出现症状","微量元素在植物体内含量少，对植物可有可无"],"answer":[0,1,2],"explain":"氮是蛋白质、核酸和叶绿素的组成元素；磷参与磷脂、核酸和ATP的构成；钾可再利用，缺钾时老叶先出现症状。微量元素含量虽少，却参与酶活性调节和多种代谢，绝非可有可无，故该项错误。","tag":"生理"},{"id":"botany-b042","type":"multi","stage":1,"stem":"下列有关植物激素生理作用的叙述，正确的是","options":["生长素低浓度促进生长、高浓度抑制生长，具有两重性","赤霉素能促进细胞伸长，使植株明显增高","脱落酸促进气孔开放，加快生长","细胞分裂素主要促进细胞分裂和芽的分化"],"answer":[0,1,3],"explain":"生长素低浓度促进、高浓度抑制，具有两重性；赤霉素促进细胞伸长；细胞分裂素促进细胞分裂和芽的分化。脱落酸促进气孔关闭、抑制生长，而不是促进气孔开放，故该项错误。","tag":"生理"},{"id":"botany-b043","type":"multi","stage":1,"stem":"下列有关植物呼吸作用的叙述，正确的是","options":["呼吸作用只在夜间进行，白天因光合作用而停止","有氧呼吸是植物获取能量的主要方式","无氧呼吸释放能量少，产物积累可能伤害细胞","低温、低氧和较高二氧化碳浓度可抑制呼吸，利于果蔬贮藏"],"answer":[1,2,3],"explain":"有氧呼吸是植物获取能量的主要方式；无氧呼吸产能少，酒精等产物积累会伤害细胞；低温、低氧和较高二氧化碳浓度可抑制呼吸，利于果蔬贮藏。呼吸作用昼夜都进行，白天不会因光合作用而停止，故该项错误。","tag":"生理"},{"id":"botany-b048","type":"multi","stage":1,"stem":"关于植物细胞结构的叙述，正确的有","options":["细胞壁自外向内分为胞间层、初生壁和次生壁","细胞膜的基本骨架是磷脂双分子层","成熟植物细胞中都具有中央大液泡","细胞核是遗传物质储存和复制的主要场所"],"answer":[0,1,3],"explain":"细胞壁自外向内依次为胞间层、初生壁和次生壁，细胞膜以磷脂双分子层为基本骨架，细胞核是遗传物质储存与复制的主要场所，故A、B、D正确。中央大液泡只存在于成熟植物细胞中，分生组织细胞通常只有许多小液泡，C错误。","tag":"细胞与组织"},{"id":"botany-b053","type":"multi","stage":1,"stem":"关于植物成熟组织的叙述，正确的有","options":["薄壁组织细胞壁薄、细胞间隙发达，常兼有同化和贮藏功能","厚壁组织细胞壁木质化加厚，细胞成熟后通常死亡","木栓层细胞壁栓质化并含叶绿体，能进行光合作用","维管束中的纤维属于机械组织"],"answer":[0,1,3],"explain":"薄壁组织壁薄、间隙发达，承担同化、贮藏、吸收等功能；厚壁组织细胞壁木质化加厚，成熟后死亡；纤维属机械组织中的厚壁组织，故A、B、D正确。木栓层细胞壁栓质化，成熟后死亡且不含叶绿体，不能光合，C错误。","tag":"细胞与组织"},{"id":"botany-b057","type":"multi","stage":1,"stem":"关于根的初生结构和吸收功能的叙述，正确的有","options":["根尖从下到上依次为根冠、分生区、伸长区和成熟区","根毛区表皮细胞外壁薄、角质层不发达，利于吸收水分","双子叶植物根的内皮层细胞壁全面木化，可阻止水分通过","侧根由中柱鞘细胞恢复分裂能力后形成"],"answer":[0,1,3],"explain":"根尖自下而上由根冠、分生区、伸长区和成熟区组成；根毛区表皮外壁薄、角质层不发达，利于吸收；侧根由中柱鞘细胞分裂形成，故A、B、D正确。内皮层只是径向壁和横向壁局部形成凯氏带，并非全面木化，C错误。","tag":"营养器官"},{"id":"botany-b063","type":"multi","stage":1,"stem":"关于茎的形态与结构的叙述，正确的有","options":["芽按着生位置可分为定芽和不定芽","茎的节是叶着生的部位，节间是相邻两节之间的部分","木本植物茎的年轮由次生木质部逐年增生形成，可用于推测树龄","所有植物的茎中都具形成层，能不断增粗"],"answer":[0,1,2],"explain":"芽按着生位置分定芽和不定芽，节为叶着生处、节间为相邻两节之间的部分，年轮由次生木质部逐年增生形成并可推测树龄，故A、B、C正确。禾本科等单子叶植物茎内无形成层，不能次生增粗，D错误。","tag":"营养器官"},{"id":"botany-b066","type":"multi","stage":1,"stem":"关于叶的形态和结构的叙述，正确的有","options":["叶片、叶柄和托叶三者俱全的叶称为完全叶","栅栏组织紧靠上表皮，细胞含叶绿体较多","气孔只分布在叶片的上表皮","叶脉中的维管束兼有输导和支持作用"],"answer":[0,1,3],"explain":"叶片、叶柄和托叶俱全者为完全叶；栅栏组织紧靠上表皮且叶绿体较多；叶脉中的维管束运输水分、无机盐和有机物并起支持作用，故A、B、D正确。多数植物气孔主要分布在下表皮，上表皮也有分布，C错误。","tag":"营养器官"},{"id":"botany-b069","type":"multi","stage":1,"stem":"关于花、果实和种子的叙述，正确的有","options":["花由花柄、花托、花萼、花冠、雄蕊群和雌蕊群等组成","传粉分自花传粉和异花传粉，异花传粉需借助风、昆虫等媒介","受精后子房发育成果实，子房壁发育成果皮","所有种子成熟后都必须经过休眠期才能萌发"],"answer":[0,1,2],"explain":"花的基本组成包括花柄、花托、花萼、花冠、雄蕊和雌蕊；传粉分自花传粉和异花传粉，后者需风、昆虫等媒介；受精后子房发育为果实、子房壁发育为果皮，故A、B、C正确。并非所有种子都有休眠期，D错误。","tag":"生殖器官"},{"id":"botany-b077","type":"multi","stage":1,"stem":"关于光合作用的叙述，正确的有","options":["光反应在类囊体薄膜上进行，产生ATP和NADPH","暗反应在叶绿体基质中进行，需要光直接参与","C4植物固定二氧化碳的最初产物是草酰乙酸","叶绿素主要吸收红光和蓝紫光"],"answer":[0,2,3],"explain":"光反应在类囊体薄膜上产生ATP和NADPH；C4植物由PEP羧化酶固定二氧化碳，最初产物为草酰乙酸；叶绿素主要吸收红光和蓝紫光，故A、C、D正确。暗反应不直接需要光，消耗的是光反应产生的ATP和NADPH，B错误。","tag":"生理"},{"id":"botany-b084","type":"multi","stage":1,"stem":"关于植物水分代谢和矿质营养的叙述，正确的有","options":["植物细胞吸水的方式主要有渗透吸水和吸胀吸水","蒸腾作用能降低叶片温度，并促进水分和矿质元素在体内的运输","根系吸收矿质元素与呼吸作用无关，不需要消耗能量","根吸收的矿质元素可随蒸腾流在木质部中向上运输"],"answer":[0,1,3],"explain":"细胞吸水有渗透吸水和吸胀吸水两种方式；蒸腾作用可降低叶片温度并促进水分和矿质元素的运输；矿质元素可随蒸腾流在木质部中上运，故A、B、D正确。根系吸收矿质元素以离子形式为主，需呼吸作用供能，C错误。","tag":"生理"},{"id":"botany-b089","type":"multi","stage":1,"stem":"关于植物激素的叙述，正确的有","options":["生长素、赤霉素、细胞分裂素、脱落酸和乙烯是五大类植物激素","细胞分裂素能促进细胞分裂并延缓叶片衰老","乙烯能促进果实成熟和器官脱落","植物激素在体内含量很高，主要为生命活动提供能量"],"answer":[0,1,2],"explain":"公认的五大类植物激素为生长素、赤霉素、细胞分裂素、脱落酸和乙烯；细胞分裂素促进分裂并延缓衰老，乙烯促进果实成熟和器官脱落，故A、B、C正确。植物激素含量极微，起信息传递和调节作用，不提供能量，D错误。","tag":"生理"},{"id":"botany-b096","type":"multi","stage":1,"stem":"关于植物细胞的细胞壁，下列叙述正确的是","options":["初生壁主要由纤维素、半纤维素和果胶类物质构成","次生壁中常沉积木质素，使细胞壁坚硬","胞间层的主要成分是纤维素","细胞壁形成后其成分和厚度不再变化"],"answer":[0,1],"explain":"初生壁由纤维素、半纤维素和果胶构成，次生壁常木质化而坚硬。胞间层主要成分为果胶类物质，起黏合相邻细胞的作用，不是纤维素；细胞壁形成后仍可增厚，或发生木质化、角质化等特化，故C、D错误。","tag":"细胞与组织"},{"id":"botany-b097","type":"multi","stage":1,"stem":"关于植物组织的类型和功能，下列叙述正确的是","options":["导管和筛管都属于输导组织","厚壁组织细胞成熟时通常为生活细胞","分泌组织能合成、贮藏或分泌代谢产物","表皮上的气孔由两个保卫细胞围成"],"answer":[0,2,3],"explain":"导管运输水和无机盐、筛管运输有机物，二者均属输导组织；分泌组织可合成、贮藏或分泌树脂、蜜汁等物质；气孔由两个保卫细胞围成。厚壁组织细胞壁厚，成熟时多为死细胞，B项错误。","tag":"细胞与组织"},{"id":"botany-b106","type":"multi","stage":1,"stem":"关于根尖各部分的结构与功能，下列叙述正确的是","options":["根冠位于根尖最前端，保护其后的分生区","分生区细胞不断分裂，产生的新细胞向上分化","伸长区细胞迅速伸长，是根尖伸长最快的部位","根毛区细胞分裂旺盛，是根伸长的主要部位"],"answer":[0,1,2],"explain":"根冠起保护作用；分生区细胞不断分裂产生新细胞；伸长区细胞迅速伸长，是根尖伸长最快的部位。根毛区细胞已高度分化，主要进行吸收，基本不再分裂，D项将其功能与分生区混淆，错误。","tag":"营养器官"},{"id":"botany-b107","type":"multi","stage":1,"stem":"关于叶的结构与功能，下列叙述正确的是","options":["栅栏组织细胞呈圆柱形、排列紧密，叶绿体较多","海绵组织细胞形状不规则，细胞间隙较大","多数双子叶植物叶片的气孔只分布在上表皮","叶肉细胞含叶绿体，能进行光合作用"],"answer":[0,1,3],"explain":"栅栏组织紧靠上表皮，细胞圆柱形、叶绿体多，光合能力强；海绵组织细胞间隙大，利于气体交换；叶肉细胞含叶绿体，能进行光合作用。多数双子叶植物气孔在下表皮分布较多，C项说只分布在上表皮错误。","tag":"营养器官"},{"id":"botany-b116","type":"multi","stage":1,"stem":"关于花的结构，下列叙述正确的是","options":["花萼和花冠合称花被","雄蕊由花药和花丝两部分组成","雌蕊由花药、花柱和子房组成","一朵花中雌蕊的数目一定与雄蕊相等"],"answer":[0,1],"explain":"花萼与花冠合称花被，起保护和吸引传粉者的作用；雄蕊由花药和花丝组成，花药产生花粉。雌蕊由柱头、花柱和子房组成，不含花药；一朵花中雄蕊常多数，雌蕊可一至多个，数目不必相等，故C、D错误。","tag":"生殖器官"},{"id":"botany-b117","type":"multi","stage":1,"stem":"关于种子和果实的形成，下列叙述正确的是","options":["有胚乳的种子由种皮、胚和胚乳三部分组成","双子叶植物种子多无胚乳，营养物质贮藏在子叶中","果实由子房发育而来，有些果实还包括花托等结构","所有被子植物的种子都具有胚乳"],"answer":[0,1,2],"explain":"有胚乳的种子由种皮、胚和胚乳组成；大豆、花生等双子叶植物种子无胚乳，养分贮于子叶；果实主要由子房发育，苹果、梨等还包含花托。无胚乳种子并不少见，D项说所有种子都有胚乳，过于绝对。","tag":"生殖器官"},{"id":"botany-b130","type":"multi","stage":1,"stem":"关于光合作用的过程，下列叙述正确的是","options":["光反应在类囊体薄膜上进行","暗反应在叶绿体基质中进行","叶绿体的光合色素都分布在类囊体薄膜上","暗反应的进行不需要酶的催化"],"answer":[0,1,2],"explain":"光反应在类囊体薄膜上进行，暗反应在叶绿体基质中进行；叶绿体的光合色素都分布在类囊体薄膜上，便于吸收光能。暗反应是一系列酶促反应，需要多种酶催化，D项错误。","tag":"生理"},{"id":"botany-b131","type":"multi","stage":1,"stem":"关于植物水分代谢，下列叙述正确的是","options":["蒸腾作用能促进根系吸水和水分在体内的运输","植物吸收的水分绝大部分用于光合作用等代谢","叶片缺水时气孔张开度增大，蒸腾增强","植物吸收的水分绝大部分通过蒸腾作用散失"],"answer":[0,3],"explain":"蒸腾作用能促进根系吸水和水分在体内的运输；植物吸收的水分只有极少量用于光合作用等代谢，绝大部分通过蒸腾散失。叶片缺水时气孔关闭、蒸腾减弱，C项说反了，错误；B项也错误。","tag":"生理"},{"id":"botany-b132","type":"multi","stage":1,"stem":"关于植物激素的生理作用，下列叙述正确的是","options":["生长素低浓度促进生长，高浓度抑制生长","植物的生长发育是多种激素共同调节的结果","乙烯能促进果实成熟和器官脱落","脱落酸能促进细胞分裂和器官生长"],"answer":[0,1,2],"explain":"生长素的作用具有两重性，低浓度促进、高浓度抑制；植物生长发育是多种激素共同调节的结果；乙烯促进果实成熟与器官脱落。脱落酸的主要作用是抑制细胞分裂和生长、促进休眠和脱落，D项将其作用说反，错误。","tag":"生理"},{"id":"botany-m01","type":"multi","stem":"关于植物细胞与组织，下列叙述正确的是","options":["细胞壁的胞间层主要由果胶类物质构成，使相邻细胞黏合","保卫细胞吸水膨胀时气孔关闭，失水时气孔张开","厚角组织在细胞角隅处加厚，成熟细胞仍具原生质体","导管分子成熟后原生质体消失，是死细胞；筛管分子成熟后也无细胞核，因此也是死细胞"],"answer":[0,2],"explain":"胞间层以果胶类物质为主，起黏合作用；厚角组织在角隅处加厚，成熟后仍为活细胞；保卫细胞吸水膨胀时气孔张开，失水时关闭，B 项颠倒；筛管分子成熟后虽无细胞核，但仍是活细胞，D 项错误。","tag":"细胞与组织","level":1,"stage":1,"standard":true},{"id":"botany-m03","type":"multi","stem":"关于花、果实和种子，下列叙述正确的是","options":["小麦种子有胚乳，因此小麦属于双子叶植物","花程式 K(5)C5A(10)G1 中括号表示器官合生，该花为两性花","双受精时受精卵发育为胚乳，受精极核发育为胚","苹果、梨的食用部分主要由花托发育形成，属于假果"],"answer":[1,3],"explain":"花程式中的括号表示同一轮器官合生，该花兼具花萼、花冠、雄蕊和雌蕊，为两性花；苹果、梨的食用部分主要由花托发育，属假果。小麦是单子叶植物，A 错误；双受精时受精卵发育为胚，受精极核发育为胚乳，C 颠倒。","tag":"生殖器官","level":1,"stage":1,"standard":true},{"id":"botany-m05","type":"multi","stem":"关于植物水分代谢、矿质营养和植物激素，下列叙述正确的是","options":["蒸腾拉力是植物体内水分向上长距离运输的主要动力","植物激素在体内含量很高，只作用于产生部位","钙在植物体内难以再利用，缺钙时幼叶先表现症状","脱落酸促进气孔张开和种子萌发"],"answer":[0,2],"explain":"蒸腾拉力是水分向上运输的主要动力；钙在体内难以再利用，缺钙时幼叶先出现症状。植物激素含量极微，可运输到其他部位起作用，B 错误；脱落酸促进气孔关闭、种子休眠，D 错误。","tag":"生理","level":1,"stage":1,"standard":true},{"id":"botany-b007","type":"judge","stage":1,"stem":"植物细胞的液泡只存在于成熟细胞中，幼嫩细胞中没有液泡。","options":["正确","错误"],"answer":[1],"explain":"幼嫩细胞中已有多个小液泡，随着细胞成熟它们逐渐合并成中央大液泡，因此液泡并非成熟细胞独有。液泡参与渗透调节、贮藏代谢产物和消化分解，是植物细胞的重要细胞器。","tag":"细胞与组织"},{"id":"botany-b008","type":"judge","stage":1,"stem":"植物体内的成熟组织都是死细胞，只有分生组织才是生活细胞。","options":["正确","错误"],"answer":[1],"explain":"成熟组织中的薄壁组织、厚角组织、表皮以及筛管分子等都是生活细胞，只有厚壁组织、导管等成熟时为死细胞，因此该说法错误。分生组织只是细胞分裂活跃的一类组织，不能据此认为其他组织都已死亡。","tag":"细胞与组织"},{"id":"botany-b019","type":"judge","stage":1,"stem":"禾本科植物的叶脉多为平行脉，大多数双子叶植物的叶脉为网状脉。","options":["正确","错误"],"answer":[0],"explain":"禾本科植物叶片狭长，叶脉平行排列，为平行脉；大多数双子叶植物叶片较宽，叶脉交织成网，为网状脉。叶脉类型是识别单子叶植物与双子叶植物的重要依据之一。","tag":"营养器官"},{"id":"botany-b020","type":"judge","stage":1,"stem":"芽按性质可分为枝芽、花芽和混合芽三类。","options":["正确","错误"],"answer":[0],"explain":"芽按性质可分为枝芽、花芽和混合芽三类；按着生位置可分为顶芽、腋芽和不定芽，按有无鳞片可分为鳞芽和裸芽。不同分类依据不能混淆，该说法正确。","tag":"营养器官"},{"id":"botany-b028","type":"judge","stage":1,"stem":"双子叶植物的种子通常有胚乳，单子叶植物的种子通常无胚乳。","options":["正确","错误"],"answer":[1],"explain":"多数双子叶植物如大豆、花生的成熟种子无胚乳，养料储存在子叶中；多数单子叶植物如小麦、玉米有胚乳。该说法正好相反，是错误的。少数植物如蓖麻虽为双子叶，却具有胚乳。","tag":"生殖器官"},{"id":"botany-b029","type":"judge","stage":1,"stem":"虫媒花通常花冠鲜艳、具蜜腺和香气，花粉粒较大且表面粗糙。","options":["正确","错误"],"answer":[0],"explain":"虫媒花靠昆虫传粉，通常花冠鲜艳、有蜜腺和香气，花粉粒较大、表面粗糙，便于黏附在虫体上，该说法正确。风媒花则花被退化，无香气和蜜腺，花粉小而轻、数量多，柱头常呈羽毛状。","tag":"生殖器官"},{"id":"botany-b044","type":"judge","stage":1,"stem":"植物体内的水分主要以水蒸气的形式通过气孔散失到体外，这一过程称为蒸腾作用。","options":["正确","错误"],"answer":[0],"explain":"植物吸收的水分绝大部分以水蒸气形式通过气孔散失，这一过程称为蒸腾作用，该说法正确。蒸腾作用能降低叶温，并产生拉力促进水分和无机盐在体内运输，是植物水分代谢的重要环节。","tag":"生理"},{"id":"botany-b045","type":"judge","stage":1,"stem":"植物激素都由分生组织产生，并且只在产生部位发挥作用。","options":["正确","错误"],"answer":[1],"explain":"植物激素由植物体的一定部位产生，可运输到作用部位，微量即可起显著调节作用，并不都由分生组织产生，也不只在产生部位起作用，该说法错误。例如生长素在尖端产生后可向下运输发挥作用。","tag":"生理"},{"id":"botany-b051","type":"judge","stage":1,"stem":"分生组织细胞一般体积小、排列紧密、细胞壁薄、细胞质浓厚，且没有中央大液泡。","options":["正确","错误"],"answer":[0],"explain":"分生组织细胞体积小、排列紧密、细胞壁薄、细胞质浓厚、细胞核相对较大，通常没有中央大液泡，能不断分裂产生新细胞，因此该陈述正确。若细胞壁厚、具大液泡且高度分化，则属于成熟组织，已失去分裂能力。","tag":"细胞与组织"},{"id":"botany-b054","type":"judge","stage":1,"stem":"植物体所有细胞都含有叶绿体，因此都能进行光合作用。","options":["正确","错误"],"answer":[1],"explain":"只有植物体绿色部分的细胞才含叶绿体，根和茎内部的薄壁细胞以及花瓣表皮细胞等不含叶绿体，不能进行光合作用；含白色体或有色体的细胞同样不能光合。该陈述以偏概全，故错误。","tag":"细胞与组织"},{"id":"botany-b061","type":"judge","stage":1,"stem":"胡萝卜的肉质直根、萝卜的肉质直根和甘薯的块根都属于根的变态。","options":["正确","错误"],"answer":[0],"explain":"胡萝卜和萝卜的肉质直根由主根膨大而成，甘薯的块根由侧根或不定根膨大形成，三者都属根的变态，故陈述正确。马铃薯的块茎、莲藕的根状茎则由茎变态而来，要注意与根的变态相区分。","tag":"营养器官"},{"id":"botany-b071","type":"judge","stage":1,"stem":"所有被子植物的种子成熟后都具有胚乳。","options":["正确","错误"],"answer":[1],"explain":"小麦、玉米等有胚乳种子的胚乳贮存大量营养，但大豆、花生等无胚乳种子的胚乳在发育过程中被胚吸收，营养贮存在子叶中。因此并非所有被子植物的种子都具有胚乳，该陈述错误。","tag":"生殖器官"},{"id":"botany-b074","type":"judge","stage":1,"stem":"花药成熟开裂散出花粉粒，花粉粒落到柱头上的过程称为传粉。","options":["正确","错误"],"answer":[0],"explain":"花药成熟后开裂散出花粉粒，花粉借助风、昆虫等落到柱头上，这一过程就是传粉，故陈述正确。若花粉落到同一朵花的柱头上为自花传粉，落到另一朵花上则为异花传粉，二者都是传粉的方式。","tag":"生殖器官"},{"id":"botany-b082","type":"judge","stage":1,"stem":"植物在白天进行光合作用，夜间进行呼吸作用，白天不进行呼吸作用。","options":["正确","错误"],"answer":[1],"explain":"呼吸作用是活细胞时刻进行的生命活动，白天和夜间都在进行，只是白天光合作用强度通常大于呼吸作用，从外观上看不出释放二氧化碳。因此该陈述错误，正确表述是两种过程在白天同时进行。","tag":"生理"},{"id":"botany-b087","type":"judge","stage":1,"stem":"植物体内水分向上运输的主要通道是木质部中的导管和管胞。","options":["正确","错误"],"answer":[0],"explain":"水分和无机盐主要在木质部中通过导管（被子植物）和管胞（裸子植物）向上运输，二者是主要的纵向输导通道，故陈述正确。韧皮部中的筛管主要运输有机物，不能承担大量水分上升的任务。","tag":"生理"},{"id":"botany-b090","type":"judge","stage":1,"stem":"植物激素由专门的腺体分泌，并通过导管运输到作用部位。","options":["正确","错误"],"answer":[1],"explain":"植物激素由植物体一定部位的细胞产生，没有专门的内分泌腺，运输通过韧皮部、木质部或细胞间扩散进行，并在特定部位以极低浓度发挥作用，因此该陈述错误。","tag":"生理"},{"id":"botany-b098","type":"judge","stage":1,"stem":"植物细胞中的液泡、质体、线粒体等细胞器都分布在细胞质基质中，细胞质基质为它们提供代谢环境。","options":["正确","错误"],"answer":[0],"explain":"细胞质包括细胞质基质和各种细胞器，液泡、质体、线粒体等均悬浮于基质中。基质含有水分、离子和多种酶，为细胞器提供代谢环境并参与多种代谢反应，因此该陈述正确。","tag":"细胞与组织"},{"id":"botany-b108","type":"judge","stage":1,"stem":"直根系植物主根发达，移栽时伤根后恢复较慢，因此一般不如须根系植物容易移栽成活。","options":["正确","错误"],"answer":[0],"explain":"直根系主根明显、侧根相对较少，起苗时主根易被切断，再生能力较弱，缓苗慢；须根系由大量粗细相近的不定根组成，伤根后恢复快，移栽更易成活。该陈述符合生产实际，正确。","tag":"营养器官"},{"id":"botany-b109","type":"judge","stage":1,"stem":"禾本科植物的茎中，维管束排列成环状，并且具有形成层。","options":["正确","错误"],"answer":[1],"explain":"禾本科植物茎中维管束散生，分布于基本组织中，且维管束内没有形成层，不能进行次生增粗生长；维管束成环状排列并具形成层是双子叶植物茎的典型特征。故该陈述错误。","tag":"营养器官"},{"id":"botany-b110","type":"judge","stage":1,"stem":"同一枝条上每个节只生一片叶，相邻两节的叶交互排列，这种叶序称为对生叶序。","options":["正确","错误"],"answer":[1],"explain":"这种叶序是互生叶序，如棉花、桃；对生叶序是每个节生两片叶、相对排列，如丁香、薄荷；轮生叶序是每个节生三片或三片以上叶，如夹竹桃。故该陈述错误。","tag":"营养器官"},{"id":"botany-b118","type":"judge","stage":1,"stem":"雌花和雄花着生在同一植株上的植物称为雌雄同株。","options":["正确","错误"],"answer":[0],"explain":"雌雄同株指同一植株上同时具有雌花和雄花，如玉米、黄瓜；雌雄异株则是雌花和雄花分别着生在不同植株上，如杨、柳。该陈述正确。","tag":"生殖器官"},{"id":"botany-b119","type":"judge","stage":1,"stem":"花粉粒落到柱头上后，柱头分泌的黏液有利于花粉粒萌发。","options":["正确","错误"],"answer":[0],"explain":"柱头表面的乳突细胞能分泌黏液，可黏附花粉，并提供花粉萌发所需的水分和营养物质，促进花粉管生长。因此柱头黏液对花粉萌发有促进作用，该陈述正确。","tag":"生殖器官"},{"id":"botany-b133","type":"judge","stage":1,"stem":"光合作用的暗反应必须在黑暗条件下才能进行。","options":["正确","错误"],"answer":[1],"explain":"暗反应不直接需要光，但并非只能在黑暗中进行，有光时同样可以正常进行，只是不直接利用光能。暗反应利用光反应产生的ATP和NADPH还原C3，因此该陈述错误。","tag":"生理"},{"id":"botany-b134","type":"judge","stage":1,"stem":"种子萌发时，细胞呼吸释放的能量大部分储存在ATP中，只有少部分以热能形式散失。","options":["正确","错误"],"answer":[1],"explain":"细胞呼吸释放的能量中只有一部分转移到ATP中供生命活动利用，大部分以热能形式散失，用于维持体温等。大部分储存在ATP中的说法与事实相反，故该陈述错误。","tag":"生理"},{"id":"botany-b135","type":"judge","stage":1,"stem":"植物体内的矿质元素只能由根系从土壤中吸收，叶片不能吸收矿质元素。","options":["正确","错误"],"answer":[1],"explain":"植物主要通过根系吸收矿质元素，但叶片也能吸收溶于水中的矿质养分，生产上可用叶面喷施（根外追肥）补充养分，尤其在根系吸收受阻时效果明显。故该陈述错误。","tag":"生理"},{"id":"botany-i001","type":"single","stage":2,"stem":"关于植物细胞的初生壁与次生壁，下列叙述正确的是","options":["初生壁较厚，主要由纤维素和木质素组成","次生壁在细胞停止生长后沉积于初生壁内侧，常含木质素","初生壁仅在细胞分裂末期形成于细胞板的位置","次生壁可塑性大，能使细胞继续伸长"],"answer":[1],"explain":"次生壁是细胞停止生长后沉积在初生壁内侧的壁层，常木质化以增强机械支持，B正确。初生壁薄而可塑，允许细胞伸长，A、D把二者说反；初生壁在细胞生长过程中持续沉积，并非只在细胞板处形成，C错。","tag":"细胞与组织"},{"id":"botany-i002","type":"single","stage":2,"stem":"镜检某植物组织切片，见细胞壁明显次生加厚并木质化，成熟细胞中已无原生质体，该组织最可能是","options":["厚角组织","薄壁组织","厚壁组织","分泌组织"],"answer":[2],"explain":"厚壁组织细胞壁次生加厚并木质化，成熟时原生质体消失成为死细胞，符合题意。厚角组织细胞壁仅角隅加厚、不木质化且为生活细胞，A错；薄壁组织细胞壁薄且为生活细胞，B错；分泌组织与木质化死细胞无关，D错。","tag":"细胞与组织"},{"id":"botany-i003","type":"single","stage":2,"stem":"小叶脉和分泌结构附近常见传递细胞，其结构特点是","options":["细胞壁向细胞内形成许多指状突起，质膜表面积增大，利于短途运输","细胞壁均匀次生加厚并木质化，主要起机械支持作用","细胞质稀薄、液泡大，代谢活动弱","仅存在于茎的皮层中，与水分长距离运输有关"],"answer":[0],"explain":"传递细胞以壁内突扩大质膜表面积，利于溶质在细胞间的短途运输，A正确。其细胞质浓、代谢旺盛，C说反；壁内突并不木质化，也不承担支持功能，B错；传递细胞还见于分泌结构等多种部位，D过窄。","tag":"细胞与组织"},{"id":"botany-i004","type":"single","stage":2,"stem":"禾本科植物与双子叶植物的气孔器相比，主要差别在于","options":["禾本科植物保卫细胞呈肾形，双子叶植物呈哑铃形","禾本科植物保卫细胞呈哑铃形且两侧有副卫细胞，双子叶植物多呈肾形","两者保卫细胞形状相同，且都没有副卫细胞","禾本科植物气孔没有保卫细胞，仅由副卫细胞构成"],"answer":[1],"explain":"禾本科植物保卫细胞呈哑铃形，中部狭窄、两端膨大，两侧常有副卫细胞；双子叶植物多为肾形，B正确。A把二者颠倒；副卫细胞并非不存在，C错；气孔必须由保卫细胞围成，D错。","tag":"细胞与组织"},{"id":"botany-i005","type":"single","stage":2,"stem":"筛管分子在结构与功能上的适应性表现为","options":["成熟时保留完整的细胞核和大量细胞器，可独立完成运输","细胞壁高度木质化，以减小运输阻力","端壁完全消失形成贯通的管道，与导管相同","成熟时细胞核消失，端壁分化出筛板，依靠伴胞提供代谢支持"],"answer":[3],"explain":"筛管分子成熟时细胞核消失，端壁分化为筛板，依靠伴胞提供能量与物质，D正确。A错在保留细胞核并能独立运输；筛管壁为初生壁、不木质化，B错；端壁仍具筛孔，与导管不同，C错。","tag":"细胞与组织"},{"id":"botany-i011","type":"single","stage":2,"stem":"与成熟区相比，根尖伸长区细胞的主要特点是","options":["细胞小、排列紧密，液泡不明显","细胞已停止伸长并分化出根毛","细胞迅速伸长、液泡化明显，是根生长最快的部位","细胞壁木质化并形成凯氏带"],"answer":[2],"explain":"伸长区细胞已停止分裂，体积迅速增大并液泡化，是根生长最快的部位，C正确。细胞小、排列紧密的是分生区，A错；已分化出根毛的是成熟区，B错；凯氏带出现在成熟区内皮层，D错。","tag":"营养器官"},{"id":"botany-i012","type":"single","stage":2,"stem":"双子叶植物侧根的发生部位是","options":["根毛区表皮细胞","内皮层细胞","根冠细胞","中柱鞘细胞"],"answer":[3],"explain":"侧根由中柱鞘一定部位的细胞恢复分裂能力形成，属内起源，D正确。表皮细胞只形成根毛，A错；内皮层与根冠不产生侧根，B、C错。","tag":"营养器官"},{"id":"botany-i013","type":"single","stage":2,"stem":"双子叶植物茎与单子叶植物茎的初生结构相比，主要区别是","options":["双子叶植物茎维管束排列成环，且具维管形成层","双子叶植物茎维管束散生，且无维管形成层","单子叶植物茎维管束排列成环，且具维管形成层","两者维管束的排列方式完全相同"],"answer":[0],"explain":"双子叶植物茎维管束排列成环，束间存在维管形成层，可次生增粗，A正确。散生、无形成层是单子叶植物茎的特点，B、C说反；两者排列方式明显不同，D错。","tag":"营养器官"},{"id":"botany-i014","type":"single","stage":2,"stem":"双子叶木本植物茎增粗时，维管形成层向内、向外分裂分别产生","options":["次生韧皮部、次生木质部","次生木质部、次生韧皮部","初生木质部、初生韧皮部","木栓层、栓内层"],"answer":[1],"explain":"维管形成层向外分裂产生次生韧皮部，向内产生次生木质部，且次生木质部数量大，是木材的主要部分，B正确。A把内外产物颠倒；初生组织由原形成层产生，C错；木栓层由木栓形成层产生，D错。","tag":"营养器官"},{"id":"botany-i015","type":"single","stage":2,"stem":"叶肉中栅栏组织与海绵组织的比较，正确的是","options":["栅栏组织细胞形状不规则、间隙大，利于气体扩散","海绵组织紧靠上表皮，含叶绿体最多","栅栏组织细胞呈长柱形、排列整齐，含叶绿体较多","阴生叶的栅栏组织比阳生叶更发达"],"answer":[2],"explain":"栅栏组织细胞呈长柱形、排列紧密，含叶绿体多，利于光能捕获，C正确。间隙大、形状不规则的是海绵组织，A把二者混淆；海绵组织靠近下表皮，B错；阴生叶栅栏组织不发达，D错。","tag":"营养器官"},{"id":"botany-i016","type":"single","stage":2,"stem":"下列各组器官中，全部属于茎的变态的是","options":["马铃薯的块茎、荸荠的球茎、莲的根状茎","甘薯的块根、萝卜的肉质直根、胡萝卜的肉质直根","豌豆的卷须、仙人掌的刺、皂荚的刺","洋葱的鳞叶、玉米的叶鞘"],"answer":[0],"explain":"马铃薯块茎、荸荠球茎、莲的根状茎都由茎变态而来，A正确。B中甘薯块根、萝卜与胡萝卜的肉质直根均为根的变态；C中豌豆卷须、仙人掌刺为叶的变态；D中鳞叶、叶鞘属叶，均不符合。","tag":"营养器官"},{"id":"botany-i017","type":"single","stage":2,"stem":"叶片脱落时，叶柄基部形成离层的意义是","options":["使叶片与茎之间的输导组织连接更紧密","促进叶片继续生长，扩大光合面积","使叶片自然脱落并保护伤口，日后留下叶痕","使茎的导管封闭，阻止水分向上运输"],"answer":[2],"explain":"离层细胞中层解体、细胞彼此分离，使叶片自然脱落，断面形成的保护层即叶痕，C正确。离层使输导联系中断而非更紧密，A错；落叶是衰老表现，B错；离层与茎导管封闭无关，D错。","tag":"营养器官"},{"id":"botany-i022","type":"single","stage":2,"stem":"下列植物中，花为单性花的是","options":["小麦","玉米","油菜","豌豆"],"answer":[1],"explain":"玉米雌雄同株异花，雄花序生于顶端、雌花序生于叶腋，每朵花只有一种花蕊，属单性花，B正确。小麦、油菜、豌豆的花中雄蕊与雌蕊并存，均为两性花，A、C、D错。","tag":"生殖器官"},{"id":"botany-i023","type":"single","stage":2,"stem":"花药壁由外向内依次为表皮、药室内壁、中层和绒毡层，其中为花粉发育提供营养的是","options":["表皮","药室内壁","中层","绒毡层"],"answer":[3],"explain":"绒毡层位于花药壁最内层，细胞质浓、代谢旺盛，为花粉粒发育提供营养，D正确。表皮主要起保护作用，A错；药室内壁与花药开裂有关，B错；中层在发育早期即退化，C错。","tag":"生殖器官"},{"id":"botany-i024","type":"single","stage":2,"stem":"被子植物种子形成过程中，各部分发育的来源是","options":["珠被发育为果皮，子房壁发育为种皮","受精卵发育为胚乳，受精极核发育为胚","胚珠发育为果实，子房发育为种子","珠被发育为种皮，受精卵发育为胚，受精极核发育为胚乳"],"answer":[3],"explain":"珠被发育为种皮，受精卵发育为胚，受精极核发育为胚乳，D正确。果皮由子房壁发育，A把二者混淆；B、C把胚与胚乳、果实与种子的来源颠倒。","tag":"生殖器官"},{"id":"botany-i025","type":"single","stage":2,"stem":"关于双子叶植物无胚乳种子的形成，下列叙述正确的是","options":["胚乳在发育中被胚吸收，营养物质储存在子叶中，如大豆、花生","无胚乳种子不经过双受精，因而不形成胚乳","无胚乳种子的营养物质主要储存在胚轴中","无胚乳种子由珠心直接发育而成"],"answer":[0],"explain":"无胚乳种子在发育过程中胚乳被胚吸收，养分转入子叶，如大豆、花生，A正确。无胚乳种子同样经过双受精，B错；养分主要储于子叶而非胚轴，C错；种子由胚珠发育，D错。","tag":"生殖器官"},{"id":"botany-i026","type":"single","stage":2,"stem":"下列果实中，属于聚合果的是","options":["苹果","草莓","梨","番茄"],"answer":[1],"explain":"草莓由一朵花中多个离生雌蕊形成多个小瘦果，聚生于膨大的花托上，属聚合果，B正确。苹果、梨为梨果（假果），番茄为浆果，三者均由单雌蕊或合生雌蕊发育为单果，A、C、D错。","tag":"生殖器官"},{"id":"botany-i027","type":"single","stage":2,"stem":"蓼型胚囊发育成熟时，所含的细胞数目是","options":["4个","6个","7个","8个"],"answer":[2],"explain":"蓼型胚囊成熟时含8个核、7个细胞，即3个反足细胞、1个中央细胞（含2个极核）、2个助细胞和1个卵细胞，C正确。A、B、D的数目与此不符。","tag":"生殖器官"},{"id":"botany-i031","type":"single","stage":2,"stem":"与C3植物相比，C4植物光合作用的特点是","options":["最初固定CO2的产物为草酰乙酸等四碳化合物，光呼吸较弱","最初固定CO2的产物为3-磷酸甘油酸，光呼吸强","只在夜间固定CO2，白天再释放","维管束鞘细胞不含叶绿体，不能进行卡尔文循环"],"answer":[0],"explain":"C4植物由PEP羧化酶先固定CO2生成草酰乙酸等四碳化合物，再在维管束鞘细胞中脱羧，光呼吸弱，A正确。B描述的是C3植物；夜间固定CO2的是CAM植物，C错；C4植物维管束鞘细胞含叶绿体，D错。","tag":"生理"},{"id":"botany-i032","type":"single","stage":2,"stem":"CAM植物与C4植物都能浓缩CO2以降低光呼吸，二者的主要区别是","options":["两者都只在夜间固定CO2，白天不进行任何固定","CAM植物在空间上分隔，C4植物在时间上分隔","C4植物在空间上分隔CO2固定与卡尔文循环，CAM植物在时间上分隔","两者都不进行卡尔文循环，只进行光反应"],"answer":[2],"explain":"C4植物由叶肉细胞固定CO2、维管束鞘细胞完成卡尔文循环，属空间分隔；CAM植物夜间固定、白天脱羧，属时间分隔，C正确。A过于绝对，B把二者机制颠倒，D否认卡尔文循环。","tag":"生理"},{"id":"botany-i033","type":"single","stage":2,"stem":"植物缺水时气孔关闭以减少水分散失，此时光合速率下降的直接原因是","options":["叶绿素被迅速破坏","气孔关闭使胞间CO2浓度下降，暗反应受抑","根系吸收矿质元素减少","呼吸作用显著加强"],"answer":[1],"explain":"缺水时保卫细胞失水、气孔关闭，胞间CO2浓度下降，暗反应受抑，光合速率随之下降，B正确。此时叶绿素并未被破坏，A错；吸矿质减少不是直接原因，C错；呼吸加强也不是主要直接原因，D错。","tag":"生理"},{"id":"botany-i034","type":"single","stage":2,"stem":"当细胞液的水势与外界溶液的水势相等时，该植物细胞将","options":["继续吸水直至膨压达到最大","开始发生质壁分离","失去膨压而萎蔫","达到水分动态平衡，净吸水量为零"],"answer":[3],"explain":"细胞水势由渗透势与压力势决定，当细胞液与外界溶液水势相等时，水分进出达到动态平衡，净吸水量为零，D正确。此时不会继续吸水，A错；外界水势更低才发生质壁分离，B错；细胞并未失水萎蔫，C错。","tag":"生理"},{"id":"botany-i035","type":"single","stage":2,"stem":"将植物细胞置于0.3 mol/L蔗糖溶液中，细胞发生质壁分离，其原因是","options":["外界溶液浓度小于细胞液浓度，细胞吸水","蔗糖分子进入细胞，使细胞液浓度升高","细胞壁对蔗糖不通透，水分子无法通过","外界溶液浓度大于细胞液浓度，细胞失水"],"answer":[3],"explain":"0.3 mol/L蔗糖溶液浓度高于细胞液，细胞失水，原生质体收缩并与细胞壁分离，即质壁分离，D正确。A把浓度关系说反；蔗糖分子不能自由透过质膜，B错；细胞壁对水和蔗糖均可透，C错。","tag":"生理"},{"id":"botany-i036","type":"single","stage":2,"stem":"植物缺铁时往往幼叶脉间失绿黄化而老叶基本正常，主要原因是","options":["铁在植物体内不易移动，不能被再利用","铁在体内移动性强，优先供应幼叶","老叶不需要铁参与叶绿素合成","缺铁只影响根系吸水，与叶片无关"],"answer":[0],"explain":"铁在植物体内移动性差，缺铁时老叶中的铁不能转运至幼叶，幼叶叶绿素合成受阻而黄化，A正确。B把移动性说反；老叶同样需铁合成叶绿素，C错；缺铁主要表现于叶片，D错。","tag":"生理"},{"id":"botany-i037","type":"single","stage":2,"stem":"关于根系吸收水分与吸收矿质元素的关系，下列叙述正确的是","options":["两者完全同步，吸收比例恒定","矿质元素只能被动进入细胞，不消耗能量","叶片不能吸收矿质元素","两者是相对独立的过程，吸收矿质以主动吸收为主"],"answer":[3],"explain":"根系吸水主要靠蒸腾拉力与根压，吸收矿质则以主动吸收为主，二者相对独立，D正确。两者并不同步，A错；矿质吸收需消耗能量，B错；叶片也可吸收矿质，如叶面施肥，C错。","tag":"生理"},{"id":"botany-i038","type":"single","stage":2,"stem":"关于植物体内同化物的运输与分配，下列叙述正确的是","options":["同化物主要经木质部导管由下向上运输","同化物运输方向总是由下向上","同化物主要经韧皮部筛管运输，优先供应生长旺盛的库器官","同化物在筛管中运输不消耗能量"],"answer":[2],"explain":"同化物主要经韧皮部筛管运输，优先供应生长旺盛的库器官，C正确。木质部运输的是水分和无机盐，A错；韧皮部运输由源到库，可向上也可向下，B错；筛管运输为主动过程，需消耗能量，D错。","tag":"生理"},{"id":"botany-i039","type":"single","stage":2,"stem":"用适宜浓度生长素类似物处理番茄花蕾可防止落花落果，而用高浓度处理则能杀死双子叶杂草，这说明生长素的作用","options":["具有两重性，低浓度促进生长，高浓度抑制生长","只促进生长，浓度越高效果越好","只抑制生长，与浓度无关","高浓度促进、低浓度抑制"],"answer":[0],"explain":"低浓度生长素防止落花落果，高浓度抑制生长甚至杀死植物，可作除草剂，体现两重性，A正确。B、C否认抑制作用；D把浓度与效应的关系颠倒。","tag":"生理"},{"id":"botany-i040","type":"single","stage":2,"stem":"用适宜浓度的生长素类似物处理未受粉的番茄花蕾，可获得无子果实，其原理是","options":["促进花粉萌发和受精","促进子房发育成果实","抑制种子形成从而阻止受精","促进果实成熟和脱落"],"answer":[1],"explain":"生长素能促进子房发育成果实；未受粉时子房本身不能发育，外源生长素可代替种子产生的生长素，使子房膨大形成无子果实，并非促进受精或抑制种子形成。","tag":"生理"},{"id":"botany-i041","type":"single","stage":2,"stem":"将短日植物菊花置于临界日长以上的长日照条件下，其结果是","options":["提前开花","延迟开花或不能开花","开花不受影响","只进行营养生长但根系停止生长"],"answer":[1],"explain":"短日植物需日照短于临界日长才能开花，置于长日照下会延迟开花或不能开花，B正确。提前开花需短日照条件，A错；光周期是成花的关键条件，C错；D中根系停止生长无依据。","tag":"生理"},{"id":"botany-i042","type":"single","stage":2,"stem":"禾谷类种子萌发时，胚乳中贮藏的淀粉被水解供胚利用，水解酶活性升高的直接原因是","options":["种子吸水后，胚分泌赤霉素诱导糊粉层合成并分泌水解酶","淀粉吸水后自发分解，不需要酶参与","光照直接激活了水解酶","低温使水解酶活性升高"],"answer":[0],"explain":"禾谷类种子吸水后，胚分泌赤霉素，诱导糊粉层合成并分泌α-淀粉酶等水解酶，分解胚乳养分，A正确。淀粉不能自发水解，B错；水解酶由激素诱导而非光照直接激活，C错；低温降低酶活性，D错。","tag":"生理"},{"id":"botany-i048","type":"single","stage":2,"stem":"将紫色洋葱表皮细胞放入0.3 g/mL蔗糖溶液中，细胞发生质壁分离的直接原因是","options":["细胞壁收缩性强于原生质体","蔗糖分子进入细胞液使浓度升高","原生质体失水收缩的幅度大于细胞壁","细胞壁对蔗糖完全不通透且不伸缩"],"answer":[2],"explain":"质壁分离是原生质体失水收缩幅度大于细胞壁所致，细胞壁伸缩性小但并非不伸缩，蔗糖分子也不易透过原生质层进入细胞液，故只有C项正确。","tag":"细胞与组织"},{"id":"botany-i049","type":"single","stage":2,"stem":"若要统计植物细胞有丝分裂各时期的细胞比例，最适宜选用的材料及观察部位是","options":["洋葱根尖分生区，细胞呈方形、排列紧密","洋葱鳞片叶表皮，细胞大、液泡明显","菠菜叶肉，叶绿体多便于计数","豌豆茎皮层，细胞已高度伸长"],"answer":[0],"explain":"分生区细胞分裂旺盛、排列紧密且近似方形，最适合统计分裂期细胞比例；叶表皮和叶肉细胞已高度分化不再分裂，茎皮层细胞伸长后也失去分裂能力。","tag":"细胞与组织"},{"id":"botany-i050","type":"single","stage":2,"stem":"关于木纤维与韧皮纤维的比较，下列叙述正确的是","options":["韧皮纤维壁未木质化，细胞腔大，主要运输有机物","木纤维壁厚且木质化，质地坚硬，主要起抗压支持作用","木纤维细胞腔大、壁薄，兼有贮藏养分的功能","韧皮纤维是活细胞，能不断分裂产生新细胞"],"answer":[1],"explain":"木纤维壁厚、木质化程度高而坚硬，是重要的抗压机械组织；韧皮纤维木化低、富弹性，主要抗拉，运输有机物是筛管的功能，纤维成熟后为死细胞。","tag":"细胞与组织"},{"id":"botany-i051","type":"single","stage":2,"stem":"许多植物叶片的表皮细胞中可见针状或簇状结晶，这些结晶的化学成分及形成意义是","options":["碳酸钙结晶，参与细胞壁的加厚","蛋白质结晶，是种子贮藏的养料","淀粉粒，是光合产物的临时贮藏形式","草酸钙结晶，是代谢废物在细胞内的积累形式"],"answer":[3],"explain":"草酸钙结晶由细胞代谢产生的草酸与钙结合而成，常积累在液泡中，属代谢废物的积累形式；碳酸钙结晶多见于钟乳体，蛋白质结晶和淀粉粒均为贮藏物质。","tag":"细胞与组织"},{"id":"botany-i052","type":"single","stage":2,"stem":"下列各组细胞中，均属于输导组织且成熟时仍为活细胞的是","options":["导管分子和管胞","木纤维和韧皮纤维","筛管分子和伴胞","薄壁细胞和厚角细胞"],"answer":[2],"explain":"筛管分子成熟时无细胞核但仍是活细胞，伴胞也生活并为其提供代谢支持；导管分子和管胞成熟后为死细胞，纤维属机械组织，厚角细胞属基本组织。","tag":"细胞与组织"},{"id":"botany-i053","type":"single","stage":2,"stem":"双子叶植物茎中，维管形成层细胞分裂后，向外形成的组织主要是","options":["木质部","周皮","髓","韧皮部"],"answer":[3],"explain":"维管形成层向外分裂产生次生韧皮部、向内产生次生木质部，使茎逐年增粗；周皮由木栓形成层产生，髓属基本组织，均不是维管形成层向外的产物。","tag":"细胞与组织"},{"id":"botany-i057","type":"single","stage":2,"stem":"小麦由胚根发育成的根与从茎基部长出的根，在发生来源上分别属于","options":["主根和不定根","主根和侧根","侧根和不定根","不定根和侧根"],"answer":[0],"explain":"由胚根直接发育而成的是主根，从茎、叶等非根部位发生的是不定根；侧根由根内部中柱鞘等细胞分裂产生，与题干两类根来源不同，故其余选项不符。","tag":"营养器官"},{"id":"botany-i058","type":"single","stage":2,"stem":"与双子叶植物茎相比，玉米茎维管束的排列特点及其对支持的意义是","options":["排列成环，靠形成层不断增粗","集中于中央髓部，靠髓细胞贮水支持","散生于基本组织中，靠机械组织增强支持","仅分布于皮层，靠表皮毛增强支持"],"answer":[2],"explain":"玉米等单子叶植物茎的维管束散生于基本组织中，无形成层不能增粗，靠维管束鞘及周围厚壁组织增强支持；排列成环并具形成层是双子叶植物茎的特点。","tag":"营养器官"},{"id":"botany-i059","type":"single","stage":2,"stem":"与阳生植物相比，阴生植物叶片的结构通常表现为","options":["叶片较厚，栅栏组织发达，气孔密度大","叶片较薄，栅栏组织不发达，叶肉细胞间隙较大","角质层厚，叶脉密集，机械组织发达","海绵组织退化，叶肉全部由栅栏组织构成"],"answer":[1],"explain":"阴生植物长期适应弱光，叶片薄、栅栏组织不发达、细胞间隙大，利于在低光强下捕获光能；叶片厚、栅栏组织发达、角质层厚是阳生植物适应强光的特征。","tag":"营养器官"},{"id":"botany-i060","type":"single","stage":2,"stem":"下列各组变态器官中，均由茎变态而来的一组是","options":["甘薯块根、胡萝卜肉质直根、萝卜贮藏根","豌豆卷须、南瓜茎卷须、皂荚茎刺","马铃薯块茎、莲藕根状茎、洋葱鳞茎","荸荠球茎、百合鳞茎、常春藤不定根"],"answer":[2],"explain":"块茎、根状茎和鳞茎都是茎的变态，具有节和芽；甘薯块根、胡萝卜肉质直根为根变态，豌豆卷须由小叶变态而来，故其余各组都混有根或叶的变态器官。","tag":"营养器官"},{"id":"botany-i061","type":"single","stage":2,"stem":"双子叶植物根进行次生生长时，木栓形成层通常起源于","options":["表皮","皮层","内皮层","中柱鞘"],"answer":[3],"explain":"双子叶植物根的木栓形成层多由中柱鞘细胞恢复分裂形成，向外产生木栓层、向内产生栓内层而构成周皮；表皮和皮层在次生生长中被挤毁，内皮层不是其来源。","tag":"营养器官"},{"id":"botany-i062","type":"single","stage":2,"stem":"木本植物茎表面皮孔的形成部位及其主要功能是","options":["由木栓形成层产生的补充组织形成，用于气体交换","由气孔分化而来，用于排出多余水分","由维管形成层产生，用于运输有机物","由表皮细胞直接形成，用于贮藏养料"],"answer":[0],"explain":"皮孔由木栓形成层产生的补充组织形成，细胞排列疏松，是周皮形成后茎与外界进行气体交换的通道；气孔位于表皮，维管形成层产生次生维管组织，均与皮孔无关。","tag":"营养器官"},{"id":"botany-i063","type":"single","stage":2,"stem":"温带落叶树秋季落叶的直接原因是","options":["叶片光合作用停止，叶绿素分解","根系吸水减少，叶片失水干枯","叶柄基部离层细胞解体，使叶片与茎分离","木质部导管被侵填体堵塞"],"answer":[2],"explain":"落叶的直接原因是叶柄基部离层细胞的中层溶解、细胞解体，使叶片与茎分离；叶绿素分解只使叶片变黄，失水干枯和导管堵塞都不是脱落发生的直接机制。","tag":"营养器官"},{"id":"botany-i068","type":"single","stage":2,"stem":"花程式↑K(5)C5A(9)+1G1所表示的花，最可能所属的科及花冠、雄蕊类型是","options":["十字花科，十字形花冠、四强雄蕊","豆科，蝶形花冠、二体雄蕊","菊科，管状花、聚药雄蕊","禾本科，外稃内稃、浆片"],"answer":[1],"explain":"该花程式表示花两侧对称、萼片5枚合生、蝶形花冠、雄蕊10枚成9+1二体、子房上位单心皮，为豆科蝶形花亚科特征；十字花科为四强雄蕊，菊科为聚药雄蕊。","tag":"生殖器官"},{"id":"botany-i069","type":"single","stage":2,"stem":"下列植物与其花序类型的对应，正确的是","options":["向日葵——总状花序","小麦——头状花序","玉米雄穗——伞形花序","胡萝卜——复伞形花序"],"answer":[3],"explain":"胡萝卜为复伞形花序，由多个伞形花序组成；向日葵为头状花序，小麦为复穗状花序，玉米雄穗为圆锥花序，故其余对应均错误。","tag":"生殖器官"},{"id":"botany-i070","type":"single","stage":2,"stem":"被子植物胚珠的珠心内，一个大孢子母细胞经减数分裂形成四个大孢子，其中通常发育为胚囊的是","options":["靠近珠孔的其中一个","合点端的三个","靠近合点的其中一个","全部四个"],"answer":[2],"explain":"蓼型胚囊中，四个大孢子通常只有靠近合点端的一个发育为胚囊，珠孔端三个退化；说靠近珠孔端的一个发育与事实相反，全部四个发育也不成立。","tag":"生殖器官"},{"id":"botany-i071","type":"single","stage":2,"stem":"桃的果肉、核桃的硬壳、蚕豆的种皮分别由什么结构发育而来","options":["子房壁、珠被、受精卵","子房壁、子房壁、珠被","珠被、子房壁、珠被","胚乳、子房壁、珠被"],"answer":[1],"explain":"桃的果肉由子房壁发育，核桃硬壳为内果皮即子房壁硬化而成，种皮由珠被发育；受精卵发育为胚，胚乳来自受精极核，故其余选项混淆了发育来源。","tag":"生殖器官"},{"id":"botany-i072","type":"single","stage":2,"stem":"大豆与豌豆种子萌发时，子叶是否出土及其原因是","options":["大豆子叶出土，因为下胚轴伸长","大豆子叶留土，因为上胚轴伸长","豌豆子叶出土，因为上胚轴伸长","两者子叶均留土，因为胚轴不伸长"],"answer":[0],"explain":"大豆下胚轴明显伸长，把子叶和胚芽顶出土面，属子叶出土萌发；豌豆上胚轴伸长而下胚轴不伸长，子叶留在土中，故只有第一项正确。","tag":"生殖器官"},{"id":"botany-i073","type":"single","stage":2,"stem":"下列果实类型中，属于成熟时果皮开裂的干果的一组是","options":["颖果、瘦果、坚果","核果、梨果、瓠果","荚果、颖果、翅果","荚果、角果、蒴果"],"answer":[3],"explain":"荚果、角果和蒴果成熟时果皮开裂散出种子，属裂果；颖果、瘦果、坚果和翅果果皮均不开裂，核果、梨果、瓠果为肉果，故只有最后一组全为开裂干果。","tag":"生殖器官"},{"id":"botany-i078","type":"single","stage":2,"stem":"油菜在花期出现“花而不实”，同时生长点坏死，最可能缺乏的元素是","options":["铁","钾","硼","镁"],"answer":[2],"explain":"硼参与花粉萌发和糖类运输，缺硼时油菜等出现花而不实、生长点坏死；缺铁使新叶脉间失绿，缺钾使老叶边缘焦枯，缺镁使老叶脉间失绿，均与题干症状不符。","tag":"生理"},{"id":"botany-i079","type":"single","stage":2,"stem":"将植物细胞放入水势比其细胞液更低的溶液中，细胞将","options":["吸水膨胀","失水发生质壁分离","保持体积不变","主动吸收溶质"],"answer":[1],"explain":"外界溶液水势低于细胞液水势时细胞失水，原生质体收缩程度大于细胞壁而发生质壁分离；吸水膨胀需外界水势高于细胞液，体积不变和主动吸溶质均不符合渗透规律。","tag":"生理"},{"id":"botany-i080","type":"single","stage":2,"stem":"夏季晴天中午，某些植物叶片气孔关闭、蒸腾减弱，同时光合速率也明显下降，其主要原因是","options":["气孔关闭导致二氧化碳供应不足","光照过强直接抑制光反应","叶温过高使暗反应酶失活","土壤水分过多抑制根系呼吸"],"answer":[0],"explain":"夏季中午气孔关闭以减少水分散失，但二氧化碳进入受阻，暗反应原料不足使光合速率下降，这一现象称光合午休；光照过强、叶温过高和水分过多都不是主要原因。","tag":"生理"},{"id":"botany-i081","type":"single","stage":2,"stem":"与C3植物相比，C4植物在高温强光下光合效率较高的主要原因是","options":["叶绿体大而多，光反应产生的ATP多","气孔白天关闭，水分利用效率较高","有PEP羧化酶固定二氧化碳，维管束鞘内二氧化碳浓度高、光呼吸弱","不进行卡尔文循环，直接合成糖类"],"answer":[2],"explain":"C4植物由PEP羧化酶在叶肉细胞固定二氧化碳，四碳化合物运至维管束鞘释放二氧化碳，使鞘内浓度高、光呼吸弱，故高温强光下效率高；它同样进行卡尔文循环。","tag":"生理"},{"id":"botany-i082","type":"single","stage":2,"stem":"将燕麦胚芽鞘尖端切下放在琼脂块上，一段时间后把该琼脂块放在去尖胚芽鞘的一侧，幼苗将","options":["向放琼脂块的一侧弯曲","直立生长","不生长也不弯曲","向放琼脂块的对侧弯曲"],"answer":[3],"explain":"琼脂块收集了尖端产生的生长素，放在去尖胚芽鞘一侧后该侧生长素浓度高、细胞伸长快，幼苗向生长慢的对侧弯曲；向放琼脂块一侧弯曲方向恰好说反。","tag":"生理"},{"id":"botany-i083","type":"single","stage":2,"stem":"果树修剪中常通过短截、剪除顶芽来促发侧枝，其生理依据是","options":["解除顶端优势，降低侧芽处的生长素浓度","提高侧芽处的生长素浓度以促进萌发","增加赤霉素含量以抑制侧芽生长","减少细胞分裂素以促进侧芽萌发"],"answer":[0],"explain":"顶芽产生的生长素向下运输并在侧芽处积累，抑制侧芽萌发形成顶端优势；剪除顶芽可降低侧芽处生长素浓度、解除抑制而促发侧枝，与赤霉素和细胞分裂素无直接关系。","tag":"生理"},{"id":"botany-i084","type":"single","stage":2,"stem":"苹果贮藏过久会产生酒味，此时细胞进行的呼吸方式及其主要场所是","options":["无氧呼吸，细胞质基质","有氧呼吸，线粒体","有氧呼吸，细胞质基质","无氧呼吸，线粒体"],"answer":[0],"explain":"苹果长期贮藏后内部缺氧，细胞在细胞质基质中进行无氧呼吸产生乙醇，故有酒味；有氧呼吸在线粒体进行且不产生乙醇，其余选项对场所或类型的判断错误。","tag":"生理"},{"id":"botany-i085","type":"single","stage":2,"stem":"某些种子采收后即使给予适宜的水分和温度仍不萌发，经低温层积处理后即可萌发，其最可能的原因是","options":["种皮不透水，低温使种皮破裂","胚未完成生理成熟，低温促进了后熟","低温提高了种子的呼吸强度","低温杀死了种子表面的微生物"],"answer":[1],"explain":"这类种子的胚采收后尚未完成生理成熟，低温层积可促进后熟，使其具备萌发能力；种皮不透水属硬实，与低温处理无关，提高呼吸强度和杀死微生物都不是主要原因。","tag":"生理"},{"id":"botany-i086","type":"single","stage":2,"stem":"冬小麦秋播后需经一定时间的低温才能抽穗，若将萌动的冬小麦种子长期置于高温下而不经低温，其结果是","options":["提前抽穗","只长叶但根系逐渐死亡","种子不能萌发","不能正常抽穗"],"answer":[3],"explain":"冬性品种必须经过一定时间低温完成春化才能抽穗，未经低温则停留在营养生长阶段、不能正常抽穗；提前抽穗恰是满足春化后的表现，与种子能否萌发无关。","tag":"生理"},{"id":"botany-i087","type":"single","stage":2,"stem":"将生长旺盛的植株在茎基部切断，伤口处不断流出液滴，这一现象说明","options":["水分上升与蒸腾拉力完全无关","根压是水分在木质部上升的一种动力","木质部导管具有类似泵的功能","韧皮部是水分上升的主要通道"],"answer":[1],"explain":"切断茎后的伤流和叶尖吐水都由根压引起，说明根压是水分上升的动力之一；但不能据此否定蒸腾拉力的作用，导管本身无泵的功能，韧皮部也不运输水分。","tag":"生理"},{"id":"botany-s04","type":"single","stem":"一般情况下，保卫细胞吸水膨胀时，气孔的状态及原因是","options":["气孔关闭，保卫细胞体积减小","气孔关闭，保卫细胞膨压增大","气孔张开，保卫细胞失水变瘪","气孔张开，保卫细胞膨压增大"],"answer":[3],"explain":"保卫细胞吸水后膨压增大，由于靠气孔一侧的细胞壁较厚，细胞向外弯曲，使气孔张开；失水时膨压下降，气孔关闭。气孔开闭由保卫细胞膨压变化控制，说失水变瘪导致张开正好相反。","tag":"细胞与组织","level":2,"stage":2,"standard":true},{"id":"botany-s07","type":"single","stem":"双子叶植物根内皮层细胞径向壁和横向壁局部木化、栓质化加厚形成的凯氏带，其主要作用是","options":["增强根的机械支持力","阻断质外体途径，控制物质进入维管柱","促进根毛的形成","加快细胞分裂"],"answer":[1],"explain":"凯氏带位于内皮层细胞的径向壁和横向壁，木化栓质化后不透水，阻断了水和溶质沿细胞壁及细胞间隙的质外体运输，使物质必须经共质体途径进入维管柱，从而起选择性控制作用；它不承担主要支持或促进分裂的功能。","tag":"营养器官","level":2,"stage":2,"standard":true},{"id":"botany-s08","type":"single","stem":"温带地区木本植物茎中形成年轮，主要是由于","options":["木质部导管逐年增多","树皮每年脱落一层","形成层活动随季节变化，春材与秋材交替","髓射线逐年加宽"],"answer":[2],"explain":"形成层细胞春季分裂快、导管大而壁薄，形成颜色浅、材质疏松的春材；秋季分裂慢、导管小而壁厚，形成颜色深、材质致密的秋材。一年内春材与秋材合称一个年轮，与树皮脱落、髓射线加宽无直接对应关系。","tag":"营养器官","level":2,"stage":2,"standard":true},{"id":"botany-s10","type":"single","stem":"豌豆复叶上的卷须，其来源是","options":["叶（小叶）的变态","茎的变态","根的变态","托叶的变态"],"answer":[0],"explain":"豌豆复叶顶端的小叶变成卷须，属于叶的变态，用于攀援；马铃薯块茎上的芽眼则说明块茎是茎的变态。根变态常见为块根、肉质直根，托叶变态如菝葜的托叶卷须，与豌豆不同。","tag":"营养器官","level":2,"stage":2,"standard":true},{"id":"botany-s12","type":"single","stem":"我们食用的苹果果肉，主要由花的哪一部分发育而来","options":["花托","子房壁","胚珠","花柄"],"answer":[0],"explain":"苹果、梨的果实由子房和花托共同发育而成，食用部分主要是花托（花筒）膨大形成的果肉，属于假果；子房壁发育为果皮，胚珠发育为种子，花柄只起支持作用。","tag":"生殖器官","level":2,"stage":2,"standard":true},{"id":"botany-s16","type":"single","stem":"仙人掌等 CAM 植物在干旱环境中，气孔白天关闭、夜间开放，其主要意义是","options":["夜间吸收 CO2 同时减少白天水分散失","白天加强蒸腾散热","白天固定 CO2 效率更高","夜间进行光反应"],"answer":[0],"explain":"CAM 植物夜间气孔开放，吸收 CO2 并以苹果酸形式贮存在液泡中；白天关闭气孔，减少蒸腾失水，同时释放夜间固定的 CO2 供卡尔文循环使用。光反应只在有光时进行，白天关闭气孔也不是为了提高 CO2 固定效率。","tag":"生理","level":2,"stage":2,"standard":true},{"id":"botany-i006","type":"multi","stage":2,"stem":"关于植物细胞中的质体，下列叙述正确的有","options":["叶绿体含叶绿素，是光合作用的场所","有色体含类胡萝卜素，可使花瓣、果实呈现黄橙色","白色体不含色素，常参与淀粉、脂类的贮存","三类质体不能相互转化，也不能由原质体发育而来"],"answer":[0,1,2],"explain":"叶绿体、有色体、白色体均由原质体发育而来，并在一定条件下相互转化，A、B、C正确。D前半句尚可，但“不能由原质体发育而来”明显错误，故不选。","tag":"细胞与组织"},{"id":"botany-i007","type":"multi","stage":2,"stem":"关于植物成熟组织的类型与特点，下列叙述正确的有","options":["厚角组织细胞壁在角隅处不均匀加厚，通常不木质化","厚壁组织成熟时原生质体消失，属于死细胞","维管形成层属于初生分生组织，只存在于根尖和茎尖","周皮由木栓层、木栓形成层和栓内层组成，属于次生保护组织"],"answer":[0,1,3],"explain":"厚角组织角隅加厚且不木质化，A正确；厚壁组织成熟时原生质体消失，B正确；周皮由木栓层、木栓形成层和栓内层组成，属次生保护组织，D正确。维管形成层是次生分生组织，C错。","tag":"细胞与组织"},{"id":"botany-i018","type":"multi","stage":2,"stem":"关于根的形态与结构，下列叙述正确的有","options":["直根系主根明显，由胚根发育而来，如大豆、棉花","须根系主根不明显，主要由茎基部产生的不定根组成，如小麦、玉米","根尖自下而上依次为根冠、分生区、伸长区和成熟区","根毛是表皮细胞向外突起形成的多细胞结构"],"answer":[0,1,2],"explain":"直根系由胚根发育的主根明显，A正确；须根系主根早期退化，主要由茎基部的不定根组成，B正确；根尖自下而上为根冠、分生区、伸长区、成熟区，C正确。根毛是单个表皮细胞外壁的突起，D错。","tag":"营养器官"},{"id":"botany-i019","type":"multi","stage":2,"stem":"关于叶的形态与结构，下列叙述正确的有","options":["单子叶植物叶脉多为平行脉，双子叶植物多为网状脉","复叶由多个小叶组成，每个小叶的叶腋处都有腋芽","阴生叶通常较大较薄，栅栏组织不发达，叶绿体大而少","禾本科植物叶片具有泡状细胞、硅质细胞等特化结构"],"answer":[0,2,3],"explain":"单子叶植物多为平行脉，A正确；阴生叶大而薄、栅栏组织不发达，C正确；禾本科叶片有泡状细胞、硅质细胞，D正确。复叶的小叶叶腋无腋芽，腋芽着生于总叶柄叶腋，B错。","tag":"营养器官"},{"id":"botany-i028","type":"multi","stage":2,"stem":"关于花的形态结构与传粉方式的适应，下列叙述正确的有","options":["风媒花花被常退化，花粉量大、轻而干燥，柱头多呈羽毛状","虫媒花常有鲜艳花被和蜜腺，花粉粒较大且表面具黏性","豌豆花冠包裹雄蕊和雌蕊，多行自花传粉","所有单性花都必须异株授粉，不可能同株授粉"],"answer":[0,1,2],"explain":"风媒花花被退化、花粉轻小、柱头羽毛状，A正确；虫媒花具鲜艳花被与蜜腺，B正确；豌豆花冠包裹雌雄蕊并行自花传粉，C正确。玉米雌雄同株异花，单性花也能同株授粉，D错。","tag":"生殖器官"},{"id":"botany-i029","type":"multi","stage":2,"stem":"关于果实和种子的发育，下列叙述正确的有","options":["子房壁发育为果皮，子房发育为果实","核果的中果皮肉质、内果皮坚硬，如桃、杏","草莓表面小而硬的“籽”实为瘦果，由子房发育而来","种子由胚珠发育而来，其中种皮由胚乳发育而成"],"answer":[0,1,2],"explain":"果皮由子房壁发育，A正确；核果中果皮肉质、内果皮坚硬，B正确；草莓表面的小瘦果由子房发育，C正确。种皮由珠被发育，胚乳由受精极核发育，D错。","tag":"生殖器官"},{"id":"botany-i043","type":"multi","stage":2,"stem":"关于植物的光合作用，下列叙述正确的有","options":["光反应在类囊体膜上进行，产生ATP和NADPH","叶绿素主要吸收绿光，所以叶片呈现绿色","暗反应在叶绿体基质中进行，消耗ATP和NADPH","C3植物的CO2补偿点一般高于C4植物"],"answer":[0,2,3],"explain":"光反应在类囊体膜上产生ATP和NADPH，A正确；暗反应在基质中进行并消耗二者，C正确；C3植物CO2补偿点高于C4植物，D正确。叶绿素主要吸收红光和蓝紫光、反射绿光，B错。","tag":"生理"},{"id":"botany-i044","type":"multi","stage":2,"stem":"关于植物的呼吸作用，下列叙述正确的有","options":["糖酵解在细胞质基质中进行，最终生成丙酮酸","三羧酸循环在线粒体基质中进行，产生CO2和NADH","呼吸作用只在夜间进行，白天完全停止","无氧呼吸产生酒精和CO2或乳酸，释放能量较少"],"answer":[0,1,3],"explain":"糖酵解在细胞质基质中进行并生成丙酮酸，A正确；三羧酸循环在线粒体基质中进行，产生CO2和NADH，B正确；无氧呼吸产酒精和CO2或乳酸，释能少，D正确。呼吸作用昼夜都进行，C错。","tag":"生理"},{"id":"botany-i045","type":"multi","stage":2,"stem":"关于植物的矿质营养，下列叙述正确的有","options":["氮是蛋白质、核酸和叶绿素的组成元素","磷参与核酸、磷脂和ATP的构成","钾能增强茎秆强度，提高抗倒伏能力","微量元素在植物体内含量很少，因而可有可无"],"answer":[0,1,2],"explain":"氮是蛋白质、核酸和叶绿素的组成元素，A正确；磷参与核酸、磷脂和ATP的构成，B正确；钾能增强茎秆强度、提高抗倒伏能力，C正确。微量元素虽少却不可缺少，D错。","tag":"生理"},{"id":"botany-i046","type":"multi","stage":2,"stem":"关于植物激素和生长调节剂在生产上的应用，下列叙述正确的有","opt
