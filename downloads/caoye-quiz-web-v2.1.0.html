ions":["赤霉素处理可促进芹菜茎伸长，提高产量","高浓度生长素类似物可用于禾本科田间防除双子叶杂草","脱落酸可促进种子萌发和茎的伸长","乙烯利在酸性条件下稳定，施用于植物后分解释放乙烯"],"answer":[0,1,3],"explain":"赤霉素能促进芹菜茎伸长，A正确；高浓度生长素类似物可杀死双子叶杂草而用于禾本科田间除草，B正确；乙烯利在酸性条件下稳定，进入植物后分解释放乙烯，D正确。脱落酸抑制萌发和生长，C错。","tag":"生理"},{"id":"botany-i054","type":"multi","stage":2,"stem":"关于植物细胞壁的结构与性质，下列叙述正确的有","options":["细胞壁的主要成分是纤维素、半纤维素和果胶","细胞壁具有全透性，水和溶质可自由通过","初生壁较薄，可随细胞生长而延展","次生壁形成后细胞壁不再增厚，细胞恢复分裂能力"],"answer":[0,1,2],"explain":"细胞壁主要由纤维素、半纤维素和果胶构成，具全透性，初生壁薄而有延展性；次生壁形成后细胞多停止生长并失去分裂能力，故第四项错误。","tag":"细胞与组织"},{"id":"botany-i055","type":"multi","stage":2,"stem":"关于植物组织的结构特点与分布，下列叙述正确的有","options":["厚角组织的细胞壁在角隅处加厚，多分布于茎和叶柄表皮下","石细胞壁厚且木质化，多成簇分布于果皮和种皮中","表皮上的保卫细胞是活细胞，其内含有叶绿体","分泌组织只存在于植物体内部，不分布于体表"],"answer":[0,1,2],"explain":"厚角组织在角隅处加厚，石细胞壁厚木化，保卫细胞为含叶绿体的活细胞；分泌组织也可分布于体表，如腺毛和蜜腺，故第四项错误。","tag":"细胞与组织"},{"id":"botany-i064","type":"multi","stage":2,"stem":"关于根的结构与功能，下列叙述正确的有","options":["双子叶植物根的内皮层具凯氏带，可控制物质径向运输","根毛由表皮细胞向外突起形成，寿命较短","根的初生木质部呈星芒状，其成熟方式为外始式","双子叶植物根的维管束为散生排列"],"answer":[0,1,2],"explain":"凯氏带可控制物质径向运输，根毛由表皮细胞外突形成且寿命短，初生木质部呈星芒状并自外向内成熟；双子叶植物根为辐射维管束，散生维管束见于单子叶植物茎。","tag":"营养器官"},{"id":"botany-i065","type":"multi","stage":2,"stem":"关于不同生境下叶片结构的适应，下列叙述正确的有","options":["阳生叶叶片较厚，栅栏组织发达","阴生叶叶片较薄，海绵组织相对发达","旱生植物叶片常具角质层厚、气孔下陷等特征","水生植物叶片通常角质层发达、气孔密集"],"answer":[0,1,2],"explain":"阳生叶厚、栅栏组织发达；阴生叶薄、海绵组织相对发达；旱生叶常角质层厚、气孔下陷以减少水分散失。水生植物叶片角质层薄、气孔常退化，第四项错误。","tag":"营养器官"},{"id":"botany-i074","type":"multi","stage":2,"stem":"关于花药与花粉粒的发育，下列叙述正确的有","options":["花药壁由表皮、药室内壁、中层和绒毡层组成","小孢子母细胞经减数分裂形成四个小孢子","成熟花粉粒由营养细胞和生殖细胞组成","绒毡层细胞在花粉成熟时仍然完整并长期存在"],"answer":[0,1,2],"explain":"花药壁由表皮、药室内壁、中层和绒毡层组成，小孢子母细胞经减数分裂形成四个小孢子，成熟花粉含营养细胞和生殖细胞；绒毡层在花粉成熟前解体，不会长期保留。","tag":"生殖器官"},{"id":"botany-i075","type":"multi","stage":2,"stem":"关于无子果实的形成，下列叙述正确的有","options":["未受精时子房不能正常发育，外源生长素可促进子房发育形成无子果实","三倍体西瓜因减数分裂异常、不能形成正常种子而产生无子果实","种子败育后，果实仍可继续发育形成无子果实","所有无子果实都必须经过受精才能形成"],"answer":[0,1,2],"explain":"未受精时外源生长素可代替种子产生的激素促进子房发育；三倍体西瓜减数分裂异常、种子不能正常发育；种子败育后果实仍可发育。无子果实并非都要经过受精，第四项错误。","tag":"生殖器官"},{"id":"botany-i088","type":"multi","stage":2,"stem":"关于C3、C4和CAM植物的光合作用，下列叙述正确的有","options":["C4植物最初固定二氧化碳的产物是草酰乙酸","CAM植物夜间固定二氧化碳并以苹果酸形式贮存于液泡","C3植物在高温强光下光呼吸明显，净光合速率相对较低","CAM植物白天气孔开放，主要在白昼吸收二氧化碳"],"answer":[0,1,2],"explain":"C4植物最初固定二氧化碳生成草酰乙酸，CAM植物夜间固定二氧化碳并以苹果酸贮存于液泡，C3植物高温强光下光呼吸强；CAM植物白天气孔关闭，故第四项错误。","tag":"生理"},{"id":"botany-i089","type":"multi","stage":2,"stem":"关于植物水分代谢与矿质营养，下列叙述正确的有","options":["细胞水势由渗透势、压力势等组成，水分由水势低处流向高处","蒸腾拉力是水分在木质部中上升的主要动力","矿质元素可通过叶面喷施被叶片吸收，用于补充微量元素","植物缺素症都最先出现在幼嫩叶片上"],"answer":[1,2],"explain":"蒸腾拉力是木质部水分上升的主要动力，矿质元素也可经叶面喷施被吸收；水分应自水势高处流向低处，第一项方向说反，缺素症也可先见于老叶，第四项绝对化。","tag":"生理"},{"id":"botany-i090","type":"multi","stage":2,"stem":"关于植物激素的作用与运输，下列叙述正确的有","options":["生长素在胚芽鞘中只能由形态学上端向下端极性运输","赤霉素可促进细胞伸长和种子萌发","脱落酸可促进气孔关闭，提高植物的抗旱能力","乙烯能促进果实成熟，但对器官脱落没有影响"],"answer":[0,1,2],"explain":"生长素在胚芽鞘中只能极性运输，即由形态学上端运向下端；赤霉素促进细胞伸长和种子萌发，脱落酸促进气孔关闭而增强抗旱性；乙烯除催熟外还能促进器官脱落。","tag":"生理"},{"id":"botany-m04","type":"multi","stem":"关于植物的光合作用、呼吸作用和蒸腾作用，下列叙述正确的是","options":["光合作用暗反应在叶绿体基质中进行，需要光反应提供 ATP 和 NADPH","有氧呼吸第三阶段在线粒体内膜上进行，释放大量能量","植物无氧呼吸的产物只能是酒精和二氧化碳","蒸腾作用只能通过气孔进行"],"answer":[0,1],"explain":"暗反应在叶绿体基质中进行，消耗光反应产生的 ATP 和 NADPH；有氧呼吸第三阶段在线粒体内膜上进行，释放大量能量。无氧呼吸还可产生乳酸，C 错误；蒸腾作用除气孔蒸腾外，还有角质层蒸腾和皮孔蒸腾，D 错误。","tag":"生理","level":2,"stage":2,"standard":true},{"id":"botany-i008","type":"judge","stage":2,"stem":"细胞分化是细胞在形态、结构和功能上产生稳定性差异的过程，分化后的成熟细胞一般不再进行分裂。","options":["正确","错误"],"answer":[0],"explain":"细胞分化使细胞在形态、结构和功能上产生稳定性差异，分化成熟的细胞一般不再分裂，只在特定条件下脱分化，故该说法正确。","tag":"细胞与组织"},{"id":"botany-i009","type":"judge","stage":2,"stem":"导管分子和筛管分子成熟时都是死细胞，因此都能承担长距离运输功能。","options":["正确","错误"],"answer":[1],"explain":"导管分子成熟时为死细胞，可运输水分和无机盐；筛管分子成熟时虽无细胞核，但仍是生活细胞，依靠伴胞维持代谢，故“都是死细胞”的说法错误。","tag":"细胞与组织"},{"id":"botany-i010","type":"judge","stage":2,"stem":"居间分生组织来源于顶端分生组织，保留在禾本科植物茎的节间基部和叶基部，其活动可使节间伸长。","options":["正确","错误"],"answer":[0],"explain":"居间分生组织由顶端分生组织衍生并保留在节间基部、叶基部，通过细胞分裂使节间伸长，如小麦拔节、韭菜割后再生，故该说法正确。","tag":"细胞与组织"},{"id":"botany-i020","type":"judge","stage":2,"stem":"叶片叶脉的维管束中，木质部位于靠近上表皮的一侧，韧皮部位于靠近下表皮的一侧。","options":["正确","错误"],"answer":[0],"explain":"叶片维管束中木质部靠近上表皮、韧皮部靠近下表皮，这与叶片上表面受光强、蒸腾流由木质部向上输送相适应，故该说法正确。","tag":"营养器官"},{"id":"botany-i021","type":"judge","stage":2,"stem":"根冠细胞排列疏松，起保护分生区的作用，但一经形成便不再更新。","options":["正确","错误"],"answer":[1],"explain":"根冠细胞排列疏松，确能保护分生区，但其外层细胞不断脱落，由分生区细胞分裂补充，因而能持续更新，故“不再更新”的说法错误。","tag":"营养器官"},{"id":"botany-i030","type":"judge","stage":2,"stem":"被子植物的双受精是指一个精子与卵细胞融合形成合子，另一个精子与两个极核融合形成初生胚乳核，这是被子植物特有的现象。","options":["正确","错误"],"answer":[0],"explain":"双受精为一个精子与卵融合成合子、另一个精子与两个极核融合成初生胚乳核，是被子植物特有的有性生殖过程，故该说法正确。","tag":"生殖器官"},{"id":"botany-i047","type":"judge","stage":2,"stem":"植物激素由专门的内分泌腺体分泌，并主要随木质部导管运输到作用部位。","options":["正确","错误"],"answer":[1],"explain":"植物没有专门的内分泌腺体，激素由特定部位的细胞产生，经韧皮部等运输到作用部位，且多在低浓度下起作用，故该说法错误。","tag":"生理"},{"id":"botany-i056","type":"judge","stage":2,"stem":"植物细胞的细胞壁由原生质体分泌形成，具有支持和保护作用，但不能阻止水分自由通过。","options":["正确","错误"],"answer":[0],"explain":"细胞壁由原生质体分泌的纤维素等构成，起支持和保护作用；其结构疏松，为全透性，水分子和溶质可自由通过，故该陈述正确。","tag":"细胞与组织"},{"id":"botany-i066","type":"judge","stage":2,"stem":"马铃薯的块茎和甘薯的块根都生于地下，二者均为茎的变态，表面都具有芽眼。","options":["正确","错误"],"answer":[1],"explain":"马铃薯块茎由地下茎膨大而成，属茎的变态，具芽眼；甘薯块根由不定根膨大形成，属根变态，没有芽眼和节，故该陈述错误。","tag":"营养器官"},{"id":"botany-i067","type":"judge","stage":2,"stem":"禾本科植物的居间分生组织位于节间基部，抽穗后其细胞已全部成熟，茎秆不能再伸长。","options":["正确","错误"],"answer":[1],"explain":"禾本科节间基部保留居间分生组织，抽穗后仍能分裂使茎秆继续伸长，小麦、水稻均如此，因此“不能再伸长”的说法错误。","tag":"营养器官"},{"id":"botany-i076","type":"judge","stage":2,"stem":"玉米的籽粒在植物学上属于颖果，其果皮与种皮愈合，因此生产中常把玉米粒直接当作种子使用。","options":["正确","错误"],"answer":[0],"explain":"玉米籽粒的果皮与种皮紧密愈合不易分离，植物学上称颖果，生产上常直接作种子使用，小麦、水稻也属此类，故该陈述正确。","tag":"生殖器官"},{"id":"botany-i077","type":"judge","stage":2,"stem":"自花传粉植物一定能完成自交亲和，因此不需要风或昆虫等任何传粉媒介。","options":["正确","错误"],"answer":[1],"explain":"自花传粉植物仍需风或昆虫等媒介，或在花冠闭合时完成自花授粉，并非不需要媒介；自交不亲和现象也存在于部分植物中，故该陈述错误。","tag":"生殖器官"},{"id":"botany-i091","type":"judge","stage":2,"stem":"阴生植物的光补偿点通常低于阳生植物，因此阴生植物能在较弱光照下积累有机物。","options":["正确","错误"],"answer":[0],"explain":"阴生植物长期适应弱光，光补偿点低，在较弱光照下光合即可超过呼吸而积累有机物，其光饱和点也低于阳生植物，故该陈述正确。","tag":"生理"},{"id":"botany-i092","type":"judge","stage":2,"stem":"植物体内的矿质元素只能通过根系从土壤中吸收，叶片不能吸收矿质元素。","options":["正确","错误"],"answer":[1],"explain":"植物叶片可通过角质层和气孔吸收矿质元素，生产上常用叶面喷施补充微量元素，故“叶片不能吸收”的说法错误。","tag":"生理"},{"id":"botany-i093","type":"judge","stage":2,"stem":"植物被水淹后根系缺氧，无氧呼吸分解葡萄糖不彻底、释放能量少，且乙醇积累会毒害细胞，因而生长受阻。","options":["正确","错误"],"answer":[0],"explain":"淹水时根系缺氧进行无氧呼吸，葡萄糖分解不彻底、释放能量远少于有氧呼吸，且乙醇积累毒害细胞，根系生长受阻，故该陈述正确。","tag":"生理"},{"id":"botany-a001","type":"single","stage":3,"stem":"某二倍体植物体细胞染色体数为24，其有丝分裂后期的细胞内染色体数和核DNA分子数依次是","options":["48条、48个","24条、24个","24条、48个","48条、24个"],"answer":[0],"explain":"有丝分裂后期着丝粒分裂，姐妹染色单体分开成为两条子染色体，染色体数由24条加倍为48条，每条染色体含1个DNA分子，核DNA共48个。B、C项仍按24条计，D项误认为DNA减半。","tag":"细胞与组织"},{"id":"botany-a002","type":"single","stage":3,"stem":"某植物茎皮层外侧、紧贴表皮的机械组织，细胞壁仅在角隅处增厚，细胞为生活细胞，能随茎的伸长而继续伸展。该组织是","options":["分生组织","厚壁组织","厚角组织","输导组织"],"answer":[2],"explain":"厚角组织细胞壁仅在角隅处不均匀增厚，为生活细胞，既有支持作用又不阻碍器官伸长。厚壁组织细胞壁均匀木质化增厚、成熟后为死细胞，支持力强但使器官变硬，不能随茎伸展。","tag":"细胞与组织"},{"id":"botany-a003","type":"single","stage":3,"stem":"木质部导管分子成熟后原生质体解体、细胞壁木质化加厚，韧皮部筛管分子成熟后保留原生质体但无细胞核。这一差异最能说明","options":["导管负责被动输水，筛管运输需要活细胞维持的生理过程","导管运输需要消耗能量，筛管运输不需要能量","导管和筛管均由同一种分生组织细胞直接分化而来","导管是死细胞，筛管是活细胞，二者都承担有机物运输"],"answer":[0],"explain":"导管成熟后为死细胞，依靠蒸腾拉力被动输水；筛管需保持生活状态，由伴胞供能完成有机物的装载与运输，结构差异体现功能差异。B项颠倒能量关系，D项混淆输水与运有机物。","tag":"细胞与组织"},{"id":"botany-a004","type":"single","stage":3,"stem":"将已分化的植物茎段细胞接种在适宜培养基上，使其恢复分裂能力并形成愈伤组织，这一过程称为","options":["再分化","脱分化","细胞衰老","细胞凋亡"],"answer":[1],"explain":"已分化细胞恢复分裂能力、形成无定形愈伤组织的过程为脱分化，愈伤组织再分化出根、芽等器官才是再分化。C、D项是细胞走向死亡的过程，与恢复分裂能力相反。","tag":"细胞与组织"},{"id":"botany-a005","type":"single","stage":3,"stem":"橡胶树割胶时流出的胶乳，由下列哪种结构产生并贮存","options":["树脂道","腺毛","蜜腺","乳汁管"],"answer":[3],"explain":"胶乳由乳汁管分泌并贮存，乳汁管是特化的分泌结构。树脂道分泌松脂等树脂，腺毛多分泌黏液或精油，蜜腺分泌花蜜，三者都不产生胶乳，也不是胶乳的贮存场所。","tag":"细胞与组织"},{"id":"botany-a006","type":"single","stage":3,"stem":"被子植物植物体的组织可归纳为三大组织系统，它们是","options":["分生组织系统、成熟组织系统、机械组织系统","表皮系统、皮层系统、中柱系统","同化组织系统、贮藏组织系统、输导组织系统","皮组织系统、维管组织系统、基本组织系统"],"answer":[3],"explain":"按组织在植物体内的分布与来源，可归纳为皮组织系统、维管组织系统和基本组织系统三大类，贯穿根、茎、叶。A项把分生组织与成熟组织混入同一层次，分类依据错误。","tag":"细胞与组织"},{"id":"botany-a011","type":"single","stage":3,"stem":"甘薯的块根与马铃薯的块茎外形相似，但变态来源不同，二者的区别在于","options":["块根由主根膨大形成，块茎由根状茎膨大形成","块根由不定根膨大形成，块茎由地下匍匐茎末端膨大形成","块根由茎基膨大形成，块茎由胚轴膨大形成","块根由胚根膨大形成，块茎由鳞茎膨大形成"],"answer":[1],"explain":"甘薯块根由不定根膨大而成，具根的结构；马铃薯块茎是地下匍匐茎末端膨大形成，表面有芽眼，属茎的变态。A、C、D项把二者的变态来源错认或相互颠倒。","tag":"营养器官"},{"id":"botany-a012","type":"single","stage":3,"stem":"某旱生植物叶片的气孔下陷于表皮之下，表皮外角质层厚，栅栏组织细胞层数多而排列紧密。这些特征的主要适应意义是","options":["增加叶面积以截获更多光照","加快有机物向果实运输","降低蒸腾并保持较高的光合能力","促进根系对矿质元素的吸收"],"answer":[2],"explain":"气孔下陷和角质层加厚可减少水分散失，多层栅栏组织增加光合面积与效率，故能降低蒸腾并保持较高光合能力。A项与气孔下陷无关且会增加失水，B、D项属输导与根系功能。","tag":"营养器官"},{"id":"botany-a013","type":"single","stage":3,"stem":"某草地样地面积为2平方米，测得样地内叶片单面总面积为9平方米，该草地群落的叶面积指数为","options":["2.25","4.5","9","18"],"answer":[1],"explain":"叶面积指数＝叶片总单面面积÷土地面积＝9÷2＝4.5。A项误将比例取反，C项漏除样地面积，D项误按叶片双面重复计算，均不符合叶面积指数的定义。","tag":"营养器官"},{"id":"botany-a014","type":"single","stage":3,"stem":"豆科牧草与根瘤菌共生形成的根瘤能固定空气中的氮气，而多数草本植物与菌根真菌共生主要有利于","options":["固定空气中的氮气","吸收磷等矿质元素和水分","合成生长素促进开花","分解土壤中的有机质"],"answer":[1],"explain":"菌根真菌的菌丝扩展了根的吸收范围，显著促进磷、锌等移动性差的矿质元素和水分吸收。固定氮气是根瘤菌的功能，A项张冠李戴；C、D项不是菌根共生的主要作用。","tag":"营养器官"},{"id":"botany-a015","type":"single","stage":3,"stem":"双子叶植物茎的维管形成层细胞分裂后，向内、向外分别形成","options":["次生木质部、次生韧皮部","次生韧皮部、次生木质部","初生木质部、初生韧皮部","木栓层、栓内层"],"answer":[0],"explain":"维管形成层向内分裂形成次生木质部，向外分裂形成次生韧皮部。B项方向颠倒；初生木质部与初生韧皮部由原形成层产生，木栓层和栓内层由木栓形成层分裂形成。","tag":"营养器官"},{"id":"botany-a016","type":"single","stage":3,"stem":"生产上通过调整行株距和种植密度改善群体结构、减少叶片相互遮阴，其生物学依据与下列哪种现象一致","options":["顶端优势","叶镶嵌","春化作用","光周期现象"],"answer":[1],"explain":"叶镶嵌是同一植株叶片通过着生方位和叶柄长短错开、互不遮挡的现象，合理密植正是维持群体内类似的受光格局。顶端优势、春化与光周期分别涉及芽抑制、低温成花和光信号成花。","tag":"营养器官"},{"id":"botany-a017","type":"single","stage":3,"stem":"水稻长期生长在淹水土壤中，其根皮层部分细胞解体形成通气组织，该结构的主要作用是","options":["增加根的吸收面积","贮藏大量有机物供后期灌浆","向根系输送氧气以维持有氧呼吸","增强根的固着能力"],"answer":[2],"explain":"淹水土壤缺氧，根皮层细胞解体形成的通气组织可将地上部氧气输送到根部，维持有氧呼吸。吸收面积主要靠根毛，有机物贮藏主要在根冠和茎，固着作用与皮层解体无关。","tag":"营养器官"},{"id":"botany-a023","type":"single","stage":3,"stem":"某二倍体植物一个花药中有100个小孢子母细胞，若全部正常进行减数分裂和后续有丝分裂，理论上可形成的精子数为","options":["100个","200个","400个","800个"],"answer":[3],"explain":"1个小孢子母细胞减数分裂形成4个小孢子，每个小孢子经有丝分裂形成1个含2个精子的花粉粒，故100×4×2＝800个。C项漏乘每个花粉粒中的2个精子。","tag":"生殖器官"},{"id":"botany-a024","type":"single","stage":3,"stem":"蓼型胚囊成熟时，其细胞组成是","options":["卵细胞1个、助细胞3个、反足细胞2个、中央细胞1个","卵细胞2个、助细胞1个、反足细胞3个、中央细胞1个","卵细胞1个、助细胞2个、反足细胞3个、中央细胞1个","卵细胞1个、助细胞2个、反足细胞2个、中央细胞2个"],"answer":[2],"explain":"蓼型胚囊由8个核组成7个细胞：卵细胞1个、助细胞2个、反足细胞3个、中央细胞1个（含2个极核）。A项助细胞与反足细胞数目不对，B项卵细胞数错，D项中央细胞数错。","tag":"生殖器官"},{"id":"botany-a025","type":"single","stage":3,"stem":"苹果的食用部分主要由花托发育而成，其子房位置和果实类型分别是","options":["上位子房、真果","下位子房、真果","上位子房、假果","下位子房、假果"],"answer":[3],"explain":"苹果的子房陷于花托中并与花托愈合，属子房下位；果实由子房和花托共同发育而成，为假果（梨果）。A、C项误认为上位子房，B项误认为真果。","tag":"生殖器官"},{"id":"botany-a026","type":"single","stage":3,"stem":"下列果实中，由单心皮发育、成熟时沿背腹两条缝线开裂的是","options":["颖果","角果","蒴果","荚果"],"answer":[3],"explain":"荚果由单心皮发育，成熟时沿背缝线和腹缝线两条缝线开裂，如大豆。颖果果皮与种皮愈合而不开裂，角果由二心皮合生并具假隔膜，蒴果多由合生心皮构成。","tag":"生殖器官"},{"id":"botany-a027","type":"single","stage":3,"stem":"香蕉、无籽柑橘等不经受精也能结出无籽果实，这种现象称为","options":["孤雌生殖","无融合生殖","单性结实","双受精"],"answer":[2],"explain":"子房未经受精而发育成果实的现象称为单性结实。孤雌生殖是卵细胞不经受精直接发育成胚，无融合生殖是不经受精产生胚，二者形成的是有胚种子，与无籽果实不同。","tag":"生殖器官"},{"id":"botany-a028","type":"single","stage":3,"stem":"禾本科牧草的花小、花被退化，花丝细长、花药外露，柱头呈羽毛状，花粉粒小而轻且数量大。这些特征说明其传粉方式主要是","options":["虫媒传粉","水媒传粉","风媒传粉","自花传粉"],"answer":[2],"explain":"花被退化、花药外露、柱头羽毛状且花粉小而轻、量大，都是适应风力传粉的特征。虫媒花多具鲜艳花冠、蜜腺和芳香，水媒传粉见于沉水植物，与本题特征不符。","tag":"生殖器官"},{"id":"botany-a033","type":"single","stage":3,"stem":"测得某植物细胞的渗透势为-1.2 MPa、压力势为0.4 MPa，将其放入水势为-0.6 MPa的溶液中，该细胞将","options":["吸水，因细胞水势（-0.8 MPa）低于外界溶液（-0.6 MPa），水由外界溶液进入细胞","既不吸水也不失水，因二者水势相等","先吸水后失水，最终达到平衡","失水，因细胞水势高于外界溶液"],"answer":[0],"explain":"细胞水势＝渗透势＋压力势＝-1.2＋0.4＝-0.8 MPa，低于外界溶液的-0.6 MPa；水由水势高（-0.6 MPa）的外界溶液流向水势低（-0.8 MPa）的细胞，细胞吸水。B、C、D的结论或理由不成立。","tag":"生理"},{"id":"botany-a034","type":"single","stage":3,"stem":"某植物叶片在光照下测得CO₂吸收速率为12 μmol·m⁻²·s⁻¹，黑暗下CO₂释放速率为3 μmol·m⁻²·s⁻¹，该叶片的总光合速率为","options":["3 μmol·m⁻²·s⁻¹","9 μmol·m⁻²·s⁻¹","12 μmol·m⁻²·s⁻¹","15 μmol·m⁻²·s⁻¹"],"answer":[3],"explain":"总（真）光合速率＝净光合速率＋呼吸速率＝12＋3＝15 μmol·m⁻²·s⁻¹。C项只是表观的净光合速率，B项误将二者相减，A项仅是呼吸速率。","tag":"生理"},{"id":"botany-a035","type":"single","stage":3,"stem":"与C3植物相比，C4植物在高温强光下光合效率较高，其主要原因是","options":["PEP羧化酶对CO₂亲和力高，维管束鞘细胞内CO₂浓度高，抑制了光呼吸","C4植物叶肉细胞不含叶绿体，光反应只在维管束鞘细胞中进行","C4植物气孔白天关闭，完全依靠夜间固定的CO₂进行光合","C4植物的RuBP羧化酶只催化加氧反应，不催化羧化反应"],"answer":[0],"explain":"C4植物先在叶肉细胞由PEP羧化酶固定CO₂，再转运至维管束鞘细胞释放，使其CO₂浓度升高，抑制RuBP加氧反应即光呼吸。B项叶肉细胞含叶绿体，C项为CAM植物特征。","tag":"生理"},{"id":"botany-a036","type":"single","stage":3,"stem":"某果园新梢顶端幼叶叶脉间失绿黄化，下部老叶仍保持绿色，最可能缺乏的元素是","options":["铁","氮","钾","镁"],"answer":[0],"explain":"铁在植物体内不易移动，缺乏时不能从老叶转运至新叶，故幼叶先失绿。氮、钾、镁为可再利用元素，缺乏时老叶先表现症状，与本例相反。","tag":"生理"},{"id":"botany-a037","type":"single","stage":3,"stem":"果树修剪中常对枝条短截或拉枝，以促进侧芽萌发、增加分枝，其主要生理依据是","options":["增强顶端优势，提高顶芽生长素含量","解除顶端优势，降低侧芽处生长素浓度","促进赤霉素合成，加速细胞伸长","提高细胞分裂素含量，抑制侧芽生长"],"answer":[1],"explain":"顶芽产生的生长素向下运输并在侧芽处积累，抑制侧芽萌发；短截或拉枝削弱顶端优势、降低侧芽处生长素浓度，从而促进侧芽萌发。C项与分枝无关，D项细胞分裂素促进侧芽生长。","tag":"生理"},{"id":"botany-a038","type":"single","stage":3,"stem":"高大树木中水分能上升到几十米高的树冠，其主要动力来自","options":["根压，由根系主动吸水产生","导管细胞的主动收缩","蒸腾拉力，由叶片蒸腾失水产生的负压经导管水柱向上传递","大气压直接把水压入根部"],"answer":[2],"explain":"叶片蒸腾失水形成水势梯度，产生蒸腾拉力，经木质部连续水柱传递至根部，是高大树木水分上升的主要动力。根压只能使水分上升有限高度，无法解释数十米的运输。","tag":"生理"},{"id":"botany-a039","type":"single","stage":3,"stem":"土壤干旱时，根系合成的脱落酸随蒸腾流运至叶片并引起气孔关闭，这一调节的意义是","options":["减少水分散失，提高抗旱能力","加快CO₂吸收，提高光合速率","促进叶片衰老脱落以节省养分","增加蒸腾以降低叶温"],"answer":[0],"explain":"脱落酸促进保卫细胞失水、气孔关闭，减少蒸腾失水，是植物对干旱的重要适应。B项气孔关闭会减少CO₂吸收而使光合下降，C项不是该调节的直接意义，D项方向相反。","tag":"生理"},{"id":"botany-a040","type":"single","stage":3,"stem":"土壤长期渍水时，旱地作物根系易受害甚至死亡，其主要原因是","options":["无氧呼吸积累乙醇等有毒物质，且能量供应不足","根系吸水过多导致细胞破裂","土壤温度过低使酶失活","根系吸收的矿质元素过多产生毒害"],"answer":[0],"explain":"渍水造成土壤缺氧，根系被迫进行无氧呼吸，积累乙醇、乳酸等有毒物质，且产生的ATP少，影响吸收与生长。B、C、D项均非渍水伤害的主要原因。","tag":"生理"},{"id":"botany-a041","type":"single","stage":3,"stem":"冬小麦秋播后需经过一段时间低温才能在次年正常抽穗，这一现象及生产上可利用的处理是","options":["光周期现象，可用短日照处理","春化作用，可用低温处理种子或幼苗","顶端优势，可用摘心处理","种子休眠，可用赤霉素处理"],"answer":[1],"explain":"冬小麦必须经过一定时间的低温才能由营养生长转向生殖生长，即春化作用，生产上可用低温处理种子或幼苗完成春化。A项光周期涉及昼夜长短对成花的调控，与低温需求不同。","tag":"生理"},{"id":"botany-s18","type":"single","stem":"关于植物体内水分的吸收、运输和散失，下列叙述正确的是","options":["根毛区吸收的水分主要经导管向上运输，蒸腾拉力是主要动力","水分在木质部中的运输方向由筛管决定","气孔关闭时蒸腾作用完全停止","根压是高大树木水分上升的主要动力"],"answer":[0],"explain":"根毛区吸收的水分进入木质部导管，主要靠蒸腾拉力向上运输；筛管运输有机物，不决定水分方向；气孔关闭后仍有角质层蒸腾，不会完全停止；根压能使水分上升，但不是高大树木水分上升的主要动力。","tag":"生理","level":3,"stage":3,"standard":true},{"id":"botany-s19","type":"single","stem":"某作物植株矮小，老叶从叶尖开始均匀发黄，幼叶仍较绿，最可能缺乏的元素及原因是","options":["缺钙，因为钙在体内可再利用，老叶先受害","缺铁，因为铁在体内可自由移动，老叶先失绿","缺氮，因为氮是可再利用元素，老叶中的氮可向幼叶转移","缺镁，因为镁只积累在老叶中不能转移"],"answer":[2],"explain":"氮是可再利用元素，缺氮时老叶中的蛋白质等含氮物质分解，氮被转运到生长旺盛的幼叶重新利用，所以老叶先均匀发黄；钙、铁在体内难以再利用，缺乏时幼叶先表现症状；镁虽可再利用，但缺镁多表现为叶脉间失绿。","tag":"生理","level":3,"stage":3,"standard":true},{"id":"botany-a007","type":"multi","stage":3,"stem":"关于植物细胞壁的结构与功能，下列叙述正确的是","options":["细胞壁的主要成分是纤维素、半纤维素和果胶类物质","相邻细胞间的纹孔与胞间连丝是细胞间物质运输的通道","初生壁较薄且有一定弹性，可随细胞生长而扩展","细胞壁为无生命的死结构，不参与细胞的任何生理活动"],"answer":[0,1,2],"explain":"细胞壁以纤维素、半纤维素和果胶类物质为主，初生壁薄而有弹性，纹孔与胞间连丝沟通相邻细胞。D项错误，细胞壁参与物质运输、防御和信号传递，并非与生理活动无关。","tag":"细胞与组织"},{"id":"botany-a008","type":"multi","stage":3,"stem":"关于植物分生组织，下列叙述正确的是","options":["顶端分生组织位于根、茎顶端，使植物体不断伸长","侧生分生组织包括维管形成层和木栓形成层，使根、茎增粗","居间分生组织位于禾本科植物节间基部，与拔节生长有关","分生组织细胞的特点是细胞大、液泡大、分裂能力弱"],"answer":[0,1,2],"explain":"顶端、侧生、居间分生组织分别与植物伸长、增粗和禾本科拔节有关。D项描述的是成熟组织细胞的特点，分生组织细胞小、排列紧密、壁薄、核大、液泡小而分裂能力强。","tag":"细胞与组织"},{"id":"botany-a018","type":"multi","stage":3,"stem":"关于植物根的结构与功能，下列叙述正确的是","options":["根毛区（成熟区）表皮细胞外壁向外突起形成根毛，是吸收水分和无机盐的主要部位","双子叶植物根内皮层细胞的凯氏带可控制物质经质外体途径运输","根压的产生与根系主动吸收矿质离子、水分进入导管有关","根只能由种子中的胚根发育而来，茎和叶上不能产生根"],"answer":[0,1,2],"explain":"根毛区吸收能力最强；凯氏带阻断质外体运输，使物质必须经共质体进入中柱；根压源于根系主动吸水。D项错误，茎、叶上可产生不定根，扦插繁殖即利用这一特性。","tag":"营养器官"},{"id":"botany-a019","type":"multi","stage":3,"stem":"关于植物叶的结构与功能，下列叙述正确的是","options":["禾本科植物叶由叶片、叶鞘、叶舌和叶耳等部分组成","叶片的表皮细胞与保卫细胞都含叶绿体，都能进行光合作用","仙人掌的刺由叶变态而来，可减少水分散失","叶脉中的维管束兼具输导和支持作用"],"answer":[0,2,3],"explain":"禾本科叶具叶片、叶鞘、叶舌和叶耳；仙人掌刺为叶的变态，可减少失水；叶脉维管束兼具输导与支持作用。B项错误，一般表皮细胞不含叶绿体，只有保卫细胞含叶绿体。","tag":"营养器官"},{"id":"botany-a029","type":"multi","stage":3,"stem":"关于被子植物花的结构，下列叙述正确的是","options":["花萼和花冠合称花被，花萼通常呈绿色并保护花蕾","雄蕊由花药和花丝组成，花药是产生花粉粒的场所","雌蕊由柱头、花柱和子房组成，子房内着生胚珠","单性花一定缺少花被，因此不能结实"],"answer":[0,1,2],"explain":"花被由花萼和花冠组成，雄蕊含花药与花丝，雌蕊含柱头、花柱和子房。D项错误，单性花只是缺少雄蕊或雌蕊，多数仍有花被，经传粉受精后同样能结实。","tag":"生殖器官"},{"id":"botany-a030","type":"multi","stage":3,"stem":"关于果实和种子的形成，下列叙述正确的是","options":["子房壁发育成果皮，胚珠发育成种子","受精卵发育成胚，受精极核发育成胚乳","玉米籽粒的胚乳由受精极核发育而来，为三倍体","所有果实的果皮都由子房壁单独发育而来"],"answer":[0,1,2],"explain":"子房壁发育为果皮，胚珠发育为种子，受精卵发育为胚，受精极核发育为三倍体胚乳。D项错误，苹果、梨等假果有花托参与发育，果皮并非全部来自子房壁。","tag":"生殖器官"},{"id":"botany-a042","type":"multi","stage":3,"stem":"关于植物光合作用，下列叙述正确的是","options":["光反应在类囊体膜上进行，将光能转变为ATP和NADPH中的活跃化学能","暗反应（碳同化）在叶绿体基质中进行，需要ATP和NADPH供能","提高CO₂浓度通常可提高C3植物的光合速率，但超过饱和点后不再增加","光合作用释放的氧气来自CO₂的分解"],"answer":[0,1,2],"explain":"光反应在类囊体膜上进行，生成ATP和NADPH；暗反应在叶绿体基质中进行并消耗二者；CO₂超过饱和点后受酶量和光反应限制。D项错误，释放的氧气来自水的光解。","tag":"生理"},{"id":"botany-a043","type":"multi","stage":3,"stem":"关于植物激素的作用与应用，下列叙述正确的是","options":["生长素在体内具有极性运输的特点，即只能从形态学上端运向形态学下端","赤霉素能打破种子和芽的休眠，促进茎的伸长","脱落酸促进气孔关闭和种子休眠，被称为胁迫激素","乙烯的主要作用是促进细胞伸长和器官生长"],"answer":[0,1,2],"explain":"生长素具极性运输特点，赤霉素能打破休眠、促进茎伸长，脱落酸响应逆境。D项错误，乙烯主要促进果实成熟和器官衰老脱落，并抑制细胞伸长，而非促进细胞伸长。","tag":"生理"},{"id":"botany-a044","type":"multi","stage":3,"stem":"关于植物水分代谢和矿质营养，下列叙述正确的是","options":["植物细胞吸水的方式包括渗透吸水、吸胀吸水和代谢性吸水","蒸腾作用不仅促进水分吸收和运输，还有助于矿质元素在体内的运输","矿质元素必须溶于水才能被根系吸收，主要通过主动吸收进入根细胞","植物必需元素中，缺素症最先在老叶表现的都是不可再利用元素"],"answer":[0,1,2],"explain":"细胞吸水有渗透吸水、吸胀吸水和代谢性吸水三种方式；蒸腾拉力促进水分与矿质运输；矿质多以离子形式被主动吸收。D项错误，缺素症在老叶先表现恰说明该元素可再利用。","tag":"生理"},{"id":"botany-m02","type":"multi","stem":"关于植物营养器官的结构与功能，下列叙述正确的是","options":["根毛区表皮细胞形成根毛，显著扩大吸收面积","双子叶植物茎的维管束环状排列，形成层活动使茎逐年加粗","禾本科植物叶片上表皮有泡状细胞，与叶片卷曲有关","甘薯块根和马铃薯块茎都是茎的变态，都具有芽眼"],"answer":[0,1,2],"explain":"根毛区根毛扩大吸收面积；双子叶植物茎维管束环状排列，具形成层，能逐年加粗；禾本科叶片上表皮的泡状细胞失水收缩使叶片卷曲。甘薯块根由根变态而来，无芽眼；马铃薯块茎才是茎的变态，具芽眼，故 D 错误。","tag":"营养器官","level":3,"stage":3,"standard":true},{"id":"botany-a009","type":"judge","stage":3,"stem":"植物导管分子在成熟过程中原生质体逐渐解体，细胞壁木质化加厚，这一过程属于细胞程序性死亡。","options":["正确","错误"],"answer":[0],"explain":"正确。导管分子由分生组织细胞分化而来，分化中液泡破裂、原生质体自溶消失，全过程受基因调控，是植物细胞程序性死亡的典型例子，最终形成中空的输水管道。","tag":"细胞与组织"},{"id":"botany-a010","type":"judge","stage":3,"stem":"筛管分子成熟后细胞核消失，因此完全丧失生命活动，只能像导管一样依靠细胞壁被动输导有机物。","options":["正确","错误"],"answer":[1],"explain":"错误。筛管分子成熟后虽无细胞核，但仍保留活的原生质体和筛板，依靠伴胞提供能量与物质，通过压力流运输有机物，属生活细胞，与死细胞构成的导管不同。","tag":"细胞与组织"},{"id":"botany-a020","type":"judge","stage":3,"stem":"双子叶植物茎的初生结构中，维管束呈环状排列，维管束之间具有髓射线。","options":["正确","错误"],"answer":[0],"explain":"正确。双子叶植物茎初生结构中维管束呈环状排列，束间由薄壁细胞构成髓射线，横向运输水分和养料；禾本科茎的维管束则散生于基本组织中，无明显的髓射线。","tag":"营养器官"},{"id":"botany-a021","type":"judge","stage":3,"stem":"植物体的根都由种子中的胚根发育而来，茎和叶上不会产生根。","options":["正确","错误"],"answer":[1],"explain":"错误。种子萌发时胚根发育为主根，但茎、叶或老根上还能产生不定根，如柳枝扦插生根、玉米茎基部的支持根，因此并非所有根都由胚根发育而来。","tag":"营养器官"},{"id":"botany-a022","type":"judge","stage":3,"stem":"叶面积指数越大，群体截获的光能越多，因此生产中叶面积指数越高越好。","options":["正确","错误"],"answer":[1],"explain":"错误。叶面积指数过大时叶片互相遮阴，下层叶受光不足、呼吸消耗增加，群体净光合下降，还易倒伏和感染病害，应保持在适宜范围而非越高越好。","tag":"营养器官"},{"id":"botany-a031","type":"judge","stage":3,"stem":"被子植物的胚乳通常由受精极核发育而来，其细胞为三倍体。","options":["正确","错误"],"answer":[0],"explain":"正确。双受精时一个精子与两个极核融合形成三倍体受精极核，发育成胚乳，为胚的发育提供营养；胚则由受精卵发育而来，为二倍体。","tag":"生殖器官"},{"id":"botany-a032","type":"judge","stage":3,"stem":"水稻和小麦的籽粒为颖果，其果皮与种皮愈合，不易分离。","options":["正确","错误"],"answer":[0],"explain":"正确。颖果由单心皮构成，果皮薄且与种皮紧密愈合，生产上所说的种子实际是果实；大豆的荚果果皮与种子容易分离，属不同的果实类型。","tag":"生殖器官"},{"id":"botany-a045","type":"judge","stage":3,"stem":"将植物细胞放入浓度高于细胞液的蔗糖溶液中，细胞发生质壁分离，平衡时细胞的水势仍低于外界溶液。","options":["正确","错误"],"answer":[1],"explain":"错误。水总是从水势高处流向低处，细胞失水发生质壁分离；当水分进出达到动态平衡时，细胞内外的水势相等，不会持续低于外界溶液，否则细胞将继续失水。","tag":"生理"},{"id":"botany-a046","type":"judge","stage":3,"stem":"在一定温度范围内，温度升高会使植物呼吸速率加快，但温度过高时呼吸速率反而下降。","options":["正确","错误"],"answer":[0],"explain":"正确。呼吸作用由酶催化，适宜温度范围内温度升高使酶活性增强、呼吸加快；温度过高会使酶变性失活，呼吸速率反而下降，因此呼吸速率有最适温度上限。","tag":"生理"},{"id":"botany-a047","type":"judge","stage":3,"stem":"低浓度促进生长、高浓度抑制生长的两重性，是植物体内所有激素共同具有的特点。","options":["正确","错误"],"answer":[1],"explain":"错误。两重性主要是生长素作用的特点，且与浓度、器官种类和细胞年龄有关；赤霉素、细胞分裂素等并无这一典型表现，如赤霉素一般只表现促进茎伸长的作用。","tag":"生理"},{"id":"taxonomy-b001","type":"single","stage":1,"stem":"植物分类系统中，最基本、也是客观存在的分类单位是","options":["属","种","科","品种"],"answer":[1],"explain":"种是植物分类的基本单位，也是客观存在的实体，属、科等高级单位都由亲缘相近的种逐级归并而成。品种是栽培学概念，指经人工选育、性状相对稳定的栽培群体，不属于自然分类等级。","tag":"分类等级"},{"id":"taxonomy-b003","type":"single","stage":1,"stem":"表示亚种的植物学名，在属名和种加词之后还应加上","options":["命名人姓氏的缩写","栽培品种的名称","亚种加词（附subsp.）","该植物所属的科名"],"answer":[2],"explain":"亚种学名采用三名法，即在属名和种加词之后再写亚种加词，并在其前加subsp.。命名人只表示命名者，品种名用单引号书写且不必拉丁化，科名也不进入学名。","tag":"双名法"},{"id":"taxonomy-b004","type":"single","stage":1,"stem":"甲发表新种时所拟学名，与乙早已合格发表的另一植物学名完全相同，形成同名。按命名法规，这一后出同名的名称","options":["仍然合法，可以继续使用","加注命名人后即可继续使用","由后一作者自行决定是否采用","不合法，须为该分类群另立新名"],"answer":[3],"explain":"命名法规要求一名一物，同名异物时后出同名不合法，必须为该分类群另立新名，且新名不得沿用该加词。优先律处理的是同一分类群的不同名称即异名，并不能使后出同名合法。","tag":"命名法规"},{"id":"taxonomy-b006","type":"single","stage":1,"stem":"禾本科植物叶片与叶鞘相接处的内侧，常有膜质或毛状的附属物，该结构称为","options":["叶舌","叶耳","叶枕","叶痕"],"answer":[0],"explain":"叶舌位于叶片与叶鞘交界处的内侧，可阻挡雨水和病菌进入叶鞘。叶耳是叶鞘口两侧的耳状突起，叶枕是叶片基部与叶鞘相连处的膨大部分，叶痕是叶片脱落后留在茎上的痕迹。","tag":"禾本科"},{"id":"taxonomy-b007","type":"single","stage":1,"stem":"观察禾本科的一朵小花，由外向内依次排列的结构是","options":["内稃—外稃—浆片—雄蕊—雌蕊","外稃—浆片—内稃—雄蕊—雌蕊","外稃—内稃—浆片—雄蕊—雌蕊","外稃—内稃—雄蕊—浆片—雌蕊"],"answer":[2],"explain":"禾本科小花最外为外稃，其内为内稃，再向内为2枚浆片，然后是雄蕊和中央的雌蕊。浆片位于花的内轮、子房基部，把它排在内稃之外或雄蕊之后都不符合小花的实际结构。","tag":"禾本科"},{"id":"taxonomy-b008","type":"single","stage":1,"stem":"禾本科花序的基本单位，由小穗轴、基部两枚颖片和一至数朵小花组成，称为","options":["颖片","小花","小穗","小穗轴"],"answer":[2],"explain":"小穗是构成禾本科花序的基本单位，基部具2枚颖片，小穗轴上着生1至数朵小花。颖片只是小穗基部的保护结构，小花是小穗的组成单元，小穗轴则为承载小花的轴。","tag":"禾本科"},{"id":"taxonomy-b009","type":"single","stage":1,"stem":"禾本科植物小花的外稃顶端或背部常延伸成针状结构，该结构称为","options":["颖","稃","浆片","芒"],"answer":[3],"explain":"芒着生于外稃顶端或背部，有的种具膝曲的芒柱，可减少水分蒸发并利于传播。颖是包被小穗基部的片状结构，稃指包被小花的外稃和内稃，浆片位于花内与开花有关。","tag":"禾本科"},{"id":"taxonomy-b010","type":"single","stage":1,"stem":"小麦、玉米等禾本科植物的果实，果皮与种皮愈合不易分离，这种果实特称为","options":["瘦果","胞果","坚果","颖果"],"answer":[3],"explain":"颖果的果皮与种皮愈合，种子只含1枚胚，是禾本科果实的特称。瘦果的果皮与种皮可以分离，胞果为藜科等所有，坚果的果皮坚硬木质化，三者均不符合禾本科果实的特征。","tag":"禾本科"},{"id":"taxonomy-b011","type":"single","stage":1,"stem":"玉米雌雄同株，着生于茎顶的雄花序类型是","options":["总状花序","穗状花序","伞形花序","圆锥花序"],"answer":[3],"explain":"玉米茎顶的雄花序由主轴和侧枝组成，属圆锥花序；雌花序生于叶腋，为肉穗花序。总状花序、穗状花序和伞形花序的分枝方式与花着生情况都与玉米雄花序不同。","tag":"禾本科"},{"id":"taxonomy-b015","type":"single","stage":1,"stem":"与禾本科叶鞘边缘分离不同，莎草科植物的叶鞘通常是","options":["边缘分离而相互重叠","闭合呈筒状","仅在基部闭合","完全退化不存"],"answer":[1],"explain":"莎草科叶鞘闭合呈筒状包住茎，禾本科叶鞘边缘分离而重叠，这是两科营养体区分的重要依据。莎草科的叶鞘并未退化，仅基部闭合或边缘重叠的描述都与实际不符。","tag":"莎草科"},{"id":"taxonomy-b016","type":"single","stage":1,"stem":"下列植物中，属于莎草科的是","options":["芦苇","苔草","碱茅","赖草"],"answer":[1],"explain":"苔草为莎草科薹草属植物，茎三棱形、叶三列、叶鞘闭合。芦苇、碱茅和赖草均为禾本科植物，茎圆柱形、叶二列、叶鞘边缘分离，与莎草科明显不同。","tag":"莎草科"},{"id":"taxonomy-b017","type":"single","stage":1,"stem":"莎草科植物的花被通常退化，其存在形式多为","options":["2枚浆片","花瓣状花被片","冠毛","鳞片或下位刚毛"],"answer":[3],"explain":"莎草科花被退化为鳞片状或下位刚毛，有时完全缺如。浆片是禾本科花中的结构，冠毛由菊科的花萼变态而来，花瓣状花被片则常见于百合科等虫媒花植物。","tag":"莎草科"},{"id":"taxonomy-b020","type":"single","stage":1,"stem":"蒲公英等菊科植物果实顶端的毛状结构，是由花的哪一部分变态而来","options":["花萼","花冠","雄蕊","总苞"],"answer":[0],"explain":"菊科的花萼常退化成毛状，称为冠毛，附着于瘦果顶端，可借风力传播。花冠变态形成舌状花或管状花，雄蕊合生成聚药雄蕊，总苞是花序外的苞片层，来源与冠毛不同。","tag":"菊科"},{"id":"taxonomy-b021","type":"single","stage":1,"stem":"菊科头状花序外围包被整个花序的绿色苞片层，称为","options":["花被","颖片","总苞","托叶"],"answer":[2],"explain":"头状花序外方由多层苞片组成总苞，起保护花序的作用。花被是花萼与花冠的合称，颖片是禾本科小穗基部的结构，托叶着生于叶柄基部，三者与总苞并非同一结构。","tag":"菊科"},{"id":"taxonomy-b022","type":"single","stage":1,"stem":"下列各属中，属于菊科的是","options":["薹草属","赖草属","蒿属","黄芪属"],"answer":[2],"explain":"蒿属为菊科植物，头状花序小、常集成圆锥状。薹草属属莎草科，赖草属属禾本科，黄芪属属豆科，三者所属的科在花序和果实类型上都与菊科明显不同。","tag":"菊科"},{"id":"taxonomy-b025","type":"single","stage":1,"stem":"十字花科植物的花萼和花瓣数目分别是","options":["4枚和4枚","4枚和5枚","5枚和4枚","5枚和5枚"],"answer":[0],"explain":"十字花科的花为四基数，萼片4枚、花瓣4枚并呈十字形排列，科名即由此而来。花瓣5枚或萼片5枚是蔷薇科等科的特征，与十字花科的四基数花被不符。","tag":"十字花科"},{"id":"taxonomy-b026","type":"single","stage":1,"stem":"十字花科的角果是由几个心皮合生发育而成的","options":["1个","2个","3个","4个"],"answer":[1],"explain":"角果由2个心皮合生形成，果内具假隔膜，种子着生于假隔膜边缘。1个心皮形成的是荚果或蓇葖果，3个或4个心皮的情况见于其他科，都不是角果的结构。","tag":"十字花科"},{"id":"taxonomy-b028","type":"single","stage":1,"stem":"豆科植物的典型果实是","options":["角果","蓇葖果","瘦果","荚果"],"answer":[3],"explain":"荚果由单心皮发育而成，成熟时沿背缝线和腹缝线开裂，种子着生于果瓣边缘，是豆科的代表性果实。角果具假隔膜、属十字花科，蓇葖果和瘦果与荚果的开裂方式不同。","tag":"豆科"},{"id":"taxonomy-b029","type":"single","stage":1,"stem":"蝶形花冠中，位于最下方、由两枚花瓣合生并包裹雌雄蕊的是","options":["旗瓣","翼瓣","龙骨瓣","唇瓣"],"answer":[2],"explain":"蝶形花冠最上一枚最大的是旗瓣，两侧各一枚为翼瓣，最下方两枚合生呈舟状、包裹雌雄蕊的是龙骨瓣。唇瓣是兰科等花中特化的花瓣，不属于蝶形花冠的组成部分。","tag":"豆科"},{"id":"taxonomy-b030","type":"single","stage":1,"stem":"紫花苜蓿、草木樨等豆科蝶形花亚科植物的花常集成","options":["总状花序","头状花序","伞形花序","穗状花序"],"answer":[0],"explain":"豆科蝶形花亚科多具总状花序，苜蓿属、草木樨属均是如此。头状花序是菊科的典型特征，伞形花序多见于伞形科，穗状花序则常见于禾本科等，都与豆科的花序不同。","tag":"豆科"},{"id":"taxonomy-b033","type":"single","stage":1,"stem":"桃、杏的果实类型是","options":["核果","梨果","蒴果","聚合瘦果"],"answer":[0],"explain":"核果由单心皮上位子房发育而成，外果皮薄、中果皮肉质、内果皮坚硬成核，桃、杏、李均属此类。梨果由下位子房与花托共同发育，蒴果和聚合瘦果则见于其他类群。","tag":"蔷薇科"},{"id":"taxonomy-b034","type":"single","stage":1,"stem":"关于蔷薇科花的结构，下列描述正确的是","options":["花4基数，雄蕊6枚，为四强雄蕊","花3基数，花被片6枚，子房下位","花5基数，萼片、花瓣各5枚，雄蕊多数","花冠唇形，雄蕊2枚，子房4裂"],"answer":[2],"explain":"蔷薇科花多为5基数，萼片5、花瓣5，雄蕊多数，萼片、花瓣和雄蕊着生于杯状或隆起的花托边缘。四基数四强雄蕊、三基数花被片和唇形花冠分别属于其他科，不是蔷薇科的特征。","tag":"蔷薇科"},{"id":"taxonomy-b037","type":"single","stage":1,"stem":"藜科植物种子的胚，其形态通常为","options":["直立型","环形或螺旋形","弯曲呈钩状","退化而不明显"],"answer":[1],"explain":"藜科种子具丰富的胚乳，胚细长呈环形或螺旋形，环绕胚乳生长，这是识别该科的重要依据。直立胚、钩状胚和胚退化的情形分别见于其他类群，都不符合藜科的情况。","tag":"藜科"},{"id":"taxonomy-b038","type":"single","stage":1,"stem":"藜科植物的花小，常簇生后再排列成","options":["头状花序","穗状或圆锥状花序","伞形花序","隐头花序"],"answer":[1],"explain":"藜科花小、常单被或无被，多3至5朵簇生，再由小花簇排列成穗状或圆锥状花序。头状花序是菊科的特征，伞形花序见于伞形科，隐头花序为桑科榕属所有。","tag":"藜科"},{"id":"taxonomy-b041","type":"single","stage":1,"stem":"紫花苜蓿是重要的优良牧草，其形态特征是","options":["蝶形花冠、荚果、三出复叶","十字形花冠、角果、单叶","头状花序、瘦果、羽状复叶","穗状花序、颖果、须根系"],"answer":[0],"explain":"紫花苜蓿属豆科苜蓿属，具三出复叶和蝶形花冠，果实为荚果，种子小、肾形。十字花冠与角果、头状花序与瘦果、穗状花序与颖果分别属于十字花科、菊科和禾本科。","tag":"常见饲用植物"},{"id":"taxonomy-b042","type":"single","stage":1,"stem":"下列牧草中，属于豆科的是","options":["无芒雀麦","沙打旺","羊草","老芒麦"],"answer":[1],"explain":"沙打旺为豆科黄芪属多年生草本，可作饲草、绿肥和水土保持植物。无芒雀麦、羊草和老芒麦均为禾本科牧草，花序为圆锥花序或穗状花序，果实为颖果，与豆科明显不同。","tag":"常见饲用植物"},{"id":"taxonomy-b043","type":"single","stage":1,"stem":"与禾本科饲草相比，豆科饲草在营养上的主要特点是","options":["粗蛋白质和钙含量较高","粗纤维含量高，蛋白质含量低","各种营养成分与禾本科完全相同","不含矿物质和维生素"],"answer":[0],"explain":"豆科饲草因根瘤固氮，粗蛋白质和钙含量一般高于禾本科饲草；禾本科饲草碳水化合物含量高、粗纤维较多。两类饲草营养互补，故成分完全相同或不含矿物质的说法均错误。","tag":"常见饲用植物"},{"id":"taxonomy-b046","type":"single","stage":1,"stem":"在植物分类的等级序列中，包含植物种类最多、成员间亲缘关系最宽泛的等级是","options":["科","属","种","目"],"answer":[3],"explain":"等级越高，所含种类越多、成员间亲缘关系越宽泛。目高于科、属、种，包含种类最多；种是分类的基本单位，同种个体亲缘关系最近。","tag":"分类等级"},{"id":"taxonomy-b047","type":"single","stage":1,"stem":"按双名法书写的植物学名中，首字母必须大写、并与种加词一同排成斜体的部分是","options":["属名","种加词","命名人姓氏","科名"],"answer":[0],"explain":"学名由属名和种加词组成，属名首字母大写，种加词全小写，两者排斜体；命名人姓氏用正体且可缩写，排于种加词之后；科名不出现在双名法学名之中。","tag":"双名法"},{"id":"taxonomy-b048","type":"single","stage":1,"stem":"甲、乙两位研究者先后用同一个学名指称两种完全不同的植物，且甲的发表在前。按命名法规，乙所发表的名称应视为","options":["早出异名，应予保留","晚出同名，必须废弃","合格名称，可继续使用","保留名称，可长期沿用"],"answer":[1],"explain":"同一名称指称两种不同植物属同名，后发表者为晚出同名，依优先律必须废弃并另立新名。异名是不同名称指称同一分类群，保留名须经法规程序专门保留。","tag":"命名法规"},{"id":"taxonomy-b052","type":"single","stage":1,"stem":"禾本科植物叶片与叶鞘交界处的内侧，常有一片向上突起的膜状结构，称为","options":["叶耳","托叶","叶舌","副卫细胞"],"answer":[2],"explain":"叶舌位于叶片与叶鞘交界处的内侧，可阻挡雨水、病菌和害虫进入叶鞘。叶耳是叶鞘口两侧的耳状突起，不呈膜片状；禾本科无托叶。","tag":"禾本科"},{"id":"taxonomy-b053","type":"single","stage":1,"stem":"禾本科植物的叶在茎上呈两行排列、相邻叶的叶鞘互相抱茎，这种叶序称为","options":["对生","轮生","螺旋状互生","二列互生"],"answer":[3],"explain":"禾本科叶为二列互生（1/2叶序），相邻两叶的叶鞘相对抱茎。对生指同一节上两叶相对，轮生指三叶以上绕节排列，均不符合此特征。","tag":"禾本科"},{"id":"taxonomy-b054","type":"single","stage":1,"stem":"水稻的小穗着生于分枝的穗轴上，形成松散下垂的花序，其类型是","options":["圆锥花序","穗状花序","肉穗花序","头状花序"],"answer":[0],"explain":"水稻小穗着生于分枝的穗轴上，形成圆锥花序；小麦为复穗状花序，小穗直接排列于穗轴两侧；玉米雌穗为肉穗花序，头状花序是菊科特征。","tag":"禾本科"},{"id":"taxonomy-b055","type":"single","stage":1,"stem":"禾本科小穗中，位于两枚颖片之上、具雌雄蕊并能结实的花称为","options":["不育花","能育花","中性花","退化花"],"answer":[1],"explain":"小穗内能正常结实的花为能育花，仅有雄蕊或雌雄蕊退化的为不育花、中性花。二者在小穗上的位置与数目是识别禾草的重要依据。","tag":"禾本科"},{"id":"taxonomy-b060","type":"single","stage":1,"stem":"禾本科植物花被退化成浆片，柱头多呈羽毛状并外露，花药悬垂于花外，这些特征适应于","options":["虫媒传粉","水媒传粉","风媒传粉","鸟媒传粉"],"answer":[2],"explain":"花被退化成浆片、柱头羽毛状外露、花药悬垂易被风吹散，都是风媒传粉的适应。虫媒花一般具鲜艳花被、蜜腺和黏性花粉。","tag":"禾本科"},{"id":"taxonomy-b061","type":"single","stage":1,"stem":"与禾本科叶呈二列排列不同，莎草科植物的叶在茎上通常呈","options":["二列排列","对生","轮生","三列排列"],"answer":[3],"explain":"莎草科叶多呈三列排列，茎常三棱形；禾本科叶为二列互生，茎多圆柱形。二列排列是禾本科特征，不能套用于莎草科。","tag":"莎草科"},{"id":"taxonomy-b062","type":"single","stage":1,"stem":"莎草科植物的花被通常退化成","options":["下位刚毛或鳞片","两枚肉质浆片","羽毛状冠毛","杯状花萼筒"],"answer":[0],"explain":"莎草科花被退化为下位刚毛或鳞片，有时完全缺如；两枚肉质浆片是禾本科特征，羽毛状冠毛由菊科花萼变态而来，花萼筒见于蔷薇科。","tag":"莎草科"},{"id":"taxonomy-b065","type":"single","stage":1,"stem":"苔草属（Carex）的雌花外包被一个瓶状或囊状的结构，成熟时包住果实，该结构是","options":["由外稃形成的颖片","由先出叶形成的果囊","由花被形成的花萼筒","由总苞片形成的总苞"],"answer":[1],"explain":"苔草属雌花外包有由先出叶形成的果囊（囊苞），成熟时包裹子房和果实，其形状、脉纹是分种的重要依据；颖片由苞片或颖片形成，与果囊来源不同。","tag":"莎草科"},{"id":"taxonomy-b066","type":"single","stage":1,"stem":"菊科头状花序基部，承托整个花序的多数苞片总称为","options":["颖片","佛焰苞","总苞","花被"],"answer":[2],"explain":"菊科头状花序外方由多层苞片组成总苞，起保护作用；颖片是禾本科小穗基部的结构，佛焰苞为天南星科等的特征，均不承托头状花序。","tag":"菊科"},{"id":"taxonomy-b067","type":"single","stage":1,"stem":"蒲公英果实顶端呈伞状的毛状结构，便于风力传播，它由花的哪一部分变态而来","options":["花冠","花托","雄蕊","花萼"],"answer":[3],"explain":"菊科花萼常变态为冠毛，果期宿存于瘦果顶端，便于风力传播；花冠变态为舌状花或管状花，花托膨大承托小花，都不形成冠毛。","tag":"菊科"},{"id":"taxonomy-b068","type":"single","stage":1,"stem":"蒲公英、莴苣等植物全为舌状花、植物体具乳汁，它们属于菊科的","options":["舌状花亚科","管状花亚科","绣线菊亚科","蝶形花亚科"],"answer":[0],"explain":"菊科分舌状花亚科与管状花亚科：前者头状花序全为舌状花、植株具乳汁，蒲公英、莴苣属之；向日葵中央为管状花，属管状花亚科。","tag":"菊科"},{"id":"taxonomy-b071","type":"single","stage":1,"stem":"十字花科植物的子房内具一层假隔膜，将子房分隔成","options":["1室","2室","4室","多室"],"answer":[1],"explain":"十字花科子房上位，由2枚心皮合生，假隔膜（次生隔膜）将子房分成2室，种子着生于胎座两侧，果实为角果。","tag":"十字花科"},{"id":"taxonomy-b073","type":"single","stage":1,"stem":"下列植物中，属于十字花科的是","options":["蒲公英","车前","荠菜","稗草"],"answer":[2],"explain":"荠菜具十字形花冠、四强雄蕊和短角果，属十字花科；蒲公英属菊科，车前属车前科，稗草属禾本科，可据花部与果实特征区分。","tag":"十字花科"},{"id":"taxonomy-b074","type":"single","stage":1,"stem":"豆科的荚果由几枚心皮发育而成，成熟时沿背、腹两条缝线开裂","options":["2枚","3枚","多枚离生","1枚"],"answer":[3],"explain":"荚果由单心皮发育而成，是豆科的典型果实，成熟时沿背缝线与腹缝线开裂；角果由2枚心皮发育，可与荚果区分。","tag":"豆科"},{"id":"taxonomy-b075","type":"single","stage":1,"stem":"豆科植物根部常形成根瘤，其形成是根系与根瘤菌共生，根瘤的主要功能是","options":["固定空气中的氮素","吸收土壤中的磷","贮藏光合产物","分泌有机酸溶解矿物质"],"answer":[0],"explain":"根瘤菌侵入根部形成根瘤，把大气中的游离氮还原为含氮化合物供植物利用，故根瘤的主要功能是固氮；吸收磷、贮藏养分均非根瘤的功能。","tag":"豆科"},{"id":"taxonomy-b078","type":"single","stage":1,"stem":"豆科荚果内的种子着生于","options":["子房中央的中轴胎座","腹缝线处的边缘胎座","子房壁上的侧膜胎座","子房基部的特立中央胎座"],"answer":[1],"explain":"荚果由单心皮构成，种子着生于腹缝线处的边缘胎座上；中轴胎座、侧膜胎座见于多心皮合生的子房，特立中央胎座见于石竹科等。","tag":"豆科"},{"id":"taxonomy-b079","type":"single","stage":1,"stem":"桃的果实为核果，其食用的肥厚多汁部分由","options":["内果皮发育而来","外果皮发育而来","中果皮发育而来","花托发育而来"],"answer":[2],"explain":"核果外果皮薄、中果皮肉质可食、内果皮坚硬成核，故桃的食用部分为中果皮；苹果、梨的食用部分由花托发育，属梨果。","tag":"蔷薇科"},{"id":"taxonomy-b080","type":"single","stage":1,"stem":"蔷薇科植物的花被通常为","options":["4基数，萼片4、花瓣4","3基数，萼片3、花瓣3","6基数，萼片6、花瓣6","5基数，萼片5、花瓣5"],"answer":[3],"explain":"蔷薇科花两性，萼片、花瓣通常各5枚，雄蕊多数，5基数为其稳定特征；4基数是十字花科特征，3基数为单子叶植物所常见。","tag":"蔷薇科"},{"id":"taxonomy-b082","type":"single","stage":1,"stem":"蔷薇科划分亚科的主要依据是","options":["心皮数目、子房位置和果实类型","花冠颜色和花期早晚","叶形和叶缘锯齿的有无","雄蕊数目和花药着生方式"],"answer":[0],"explain":"蔷薇科按心皮数目、离生或合生、子房位置及果实类型分为绣线菊、蔷薇、苹果、李四个亚科；花色、叶形等易受环境影响，不作分亚科依据。","tag":"蔷薇科"},{"id":"taxonomy-b083","type":"single","stage":1,"stem":"下列植物中，属于藜科的是","options":["荠菜","菠菜","狗尾草","马齿苋"],"answer":[1],"explain":"菠菜花小、单被，雄蕊与花被片对生，果实为胞果，属藜科；荠菜属十字花科，狗尾草属禾本科，马齿苋属马齿苋科。","tag":"藜科"},{"id":"taxonomy-b084","type":"single","stage":1,"stem":"灰绿藜等藜科植物的叶表面常呈灰绿色，主要原因是表皮具有","options":["发达的蜡质层","大量黏液细胞","泡状毛和粉状物","厚的角质层"],"answer":[2],"explain":"藜科叶表常被泡状毛，毛破裂后形成粉状物，使叶呈灰绿色，可减少水分蒸发、适应盐碱干旱环境；蜡质层和厚角质层并非呈灰绿色的主因。","tag":"藜科"},{"id":"taxonomy-b085","type":"single","stage":1,"stem":"藜科植物的小花通常密集着生，其花序的基本单位是","options":["头状花序","伞形花序","葇荑花序","团伞花序"],"answer":[3],"explain":"藜科花小，常由数花聚成团伞花序，再排成穗状或圆锥状；头状花序为菊科特征，伞形花序为伞形科特征，葇荑花序见于杨柳科等。","tag":"藜科"},{"id":"taxonomy-b086","type":"single","stage":1,"stem":"紫花苜蓿是优良的豆科牧草，其根系类型及特点是","options":["直根系，主根入土深，抗旱性强","须根系，根系分布浅，耐旱性弱","不定根系，多生于茎基","气生根系，可吸收空气水分"],"answer":[0],"explain":"紫花苜蓿为直根系，主根可深入土层数米，抗旱、耐瘠能力强；须根系是禾本科牧草的典型特征，气生根多见于热带植物。","tag":"常见饲用植物"},{"id":"taxonomy-b087","type":"single","stage":1,"stem":"羊草在典型草原上常形成单优势种群落，其扩大繁殖主要依靠","options":["地下块茎的休眠芽","发达的根状茎进行营养繁殖","地上匍匐茎的节间生根","鳞茎的分瓣繁殖"],"answer":[1],"explain":"羊草具发达根状茎，可迅速进行营养繁殖并占据地面，形成单优势种群落；块茎、鳞茎分别是马铃薯、洋葱等的繁殖器官。","tag":"常见饲用植物"},{"id":"taxonomy-b090","type":"single","stage":1,"stem":"天然草地上将豆科牧草与禾本科牧草混播，最主要的优点是","options":["便于机械化收割和运输","延长牧草生育期，便于多次刈割","提高饲草产量与品质，并改善氮素供应","减少土壤水分消耗，降低蒸腾"],"answer":[2],"explain":"豆科牧草通过根瘤固氮为禾草提供氮素，混播群体产量高、蛋白质含量与适口性均改善；混播并不改变生育期，群体耗水通常增加。","tag":"常见饲用植物"},{"id":"taxonomy-b091","type":"single","stage":1,"stem":"植物分类学中，同一物种的个体之间的关系是","options":["形态特征相似，能相互交配并产生可育后代","形态完全相同，个体之间不存在任何变异","必须分布在同一个地区内，不能跨区分布","只能进行无性繁殖，不能产生种子"],"answer":[0],"explain":"种是植物分类的基本单位，指形态和生理特性相似、能相互交配并产生可育后代、占有一定分布区的个体群。同种个体存在变异，B错误；分布区可跨地区，C错误；多数植物行有性繁殖，D错误。","tag":"分类等级"},{"id":"taxonomy-b092","type":"single","stage":1,"stem":"按照双名法书写植物学名，正确的格式是","options":["属名首字母大写，种加词全部小写，学名整体排斜体","属名和种加词首字母均大写，学名整体排正体","属名小写，种加词首字母大写，学名整体排斜体","属名首字母大写，种加词全部大写，学名整体排正体"],"answer":[0],"explain":"双名法的学名由属名和种加词构成，属名首字母大写、种加词全部小写，整体排斜体。B项把大小写规则弄反，C项属名小写、种加词大写，D项用正体，均不合规范。","tag":"双名法"},{"id":"taxonomy-b093","type":"single","stage":1,"stem":"植物命名法规规定，种子植物名称的命名起点著作是林奈1753年发表的","options":["《自然系统》","《中国植物志》","《本草纲目》","《植物种志》"],"answer":[3],"explain":"种子植物（含蕨类）名称的命名起点为林奈1753年出版的《植物种志》。《自然系统》《中国植物志》及李时珍的《本草纲目》均不是命名起点，故只有D正确。","tag":"命名法规"},{"id":"taxonomy-b095","type":"single","stage":1,"stem":"小麦、水稻等禾本科作物的籽粒，在植物学上属于","options":["瘦果","颖果","荚果","蒴果"],"answer":[1],"explain":"禾本科作物的籽粒为颖果，果皮与种皮愈合不易分离，内含1粒种子。瘦果为菊科等所有，果皮与种皮分离；荚果属豆科；蒴果开裂散出多粒种子，故A、C、D错误。","tag":"禾本科"},{"id":"taxonomy-b096","type":"single","stage":1,"stem":"禾本科植物叶片基部与叶鞘相接处的内侧，常有一片膜质附属物，称为","options":["叶耳","叶枕","叶舌","托叶"],"answer":[2],"explain":"叶舌位于叶片与叶鞘相接处的内侧，多为膜质，可阻挡雨水和病菌进入叶鞘。叶耳是叶鞘口两侧的耳状突起，叶枕为叶片基部的膨大部分，托叶多见于双子叶植物，故A、B、D错误。","tag":"禾本科"},{"id":"taxonomy-b097","type":"single","stage":1,"stem":"禾本科花序的基本组成单位是","options":["小花","小穗","颖片","总苞"],"answer":[1],"explain":"小穗是禾本科花序的基本单位，由基部2枚颖片和1至多朵小花组成。小花、颖片都是小穗的组成部分，总苞为菊科头状花序的结构，故A、C、D错误。","tag":"禾本科"},{"id":"taxonomy-b098","type":"single","stage":1,"stem":"禾本科中，秆木质化、多年生，叶片与叶鞘连接处具关节而易于脱落的类群是","options":["禾亚科","黍亚科","早熟禾亚科","竹亚科"],"answer":[3],"explain":"竹亚科秆多木质化，叶片基部具短柄，与叶鞘连接处有关节，落叶时叶片连同短柄脱落。禾亚科、黍亚科、早熟禾亚科多为草本，叶片与叶鞘间无关节，故A、B、C错误。","tag":"禾本科"},{"id":"taxonomy-b099","type":"single","stage":1,"stem":"禾本科植物多为风媒传粉，其雌蕊柱头的典型形态是","options":["头状且表面具黏液","盘状而平滑","羽毛状，分枝展开","盾状并包被花药"],"answer":[2],"explain":"禾本科柱头多呈羽毛状并伸出花外，增大接收花粉的面积，是适应风媒传粉的典型结构。头状具黏液、盘状平滑多见于虫媒植物，盾状并包被花药的结构并不存在，故A、B、D错误。","tag":"禾本科"},{"id":"taxonomy-b103","type":"single","stage":1,"stem":"苔草、芦苇、灯心草和狗尾草中，属于莎草科的是","options":["芦苇","苔草","灯心草","狗尾草"],"answer":[1],"explain":"苔草属茎三棱形、叶鞘闭合、果实为小坚果，属莎草科。芦苇和狗尾草属禾本科，具开放叶鞘和颖果；灯心草属灯心草科，故A、C、D错误。","tag":"莎草科"},{"id":"taxonomy-b104","type":"single","stage":1,"stem":"莎草科植物的小花通常具有的结构是","options":["花被退化为下位刚毛或鳞片，雄蕊通常3枚","花被为两枚肉质浆片，雄蕊6枚","花冠为舌状，雄蕊合生成聚药雄蕊","花冠为蝶形，雄蕊9+1二体"],"answer":[0],"explain":"莎草科小花花被退化为下位刚毛或鳞片，有时完全缺如，雄蕊通常3枚；两枚浆片是禾本科特征，舌状花冠和聚药雄蕊属菊科，蝶形花冠和二体雄蕊属豆科。","tag":"莎草科"},{"id":"taxonomy-b107","type":"single","stage":1,"stem":"菊科头状花序的外方，由多层总苞片组成、起保护作用的结构是","options":["花萼","花托","总苞","副萼"],"answer":[2],"explain":"菊科头状花序基部由多层总苞片组成总苞，包围并保护花序及小花。花萼多变态为冠毛，花托是承载小花的膨大花序轴，副萼见于锦葵科等，故A、B、D错误。","tag":"菊科"},{"id":"taxonomy-b108","type":"single","stage":1,"stem":"向日葵的“瓜子”剥去外壳后可见1粒种子，其在植物学上属于","options":["颖果","瘦果","蒴果","核果"],"answer":[1],"explain":"向日葵的“瓜子”为瘦果，由下位子房发育，含1粒种子，果皮与种皮分离。颖果为禾本科所有，果皮与种皮愈合；蒴果开裂，核果具肉质中果皮，故A、C、D错误。","tag":"菊科"},{"id":"taxonomy-b109","type":"single","stage":1,"stem":"菊科植物花萼的常见变态形式是","options":["冠毛","刚毛","浆片","蜜腺"],"answer":[0],"explain":"菊科花萼多变态为冠毛，如蒲公英果实顶端的毛状冠毛，有利于果实随风传播。刚毛为莎草科花被的变态，浆片为禾本科花被的变态，蜜腺并非花萼的变态，故B、C、D错误。","tag":"菊科"},{"id":"taxonomy-b110","type":"single","stage":1,"stem":"下列菊科植物中，头状花序全部由舌状花组成的是","options":["向日葵","艾蒿","菊芋","蒲公英"],"answer":[3],"explain":"蒲公英头状花序全由舌状花组成，小花均具舌状花冠。向日葵、菊芋外围为舌状花、中央为管状花，艾蒿以管状花为主，故A、B、C错误。","tag":"菊科"},{"id":"taxonomy-b113","type":"single","stage":1,"stem":"十字花科植物花冠的典型特征是","options":["花瓣4枚，排成十字形","花瓣5枚，排成蝶形","花瓣5枚，合生成筒状","无花瓣，花被单层"],"answer":[0],"explain":"十字花科花冠由4枚分离花瓣组成，排列成十字形，科名即由此而来。蝶形花冠为豆科特征，合生成筒的花冠见于菊科管状花等，无花瓣者与本科不符，故B、C、D错误。","tag":"十字花科"},{"id":"taxonomy-b114","type":"single","stage":1,"stem":"十字花科植物子房内，将子房室隔成两室的结构是","options":["中轴胎座","真隔膜","假隔膜","胚乳"],"answer":[2],"explain":"十字花科为侧膜胎座，子房1室，由心皮边缘延伸形成假隔膜，把子房隔成2室，果熟时沿两缝线开裂。中轴胎座见于合生心皮子房，真隔膜由心皮本身形成，胚乳与分隔无关，故A、B、D错误。","tag":"十字花科"},{"id":"taxonomy-b117","type":"single","stage":1,"stem":"大豆的豆荚在植物学上属于","options":["角果","荚果","蓇葖果","胞果"],"answer":[1],"explain":"豆荚为荚果，由单心皮发育，成熟时沿背缝线和腹缝线开裂。角果为十字花科所有，蓇葖果见于蔷薇科绣线菊亚科，胞果为藜科特征，故A、C、D错误。","tag":"豆科"},{"id":"taxonomy-b118","type":"single","stage":1,"stem":"豆科植物的子房由1枚心皮构成，其胚珠着生的部位是","options":["子房中央的中轴胎座上","子房壁的侧膜胎座上","子房顶端的悬垂胎座上","腹缝线的边缘胎座上"],"answer":[3],"explain":"豆科为单心皮子房，胚珠着生于腹缝线的边缘胎座上，果熟时沿背、腹两条缝线开裂成荚果。中轴胎座、侧膜胎座见于合生心皮子房，悬垂胎座描述的是胚珠着生方式，故A、B、C错误。","tag":"豆科"},{"id":"taxonomy-b119","type":"single","stage":1,"stem":"豆科植物根部常形成根瘤，其形成过程和主要作用是","options":["真菌侵染根系，分解土壤有机质","根瘤菌侵入根毛，固定空气中的游离氮","线虫刺激根组织，吸收土壤水分","根系分泌黏液，黏结土壤颗粒"],"answer":[1],"explain":"根瘤由根瘤菌侵入根毛后刺激根组织增生形成，菌体把空气中的游离氮还原成氨供植物利用，同时从植物获取碳水化合物。真菌侵染形成的是菌根，线虫和黏液均与固氮无关，故A、C、D错误。","tag":"豆科"},{"id":"taxonomy-b120","type":"single","stage":1,"stem":"豆科植物的种子通常","options":["有发达胚乳，子叶细小","有胚乳，胚乳与子叶均肉质","无胚乳，子叶肥厚并贮存养分","无胚乳，养分由胚柄从母体继续供给"],"answer":[2],"explain":"豆科种子多无胚乳，养分贮存在肥厚的子叶中，萌发时子叶出土或留土。禾本科等有发达胚乳；种子成熟后由胚柄继续供应养分的说法不符合实际，故A、B、D错误。","tag":"豆科"},{"id":"taxonomy-b123","type":"single","stage":1,"stem":"月季、玫瑰茎上着生的刺，按其起源属于","options":["皮刺","枝刺","叶刺","托叶刺"],"answer":[0],"explain":"月季、玫瑰茎上的刺由表皮和皮层组织形成，内部无维管组织，剥落时不留痕迹，属皮刺。枝刺由枝条变态而来，叶刺和托叶刺分别由叶、托叶变态形成，故B、C、D错误。","tag":"蔷薇科"},{"id":"taxonomy-b124","type":"single","stage":1,"stem":"蔷薇科植物的叶片基部两侧常具一对附属物，称为","options":["叶舌","叶耳","鳞片","托叶"],"answer":[3],"explain":"蔷薇科叶互生，多在叶柄基部具一对托叶。叶舌、叶耳是禾本科叶片与叶鞘相接处的结构，鳞片为芽或花序上的变态叶，故A、B、C错误。","tag":"蔷薇科"},{"id":"taxonomy-b127","type":"single","stage":1,"stem":"藜科植物的花小而不显著，通常集成","options":["头状花序","聚伞花序，再组成穗状或圆锥状","伞形花序","肉穗花序"],"answer":[1],"explain":"藜科的花小，常为聚伞花序，再排成穗状、圆锥状或团伞状。头状花序为菊科特征，伞形花序见于伞形科等，肉穗花序见于天南星科，故A、C、D错误。","tag":"藜科"},{"id":"taxonomy-b128","type":"single","stage":1,"stem":"藜科植物多生于盐碱、干旱生境，其叶片常见的适应特征是","options":["叶片宽大薄软，气孔密集","叶退化为鳞片，靠茎进行光合","叶肉质，表面被白粉或毛，减少蒸腾","叶具发达通气组织，浮于水面"],"answer":[2],"explain":"藜科植物叶常肉质化，表面被白粉或泡状毛，可减少蒸腾并适应盐碱、干旱环境。宽大薄软叶、鳞片状叶和水生通气组织分别适应阴湿、干旱和水生环境，故A、B、D错误。","tag":"藜科"},{"id":"taxonomy-b131","type":"single","stage":1,"stem":"有“牧草之王”之称、蛋白质含量高、适于调制干草的优良豆科牧草是","options":["羊草","苏丹草","多花黑麦草","紫花苜蓿"],"answer":[3],"explain":"紫花苜蓿为豆科苜蓿属多年生草本，蛋白质含量高、再生力强、产量稳定，被称为“牧草之王”。羊草、苏丹草、多花黑麦草均为禾本科牧草，蛋白质含量较低，故A、B、C错误。","tag":"常见饲用植物"},{"id":"taxonomy-b132","type":"single","stage":1,"stem":"我国北方草原广泛分布、具发达根状茎、耐牧耐盐碱的优良禾本科牧草是","options":["白三叶","羊草","草木樨","沙打旺"],"answer":[1],"explain":"羊草为禾本科赖草属多年生草本，根状茎发达，耐牧、耐盐碱，是北方草原的重要建群种和优良牧草。白三叶、草木樨、沙打旺均为豆科植物，故A、C、D错误。","tag":"常见饲用植物"},{"id":"taxonomy-b133","type":"single","stage":1,"stem":"在南方农区广泛栽培、分蘖多、叶量丰富、适于青饲和放牧的禾本科饲草是","options":["红三叶","紫云英","多花黑麦草","沙打旺"],"answer":[2],"explain":"多花黑麦草为禾本科黑麦草属一年生或短多年生草本，分蘖力强、叶量丰富、品质好，适于青饲和放牧。红三叶、紫云英、沙打旺均为豆科饲草，故A、B、D错误。","tag":"常见饲用植物"},{"id":"taxonomy-s01","type":"single","stem":"按照植物分类的基本等级，下列由低到高的排列正确的是","options":["种—属—科—目—纲—门","种—科—属—目—纲—门","属—种—科—目—门—纲","种—属—目—科—纲—门"],"answer":[0],"explain":"植物分类的基本等级依次为种、属、科、目、纲、门，科是属的上一级，目是科的上一级。B把科置于属前，C把属置于种前，D把目置于科前，均违背等级顺序，基本等级不可随意颠倒。","tag":"分类等级","level":1,"stage":1,"standard":true},{"id":"taxonomy-s02","type":"single","stem":"双名法规定每种植物学名由两部分组成，其正确构成是","options":["属名+种加词","科名+属名","属名+命名人","种加词+变种名"],"answer":[0],"explain":"双名法的学名由属名和种加词构成，属名首字母大写，种加词小写，印刷时整体斜体，命名人置于其后。科名、命名人及变种名都不是双名法的主体部分。","tag":"双名法","level":1,"stage":1,"standard":true},{"id":"taxonomy-s03","type":"single","stem":"发表新种时，命名人指定并永久附于该学名之下的那份标本称为","options":["主模式标本","等模式标本","副模式标本","后选模式标本"],"answer":[0],"explain":"主模式（holotype）是发表新分类群时指定的一份模式标本，是名称的永久依附对象；等模式是主模式的复份，副模式是其余引证标本，后选模式是后来补选的。","tag":"命名法规","level":1,"stage":1,"standard":true},{"id":"taxonomy-s06","type":"single","stem":"禾本科小穗基部通常有2枚颖片，小穗内每朵能育小花的外方直接包被的结构是","options":["外稃","内稃","浆片","颖片"],"answer":[0],"explain":"禾本科小穗基部为2枚颖片，其内为1至多朵小花；每朵小花由外稃、内稃及花被退化的浆片、雄蕊、雌蕊组成。外稃位于小花最外方，内稃是其内方的膜质结构。","tag":"禾本科","level":1,"stage":1,"standard":true},{"id":"taxonomy-s07","type":"single","stem":"小麦小花开放时，使外稃与内稃撑开、便于花药伸出授粉的结构是","options":["浆片","花药","柱头","颖片"],"answer":[0],"explain":"浆片是禾本科花被退化的产物，通常2枚，位于子房基部；开花时吸水膨胀，将外稃与内稃撑开。花药、柱头是繁殖器官，颖片位于小穗基部，均不承担撑开稃片的作用。","tag":"禾本科","level":1,"stage":1,"standard":true},{"id":"taxonomy-s08","type":"single","stem":"观察小麦的一朵能育小花，其雄蕊数目通常为","options":["3枚","6枚","9枚","10枚"],"answer":[0],"explain":"小麦等多数禾本科植物的小花具3枚雄蕊，花丝细长，花药丁字着生。稻、竹等少数禾本科植物可有6枚雄蕊；9枚和10枚不是禾本科的典型数目，因此小麦小花应记为3枚雄蕊。","tag":"禾本科","level":1,"stage":1,"standard":true},{"id":"taxonomy-s10","type":"single","stem":"莎草科植物的果实类型是","options":["小坚果","颖果","荚果","角果"],"answer":[0],"explain":"莎草科子房上位，果实为小坚果，常三棱形，果皮坚硬，内含1枚种子；颖果是禾本科特征，荚果属豆科，角果属十字花科。小坚果与颖果的差异可用于区分莎草科和禾本科。","tag":"莎草科","level":1,"stage":1,"standard":true},{"id":"taxonomy-s11","type":"single","stem":"向日葵等菊科植物的头状花序外围，通常着生有","options":["舌状花","管状花","蝶形花","假蝶形花"],"answer":[0],"explain":"菊科头状花序的花托上密集着生无柄小花，向日葵外围为舌状花，中央为管状花；舌状花冠常呈舌片状，管状花冠呈筒状。蝶形花和假蝶形花分别是豆科蝶形花亚科、云实亚科的花冠类型。","tag":"菊科","level":1,"stage":1,"standard":true},{"id":"taxonomy-s12","type":"single","stem":"菊科小花中，花丝分离而花药合生成筒状包围花柱，这种雄蕊类型称为","options":["聚药雄蕊","二体雄蕊","四强雄蕊","单体雄蕊"],"answer":[0],"explain":"菊科雄蕊通常5枚，花丝分离、花药合生成筒状，称聚药雄蕊，是菊科的重要性状。二体雄蕊见于豆科，四强雄蕊见于十字花科，单体雄蕊如锦葵科，均不是菊科特征。","tag":"菊科","level":1,"stage":1,"standard":true},{"id":"taxonomy-s13","type":"single","stem":"十字花科植物花中，外轮2枚雄蕊较短、内轮4枚较长，这种雄蕊类型称为","options":["四强雄蕊","二强雄蕊","二体雄蕊","聚药雄蕊"],"answer":[0],"explain":"十字花科花萼、花瓣各4枚，雄蕊6枚，外轮2短、内轮4长，为四强雄蕊。二强雄蕊见于唇形科等，二体雄蕊见于豆科，聚药雄蕊见于菊科，注意名称相近但结构不同。","tag":"十字花科","level":1,"stage":1,"standard":true},{"id":"taxonomy-s14","type":"single","stem":"十字花科植物的典型果实是","options":["角果","荚果","蒴果","瘦果"],"answer":[0],"explain":"十字花科果实由2心皮合生，具假隔膜，成熟时沿两侧缝线开裂，为角果，有长角果和短角果之分。荚果由1心皮发育，是豆科特征；蒴果和瘦果并非该科典型果实。","tag":"十字花科","level":1,"stage":1,"standard":true},{"id":"taxonomy-s15","type":"single","stem":"蝶形花冠的5枚花瓣排列不对称，其中位于最外方、通常最大的一枚称为","options":["旗瓣","翼瓣","龙骨瓣","唇瓣"],"answer":[0],"explain":"蝶形花冠由1枚旗瓣、2枚翼瓣和2枚龙骨瓣组成；旗瓣位于最外方且最大，翼瓣位于两侧，龙骨瓣在最内方，常合生。唇瓣是兰科等花被的特化结构；旗瓣、翼瓣和龙骨瓣的排列是识别蝶形花冠的关键。","tag":"豆科","level":1,"stage":1,"standard":true},{"id":"taxonomy-s16","type":"single","stem":"大豆的花具10枚雄蕊，其中9枚花丝合生、1枚分离，这种雄蕊类型是","options":["二体雄蕊","单体雄蕊","四强雄蕊","聚药雄蕊"],"answer":[0],"explain":"大豆属蝶形花亚科，雄蕊10枚，9枚花丝合生成管、1枚分离，称二体雄蕊（9+1）。单体雄蕊是花丝全部合生，四强雄蕊见于十字花科，聚药雄蕊为花药合生，均与此不同。","tag":"豆科","level":1,"stage":1,"standard":true},{"id":"taxonomy-b002","type":"multi","stage":1,"stem":"关于植物分类等级，下列叙述正确的有","options":["种是植物分类的基本单位","科由亲缘关系相近的属归并而成","亚种是种以下的自然分类等级","品种是植物分类学上的自然等级"],"answer":[0,1,2],"explain":"种是基本单位，属、科由亲缘相近的类群逐级归并；亚种、变种、变型均为种下的自然分类等级。品种是人工选育的栽培群体，不属于自然分类等级，故第四项错误。","tag":"分类等级"},{"id":"taxonomy-b012","type":"multi","stage":1,"stem":"关于禾本科小穗与花的结构，下列叙述正确的有","options":["禾本科的小花全部为两性花","小穗基部通常具2枚颖片","每朵小花具外稃和内稃各1枚","浆片通常2枚，位于内稃之内、子房基部"],"answer":[1,2,3],"explain":"小穗基部有2枚颖片，小花由外稃、内稃包被，内有2枚浆片及雄蕊、雌蕊。玉米等的小穗含单性花，故第一项错误，禾本科并非所有小花都为两性花。","tag":"禾本科"},{"id":"taxonomy-b013","type":"multi","stage":1,"stem":"下列禾本科属的特征配对，正确的有","options":["小麦属：复穗状花序，小穗单生于穗轴各节","水稻属：小穗含3朵两性花，外稃均具长芒","玉米属：雌花序为肉穗花序，生于叶腋","赖草属：穗状花序，小穗2至数枚生于穗轴同一节"],"answer":[0,2,3],"explain":"小麦为复穗状花序，小穗单生于穗轴节上；玉米雌花序为腋生肉穗花序；赖草属小穗2至数枚簇生于穗轴节。水稻小穗仅含1朵两性花，下方2枚为退化外稃，故第二项错误。","tag":"禾本科"},{"id":"taxonomy-b018","type":"multi","stage":1,"stem":"下列莎草科各属的特征，叙述正确的有","options":["薹草属（苔草）：叶三列，花单性，同株或异株","藨草属（水葱）：茎圆柱形，叶片退化为叶鞘","莎草属：果实为颖果，种子无胚乳","荸荠属：具地下球茎，球茎可食用"],"answer":[0,1,3],"explain":"苔草属叶三列、花单性，水葱叶片退化成鞘状而茎圆柱形，荸荠以地下球茎供食。莎草科果实为瘦果或小坚果，颖果是禾本科果实的特称，故第三项错误。","tag":"莎草科"},{"id":"taxonomy-b023","type":"multi","stage":1,"stem":"下列菊科植物与特征的配对，正确的有","options":["莴苣属：果实为荚果，种子无胚乳","向日葵：头状花序，瘦果含油丰富","蒲公英：全部为舌状花，瘦果具冠毛","蒿属：头状花序小，多集成圆锥状"],"answer":[1,2,3],"explain":"向日葵为大头状花序、瘦果含油；蒲公英头状花序全由舌状花组成，瘦果具冠毛；蒿属头状花序小且常集成圆锥状。莴苣属果实为瘦果而非荚果，荚果是豆科的特征，故第一项错误。","tag":"菊科"},{"id":"taxonomy-b027","type":"multi","stage":1,"stem":"关于十字花科植物的花与果实，下列叙述正确的有","options":["花两性，辐射对称，萼片4枚","花瓣4枚，十字形排列，常具长爪","子房下位，果实为浆果","雄蕊6枚，外轮2枚短、内轮4枚长"],"answer":[0,1,3],"explain":"十字花科花两性、辐射对称，萼片和花瓣各4枚，花瓣具长爪排成十字形；雄蕊6枚，为四强雄蕊。其子房上位，果实为角果而非浆果，故第三项错误。","tag":"十字花科"},{"id":"taxonomy-b031","type":"multi","stage":1,"stem":"关于豆科植物的形态特征，下列叙述正确的有","options":["叶常为羽状或三出复叶，多具托叶","果实为角果，由假隔膜分为两室","花萼5裂，花冠多为蝶形，雄蕊10枚","荚果由单心皮发育，种子着生于腹缝线"],"answer":[0,2,3],"explain":"豆科多为复叶且具托叶；花萼5裂、花冠多为蝶形、雄蕊10枚而常成二体雄蕊；荚果由单心皮发育，种子着生于腹缝线。角果具假隔膜是十字花科的特征，故第二项错误。","tag":"豆科"},{"id":"taxonomy-b035","type":"multi","stage":1,"stem":"蔷薇科各亚科的果实类型，配对正确的有","options":["李亚科：角果","绣线菊亚科：蓇葖果或蒴果","蔷薇亚科：瘦果或小核果，常成聚合果","苹果亚科：梨果"],"answer":[1,2,3],"explain":"绣线菊亚科多蓇葖果，蔷薇亚科为瘦果或小核果并常成聚合果，苹果亚科为梨果，李亚科为核果。角果是十字花科的特征，李亚科的果实并非角果，故第一项错误。","tag":"蔷薇科"},{"id":"taxonomy-b039","type":"multi","stage":1,"stem":"藜科植物适应盐碱生境的特征包括","options":["花大而鲜艳，依靠昆虫传粉提高结实率","叶肉质，含水量高，可稀释体内盐分","茎叶表面具盐腺，能将盐分排出体外","根系发达，能在高盐土壤中吸水"],"answer":[1,2,3],"explain":"藜科多为盐生植物，叶肉质储水以稀释盐分，部分种类具盐腺可泌盐，根系发达以适应高盐干旱土壤。其花小、单被，多为风媒或自花传粉，并非花大鲜艳的虫媒花，故第一项错误。","tag":"藜科"},{"id":"taxonomy-b044","type":"multi","stage":1,"stem":"关于常见饲用植物的分类归属与特性，下列叙述正确的有","options":["紫花苜蓿、草木樨均属豆科，根系发达","羊草、无芒雀麦、老芒麦均属禾本科","苔草、水葱均属禾本科","碱蓬、盐爪爪均属藜科"],"answer":[0,1,3],"explain":"苜蓿和草木樨为豆科，根系发达、耐旱；羊草、无芒雀麦、老芒麦为禾本科牧草；碱蓬、盐爪爪为藜科盐生植物。苔草和水葱属莎草科而非禾本科，故第三项错误。","tag":"常见饲用植物"},{"id":"taxonomy-b051","type":"multi","stage":1,"stem":"关于植物学名的书写与引用，下列叙述正确的是","options":["属名首字母大写，其余字母小写","种加词一律小写","学名在印刷或书写时整体排斜体","命名人姓氏用斜体，紧接于属名之后"],"answer":[0,1,2],"explain":"属名首字母大写、种加词全小写，学名整体排斜体；命名人姓氏用正体，紧接于种加词之后，并不排在属名之后，故该项叙述错误。","tag":"命名法规"},{"id":"taxonomy-b056","type":"multi","stage":1,"stem":"关于禾本科植物茎和叶的形态特征，下列叙述正确的是","options":["秆有明显的节和节间，节间常中空","叶由叶片和叶鞘组成，二列互生","茎内维管束排列成一圈，具形成层","叶片与叶鞘交界处常有叶舌"],"answer":[0,1,3],"explain":"禾本科秆有明显节和节间，节间常中空，叶二列互生并具叶舌；其维管束散生于基本组织中、无形成层，茎不能逐年增粗，故“排列成一圈、具形成层”错误。","tag":"禾本科"},{"id":"taxonomy-b057","type":"multi","stage":1,"stem":"关于禾本科常见作物花序的类型，下列叙述正确的是","options":["小麦为复穗状花序","玉米的雌花序为穗状花序","水稻为圆锥花序","玉米的雄花序为圆锥花序"],"answer":[0,2,3],"explain":"小麦小穗着生于穗轴两侧成复穗状，水稻为圆锥花序，玉米雄穗亦为圆锥花序；玉米雌穗为肉穗花序而非穗状花序，故该项错误。","tag":"禾本科"},{"id":"taxonomy-b063","type":"multi","stage":1,"stem":"下列属中，属于莎草科的是","options":["芦苇属（Phragmites）","苔草属（Carex）","莎草属（Cyperus）","荸荠属（Eleocharis）"],"answer":[1,2,3],"explain":"苔草属、莎草属、荸荠属均属莎草科，果实为瘦果或小坚果；芦苇属属禾本科，具小穗、颖片与颖果，是湿地常见的高大禾草。","tag":"莎草科"},{"id":"taxonomy-b069","type":"multi","stage":1,"stem":"关于菊科两个亚科的特征，下列叙述正确的是","options":["舌状花亚科的头状花序全由舌状花组成","舌状花亚科植物体内常有乳汁","管状花亚科的头状花序中央为管状花","向日葵属于舌状花亚科"],"answer":[0,1,2],"explain":"舌状花亚科全为舌状花且常具乳汁；管状花亚科中央为管状花。向日葵头状花序中央为管状花，应归管状花亚科，故“向日葵属于舌状花亚科”错误。","tag":"菊科"},{"id":"taxonomy-b076","type":"multi","stage":1,"stem":"关于豆科蝶形花亚科的花，下列叙述正确的是","options":["花辐射对称，花瓣在花蕾中呈镊合状排列","花两侧对称","旗瓣位于最外方，通常最大","龙骨瓣包被雄蕊和雌蕊"],"answer":[1,2,3],"explain":"蝶形花冠下降覆瓦状排列，旗瓣最外且最大，龙骨瓣位于最内并包被雌雄蕊，花两侧对称；辐射对称、镊合状排列是含羞草亚科的特征。","tag":"豆科"},{"id":"taxonomy-b081","type":"multi","stage":1,"stem":"关于蔷薇科植物的特征，下列叙述正确的是","options":["叶互生，常具托叶","花两性，萼片与花瓣通常各5枚","果实均为蒴果，种子多数","雄蕊多数，心皮1至多数"],"answer":[0,1,3],"explain":"蔷薇科叶互生、常具托叶，花5基数、雄蕊多数，心皮1至多数；果实为蓇葖果、瘦果、梨果或核果，并非都为蒴果，故该项错误。","tag":"蔷薇科"},{"id":"taxonomy-b088","type":"multi","stage":1,"stem":"豆科牧草作为饲草，其优良特性包括","options":["粗蛋白质含量较高","茎叶木质素含量高，消化率很高","根部具根瘤，能固定空气中的氮","适口性好，家畜喜食"],"answer":[0,2,3],"explain":"豆科牧草粗蛋白质含量高、适口性好，并可通过根瘤固氮改良土壤；木质素含量高会使消化率下降，故“木质素高、消化率很高”自相矛盾。","tag":"常见饲用植物"},{"id":"taxonomy-b089","type":"multi","stage":1,"stem":"关于优良牧草的选择与利用，下列叙述正确的是","options":["豆科牧草含糖量低，单独青贮比禾本科更易成功","禾本科牧草抽穗至开花期刈割，营养价值较高","禾本科牧草分蘖力强，较耐践踏和放牧","豆科与禾本科牧草混播可提高产量和品质"],"answer":[1,2,3],"explain":"禾本科牧草抽穗开花期营养较高、分蘖力强而耐牧，与豆科混播可兼顾产量与品质；豆科牧草含糖量低、缓冲能力差，单独青贮不易成功。","tag":"常见饲用植物"},{"id":"taxonomy-b100","type":"multi","stage":1,"stem":"禾本科植物适应风媒传粉的特征包括","options":["花冠鲜艳并具发达蜜腺，吸引昆虫","花被退化为浆片，花小而多","柱头呈羽毛状，伸出花外","花药丁字着生，花丝细长"],"answer":[1,2,3],"explain":"禾本科花被退化为浆片、花小而多，柱头羽毛状，花药丁字着生且花丝细长，都利于风媒传粉。A项“花冠鲜艳、具蜜腺”是虫媒花特征，与禾本科不符，其余三项正确。","tag":"禾本科"},{"id":"taxonomy-b101","type":"multi","stage":1,"stem":"关于禾本科主要作物的花序类型，下列对应正确的是","options":["小麦的穗为复穗状花序","豌豆的花序为复穗状花序","水稻的花序为圆锥花序","玉米的雌花序为肉穗花序"],"answer":[0,2,3],"explain":"小麦小穗着生于穗轴两侧，形成复穗状花序；水稻为圆锥花序；玉米雌花序为肉穗花序。豌豆属豆科，花单生或成总状花序，不具复穗状花序，故B项错误。","tag":"禾本科"},{"id":"taxonomy-b105","type":"multi","stage":1,"stem":"关于莎草科的形态特征，下列叙述正确的是","options":["茎通常三棱形，实心，节不明显","叶三列排列，叶鞘闭合","小穗由多数鳞片和花组成，花两性或单性","花被发达，呈鲜艳的花瓣状"],"answer":[0,1,2],"explain":"莎草科茎多三棱形、实心且节不明显，叶三列、叶鞘闭合，小穗由多数鳞片和花组成，花两性或单性。其花被退化为刚毛或鳞片，不呈花瓣状，故D错误。","tag":"莎草科"},{"id":"taxonomy-b111","type":"multi","stage":1,"stem":"关于菊科植物的生活型和经济价值，下列叙述正确的是","options":["有草本和灌木，少数为乔木或藤本","向日葵、红花为油料作物","菊芋块茎可食用或饲用，艾蒿、菊花可药用或观赏","菊科全为一二年生草本，没有多年生种类"],"answer":[0,1,2],"explain":"菊科生活型多样，有草本、灌木，少数为乔木或藤本；向日葵、红花为油料作物，菊芋块茎可食或饲用，艾蒿、菊花可药用或观赏。菊科有多年生种类，D项错误。","tag":"菊科"},{"id":"taxonomy-b115","type":"multi","stage":1,"stem":"关于十字花科植物的花序和叶，下列叙述正确的是","options":["花两性，辐射对称，常组成总状花序","果实成熟时花序轴明显伸长","叶互生，基生叶常呈莲座状","叶对生，具托叶"],"answer":[0,1,2],"explain":"十字花科花多两性、辐射对称，常组成总状花序，果期花序轴伸长；叶互生，基生叶常呈莲座状。叶对生并具托叶不是本科特征，故D项错误。","tag":"十字花科"},{"id":"taxonomy-b121","type":"multi","stage":1,"stem":"豆科植物在草地农业和农业生产中的作用包括","options":["全部为一年生草本，便于轮作倒茬","通过根瘤菌固氮，提高土壤氮素含量","蛋白质含量高，是优质豆科饲草和精料","与禾本科牧草混播，可提高草地产量和品质"],"answer":[1,2,3],"explain":"豆科能通过根瘤菌固氮提高土壤氮素，蛋白质含量高，是优质饲草和精料，与禾草混播可提高草地产量和品质。豆科生活型多样，有草本、灌木和乔木，并非全为一年生，A项错误。","tag":"豆科"},{"id":"taxonomy-b125","type":"multi","stage":1,"stem":"蔷薇科植物的花和果实，下列叙述正确的是","options":["花萼、花瓣常为5数，雄蕊多数","子房上位或下位，花托常参与果实形成","花冠为蝶形花冠，两侧对称","果实类型多样，有蓇葖果、瘦果、梨果和核果等"],"answer":[0,1,3],"explain":"蔷薇科花多为5基数、雄蕊多数，子房上位或下位、花托常参与形成假果，果实有蓇葖果、瘦果、梨果和核果等。蝶形花冠为豆科特征，故C项错误。","tag":"蔷薇科"},{"id":"taxonomy-b129","type":"multi","stage":1,"stem":"藜科植物在盐碱地治理和草地利用中的意义体现在","options":["碱蓬、盐爪爪等可作盐碱地指示植物和改良先锋","灰绿藜、盐爪爪等可作骆驼和羊的饲草","全部为水生植物，可用于水体净化","菠菜、甜菜等为常见蔬菜和糖料作物"],"answer":[0,1,3],"explain":"藜科多耐盐碱，碱蓬、盐爪爪可指示和改良盐碱地并作饲草，菠菜、甜菜是常见蔬菜和糖料作物。藜科以旱生、盐生草本为主，并非水生植物，C项错误。","tag":"藜科"},{"id":"taxonomy-b134","type":"multi","stage":1,"stem":"下列关于常见饲用植物的叙述，正确的是","options":["籽粒苋为禾本科植物，其籽实可作精饲料","沙打旺为豆科黄芪属植物，耐旱耐瘠，可饲用并用于水土保持","苏丹草为禾本科高粱属一年生草本，再生力强，适于青饲","紫云英为豆科黄芪属一年生草本，常作绿肥和饲草"],"answer":[1,2,3],"explain":"沙打旺、紫云英均为豆科黄芪属植物，分别用于饲用、水土保持和绿肥；苏丹草为禾本科高粱属一年生饲草。A项籽粒苋属苋科，不是禾本科，故错误。","tag":"常见饲用植物"},{"id":"taxonomy-m01","type":"multi","stem":"下列属于禾本科（Poaceae）识别特征的是","options":["秆通常圆柱形，节间中空，叶二列排列","叶鞘常开裂，叶舌常存在","果实为颖果，种子含丰富胚乳","秆三棱形，叶三列排列，果实为小坚果"],"answer":[0,1,2],"explain":"禾本科秆多圆柱形、节间中空，叶二列，叶鞘常开裂并具叶舌，果实为颖果。D描述的是莎草科，其秆常三棱、叶三列、果实为小坚果，不能作为禾本科特征。","tag":"禾本科","level":1,"stage":1,"standard":true},{"id":"taxonomy-m03","type":"multi","stem":"藜科植物的主要识别特征包括","options":["花小，常为单被花，花被片常5枚，雄蕊与花被片同数对生","果实常为胞果，种子具外胚乳，胚弯曲","叶互生或对生，常肉质，体表常具泡状毛或粉霜","花具蝶形花冠，雄蕊二体，果实为荚果"],"answer":[0,1,2],"explain":"藜科花小，单被，花被片常5，雄蕊与花被片对生；果实常为胞果，种子具外胚乳，胚弯曲；叶互生或对生，常肉质，常被泡状毛或粉霜。D是豆科特征，不属于藜科。","tag":"藜科","level":1,"stage":1,"standard":true},{"id":"taxonomy-b005","type":"judge","stage":1,"stem":"同一分类群只能有一个符合法规的正确名称，因此一个分类群不可能存在异名。","options":["正确","错误"],"answer":[1],"explain":"错误。正确名称的唯一性与异名的存在并不矛盾：同一分类群若先后有多个合法名称，按优先律取最早合格发表者为正确名称，其余名称作为异名保留，故一个分类群常有几个异名。","tag":"命名法规"},{"id":"taxonomy-b014","type":"judge","stage":1,"stem":"禾本科是单子叶植物中经济价值最高的科之一，小麦、玉米、水稻和甘蔗均属于该科。","options":["正确","错误"],"answer":[0],"explain":"正确。小麦、玉米、水稻、甘蔗、高粱等主要粮食和糖料作物都是禾本科植物，该科还是草地畜牧业最重要的饲草来源，因此在单子叶植物中经济价值最高。","tag":"禾本科"},{"id":"taxonomy-b019","type":"judge","stage":1,"stem":"苔草属植物的雌花包被于由先出叶形成的果囊中，果囊是该属识别的重要依据。","options":["正确","错误"],"answer":[0],"explain":"正确。苔草属雌花外面包有由先出叶形成的囊状结构即果囊，果囊的形状、脉纹和喙的有无是该属分种的重要依据，也是莎草科中识别苔草属的关键特征。","tag":"莎草科"},{"id":"taxonomy-b024","type":"judge","stage":1,"stem":"菊科植物全部为草本，不含有木本种类。","options":["正确","错误"],"answer":[1],"explain":"错误。菊科虽以草本为主，但也含灌木和乔木，如菊属中有半灌木，千里光属中有木本种类。判断菊科的范围主要依据头状花序、聚药雄蕊和瘦果等特征，而非植株是否为草本。","tag":"菊科"},{"id":"taxonomy-b032","type":"judge","stage":1,"stem":"豆科植物根部的根瘤是根瘤菌侵入根组织后形成的共生结构，能固定空气中的氮素。","options":["正确","错误"],"answer":[0],"explain":"正确。根瘤菌侵入根部皮层形成根瘤，把空气中的氮还原成氨供植物利用，植物则供给碳水化合物，属互利共生。这一特性使豆科饲草蛋白质含量较高，也有利于土壤培肥。","tag":"豆科"},{"id":"taxonomy-b036","type":"judge","stage":1,"stem":"蔷薇科绣线菊亚科的植物多为草本，果实为瘦果。","options":["正确","错误"],"answer":[1],"explain":"错误。绣线菊亚科多为灌木，果实为蓇葖果或蒴果；以草本为主、果实为瘦果或小核果并常形成聚合果的是蔷薇亚科。该陈述把两个亚科的特征混淆了。","tag":"蔷薇科"},{"id":"taxonomy-b040","type":"judge","stage":1,"stem":"碱蓬、盐爪爪等藜科植物常作为盐碱地的指示植物，可用于判断土壤的盐碱化程度。","options":["正确","错误"],"answer":[0],"explain":"正确。碱蓬、盐爪爪等对土壤盐分有特定的适应范围，其分布和长势能反映土壤含盐量，因而常被用作盐碱地指示植物，也是盐碱地植被恢复的先锋种类。","tag":"藜科"},{"id":"taxonomy-b045","type":"judge","stage":1,"stem":"沙打旺是禾本科多年生牧草，主要用于调制干草和放牧。","options":["正确","错误"],"answer":[1],"explain":"错误。沙打旺是豆科黄芪属多年生草本，并非禾本科。它根系发达、耐旱耐瘠，可固氮培肥，常用于饲草、绿肥和水土保持，题干对其科的归属判断有误。","tag":"常见饲用植物"},{"id":"taxonomy-b049","type":"judge","stage":1,"stem":"种是植物分类的基本单位，因此同一科内的植物比同一属内的植物亲缘关系更近。","options":["正确","错误"],"answer":[1],"explain":"前半句正确，后半句错误。属是科的下一级分类等级，同属植物比同科植物亲缘关系更近；科包含多个属，成员间形态差异通常更大。","tag":"分类等级"},{"id":"taxonomy-b050","type":"judge","stage":1,"stem":"双名法规定，植物学名中的种加词首字母必须大写，以便与属名相区别。","options":["正确","错误"],"answer":[1],"explain":"错误。种加词一律小写，即使来自人名、地名也不大写；首字母大写的是属名。学名中属名与种加词均排斜体，命名人姓氏用正体。","tag":"双名法"},{"id":"taxonomy-b058","type":"judge","stage":1,"stem":"禾本科植物的果实为颖果，其果皮与种皮愈合，种子不易与果皮分离。","options":["正确","错误"],"answer":[0],"explain":"正确。颖果是禾本科特有的果实类型，由单粒种子构成，果皮与种皮紧密愈合，生产中常把颖果直接当作种子使用。","tag":"禾本科"},{"id":"taxonomy-b059","type":"judge","stage":1,"stem":"禾本科的一朵能育小花中，外稃与内稃之间通常着生3枚浆片。","options":["正确","错误"],"answer":[1],"explain":"错误。禾本科小花中浆片通常为2枚，肉质，开花时吸水膨胀将外稃与内稃撑开；雄蕊通常为3枚，不能把雄蕊数目误作浆片数目。","tag":"禾本科"},{"id":"taxonomy-b064","type":"judge","stage":1,"stem":"莎草科植物的花通常具3枚雄蕊，子房上位，柱头2～3裂。","options":["正确","错误"],"answer":[0],"explain":"正确。莎草科花小，雄蕊通常3枚（少为1～2枚），子房上位、1室，柱头2～3裂，果实为瘦果或小坚果。","tag":"莎草科"},{"id":"taxonomy-b070","type":"judge","stage":1,"stem":"菊科的头状花序由多数小花密集着生于扁平或隆起的花托上，外方有总苞包围。","options":["正确","错误"],"answer":[0],"explain":"正确。头状花序是菊科最典型的识别特征，小花无柄、密集着生于扁平或隆起的花托上，外方由总苞片包围，小花分管状花与舌状花两类。","tag":"菊科"},{"id":"taxonomy-b072","type":"judge","stage":1,"stem":"十字花科植物多为草本，叶互生，植株表面常具单毛、分叉毛或星状毛。","options":["正确","错误"],"answer":[0],"explain":"正确。十字花科多为一年生至多年生草本，叶互生、无托叶，植株被单毛、分叉毛或星状毛，毛被类型是分属的重要依据。","tag":"十字花科"},{"id":"taxonomy-b077","type":"judge","stage":1,"stem":"豆科含羞草亚科的花为两侧对称，雄蕊通常10枚。","options":["正确","错误"],"answer":[1],"explain":"错误。含羞草亚科花辐射对称，雄蕊多数且常仅基部合生；两侧对称、雄蕊10枚（9+1二体）是蝶形花亚科的特征。","tag":"豆科"},{"id":"taxonomy-b094","type":"judge","stage":1,"stem":"不同属的植物可以使用相同的种加词，但在同一属内不能有两个种使用相同的种加词。","options":["正确","错误"],"answer":[0],"explain":"法规只要求种加词在同一属内不重复，不同属之间可以使用相同种加词，如 sativa、officinalis 常被多个属使用。该陈述符合同名限制的规定，故正确。","tag":"命名法规"},{"id":"taxonomy-b102","type":"judge","stage":1,"stem":"禾本科的每个小穗中都含有多朵小花，不存在只含1朵小花的小穗。","options":["正确","错误"],"answer":[1],"explain":"禾本科小穗含1至多朵小花，如针茅属等不少种类的小穗只有1朵能育小花，并非都含多朵。小花的数目和排列是分属、分种的重要依据，故该陈述错误。","tag":"禾本科"},{"id":"taxonomy-b106","type":"judge","stage":1,"stem":"荸荠的食用部分由地下茎末端膨大形成，其植物属于莎草科。","options":["正确","错误"],"answer":[0],"explain":"荸荠为莎草科荸荠属植物，食用部分是地下匍匐茎末端膨大形成的球茎，不是块根或果实。其茎三棱形、叶鞘闭合，也符合莎草科特征，故正确。","tag":"莎草科"},{"id":"taxonomy-b112","type":"judge","stage":1,"stem":"向日葵的“花盘”实际上是一个头状花序，由许多小花密集着生而成。","options":["正确","错误"],"answer":[0],"explain":"向日葵花盘为头状花序，花序托上密集着生管状花和外围的舌状花，看似一朵大花，实为许多小花组成的花序，该陈述正确。","tag":"菊科"},{"id":"taxonomy-b116","type":"judge","stage":1,"stem":"十字花科植物的种子有发达胚乳，子叶细小。","options":["正确","错误"],"answer":[1],"explain":"十字花科种子无胚乳，养分贮存在发达而弯曲的胚的子叶中，子叶缘倚或背倚。发达胚乳、子叶细小的特征见于禾本科等，与本科不符，故错误。","tag":"十字花科"},{"id":"taxonomy-b122","type":"judge","stage":1,"stem":"豆科植物的叶多为复叶，叶柄和小叶基部具叶枕，含羞草的小叶可因刺激而闭合。","options":["正确","错误"],"answer":[0],"explain":"豆科叶多为羽状或三出复叶，叶柄和小叶基部具叶枕；含羞草受刺激后小叶因叶枕细胞膨压变化而闭合。复叶、叶枕和荚果是识别豆科的常见特征，故该陈述正确。","tag":"豆科"},{"id":"taxonomy-b126","type":"judge","stage":1,"stem":"蔷薇科各亚科的果实类型相同，均为梨果。","options":["正确","错误"],"answer":[1],"explain":"蔷薇科各亚科果实不同：绣线菊亚科为蓇葖果，蔷薇亚科为瘦果，苹果亚科为梨果，梅亚科为核果。梨果只是其中一类，并非各亚科相同，故该陈述错误。","tag":"蔷薇科"},{"id":"taxonomy-b130","type":"judge","stage":1,"stem":"藜科植物多生于湿润的淡水环境，是水生植被的主要成分。","options":["正确","错误"],"answer":[1],"explain":"藜科以旱生、盐生种类为主，多分布于干旱和盐碱生境，如盐爪爪、碱蓬，并非水生植物，也不构成水生植被。故该陈述错误。","tag":"藜科"},{"id":"taxonomy-b135","type":"judge","stage":1,"stem":"草木樨为豆科草木樨属植物，根系发达、耐旱耐瘠，可作饲草、绿肥和水土保持植物。","options":["正确","错误"],"answer":[0],"explain":"草木樨属豆科草木樨属，主根发达、耐旱耐瘠，植株含香豆素，可作饲草、绿肥和水土保持植物。其适应性和利用方式与陈述一致，故正确。","tag":"常见饲用植物"},{"id":"taxonomy-i001","type":"single","stage":2,"stem":"某研究者在同一分布区内发现两个居群，其差异仅表现为花色深浅和毛被疏密，居群间存在连续过渡。按照现行命名法规，将其作为种下等级处理时，最恰当的等级是","options":["亚种","变种","变型","栽培品种"],"answer":[2],"explain":"变型用于种内单一或少数性状（如花色、毛被）的微小而稳定的差异；亚种要求有地理分化且多个性状相关，变种介于二者之间，栽培品种受栽培植物命名法规管理而非自然种下等级，故A、B、D不当。","tag":"分类等级"},{"id":"taxonomy-i002","type":"single","stage":2,"stem":"禾本科植物叶片与叶鞘交界处内侧生有膜质或毛状的叶舌，从结构与功能的关系看，叶舌的主要作用是","options":["扩大叶片受光面积以提高光合速率","阻挡雨水、病原物和害虫进入叶鞘与茎之间","增强茎秆的机械强度以防止倒伏","储存水分以缓解干旱胁迫"],"answer":[1],"explain":"叶舌紧贴茎秆，可阻止雨水、病菌和害虫进入叶鞘抱茎处，起保护作用。扩大受光面积主要靠叶片本身，茎秆强度取决于机械组织，叶舌又无储水功能，故A、C、D均把功能张冠李戴。","tag":"禾本科"},{"id":"taxonomy-i004","type":"single","stage":2,"stem":"莎草科薹草属（Carex）的小穗常单性，其雌花外包被一个瓶状或囊状结构，果实成熟时包于其中。该结构称为","options":["果囊（囊苞）","内稃","小苞片","花被筒"],"answer":[0],"explain":"薹草属雌花的先出叶愈合成瓶状果囊，包裹小坚果，是该属最关键的分类性状。内稃是禾本科花内结构，小苞片不能形成包裹果实的囊体，莎草科花被已退化而无花被筒，故B、C、D错误。","tag":"莎草科"},{"id":"taxonomy-i006","type":"single","stage":2,"stem":"紫花苜蓿的一个亚种学名写作 Medicago sativa L. subsp. falcata (L.) Arcang.，其中 falcata 这一部分表示","options":["属名","种加词","命名人","亚种加词"],"answer":[3],"explain":"双名之后再添一个亚种加词即构成三名法，故 falcata 为亚种加词。Medicago 是属名，sativa 是种加词，Arcang. 为组合命名人，A、B、C 的位置与含义均不符。","tag":"双名法"},{"id":"taxonomy-i007","type":"single","stage":2,"stem":"蒲公英的果实顶端有一轮白色冠毛，随风传播。从花部结构来源看，冠毛是由下列哪一部分退化变态形成的","options":["花冠","雄蕊","花萼","花柱"],"answer":[2],"explain":"菊科花萼退化为冠毛、鳞片或消失，冠毛宿存于连萼瘦果顶端，利于风媒传播。舌状花冠由花冠形成，雄蕊合生成聚药雄蕊，花柱顶端二裂，均不能形成冠毛，故A、B、D错误。","tag":"菊科"},{"id":"taxonomy-i009","type":"single","stage":2,"stem":"豆科的荚果与十字花科的角果都呈细长形，二者的本质区别在于","options":["荚果由二心皮合生，种子着生于假隔膜边缘","荚果由单心皮发育，无假隔膜，种子着生于腹缝线","荚果由离生心皮发育，成熟时不开裂","荚果由下位子房发育，外果皮与花托愈合"],"answer":[1],"explain":"荚果由单心皮上位子房发育，成熟时沿背腹两缝开裂，种子着生于腹缝线，无假隔膜。二心皮合生并具假隔膜的是角果，离生心皮与下位子房也不符合荚果特征，故A、C、D错误。","tag":"豆科"},{"id":"taxonomy-i010","type":"single","stage":2,"stem":"禾本科分竹亚科与禾亚科，野外区分二者最关键的营养体性状组合是","options":["秆是否木质化，叶片与叶鞘连接处有无关节及叶片是否易脱落","小穗颖片的数目以及外稃是否具芒","雄蕊数目以及花药的着生方式","果实为颖果还是瘦果"],"answer":[0],"explain":"竹亚科秆木质化，叶片具短柄，与叶鞘相连处有关节，叶片脱落而叶鞘宿存；禾亚科秆草质，叶片不脱落。颖片、芒与雄蕊数目在两类群中均有变化，禾本科果实又都是颖果，故B、C、D不能区分。","tag":"禾本科"},{"id":"taxonomy-i011","type":"single","stage":2,"stem":"十字花科的角果成熟时由下向上开裂，种子并未散落于果皮内壁，而是整齐着生在中央的膜状结构上。该结构是","options":["花托","胚乳","内果皮","假隔膜（胎座框）"],"answer":[3],"explain":"十字花科子房一室，具侧膜胎座，两心皮边缘愈合处形成假隔膜，把子房分为两室，种子着生于其边缘，角果开裂后假隔膜宿存。花托、胚乳和内果皮都不构成这一膜状结构，故A、B、C错误。","tag":"十字花科"},{"id":"taxonomy-i013","type":"single","stage":2,"stem":"蔷薇科李亚科（梅亚科）植物如桃、李、杏，其果实类型是","options":["梨果","蓇葖果","核果","聚合瘦果"],"answer":[2],"explain":"李亚科为单心皮上位子房，果实为核果，外果皮薄、中果皮肉质、内果皮坚硬成核。梨果是苹果亚科特征，蓇葖果见于绣线菊亚科，聚合瘦果见于蔷薇亚科，故A、B、D张冠李戴。","tag":"蔷薇科"},{"id":"taxonomy-i014","type":"single","stage":2,"stem":"某属名先后被两位作者独立用于两个不同的植物类群，形成同名关系。按现行命名法规，在无保留名的情况下，晚出同名的处理是","options":["仍然合法，可继续使用","不合法，必须废弃并为其所指类群另拟新名","自动降为异名，无需另拟新名即可使用","由后一作者自行决定是否继续使用"],"answer":[1],"explain":"同名指同一名称用于不同分类群，后发表者构成晚出同名，违反一名一物原则因而不合法，须废弃并为该分类群另拟新名。若为同一分类群的重复发表则属异名，故A、C、D均混淆了同名与异名。","tag":"命名法规"},{"id":"taxonomy-i016","type":"single","stage":2,"stem":"藜科植物种子中，胚常呈环形或螺旋形弯曲并围绕粉质胚乳。这一性状在分类学上的意义是","options":["是藜科稳定的种子性状，常与花部特征配合用于科属鉴定","与植物的光合途径类型直接相关","决定胞果成熟时的颜色","与花被片数目存在固定对应关系"],"answer":[0],"explain":"胚环形或螺旋形并围绕粉质胚乳，是藜科稳定的种子性状，常与花小、单被、雄蕊与花被片对生、胞果等性状配合用于鉴定。光合类型、果实颜色和花被数目与胚形并无固定关联，故B、C、D错误。","tag":"藜科"},{"id":"taxonomy-i017","type":"single","stage":2,"stem":"小麦、水稻等禾本科植物的柱头呈羽毛状并伸出花外，这一形态的适应意义是","options":["保护胚珠免受雨水浸渍","便于昆虫停留取食花粉","分泌黏液黏住来访昆虫","增大柱头接受花粉的面积，适应风媒传粉"],"answer":[3],"explain":"禾本科为风媒花，花被退化为浆片，羽毛状柱头增大受粉面积并外露于稃片之外，便于截获风传花粉。昆虫传粉并非其适应方式，柱头不分泌黏液，保护胚珠的是子房壁，故A、B、C错误。","tag":"禾本科"},{"id":"taxonomy-i019","type":"single","stage":2,"stem":"在含盐量较高的滨海盐土上建立植被时，下列植物中最适宜作为改良先锋的是","options":["紫花苜蓿","白三叶","碱蓬","多年生黑麦草"],"answer":[2],"explain":"碱蓬为藜科盐生植物，耐盐能力强，可在重度盐碱地生长并在体内积累盐分，起到改良先锋作用。紫花苜蓿、白三叶和黑麦草耐盐性中等或较弱，需待土壤脱盐后才能正常生长，故A、B、D不宜。","tag":"常见饲用植物"},{"id":"taxonomy-i021","type":"single","stage":2,"stem":"某禾草花标本观察结果为：浆片2枚，雄蕊6枚，柱头2裂。据此判断，该标本最可能来自","options":["小麦属","稻属（水稻）","玉米属","莎草科薹草属"],"answer":[1],"explain":"禾本科多数种类雄蕊3枚，稻属为6枚，是科内重要例外，且具2枚浆片、柱头2裂，符合禾本科特征。小麦、玉米雄蕊均为3枚；薹草属属莎草科，花被退化为刚毛而非浆片，故A、C、D错误。","tag":"禾本科"},{"id":"taxonomy-i022","type":"single","stage":2,"stem":"同为草地植物，莎草科多数种类的饲用价值通常低于禾本科，从植物体结构看，主要原因是","options":["茎叶硅质和纤维素含量高、质地粗糙，适口性差","完全不含蛋白质，不能提供营养","全为一年生植物，地上生物量很低","不进行光合作用，不能积累有机物"],"answer":[0],"explain":"莎草科茎叶机械组织发达，硅质与纤维素含量高，质地粗糙，家畜采食少、消化率低，故饲用价值较低。其幼嫩时仍含蛋白质，且多为多年生，绿色植物能进行光合作用，B、C、D说法绝对化，错误。","tag":"莎草科"},{"id":"taxonomy-i024","type":"single","stage":2,"stem":"豆科植物叶柄和小叶柄基部常明显膨大，称为叶枕。从结构与功能的关系看，叶枕的主要作用是","options":["储存大量淀粉供种子发育","分泌黏液以黏捕害虫","增加叶片厚度以提高抗寒性","通过细胞的膨压变化使叶片运动，减少强光干旱下的水分散失"],"answer":[3],"explain":"叶枕由薄壁细胞组成，膨压改变引起叶片开合或下垂，可减少强光下水分蒸腾与机械损伤，是豆科常见的感震性运动结构。储存淀粉、分泌黏液和加厚抗寒都不是叶枕的功能，故A、B、C错误。","tag":"豆科"},{"id":"taxonomy-i025","type":"single","stage":2,"stem":"向日葵头状花序中央的管状花与边缘的舌状花相比，二者花冠对称性的差异是","options":["管状花两侧对称，舌状花辐射对称","二者均为辐射对称","管状花辐射对称，舌状花两侧对称","二者均为两侧对称"],"answer":[2],"explain":"管状花花冠5裂、辐射对称，舌状花花冠连合成片并向一侧展开，属两侧对称。同科花序内出现两种对称性，正是菊科花部变化丰富的表现，故A把二者说反，B、D的判断错误。","tag":"菊科"},{"id":"taxonomy-i027","type":"single","stage":2,"stem":"在禾谷类作物苗期鉴别中，叶片基部不具叶耳、叶舌钝圆而宽大的种类是","options":["小麦","燕麦","大麦","水稻"],"answer":[1],"explain":"燕麦叶片基部无叶耳，叶舌宽大而钝圆，是苗期识别的关键性状。小麦叶耳小而狭，大麦叶耳大而抱茎，水稻叶耳明显，三者均具叶耳，故只有燕麦符合不具叶耳这一条件，A、C、D错误。","tag":"禾本科"},{"id":"taxonomy-i029","type":"single","stage":2,"stem":"蔷薇科花托有杯状、坛状、盘状等多种形态，这一性状被用作划分亚科的重要依据，其主要原因是","options":["花托形态与子房位置及果实类型存在稳定的相关性","花托颜色与传粉昆虫的种类直接相关","花托大小决定胚珠的数目","花托形状随生境变化而剧烈改变"],"answer":[0],"explain":"花托形态决定子房着生位置，进而影响果实类型：盘状或杯状花托与离生心皮形成蓇葖果、聚合瘦果，壶状花托包围子房形成梨果，故与分类相关。花托颜色、大小和生境变化均非稳定依据，B、C、D错误。","tag":"蔷薇科"},{"id":"taxonomy-i031","type":"single","stage":2,"stem":"紫花苜蓿与白三叶均为豆科优良牧草，二者在习性和利用方式上的主要差异是","options":["前者匍匐、耐践踏，后者直立、宜刈割","二者均为直立型，只能刈割利用","二者均为水生植物，只适宜湿地种植","前者直立、根系深、耐旱宜刈割，后者匍匐、节间生根、耐践踏宜放牧"],"answer":[3],"explain":"紫花苜蓿直立生长，主根深入土层，耐旱、产量高，适宜调制干草；白三叶以匍匐茎节间生根，再生力强、耐践踏，适宜放牧。A把二者习性颠倒，B、C与实际生长习性不符，均错误。","tag":"常见饲用植物"},{"id":"taxonomy-i032","type":"single","stage":2,"stem":"盐碱地上的碱蓬、盐角草等藜科植物，叶片肉质化并具盐腺或盐囊。这一结构的适应意义是","options":["增大叶面积以截获更多光照","分泌蜜汁吸引传粉昆虫","稀释或排出体内盐分，维持水分平衡与正常代谢","储存淀粉供开花时消耗"],"answer":[2],"explain":"肉质化叶可稀释盐分并储存水分，盐腺或盐囊把多余盐分排出体表，二者共同维持细胞内水分平衡与酶活性。增大受光、分泌蜜汁和储存淀粉都不是盐生植物该结构的主要功能，A、B、D错误。","tag":"藜科"},{"id":"taxonomy-i034","type":"single","stage":2,"stem":"普通小麦的穗为复穗状，其穗轴每个节上着生小穗的数目是","options":["1枚","2枚","3枚","4枚"],"answer":[0],"explain":"普通小麦穗轴每节仅着生1枚无柄小穗，小穗互生于穗轴两侧；大麦穗轴每节着生3枚小穗，即三联小穗，是二者穗部结构的重要区别，故B、C、D均与小麦实际结构不符。","tag":"禾本科"},{"id":"taxonomy-i035","type":"single","stage":2,"stem":"菊科头状花序基部的总苞呈杯状或钟状，包被整个花序。从来源看，组成总苞的每一片结构是","options":["萼片","苞片","花瓣","托叶"],"answer":[1],"explain":"总苞由多层苞片组成，着生于花序基部，起保护幼花序的作用，其层数、形状与质地常作为菊科分属依据。萼片已退化为冠毛，花瓣构成花冠，托叶生于叶柄基部，故A、C、D错误。","tag":"菊科"},{"id":"taxonomy-i037","type":"single","stage":2,"stem":"豆科中，具三出复叶、总状花序、荚果螺旋状卷曲的属是","options":["草木樨属","野豌豆属","槐属","苜蓿属"],"answer":[3],"explain":"苜蓿属为三出复叶、总状花序，荚果肾形或螺旋状卷曲，是识别该属的关键性状。草木樨属荚果小、卵形且不开裂，野豌豆属荚果扁长，槐属为奇数羽状复叶，故A、B、C不符。","tag":"豆科"},{"id":"taxonomy-i039","type":"single","stage":2,"stem":"莎草属（Cyperus）植物的花序基部常有多枚叶状总苞片，其花序的基本排列方式是","options":["由小穗排成穗状花序并再组成圆锥花序","肉穗花序外包佛焰苞","由多数小穗组成伞形或伞房状聚伞花序","头状花序由舌状花组成"],"answer":[2],"explain":"莎草属为长侧枝聚伞花序，小穗着生于辐射枝顶端，呈伞形或伞房状，下具多枚叶状总苞片。穗状圆锥花序见于禾本科，肉穗花序与佛焰苞见于天南星科，头状花序有舌状花见于菊科，A、B、D错误。","tag":"莎草科"},{"id":"taxonomy-i041","type":"single","stage":2,"stem":"田边常见一种十字花科小草：基生叶羽状分裂，总状花序，果实扁平、长宽近相等，成熟时开裂。该植物最可能是","options":["油菜","荠菜","萝卜","甘蓝"],"answer":[1],"explain":"荠菜的果实为短角果，扁平近三角形，长宽相近，基生叶呈莲座状羽状分裂，与描述相符。油菜、萝卜和甘蓝的果实均为长角果，细长而明显长于宽，故A、C、D不符。","tag":"十字花科"},{"id":"taxonomy-i043","type":"single","stage":2,"stem":"蒲公英、莴苣等植物体被折断后有白色乳汁流出，头状花序全由舌状花组成。它们属于菊科的","options":["舌状花亚科","管状花亚科","菊亚科","蒿亚科"],"answer":[0],"explain":"菊科舌状花亚科植物体内具乳汁，头状花序全部由舌状花组成，舌状花花冠连合成片。管状花亚科无乳汁，花序中央为管状花，蒿属等即属该亚科；菊亚科、蒿亚科并非通用亚科名称，故B、C、D错误。","tag":"菊科"},{"id":"taxonomy-i045","type":"single","stage":2,"stem":"蝶形花冠中，位于最内方、由2枚花瓣合生呈舟状并包被雄蕊和雌蕊的结构是","options":["旗瓣","翼瓣","副花冠","龙骨瓣"],"answer":[3],"explain":"蝶形花冠由1枚旗瓣、2枚翼瓣和2枚合生的龙骨瓣组成，龙骨瓣在最内方呈舟状，保护雄蕊和雌蕊。旗瓣最大且位于最外方，翼瓣位于两侧，副花冠并非蝶形花冠的组成部分，故A、B、C错误。","tag":"豆科"},{"id":"taxonomy-i046","type":"single","stage":2,"stem":"下列牧草中，属于C4植物、在温暖地区生长快、产量高，但青饲时需防止氢氰酸中毒的是","options":["多年生黑麦草","苏丹草","白三叶","紫花苜蓿"],"answer":[1],"explain":"苏丹草为禾本科高粱属C4植物，光效高、再生快，幼嫩或受旱植株含氢氰酸，青饲时需防止中毒。多年生黑麦草为C3植物，白三叶和紫花苜蓿为豆科C3植物，均不含氢氰酸，故A、C、D错误。","tag":"常见饲用植物"},{"id":"taxonomy-i047","type":"single","stage":2,"stem":"某禾草一个小穗含5朵小花，其中基部3朵能育、顶端2朵退化不育。该小穗发育成熟后最多可形成的颖果数目是","options":["1枚","2枚","3枚","5枚"],"answer":[2],"explain":"禾本科每朵能育小花具1枚上位子房，发育为1枚颖果，退化小花不结实。该小穗有3朵能育小花，故最多形成3枚颖果；1枚或2枚低估了能育小花数，5枚则把退化小花计入，均错误。","tag":"禾本科"},{"id":"taxonomy-i048","type":"single","stage":2,"stem":"某禾草标本被归入禾本科小麦族（Triticeae）小麦属。在这一分类系统中，“族”所处的位置是","options":["科（或亚科）之下、属之上","科之下、亚科之上","属之下、种之上","目之下、科之上"],"answer":[0],"explain":"族（tribus）是科或亚科之下的等级，其下再分为属，因此处于科与属之间；亚科应在族之上，目则在科之上，故其余三项均把等级顺序颠倒。","tag":"分类等级"},{"id":"taxonomy-i049","type":"single","stage":2,"stem":"关于亚种（subspecies）与变种（varietas）的比较，下列叙述正确的是","options":["亚种是种上等级，变种是种下等级","二者均为种下等级，亚种多与地理分布分化相联系","二者均为种上等级，用于归并近缘种","变种为栽培植物特有等级，亚种为野生植物特有"],"answer":[1],"explain":"亚种与变种同属种下等级，亚种强调地理分化、变种强调形态差异；属、科等才是种上等级，而栽培植物特有的等级是品种（cultivar）而非变种。","tag":"分类等级"},{"id":"taxonomy-i050","type":"single","stage":2,"stem":"某文献把草地早熟禾写作“Poa pratensis auct. non L.”，其中“auct. non L.”表示","options":["该名称由林奈的合作者共同发表","该名称是林奈所定名的合法异名","某些作者误用了该名称，所指并非林奈命名的分类群","该名称的模式标本由林奈之后的研究者后选"],"answer":[2],"explain":"auct. non L. 读作“作者们（auct.）而非林奈”，说明文献中该名称被误用，实际植物不是林奈所命名的分类群；它不涉及合作发表、异名关系或模式后选。","tag":"双名法"},{"id":"taxonomy-i052","type":"single","stage":2,"stem":"某常见属名存在一个更早合格发表、但长期未被使用的名称。为使该熟知属名继续使用，最恰当的做法是","options":["依优先律直接改用最早发表的名称","把熟知名作为异名处理并停止使用","重新发表该熟知名并另行指定模式","提出保留名（nomen conservandum）提案，经命名委员会审议"],"answer":[3],"explain":"优先律要求采用最早合格发表的名称，保留名是《法规》为名称稳定设置的正式例外，须经提案并由命名委员会（大会）通过；重新发表不产生优先权，直接改名则会破坏稳定性。","tag":"命名法规"},{"id":"taxonomy-i054","type":"single","stage":2,"stem":"田间鉴定禾本科植物时，常观察叶片与叶鞘交界处内侧的膜状或毛状附属物，该结构是","options":["叶耳","叶舌","叶颈","托叶"],"answer":[1],"explain":"叶舌位于叶片与叶鞘交界处的内侧，可阻挡雨水、病菌和害虫进入叶鞘；叶耳在叶片基部两侧，叶颈是叶片与叶鞘相连的环带，托叶着生于叶柄基部，均不在该位置。","tag":"禾本科"},{"id":"taxonomy-i055","type":"single","stage":2,"stem":"禾本科植物的果皮与种皮紧密愈合、难以分离，其果实类型是","options":["瘦果","坚果","胞果","颖果"],"answer":[3],"explain":"颖果的特征是果皮与种皮完全愈合，为禾本科特有；瘦果的果皮与种皮可以分离，坚果果皮坚硬，胞果由膜质果皮包被种子，三者均非禾本科果实。","tag":"禾本科"},{"id":"taxonomy-i056","type":"single","stage":2,"stem":"黍亚科与早熟禾亚科的小穗在成熟时脱节方式不同，黍亚科小穗通常","options":["脱节于颖之下，整个小穗连同颖片一起脱落","脱节于颖之上，仅小花脱落而颖片宿存","不脱节，果实在小穗上萌发","脱节于外稃与内稃之间，颖片随小花脱落"],"answer":[0],"explain":"黍亚科的小穗脱节于颖之下，脱落时整个小穗一并掉落；早熟禾亚科则脱节于颖之上，颖片宿存而小花脱落，二者的脱节位置是区分两个亚科的重要依据。","tag":"禾本科"},{"id":"taxonomy-i057","type":"single","stage":2,"stem":"小麦花开放时花药以中部附着于细长花丝上，可随风摆动散粉，这种着生方式称为","options":["基着药","背着药","丁字着药","内向药"],"answer":[2],"explain":"花药中部与花丝相连、两端游离如丁字，称丁字着药，利于风媒散粉；基着药以花药基部着生，背着药以背部着生，内向药指花药开裂方向，均不描述该着生方式。","tag":"禾本科"},{"id":"taxonomy-i058","type":"single","stage":2,"stem":"某禾草具穗状花序，穗轴每节着生3枚小穗，成熟时小穗连同颖片脱落。该植物最可能属于","options":["小麦属","大麦属","燕麦属","黍属"],"answer":[1],"explain":"大麦属穗轴每节着生3枚小穗，小麦属每节仅1枚小穗；燕麦属为圆锥花序，黍属也为圆锥花序且小穗脱节于颖下，故依穗轴节上小穗数目可判断为大麦属。","tag":"禾本科"},{"id":"taxonomy-i059","type":"single","stage":2,"stem":"禾本科小花外稃顶端伸出的芒，其来源是","options":["内稃边缘的延伸","浆片的附属物","颖片顶端的延伸","外稃中脉的延伸"],"answer":[3],"explain":"芒由外稃中脉向顶端延伸而成，是禾草分类和牧草品质鉴定的重要性状；内稃、浆片和颖片均不形成外稃顶端的芒，故其余选项错误。","tag":"禾本科"},{"id":"taxonomy-i060","type":"single","stage":2,"stem":"竹亚科与禾亚科在营养体上的主要区别是，竹亚科","options":["具秆箨（箨鞘、箨叶），秆木质化","无秆箨，秆为草质","叶鞘闭合，叶片具叶舌","具根状茎，花序为圆锥花序"],"answer":[0],"explain":"竹亚科的秆具秆箨（箨鞘与箨叶），秆木质化，而禾亚科无秆箨、秆多为草质；叶舌和根状茎在禾亚科中同样常见，叶鞘闭合又是莎草科特征，故C项不能作为区分依据。","tag":"禾本科"},{"id":"taxonomy-i064","type":"single","stage":2,"stem":"莎草科小坚果基部常见的刚毛状结构，其来源是","options":["退化的花被","特化的花丝","苞片的裂片","花托的附属物"],"answer":[0],"explain":"莎草科花被退化成下位刚毛或鳞片，宿存于小坚果基部；花丝、苞片和花托都不形成该刚毛状结构，故可据花被退化的形态识别莎草科。","tag":"莎草科"},{"id":"taxonomy-i065","type":"single","stage":2,"stem":"薹草属（Carex）的雌花外方包被一个瓶状囊状结构，果实成熟时藏于其中，该结构是","options":["内稃","颖片","小穗轴","果囊（perigynium）"],"answer":[3],"explain":"薹草属雌花由瓶状果囊包被，果囊由雌花外的先出叶愈合成瓶状囊体，包裹小坚果，其形状、脉纹和喙的有无是分种的重要依据；内稃、颖片和小穗轴均不形成包被雌花的瓶状囊，故其余选项错误。","tag":"莎草科"},{"id":"taxonomy-i066","type":"single","stage":2,"stem":"与禾本科小穗相比，莎草科小穗的典型特点是","options":["小穗基部具2枚颖片，小花具外稃与内稃","鳞片腋内着生单花，花被退化，无外稃和内稃","小穗由多数小花组成，每朵小花具2枚浆片","小穗轴肉质，小花嵌入轴内"],"answer":[1],"explain":"莎草科小穗的鳞片（苞片）腋内着生单花，花被退化，不具外稃和内稃；具2枚颖片、外稃内稃和2枚浆片恰是禾本科小穗的特征，故其余选项描述的是禾本科。","tag":"莎草科"},{"id":"taxonomy-i068","type":"single","stage":2,"stem":"菊科头状花序基部包被花序的一层或数层结构是","options":["总苞片","颖片","苞叶","托片"],"answer":[0],"explain":"头状花序基部由多层总苞片组成总苞，起保护作用；颖片为禾本科小穗基部结构，苞叶是花序下方的叶状结构，托片位于花序托上小花之间，位置与功能均不同。","tag":"菊科"},{"id":"taxonomy-i069","type":"single","stage":2,"stem":"蒲公英的果实顶端具由花萼特化的冠毛，成熟后随风传播，其果实类型是","options":["蒴果","荚果","瘦果","胞果"],"answer":[2],"explain":"菊科果实为瘦果（连萼瘦果），由下位子房发育，顶端具冠毛利于风播；蒴果、荚果和胞果分别属于其他科，子房位置与果皮结构均与菊科不同。","tag":"菊科"},{"id":"taxonomy-i070","type":"single","stage":2,"stem":"蒿属（Artemisia）植物头状花序小、多数排列成圆锥状，其花部特点是","options":["全为舌状花，植株具乳汁","花全为管状花，边花雌性，盘花两性","花单性，果实为蒴果","花两侧对称，呈二唇形，无冠毛"],"answer":[1],"explain":"蒿属头状花序小而多，集成圆锥状，花均为管状花，边花雌性、盘花两性，是菊科蒿属的典型特征；全舌状花且具乳汁的是舌状花亚科（如蒲公英），蒴果与二唇形花则不属于菊科。","tag":"菊科"},{"id":"taxonomy-i073","type":"single","stage":2,"stem":"十字花科的花瓣4枚，排成十字形，其花冠类型称为","options":["蝶形花冠","唇形花冠","十字形花冠","管状花冠"],"answer":[2],"explain":"十字花科4枚花瓣等大、排列成十字形，称十字形花冠；蝶形花冠为豆科旗瓣、翼瓣、龙骨瓣的不对称排列，唇形花冠和管状花冠分别为唇形科、菊科的特征。","tag":"十字花科"},{"id":"taxonomy-i074","type":"single","stage":2,"stem":"十字花科角果有长角果和短角果之分，区分二者的主要依据是","options":["果实长度与宽度之比（通常长超过宽3倍为长角果）","果实开裂与否","种子有无胚乳","子房室数目的多少"],"answer":[0],"explain":"长角果与短角果按果实的长度与宽度比例区分，长而狭者为长角果（如油菜），短而宽者为短角果（如荠菜）；二者均开裂、均具假隔膜，种子和子房室数也相同。","tag":"十字花科"},{"id":"taxonomy-i077","type":"single","stage":2,"stem":"与蝶形花亚科相比，云实亚科的花部特征是","options":["花冠蝶形，旗瓣位于最外方，雄蕊为二体雄蕊","花辐射对称，雄蕊多数，荚果横裂成节","花冠缺如，花单性，雄蕊3枚","花冠假蝶形，最上一枚花瓣位于最内方，雄蕊多离生"],"answer":[3],"explain":"云实亚科花冠为假蝶形，最上一枚花瓣位于最内方，雄蕊10枚多离生；蝶形花亚科旗瓣在最外方且为二体雄蕊，辐射对称、雄蕊多数是含羞草亚科的特征。","tag":"豆科"},{"id":"taxonomy-i078","type":"single","stage":2,"stem":"蝶形花冠中，位于最下方、两枚常合生并包被雌蕊和雄蕊的花瓣是","options":["旗瓣","龙骨瓣","翼瓣","唇瓣"],"answer":[1],"explain":"蝶形花冠由1枚旗瓣、2枚翼瓣和2枚龙骨瓣组成，龙骨瓣位于最下方且常合生，包被雌雄蕊；旗瓣最大位于最外上方，翼瓣在两侧，唇瓣则是兰科等花冠的术语。","tag":"豆科"},{"id":"taxonomy-i079","type":"single","stage":2,"stem":"荚果成熟开裂时，通常沿","options":["果皮中部横向断裂","种子之间的隔膜纵裂","背缝线与腹缝线两条缝线开裂","果顶孔裂"],"answer":[2],"explain":"荚果由单心皮发育，具背缝线和腹缝线，成熟时沿这两条缝线开裂成两片果瓣；横断成节的是节荚，孔裂、瓣裂见于蒴果，隔膜纵裂则不符合荚果结构。","tag":"豆科"},{"id":"taxonomy-i080","type":"single","stage":2,"stem":"豆科植物小叶基部常有一膨大结构，能引起叶片感夜运动，该结构是","options":["叶枕","叶舌","托叶","叶耳"],"answer":[0],"explain":"叶枕是小叶或叶柄基部的膨大薄壁组织，细胞膨压变化引起叶片开合和感夜运动，为豆科常见特征；叶舌和叶耳属禾本科，托叶虽为豆科特征但不司运动。","tag":"豆科"},{"id":"taxonomy-i083","type":"single","stage":2,"stem":"桃、李的果实外果皮薄、中果皮肉质、内果皮坚硬成核，其果实类型是","options":["梨果","蓇葖果","聚合瘦果","核果"],"answer":[3],"explain":"核果由单心皮上位子房发育，内果皮硬化成核，桃、李、杏均属此类；梨果内果皮革质、由下位子房与花托共同发育，蓇葖果和聚合瘦果分别见于绣线菊亚科和蔷薇亚科。","tag":"蔷薇科"},{"id":"taxonomy-i084","type":"single","stage":2,"stem":"蔷薇科各亚科果实类型差异明显，造成这种差异的主要原因是","options":["花瓣数目的不同","花托形态及子房位置（上位或下位）的不同","雄蕊数目的不同","叶为单叶或复叶的不同"],"answer":[1],"explain":"蔷薇科果实类型取决于花托与子房的关系：子房上位、花托平坦者多形成蓇葖果或瘦果，子房下位并与花托愈合者形成梨果；花瓣、雄蕊和叶的形态与果实类型无直接对应。","tag":"蔷薇科"},{"id":"taxonomy-i086","type":"single","stage":2,"stem":"盐角草属（Salicornia）生于盐碱地，茎肉质、多节，叶退化成鳞片状。这些特征主要适应","options":["强光照射","机械风沙","高盐与干旱环境","低温冻害"],"answer":[2],"explain":"肉质茎可储水稀释盐分，退化鳞片叶减少蒸腾，是藜科盐生植物适应高盐干旱生境的典型对策；强光、风沙和低温虽也影响生长，但不能解释肉质化与叶片退化的形成。","tag":"藜科"},{"id":"taxonomy-i087","type":"single","stage":2,"stem":"藜科种子的胚常弯曲成环形，围绕胚乳，这种胚的类型是","options":["环形胚","直立胚","折叠胚","未分化胚"],"answer":[0],"explain":"藜科胚弯曲成环状、包围胚乳，称环形胚，是识别藜科种子和幼苗的重要依据；直立胚的胚轴与胚根呈直线，折叠胚仅子叶褶皱，未分化胚则见于寄生植物。","tag":"藜科"},{"id":"taxonomy-i088","type":"single","stage":2,"stem":"猪毛菜属（Salsola）植物成熟时，花被片背部常发育出膜质翅状附属物，其意义主要是","options":["吸引昆虫传粉","储存水分","保护种子免受盐害","借助风力传播果实"],"answer":[3],"explain":"猪毛菜属花被片在果实期发育成膜质翅，增大受风面积，利于果实随风传播，是沙区植物的常见适应；翅状结构不具储水、防盐或吸引昆虫的功能。","tag":"藜科"},{"id":"taxonomy-i090","type":"single","stage":2,"stem":"我国北方草原上重要的建群种羊草，其分类地位和形态特点是","options":["豆科赖草属，三出复叶，具根瘤","禾本科赖草属，具发达根状茎，穗状花序","禾本科雀麦属，圆锥花序，外稃具长芒","莎草科薹草属，具果囊，小坚果"],"answer":[1],"explain":"羊草（Leymus chinensis）属禾本科赖草属，具发达根状茎、穗状花序，是北方草原重要建群种和优良牧草；三出复叶为豆科特征，雀麦属为圆锥花序，薹草属属莎草科。","tag":"常见饲用植物"},{"id":"taxonomy-i091","type":"single","stage":2,"stem":"某牧草具匍匐茎，三出复叶，小叶倒卵形，花白色集成头状花序。该牧草最可能是","options":["紫花苜蓿","草木樨","白三叶","沙打旺"],"answer":[2],"explain":"白三叶具匍匐茎、三出复叶和白色头状花序，是优良放牧型豆科牧草；紫花苜蓿花紫色、无匍匐茎，草木樨花黄色、总状花序，沙打旺为直立草本、总状花序。","tag":"常见饲用植物"},{"id":"taxonomy-s04","type":"single","stem":"甲于2020年合格发表某植物名称，乙于2022年又合格发表另一名称指称同一分类群。若两名称均合法，依据命名法规通常应采用的名称是","options":["甲2020年发表的名称","乙2022年发表的名称","两者均可，任选其一","需另立新名"],"answer":[0],"explain":"同一分类群若有多个合法名称，应遵循优先律，采用最早合格发表的名称。乙的名称晚出，通常成为异名；两者不能随意任选，也不必另立新名，这正是优先律的核心含义。","tag":"命名法规","level":2,"stage":2,"standard":true},{"id":"taxonomy-s05","type":"single","stem":"某研究者仅在内部油印资料中描述一个新种，未向社会公开分发。该名称的发表状态是","options":["未有效发表","已有效发表","合格发表但为晚出异名","合格发表并自动成为模式"],"answer":[0],"explain":"有效发表要求名称通过公开出售、交换或分发的印刷品或电子出版物为公众所得，内部油印资料未公开分发，不构成有效发表，因而不可能合格发表。它与异名、模式指定是不同概念。","tag":"命名法规","level":2,"stage":2,"standard":true},{"id":"taxonomy-s09","type":"single","stem":"与禾本科相比，莎草科营养体的典型特征是","options":["秆常三棱形，叶三列排列","秆圆柱形，叶二列排列","叶鞘常开裂并具叶舌","小花具浆片和颖果"],"answer":[0],"explain":"莎草科秆多三棱形，叶三列，叶鞘闭合，通常无叶舌；禾本科秆多圆柱形，叶二列，叶鞘常开裂并具叶舌，果实为颖果。C、D描述的是禾本科特征，这些差异常作为分科检索的关键性状。","tag":"莎草科","level":2,"stage":2,"standard":true},{"id":"taxonomy-s17","type":"single","stem":"苹果、梨的食用部分主要由花托发育而来，其果实类型为","options":["梨果","核果","瘦果","蓇葖果"],"answer":[0],"explain":"苹果和梨的子房下位，花托与子房壁愈合，果肉主要由花托发育，形成梨果，属假果。核果如桃，瘦果如向日葵，蓇葖果如绣线菊，均不是苹果、梨的果实类型。","tag":"蔷薇科","level":2,"stage":2,"standard":true},{"id":"taxonomy-s19","type":"single","stem":"在盐碱地调查中，见到一种植物：花小、单被，花被片5枚，雄蕊5枚且与花被片对生，果实为胞果。该植物最可能属于","options":["藜科","十字花科","豆科","莎草科"],"answer":[0],"explain":"藜科花小，常为单被花，花被片和雄蕊常各5枚，雄蕊与花被片对生，果实为胞果。十字花科具四强雄蕊和角果，豆科具蝶形花冠和荚果，莎草科具小坚果，均与上述特征不符。","tag":"藜科","level":2,"stage":2,"standard":true},{"id":"taxonomy-i003","type":"multi","stage":2,"stem":"下列禾本科结构与其功能的对应关系中，正确的有","options":["叶舌——防止雨水和害虫进入叶鞘内侧","浆片——开花时吸水膨胀，撑开外稃与内稃","羽毛状柱头——增大接受花粉的面积，适应风媒传粉","颖片——包被每朵能育小花"],"answer":[0,1,2],"explain":"叶舌阻隔雨水害虫，浆片吸水撑开稃片便于花药伸出，羽毛状柱头适应风媒，三项对应正确。颖片位于小穗基部、并非包被单朵小花，包被小花的是外稃和内稃，故第四项错误。","tag":"禾本科"},{"id":"taxonomy-i008","type":"multi","stage":2,"stem":"豆科植物在草地农业中占有重要地位，下列叙述与其形态或功能相符的有","options":["多数种类根部与根瘤菌共生，能固定空气中的氮素","荚果由单心皮发育，成熟时沿背腹两缝开裂","叶常为复叶，基部具托叶，叶柄与小叶柄常有叶枕","花均为辐射对称，雄蕊数目固定为10枚"],"answer":[0,1,2],"explain":"根瘤固氮、单心皮荚果、复叶具托叶和叶枕均为豆科典型特征。豆科花多为两侧对称；蝶形花亚科为二体雄蕊，但含羞草亚科花辐射对称且雄蕊多数，故第四项说法绝对化而错误。","tag":"豆科"},{"id":"taxonomy-i015","type":"multi","stage":2,"stem":"关于莎草科花的构造，下列叙述正确的有","options":["花被退化为鳞片状或刚毛状，有的完全缺如","子房上位，花柱常2～3裂","小穗由多数两性或单性花组成，基部具颖片","果实为颖果，果皮与种皮愈合不可分离"],"answer":[0,1,2],"explain":"莎草科花被退化，子房上位、花柱2～3裂，小穗具颖片并由多数两性或单性花组成，前三项正确。其果实为小坚果（坚果状瘦果），果皮不与种皮愈合，颖果是禾本科特征，故第四项错误。","tag":"莎草科"},{"id":"taxonomy-i020","type":"multi","stage":2,"stem":"菊科常分为舌状花亚科和管状花亚科，下列叙述正确的有","options":["舌状花亚科植物体内多有乳汁，头状花序全由舌状花组成","管状花亚科植物无乳汁，花序中央为管状花、边缘可具舌状花","蒲公英属舌状花亚科，向日葵属管状花亚科","菊科是双子叶植物中最小的科之一，仅含数十种"],"answer":[0,1,2],"explain":"舌状花亚科具乳汁且全为舌状花，管状花亚科无乳汁、中央为管状花而边缘可有舌状花，蒲公英与向日葵分别属于两亚科，前三项正确。菊科是被子植物最大的科之一，含2万余种，故第四项错误。","tag":"菊科"},{"id":"taxonomy-i026","type":"multi","stage":2,"stem":"蔷薇科四个亚科与果实类型的对应关系，正确的有","options":["绣线菊亚科——蓇葖果","苹果亚科——梨果","蔷薇亚科——聚合瘦果","李亚科——角果"],"answer":[0,1,2],"explain":"绣线菊亚科为蓇葖果，苹果亚科由花托与心皮共同形成梨果，蔷薇亚科多为聚合瘦果，前三项正确。李亚科为单心皮核果，角果是十字花科的特征，故第四项错误。","tag":"蔷薇科"},{"id":"taxonomy-i030","type":"multi","stage":2,"stem":"比较十字花科与豆科的花部及果实特征，下列叙述正确的有","options":["十字花科花瓣4枚呈十字形，豆科多为蝶形花冠","十字花科为四强雄蕊，豆科常见二体雄蕊","十字花科为角果且具假隔膜，豆科为荚果","两科的果实均由二心皮合生发育而来"],"answer":[0,1,2],"explain":"花瓣十字形、四强雄蕊、角果具假隔膜为十字花科特征；蝶形花冠、二体雄蕊、荚果为豆科特征，前三项正确。荚果由单心皮发育，只有角果来自二心皮，故第四项错误。","tag":"十字花科"},{"id":"taxonomy-i036","type":"multi","stage":2,"stem":"下列草地与盐碱地常见植物中，属于藜科的有","options":["灰绿藜","碱蓬","猪毛菜","荠菜"],"answer":[0,1,2],"explain":"灰绿藜、碱蓬和猪毛菜均具花小、单被、雄蕊与花被片对生、胞果等藜科特征。荠菜花瓣4枚呈十字形、具四强雄蕊和角果，属十字花科，故第四项错误。","tag":"藜科"},{"id":"taxonomy-i040","type":"multi","stage":2,"stem":"关于禾本科小穗的组成，下列叙述正确的有","options":["小穗基部通常具2枚颖片","每朵小花外方为外稃，内方为内稃","内稃常具2条脉（2脊），外稃具1条中脉","每个小穗中能育小花恒为1朵"],"answer":[0,1,2],"explain":"颖片2枚位于小穗基部，外稃在外、内稃在内，内稃通常2脉而外稃具1中脉，前三项正确。小穗可含多朵能育小花，如小麦小穗含3～9朵，故恒为1朵的说法错误。","tag":"禾本科"},{"id":"taxonomy-i044","type":"multi","stage":2,"stem":"下列饲用植物中，耐践踏、再生力强，适宜直接放牧利用的有","options":["白三叶","狗牙根","多年生黑麦草","苏丹草"],"answer":[0,1,2],"explain":"白三叶匍匐、节间生根，狗牙根具根状茎和匍匐茎，多年生黑麦草分蘖力强、耐践踏，三者均适宜放牧。苏丹草植株高大、茎秆粗壮，宜刈割青饲或青贮，不耐践踏，故第四项错误。","tag":"常见饲用植物"},{"id":"taxonomy-i051","type":"multi","stage":2,"stem":"关于植物学名的书写与引证，下列叙述正确的有","options":["属名首字母大写，种加词全部小写","学名在印刷或书写时整体排斜体（或加下划线）","命名人引证以正体排在种加词之后","种加词首字母须大写，以便与属名对应"],"answer":[0,1,2],"explain":"学名由属名和种加词构成，属名首字母大写、种加词全小写，整体斜体，命名人用正体附于种加词之后；种加词首字母大写不符合《法规》的书写规范。","tag":"双名法"},{"id":"taxonomy-i061","type":"multi","stage":2,"stem":"禾本科小穗的组成结构中，通常包括","options":["小穗基部的颖片","小花的外稃与内稃","小花基部的花被片6枚","小花中的浆片"],"answer":[0,1,3],"explain":"小穗由基部两枚颖片和一枚至多枚小花组成，小花具外稃、内稃、2枚浆片、雄蕊和雌蕊；禾本科花被退化为浆片，并无6枚花被片，故C项错误。","tag":"禾本科"},{"id":"taxonomy-i062","type":"multi","stage":2,"stem":"关于禾本科的花序类型，下列叙述正确的有","options":["燕麦、早熟禾等具有圆锥花序","禾本科的花序均为穗状花序，没有分枝","小麦、黑麦等具有穗状花序，小穗无柄着生于穗轴","狗牙根等具有指状（掌状）穗状花序"],"answer":[0,2,3],"explain":"禾本科花序多样：燕麦、早熟禾为圆锥花序，小麦、黑麦为穗状花序，狗牙根为指状穗状花序；说禾本科花序全为穗状花序不符合事实，故B项错误。","tag":"禾本科"},{"id":"taxonomy-i067","type":"multi","stage":2,"stem":"关于莎草科的花部特征，下列叙述正确的有","options":["花被退化为下位刚毛或鳞片，有时完全缺如","雄蕊通常3枚，偶有1～2枚","子房上位，1室，具1枚胚珠","果实为蒴果，成熟时瓣裂"],"answer":[0,1,2],"explain":"莎草科花被退化，雄蕊多为3枚，子房上位、1室1胚珠，果实为小坚果；蒴果瓣裂是百合科等植物的特征，莎草科并不形成蒴果，故D项错误。","tag":"莎草科"},{"id":"taxonomy-i071","type":"multi","stage":2,"stem":"关于菊科头状花序中舌状花与管状花的差异，下列叙述正确的有","options":["舌状花花冠呈舌片状，常位于花序外围","管状花花冠呈筒状，常位于花序中央","向日葵外围的舌状花通常是不育的","同一头状花序中所有小花的花冠形态完全相同"],"answer":[0,1,2],"explain":"舌状花花冠呈舌片状、多位于外围，管状花花冠呈筒状、多位于中央；向日葵外围舌状花通常不育。同一头状花序中小花可异型，第四项错误。","tag":"菊科"},{"id":"taxonomy-i075","type":"multi","stage":2,"stem":"下列特征中，可用于识别十字花科植物的有","options":["花冠十字形，花瓣4枚","花被片3枚，雄蕊6枚合生","四强雄蕊，花萼4枚","角果具假隔膜，种子排列于假隔膜两侧"],"answer":[0,2,3],"explain":"十字花科具4枚十字形花瓣、4枚花萼和四强雄蕊，角果内有假隔膜，种子分列两侧；花瓣和萼片均为4枚而非3枚，雄蕊为6枚离生而非合生，故B项错误。","tag":"十字花科"},{"id":"taxonomy-i081","type":"multi","stage":2,"stem":"关于豆科植物的识别特征，下列叙述正确的有","options":["叶常为复叶，具托叶，小叶基部常有叶枕","花为蝶形花冠或假蝶形花冠，也有辐射对称者","雄蕊10枚，常为二体雄蕊或离生，偶有较多","果实为蒴果，种子具翅"],"answer":[0,1,2],"explain":"豆科多为复叶并具托叶和叶枕，花冠蝶形、假蝶形或辐射对称，雄蕊常10枚、二体或离生；其果实为荚果而非蒴果，种子一般无翅，故D项错误。","tag":"豆科"},{"id":"taxonomy-i089","type":"multi","stage":2,"stem":"下列植物中，属于藜科的有","options":["灰绿藜","猪毛菜","盐角草","荠菜"],"answer":[0,1,2],"explain":"灰绿藜、猪毛菜、盐角草均为藜科植物，花小、单被、果实为胞果；荠菜属十字花科，具十字形花冠、四强雄蕊和短角果，故D项不属于藜科。","tag":"藜科"},{"id":"taxonomy-i092","type":"multi","stage":2,"stem":"下列牧草中，属于禾本科的有","options":["羊草","无芒雀麦","老芒麦","草木樨"],"answer":[0,1,2],"explain":"羊草为赖草属、无芒雀麦为雀麦属、老芒麦为披碱草属，均属禾本科；草木樨为豆科草木樨属，具三出复叶和总状花序，故D项不属于禾本科。","tag":"常见饲用植物"},{"id":"taxonomy-m04","type":"multi","stem":"菊科头状花序及其花部特征，下列叙述正确的是","options":["头状花序外有总苞，总苞片常多层，花序轴膨大形成花托","花冠类型主要有管状花和舌状花，边缘花有时为舌状花","花药合生成聚药雄蕊，子房下位，果实为瘦果","果实为蒴果，种子多数具翅，子房上位"],"answer":[0,1,2],"explain":"菊科头状花序的总苞片常多层，花托上密集着生无柄小花；花冠分管状和舌状，花药合生为聚药雄蕊，子房下位，形成瘦果。D的蒴果、具翅种子和子房上位均不符合菊科。","tag":"菊科","level":2,"stage":2,"standard":true},{"id":"taxonomy-m05","type":"multi","stem":"下列常见饲用或草原植物与所属科、属的对应，正确的是","options":["紫花苜蓿—豆科苜蓿属","草木樨—豆科草木樨属","沙打旺—豆科黄芪属","披碱草—禾本科赖草属"],"answer":[0,1,2],"explain":"紫花苜蓿为豆科苜蓿属，草木樨为豆科草木樨属，沙打旺为豆科黄芪属（直立黄芪）。披碱草属于禾本科披碱草属（Elymus），并非赖草属，故D错误；这些植物在草原调查中常需准确鉴定。","tag":"常见饲用植物","level":2,"stage":2,"standard":true},{"id":"taxonomy-i005","type":"judge","stage":2,"stem":"在植物分类的主要等级中，界、门、纲、目、科、属、种依次排列，亚科、族、组与科、属同属主要等级。","options":["正确","错误"],"answer":[1],"explain":"主要等级为界、门、纲、目、科、属、种；亚科、族、组、系以及亚种、变种等属于辅助（次要）等级，只在需要细分时插入。亚科、族、组并非主要等级，故该陈述错误。","tag":"分类等级"},{"id":"taxonomy-i012","type":"judge","stage":2,"stem":"禾本科的小穗由基部1至2枚颖片和1至多
