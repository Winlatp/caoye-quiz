相同、成土时间足够长，土壤剖面性状就应当基本相同。","options":["正确","错误"],"answer":[1],"explain":"错误。成土过程是气候、生物、母质、地形和时间共同作用的结果，同一气候带内地形引起的水热与侵蚀差异、植被类型和人类活动不同，都会使剖面性状出现分异，该说法把多因素作用简化为单因素决定。","tag":"土壤成土因素"},{"id":"soil-i062","type":"judge","stage":2,"stem":"土壤质地越粗，颗粒比表面积越大，保肥能力越强。","options":["正确","错误"],"answer":[1],"explain":"错误。颗粒越细比表面积越大，黏粒表面电荷多、吸附交换能力强，因此黏质土保肥能力强而砂质土保肥能力弱，该陈述把质地粗细与比表面积、保肥能力的关系完全颠倒了。","tag":"土壤物理性质"},{"id":"soil-i063","type":"judge","stage":2,"stem":"砂土的总孔隙度一般大于黏土，因此砂土的保水能力更强。","options":["正确","错误"],"answer":[1],"explain":"错误。黏土细颗粒多，总孔隙度通常大于砂土，且孔隙以毛管孔隙为主、吸水吸力大，保水能力强；砂土大孔隙多、孔隙度较小，通气好而保水保肥差，该陈述两处判断均不成立。","tag":"土壤物理性质"},{"id":"soil-i069","type":"judge","stage":2,"stem":"在土壤—植物—大气连续体中，水分沿水势降低的方向运动，最终由叶片蒸腾散失。","options":["正确","错误"],"answer":[0],"explain":"正确。水势梯度是水分运动的动力，通常土壤水势高于根系、根系高于叶片、叶片高于大气，水分因此由土壤进入植物并蒸腾散失；若水势梯度反转，植物便无法吸水。","tag":"土壤水分"},{"id":"soil-i076","type":"judge","stage":2,"stem":"石灰性土壤富含碳酸钙，pH偏高，会使铁、锌、磷等养分的有效性降低。","options":["正确","错误"],"answer":[0],"explain":"正确。碳酸钙水解使土壤呈中性至微碱性，铁、锌、锰等微量元素溶解度下降，磷则形成难溶性磷酸钙，因此石灰性土壤上这些养分常供应不足。","tag":"土壤化学性质"},{"id":"soil-i079","type":"judge","stage":2,"stem":"豆科牧草与禾本科牧草混播，可通过根瘤菌固氮增加土壤氮素输入，有利于维持草地土壤肥力。","options":["正确","错误"],"answer":[0],"explain":"正确。豆科牧草与根瘤菌共生固定空气中的氮素，除满足自身需要外，可通过残体、根系和家畜粪尿归还土壤，提高氮素肥力；混播还能改善群体结构和地表覆盖。","tag":"土壤肥力"},{"id":"soil-i086","type":"judge","stage":2,"stem":"盐碱土改良后若继续大水漫灌而不控制地下水位，已改良的土壤仍可能重新返盐。","options":["正确","错误"],"answer":[0],"explain":"正确。盐分运动遵循“盐随水来、盐随水去”，灌溉水量过大而排水不畅会抬高地下水位，蒸发时毛管水携带盐分回升表层，使改良效果逆转。","tag":"土壤盐碱化"},{"id":"soil-i093","type":"judge","stage":2,"stem":"草地土壤退化只表现为植被盖度下降，与土壤物理、化学性质的变化无关。","options":["正确","错误"],"answer":[1],"explain":"错误。草地退化是植被与土壤同步退化的过程，除盖度下降外，还表现为容重增大、结构破坏、有机质和养分减少、风蚀水蚀加剧等物理化学性质恶化。","tag":"草地土壤管理"},{"id":"soil-a001","type":"single","stage":3,"stem":"某半干旱草地年降水量约350 mm、年均温6 ℃，其表层土壤有机质含量明显低于同纬度湿润草原，主要原因是","options":["降水不足限制了植物生长，有机质归还量少","气温偏低，微生物分解有机质的速度过慢","母质为黄土，矿质养分含量过低","砂粒含量高，有机质随下渗水大量淋失"],"answer":[0],"explain":"有机质含量取决于植物归还量与微生物分解量的对比。半干旱区水分不足使生物量小、归还少，积累量低；年均温6 ℃偏低会使分解变慢而有利于积累，与题意相反；矿质养分和淋失均非主因。","tag":"土壤成土因素"},{"id":"soil-a002","type":"single","stage":3,"stem":"同一山地，阴坡草地土壤有机质含量常高于阳坡，其主要原因是","options":["阴坡母岩富含矿质养分，供给充足","阴坡蒸发弱、土壤湿度大，植被覆盖好，有机质积累多","阴坡土层较薄，有机质相对浓缩","阴坡成土时间比阳坡更长"],"answer":[1],"explain":"阴坡接受太阳辐射少、蒸发弱，土壤湿度大，植被覆盖好，有机质归还多、分解较慢，故含量更高。同一山体两坡母质相近；土层薄不能使有机质浓缩；成土时间也无明显差别。","tag":"土壤成土因素"},{"id":"soil-a003","type":"single","stage":3,"stem":"某河流冲积平原上，近河床处为砂质沉积物、远河床处为黏质沉积物，两地土壤质地和保肥能力差异明显，这种分异主要体现了","options":["气候沿河岸的差异","生物（植被类型）的差异","成土母质（冲积物颗粒分选）的差异","成土时间长短的差异"],"answer":[2],"explain":"河流冲积物的颗粒分选造成近河床砂质、远河床黏质，属母质差异；同一平原内气候和生物条件基本一致，成土时间也相近，因此质地和保肥能力的差异主要由母质决定。","tag":"土壤成土因素"},{"id":"soil-a004","type":"single","stage":3,"stem":"下列土壤中，剖面分异最不明显、发育程度最低的是","options":["黄土高原塬面的黑垆土","花岗岩风化壳上发育的红壤","温带草原发育的黑钙土","新近沉积的河流冲积物上发育的土壤"],"answer":[3],"explain":"土壤剖面分异随成土时间延长而增强。新近沉积的冲积物成土时间最短，剖面层次分化最弱；黑垆土、红壤和黑钙土均经历了较长的成土过程，剖面发育明显。","tag":"土壤成土因素"},{"id":"soil-a009","type":"single","stage":3,"stem":"某草地表层土壤容重为1.28 g/cm³，总孔隙度为52%，其比重约为","options":["2.67","2.46","2.55","2.80"],"answer":[0],"explain":"比重＝容重/（1－总孔隙度）＝1.28÷0.48≈2.67。若误用容重除以孔隙度会得到2.46；一般土壤比重在2.6～2.7之间，也可据此核对结果。","tag":"土壤物理性质"},{"id":"soil-a010","type":"single","stage":3,"stem":"某草地表层土壤总孔隙度为50%，其中毛管孔隙度为38%，据此判断该土壤","options":["非毛管孔隙占38%，通气性良好","非毛管孔隙占12%，通气性偏差","毛管孔隙占12%，保水性差","非毛管孔隙占50%，透水性过强"],"answer":[1],"explain":"非毛管（通气）孔隙＝总孔隙度－毛管孔隙度＝50%－38%＝12%，通气孔隙偏少，通气性较差；毛管孔隙占38%而非12%，保水性并不差，故其余选项均不成立。","tag":"土壤物理性质"},{"id":"soil-a011","type":"single","stage":3,"stem":"某草地0~20 cm土层容重为1.3 g/cm³，面积1 hm²，该土层的干土质量约为","options":["260 t","1300 t","2600 t","5200 t"],"answer":[2],"explain":"土层体积＝10000 m²×0.2 m＝2000 m³，干土质量＝2000 m³×1.3 t/m³＝2600 t。1300 t是把土层厚度按0.1 m计算的结果，5200 t则是把厚度按0.4 m计算的结果。","tag":"土壤物理性质"},{"id":"soil-a012","type":"single","stage":3,"stem":"草地土壤中团粒结构的形成，主要依赖于","options":["砂粒在重力作用下的自然堆积","钠离子对黏粒的分散作用","冻融交替使土体开裂成块","有机质与钙离子的胶结作用以及根系穿插挤压"],"answer":[3],"explain":"团粒结构的形成主要靠有机质与钙离子的胶结以及根系穿插挤压、干湿交替等作用。砂粒自然堆积不能形成团粒，钠离子分散黏粒、冻融开裂都会破坏结构。","tag":"土壤物理性质"},{"id":"soil-a013","type":"single","stage":3,"stem":"某草地土壤0~20 cm为砂壤土、20~50 cm为黏土层。一次较大降水后，最可能出现的情况是","options":["水分下渗至黏土层时受阻，表层易产生滞水","上层黏粒被淋洗至下层，剖面质地趋于均一","下层黏土阻断毛管水上升，表层迅速干燥","上下层质地差异使土壤总孔隙度明显增大"],"answer":[0],"explain":"上砂下黏的质地层次中，水分下渗到黏土层时因孔隙细、导水慢而受阻，易在表层形成滞水；黏粒不会向上移动，黏土毛管作用强而非阻断上升，总孔隙度也不会因此增大。","tag":"土壤物理性质"},{"id":"soil-a014","type":"single","stage":3,"stem":"早春，深色（有机质含量高）的草地表层土壤比浅色砂质土升温快，主要原因是","options":["深色土壤热容量大，储存的热量多","深色土壤反射率低，吸收的太阳辐射能多","深色土壤孔隙度大，空气导热快","深色土壤含水量高，传热效率高"],"answer":[1],"explain":"深色土壤反射率低，吸收的太阳辐射多，故升温快。热容量大、含水量高会使升温变慢，与题意相反；孔隙度与导热的关系也不能解释颜色差异，故其余选项错误。","tag":"土壤物理性质"},{"id":"soil-a019","type":"single","stage":3,"stem":"某草地0~30 cm土层田间持水量为25%（质量分数），凋萎系数为8%，容重为1.2 g/cm³。该土层有效水储量约为","options":["36 mm","51 mm","61 mm","72 mm"],"answer":[2],"explain":"有效水＝（25%－8%）×1.2 g/cm³×300 mm≈61 mm。51 mm是未乘容重、只按质量分数计算的结果，72 mm则是按20%含水量计算的结果。","tag":"土壤水分"},{"id":"soil-a020","type":"single","stage":3,"stem":"在草地土壤中，对牧草有效性最高、也是植物吸收的主要水分形态是","options":["吸湿水","膜状水","重力水","毛管水"],"answer":[3],"explain":"毛管水受毛管力吸持、可自由移动，是植物吸收的主要形态。吸湿水被胶体牢固吸附不能利用，膜状水移动极慢、有效性低，重力水很快下渗流失，均非主要给源。","tag":"土壤水分"},{"id":"soil-a021","type":"single","stage":3,"stem":"某草地生长期降水量150 mm、灌溉水量80 mm、地表径流25 mm、深层渗漏35 mm、蒸散量200 mm。该生长期0~50 cm土层储水量变化为","options":["减少30 mm","增加30 mm","减少80 mm","基本不变"],"answer":[0],"explain":"储水量变化＝降水＋灌溉－径流－渗漏－蒸散＝150＋80－25－35－200＝－30 mm，即减少30 mm。忽略径流和渗漏或把蒸散当作收入项都会得出错误结果。","tag":"土壤水分"},{"id":"soil-a022","type":"single","stage":3,"stem":"下列土壤水分形态中，按土壤对水分吸持力由大到小排列，正确的是","options":["毛管水＞膜状水＞吸湿水＞重力水","吸湿水＞膜状水＞毛管水＞重力水","重力水＞毛管水＞膜状水＞吸湿水","膜状水＞吸湿水＞重力水＞毛管水"],"answer":[1],"explain":"土壤对水分的吸持力由大到小依次为吸湿水、膜状水、毛管水、重力水，含水量则依次升高。重力水受重力支配最易排走，故排在最后，其余排序均颠倒。","tag":"土壤水分"},{"id":"soil-a023","type":"single","stage":3,"stem":"对多数牧草而言，永久凋萎点所对应的土壤水吸力约为","options":["0.03 MPa","0.30 MPa","1.5 MPa","15 MPa"],"answer":[2],"explain":"田间持水量对应的水吸力约0.03 MPa，永久凋萎点约1.5 MPa，二者之间的水分即有效水。0.3 MPa常用于区分易效水与难效水，15 MPa则远超凋萎点。","tag":"土壤水分"},{"id":"soil-a027","type":"single","stage":3,"stem":"某草地土壤阳离子交换量为20 cmol(+)/kg，交换性盐基总量为16 cmol(+)/kg，其盐基饱和度为","options":["16%","20%","125%","80%"],"answer":[3],"explain":"盐基饱和度＝交换性盐基总量/阳离子交换量×100%＝16÷20×100%＝80%。16%是误把盐基总量直接当作百分数，125%则把分子与分母颠倒相除。","tag":"土壤化学性质"},{"id":"soil-a028","type":"single","stage":3,"stem":"与盐基饱和度低的土壤相比，盐基饱和度高的草地土壤通常","options":["pH较高，交换性Ca²⁺、Mg²⁺在交换性阳离子中占比大","pH较低，交换性Al³⁺、H⁺占比大","阳离子交换量明显较小，保肥能力弱","有机质分解速度慢，养分释放少"],"answer":[0],"explain":"盐基饱和度高的土壤中交换性Ca²⁺、Mg²⁺占比大，pH较高、缓冲性强。pH低、Al³⁺占比大是盐基饱和度低的表现；交换量大小与盐基饱和度不是同一概念。","tag":"土壤化学性质"},{"id":"soil-a029","type":"single","stage":3,"stem":"草地上长期大量施用硫酸铵等生理酸性铵态氮肥，土壤最可能出现的变化是","options":["阳离子交换量显著升高，缓冲能力增强","交换性Ca²⁺被NH₄⁺取代并淋失，pH下降","盐基饱和度升高，土壤趋于中性","土壤胶体负电荷数量增加，保肥性增强"],"answer":[1],"explain":"硫酸铵为生理酸性肥料，长期施用使NH₄⁺置换胶体上的Ca²⁺、Mg²⁺并随淋洗损失，盐基饱和度下降、pH降低。交换量由胶体类型和有机质决定，不会因此显著升高。","tag":"土壤化学性质"},{"id":"soil-a030","type":"single","stage":3,"stem":"土壤腐殖质对铜、铅等重金属离子具有较强的固定能力，其主要机制是","options":["通过阴离子交换吸附将重金属固定在交换位点上","通过氧化还原反应使重金属挥发损失","依靠羧基、酚羟基等官能团与重金属形成络合物","依靠碳酸钙沉淀将重金属转化为碳酸盐"],"answer":[2],"explain":"腐殖质表面富含羧基、酚羟基等含氧官能团，能与重金属形成稳定的络合物或螯合物，降低其活性和迁移性；重金属多以阳离子存在，不靠阴离子交换固定，也不会挥发。","tag":"土壤化学性质"},{"id":"soil-a031","type":"single","stage":3,"stem":"石灰性草地土壤中磷的有效性常较低，主要原因是","options":["pH偏高使铁、铝氧化物大量释放并吸附磷","土壤黏粒含量低，磷易随水淋失","高pH下土壤胶体正电荷增加，吸附大量磷酸根","磷酸根与钙离子形成难溶性磷酸钙盐"],"answer":[3],"explain":"石灰性土壤富含碳酸钙、pH较高，磷酸根与钙离子形成难溶性磷酸钙盐，有效性低。铁铝氧化物在酸性条件下才大量活化，高pH下胶体负电荷增加，磷也不易淋失。","tag":"土壤化学性质"},{"id":"soil-a035","type":"single","stage":3,"stem":"某草地土壤养分含量较高，但因板结、通气不良和地温偏低，牧草产量并不高。这一现象说明","options":["土壤肥力是水、肥、气、热等因素的综合表现，单有养分不能保证高产","土壤养分含量与牧草产量之间没有任何关系","只要增施化肥就能提高该草地的产量","该土壤肥力水平高，产量低是牧草品种原因"],"answer":[0],"explain":"肥力是水、肥、气、热等多种因素的综合体现。养分虽高，但板结、通气不良和地温低限制了根系吸收与养分释放，产量仍低；单施化肥不能解决通气与温度问题。","tag":"土壤肥力"},{"id":"soil-a037","type":"single","stage":3,"stem":"某盐碱土阳离子交换量为25 cmol(+)/kg，交换性钠为5 cmol(+)/kg，其碱化度（ESP）为","options":["5%","20%","25%","80%"],"answer":[1],"explain":"碱化度＝交换性钠/阳离子交换量×100%＝5÷25×100%＝20%。5%是误把交换性钠的数值直接当作百分数，80%则是把(25－5)/25误按盐基饱和度计算的结果。","tag":"土壤盐碱化"},{"id":"soil-a038","type":"single","stage":3,"stem":"干旱区草甸草地地下水位约1.5 m、地下水矿化度较高，地表常出现白色盐霜，其主要形成过程是","options":["降水淋洗使盐分在表层累积","地下水中的盐分随毛管水下降而淀积于表层","毛管水上升至地表，水分蒸发后盐分在表层聚积","植物残体分解释放大量可溶盐"],"answer":[2],"explain":"地下水位浅且矿化度高时，毛管水把盐分带到地表，水分蒸发后盐分留在表层形成盐霜。降水淋洗会使盐分向下移动，毛管水不会下降把盐带向表层，残体释盐量也远不足。","tag":"土壤盐碱化"},{"id":"soil-a039","type":"single","stage":3,"stem":"对碱化草地施用石膏（CaSO₄）的主要作用是","options":["降低土壤pH至强酸性，抑制盐分溶解","增加土壤胶体负电荷，提高保肥能力","以硫酸根阴离子置换交换性钠，降低pH","以Ca²⁺置换胶体上的Na⁺，降低碱化度并改善结构"],"answer":[3],"explain":"石膏提供Ca²⁺，置换胶体表面的Na⁺，经淋洗排出后碱化度下降，黏粒重新凝聚、结构改善。CaSO₄不能把土壤降为强酸性，阴离子也不参与阳离子交换，故其余选项错误。","tag":"土壤盐碱化"},{"id":"soil-a042","type":"single","stage":3,"stem":"草地长期重度放牧后，土壤最明显的变化是","options":["表层容重增大、孔隙度下降、入渗速率降低","表层容重减小、孔隙度增大、通气性改善","土壤有机质含量升高，结构更加稳定","土壤阳离子交换量显著升高，保肥能力增强"],"answer":[0],"explain":"重牧使家畜践踏加剧，表层容重增大、孔隙度下降、入渗速率降低，进而加重水土流失。有机质含量会下降而非升高，交换量也不会显著提高，故其余选项与实际情况相反。","tag":"草地土壤管理"},{"id":"soil-a043","type":"single","stage":3,"stem":"在退化草地上补播草木樨、苜蓿等豆科牧草，对土壤的主要贡献是","options":["通过根系分泌有机酸大量溶解磷矿，迅速提高速效磷","通过根瘤菌共生固氮增加土壤氮素，并改善土壤结构","通过深根吸收深层水分，使表层土壤含水量升高","通过遮阴降低地温，抑制土壤微生物活动"],"answer":[1],"explain":"豆科牧草与根瘤菌共生固氮，可增加土壤氮素，其根系和残体还能改善结构与有机质。深根主要消耗深层水分，不会使表层含水量升高；遮阴也不是其主要贡献。","tag":"草地土壤管理"},{"id":"soil-a044","type":"single","stage":3,"stem":"与连续放牧相比，划区轮牧对草地土壤的有利影响主要是","options":["家畜集中践踏使表层容重进一步增大，减少水分蒸发","牧草被均匀采食，土壤有机质归还量显著增加","牧草有恢复时间，践踏减轻，土壤结构和入渗性能较好","家畜粪尿集中沉积，使土壤盐分明显降低"],"answer":[2],"explain":"轮牧给牧草留出恢复时间，践踏强度降低，土壤容重较小、结构和入渗性能较好，有利于牧草再生。集中践踏会使容重增大，粪尿沉积并不能降低土壤盐分。","tag":"草地土壤管理"},{"id":"soil-a045","type":"single","stage":3,"stem":"天然草地开垦为农田后，表层土壤有机碳含量通常下降，主要原因是","options":["降水入渗减少，有机碳随径流大量流失","土壤pH升高，有机碳被化学固定","耕种使土壤黏粒增加，有机碳被吸附固定","植被归还量减少，耕作使有机质矿化分解加快"],"answer":[3],"explain":"开垦后天然植被归还的有机物质减少，耕作又改善通气、加速有机质矿化分解，故有机碳下降。有机碳不会因pH升高被化学固定，黏粒增加也不能解释碳的损失。","tag":"草地土壤管理"},{"id":"soil-s17","type":"single","stem":"盐碱土形成的主要机理是","options":["地下水位高、矿化度大，蒸发强烈使盐分随毛管水上升并在地表积聚","降水充沛使可溶性盐随水下渗淋洗","有机质大量分解产生碱性物质","长期施用有机肥导致盐分积累"],"answer":[0],"explain":"盐碱土形成的关键是地下水位高、矿化度大，蒸发量大于降水量，盐分随毛管水上升并在地表积聚；降水多则淋盐，有机质分解和施有机肥不会造成盐分积累。","tag":"土壤盐碱化","level":3,"stage":3,"standard":true},{"id":"soil-s20","type":"single","stem":"禾本科牧草追施氮肥时，提高氮肥利用率的主要措施是","options":["深施覆土或分次追施，避免表施后立即大水漫灌","与石灰同时施用","在干旱条件下撒施于地表","一次性大量施用"],"answer":[0],"explain":"氮肥深施覆土或分次追施可减少氨挥发和硝态氮淋失，提高利用率；与石灰同施会加剧氨挥发，干旱表施和一次性大量施用损失更大，故B、C、D均不利于提高利用率。","tag":"草地土壤管理","level":3,"stage":3,"standard":true},{"id":"soil-a005","type":"multi","stage":3,"stem":"关于五大自然成土因素及其作用，叙述正确的有","options":["气候通过水热条件控制风化强度以及有机质积累与分解的对比","生物因素使土壤获得肥力，是土壤区别于母质的关键","地形只改变地表起伏，不参与土壤水热条件的再分配","母质决定土壤的矿物组成和质地，其影响随成土时间延长而减弱"],"answer":[0,1,3],"explain":"地形通过海拔、坡向和坡度再分配水热条件，进而影响成土过程，故第3项错误；气候控制风化与有机质积累分解对比、生物使土壤获得肥力、母质影响随时间减弱，均正确。","tag":"土壤成土因素"},{"id":"soil-a006","type":"multi","stage":3,"stem":"下列现象中，能说明气候对成土过程具有控制作用的有","options":["由东向西降水减少，草地土壤有机质含量下降、钙积层发育增强、层位变浅","同一山体阴坡与阳坡的土壤水分状况和有机质含量不同","热带地区风化壳深厚、盐基离子淋失强烈","河谷两侧沉积物颗粒粗细不同，土壤质地分异明显"],"answer":[0,2],"explain":"降水由东向西减少引起有机质下降，钙积作用增强、钙积层层位变浅，热带风化壳深厚且盐基淋失强烈，都体现气候的控制作用；坡向差异属地形作用，河谷沉积物分选属母质作用。","tag":"土壤成土因素"},{"id":"soil-a015","type":"multi","stage":3,"stem":"关于土壤容重与孔隙度，下列叙述正确的有","options":["容重可反映土壤的紧实程度，容重越大通常越紧实","同一土壤容重增大时，总孔隙度一般减小","容重与总孔隙度之和恒等于100%，可互相换算","同一土壤容重增大时，通气孔隙往往减少"],"answer":[0,1,3],"explain":"容重反映紧实程度，容重增大时总孔隙度减小、通气孔隙减少。容重单位是g/cm³，孔隙度是体积百分数，两者量纲不同，不能相加为100%，可用孔隙度＝1－容重/比重换算。","tag":"土壤物理性质"},{"id":"soil-a016","type":"multi","stage":3,"stem":"某草地土壤砂粒含量高、黏粒含量低，其性状表现为","options":["保水保肥能力较弱","通气透水性较好","毛管孔隙多，有效水含量高","土温昼夜变幅较大"],"answer":[0,1,3],"explain":"砂粒多、黏粒少的土壤通气透水性好、土温变幅大，但毛管孔隙少、保水保肥能力弱，有效水含量低于黏质土，故第3项错误，其余三项正确。","tag":"土壤物理性质"},{"id":"soil-a024","type":"multi","stage":3,"stem":"关于草地土壤水分平衡与灌溉，叙述正确的有","options":["灌溉量应控制在田间持水量以内，避免产生深层渗漏","有效降水量越大，所需灌溉定额越小","土壤蒸发和植物蒸腾是草地水分支出的主要途径","砂质土的有效水含量通常高于黏质土"],"answer":[0,1,2],"explain":"灌溉以田间持水量为上限可减少深层渗漏，有效降水越多灌溉定额越小，蒸发蒸腾是主要支出项。第4项错误：黏质土有效水含量高于砂质土。","tag":"土壤水分"},{"id":"soil-a032","type":"multi","stage":3,"stem":"关于土壤阳离子交换作用与草地施肥，叙述正确的有","options":["施入的K⁺、NH₄⁺可与胶体表面的Ca²⁺、Mg²⁺发生交换","阳离子交换量大的土壤保肥能力通常较强","NO₃⁻主要靠阴离子交换吸附被土壤保持，不易淋失","盐基饱和度低的酸性草地土壤施用石灰可提高盐基饱和度"],"answer":[0,1,3],"explain":"K⁺、NH₄⁺可与胶体上Ca²⁺、Mg²⁺交换，交换量大者保肥强，酸性土施石灰可提高盐基饱和度。第3项错误：NO₃⁻带负电，受胶体排斥，主要存在于溶液中，极易淋失。","tag":"土壤化学性质"},{"id":"soil-a040","type":"multi","stage":3,"stem":"对苏打盐碱化草地进行综合改良，下列措施合理的有","options":["施用石膏或磷石膏，以钙离子代换交换性钠","健全排水系统、降低地下水位，防止盐分表聚","种植耐盐牧草并增加地表覆盖，减少蒸发","大量施用氯化钠，以盐压盐"],"answer":[0,1,2],"explain":"以钙代钠、排水控盐、种植耐盐牧草并覆盖减少蒸发，均为苏打盐碱化草地的合理改良措施；施氯化钠只会加重盐害，属错误做法，故第4项不选。","tag":"土壤盐碱化"},{"id":"soil-a046","type":"multi","stage":3,"stem":"下列草地管理措施中，有利于增加土壤有机碳储量的有","options":["围栏封育、减轻放牧压力，恢复植被","补播多年生禾本科和豆科牧草","每年深翻晒垡并清除全部地上残茬","施用腐熟有机肥、秸秆覆盖还田"],"answer":[0,1,3],"explain":"围栏封育、补播多年生牧草、施有机肥和秸秆还田都能增加有机物料输入与固持；每年深翻晒垡并清除残茬会加速有机质矿化、减少归还，不利于碳积累。","tag":"草地土壤管理"},{"id":"soil-a047","type":"multi","stage":3,"stem":"在盐碱化草地上建植人工草地，下列做法合理的有","options":["选择耐盐碱的牧草品种，如碱茅、沙打旺","平整土地、健全排水系统，配合灌溉压盐","在返盐季节大量灌溉而不设排水出口","增施有机肥和磷石膏，改良碱化层"],"answer":[0,1,3],"explain":"选耐盐品种、平整土地并健全排水、增施有机肥和磷石膏改良碱化层，都是盐碱地建植人工草地的合理做法；返盐期只灌不排会抬高地下水位、加重盐渍化。","tag":"草地土壤管理"},{"id":"soil-m04","type":"multi","stem":"关于盐碱土特征与改良的叙述，正确的有","options":["盐土以可溶性盐类大量积累为特征，碱土以交换性钠含量高、pH高为特征","种植耐盐牧草会加重盐渍化，盐碱地应禁止种植","施用石膏可提供钙离子置换碱土中的交换性钠","盐碱土改良只需大量灌溉，无需排水"],"answer":[0,2],"explain":"盐土以可溶性盐大量积累为特征，碱土以交换性钠高、pH高、物理性质恶化为特征；改良碱土常用石膏提供钙置换钠，种植耐盐牧草是有效的改良利用途径，故B、D错误。","tag":"土壤盐碱化","level":3,"stage":3,"standard":true},{"id":"soil-a007","type":"judge","stage":3,"stem":"在五大自然成土因素中，生物因素使土壤具有了母质所不具备的肥力，因而是土壤形成的核心因素之一。","options":["正确","错误"],"answer":[0],"explain":"生物通过有机质合成与分解、养分富集和根系穿插，使土壤具有母质所没有的肥力并形成剖面分异，故为成土核心因素；母质只提供物质基础，本身并不具有肥力。","tag":"土壤成土因素"},{"id":"soil-a008","type":"judge","stage":3,"stem":"母质对土壤性质的影响始终强于气候，且这种影响不会随成土时间的延长而发生改变。","options":["正确","错误"],"answer":[1],"explain":"该说法错误。成土初期母质的矿物组成和质地对土壤影响明显，随成土时间延长，气候与生物的作用不断增强，母质影响相对减弱，成熟土壤性质更多由水热和植被条件决定。","tag":"土壤成土因素"},{"id":"soil-a017","type":"judge","stage":3,"stem":"土壤容重是单位体积原状土壤（含孔隙）的烘干土重，其数值一般小于同一种土壤的比重。","options":["正确","错误"],"answer":[0],"explain":"容重为包含孔隙的单位体积原状土的烘干重，因固体部分只占总体积的一部分，故容重小于比重；两者之比即固相率，容重/比重＝1－总孔隙度。","tag":"土壤物理性质"},{"id":"soil-a018","type":"judge","stage":3,"stem":"土壤总孔隙度等于毛管孔隙度与非毛管孔隙度之和，且毛管孔隙与非毛管孔隙的比例不随质地和结构而变化。","options":["正确","错误"],"answer":[1],"explain":"该说法错误。总孔隙度确为毛管孔隙与非毛管孔隙之和，但两者比例随质地和结构显著变化：砂质土非毛管孔隙比例大，黏质土和团粒结构良好的土壤毛管孔隙比例大。","tag":"土壤物理性质"},{"id":"soil-a025","type":"judge","stage":3,"stem":"土壤有效水是田间持水量与凋萎系数之间的那部分水分，一般黏质土的有效水含量高于砂质土。","options":["正确","错误"],"answer":[0],"explain":"有效水为田间持水量与凋萎系数之差。黏质土该差值约为15%～18%，砂质土仅5%～8%，故黏质土有效水含量更高，但其导水慢、释水能力略差。","tag":"土壤水分"},{"id":"soil-a026","type":"judge","stage":3,"stem":"在同一土壤中，土壤水吸力越大，其含水量越高，因此可用水吸力判断土壤的干旱程度。","options":["正确","错误"],"answer":[1],"explain":"该说法错误。土壤水吸力与含水量呈反比：含水量越低，吸力越大。因此吸力越大说明土壤越干，而不是含水量越高，二者的关系被说反了。","tag":"土壤水分"},{"id":"soil-a033","type":"judge","stage":3,"stem":"土壤胶体一般带负电荷，能吸附保持NH₄⁺、K⁺等阳离子，而对NO₃⁻的保持能力很弱。","options":["正确","错误"],"answer":[0],"explain":"土壤胶体一般带负电荷，通过静电作用吸附NH₄⁺、K⁺、Ca²⁺等阳离子；NO₃⁻为阴离子，受同性电荷排斥，除少量被生物固定外主要留在溶液中，容易随水淋失。","tag":"土壤化学性质"},{"id":"soil-a034","type":"judge","stage":3,"stem":"土壤盐基饱和度越低，说明交换性钙、镁等离子占交换性阳离子的比例越高。","options":["正确","错误"],"answer":[1],"explain":"该说法错误。盐基饱和度是交换性盐基占阳离子交换量的百分比，饱和度越低说明Ca²⁺、Mg²⁺、K⁺等占比越小，H⁺、Al³⁺占比越大，土壤越酸。","tag":"土壤化学性质"},{"id":"soil-a036","type":"judge","stage":3,"stem":"土壤有机质是衡量土壤肥力的重要指标，因此有机质含量越高的土壤，其肥力水平一定越高。","options":["正确","错误"],"answer":[1],"explain":"该说法错误。有机质是重要肥力指标，但肥力还包括通气性、水分和温度等。有机质高的土壤若通气不良或地温过低，肥力表现仍可能较差，不能仅凭有机质判断。","tag":"土壤肥力"},{"id":"soil-a041","type":"judge","stage":3,"stem":"盐碱土改良中灌溉必须与排水相结合，只灌不排会抬高地下水位，加重次生盐渍化。","options":["正确","错误"],"answer":[0],"explain":"灌溉压盐需有排水出路，只灌不排将抬高地下水位，使盐分随毛管水再次向表层聚积，形成次生盐渍化。以灌代排是盐碱地改良中常见的失误。","tag":"土壤盐碱化"},{"id":"ecology-b001","type":"single","stage":1,"stem":"某植物种群在资源分布均匀、个体间竞争激烈的环境中呈等距分布，这种空间分布格局属于","options":["随机分布","均匀分布","集群分布","斑块分布"],"answer":[1],"explain":"均匀分布多出现在资源均匀、个体间竞争激烈的环境，如人工林和干旱区灌木。随机分布要求环境资源均匀且个体间相互作用很弱；集群分布是最常见的格局，由资源斑块性或繁殖方式造成，故A、C、D均不符。","tag":"种群生态"},{"id":"ecology-b002","type":"single","stage":1,"stem":"某草地植物种群中幼年个体很少，老年个体比例很大，该种群的年龄结构属于","options":["增长型","稳定型","衰退型","随机型"],"answer":[2],"explain":"衰退型种群的幼年个体少、老年个体多，未来进入生殖期的个体不足，种群密度将下降。增长型幼年个体比例大，稳定型各年龄组比例相近；年龄结构只有增长型、稳定型、衰退型三类，“随机型”不是年龄结构类型。","tag":"种群生态"},{"id":"ecology-b003","type":"single","stage":1,"stem":"某动物种群在生命早期死亡率极高，只有少数个体能活到老年，其存活曲线属于","options":["Ⅰ型（凸型）","Ⅱ型（对角线型）","Ⅲ型（凹型）","Ⅳ型（S型）"],"answer":[2],"explain":"Ⅲ型存活曲线呈凹形，幼体死亡率极高、存活后死亡率低，鱼类和昆虫多属此类。Ⅰ型凸形表示幼体存活率高、老年集中死亡；Ⅱ型对角线表示各年龄死亡率相近；存活曲线无Ⅳ型S形之说，故D错。","tag":"种群生态"},{"id":"ecology-b004","type":"single","stage":1,"stem":"下列种群参数中，直接决定种群密度变化的是","options":["出生率和死亡率","年龄结构和性比","空间分布格局","物种丰富度"],"answer":[0],"explain":"出生与死亡、迁入与迁出直接改变种群个体数量，是决定种群密度的直接因素。年龄结构和性比通过影响出生率与死亡率间接起作用，分布格局只反映个体空间配置，物种丰富度是群落水平的指标，故B、C、D均不直接决定密度。","tag":"种群生态"},{"id":"ecology-b005","type":"single","stage":1,"stem":"一个物种在群落中所处的时空位置及其与其他物种的营养关系，称为该物种的","options":["生态位","生活型","生态幅","栖息地"],"answer":[0],"explain":"生态位是物种在群落中的时间、空间位置及与其他物种的功能关系，强调其在群落中的角色。栖息地只是物种生活的场所，生态幅指对某一环境因子的耐受范围，生活型是按形态习性划分的植物类型，三者均不等于生态位。","tag":"种群生态"},{"id":"ecology-b006","type":"single","stage":1,"stem":"在食物和空间充足、无天敌和疾病等理想条件下，种群所能达到的最大增长率称为","options":["实际增长率","内禀增长率","周限增长率","环境容纳量"],"answer":[1],"explain":"内禀增长率是在理想条件下、不受密度制约时的最大增长率，是物种固有的生物学特性。实际增长率因环境阻力而低于内禀增长率；周限增长率是一定时期内种群增长的倍数；环境容纳量K是数量上限，故A、C、D错。","tag":"种群生态"},{"id":"ecology-b012","type":"single","stage":1,"stem":"草原群落中不同地段的植物种类组成和密度呈斑块状差异，这种现象反映的是群落的","options":["垂直结构","水平结构","时间结构","营养结构"],"answer":[1],"explain":"群落的水平结构指在水平方向上因地形、土壤和水分差异形成的斑块状镶嵌分布。垂直结构指成层现象，时间结构指随季节变化的外貌，营养结构指食物链和食物网，故A、C、D均不符。","tag":"群落生态"},{"id":"ecology-b013","type":"single","stage":1,"stem":"一个群落中物种数目的多少称为","options":["物种丰富度","物种均匀度","生态优势度","多度"],"answer":[0],"explain":"物种丰富度仅指群落中物种数目的多少，不涉及各物种个体数比例。均匀度描述各物种个体数分配的均匀程度，优势度反映优势种作用的大小，多度指某物种的个体数量，故B、C、D均不是表示物种数目的指标。","tag":"群落生态"},{"id":"ecology-b014","type":"single","stage":1,"stem":"草原群落的外貌随季节更替发生明显变化，春夏一片绿色、秋季逐渐枯黄，这种现象称为群落的","options":["层相","水平结构","演替","季相"],"answer":[3],"explain":"季相是群落外貌随季节变化而呈现的周期性更替，由植物物候差异造成。水平结构是水平方向的斑块差异，演替是年际间的定向变化，“层相”不是规范术语，故A、B、C均不符。","tag":"群落生态"},{"id":"ecology-b015","type":"single","stage":1,"stem":"群落演替到与当地气候等环境条件相适应、相对稳定的最终阶段，该群落称为","options":["先锋群落","演替系列","顶极群落","伴生群落"],"answer":[2],"explain":"顶极群落是演替的最终稳定阶段，其组成和结构与该地区气候、土壤条件相适应。先锋群落是演替初期阶段，演替系列指演替全过程中各阶段群落的序列，“伴生群落”不是规范术语，故A、B、D错。","tag":"群落生态"},{"id":"ecology-b016","type":"single","stage":1,"stem":"在群落的优势层中，对群落结构形成起主要作用的优势种称为","options":["伴生种","偶见种","建群种","外来种"],"answer":[2],"explain":"建群种是优势层中的优势种，决定群落的基本结构和外貌。伴生种和偶见种在群落中作用较小，外来种是按来源划分的类群，与是否建群无关。注意建群种一定是优势种，而优势种不一定是建群种，故A、B、D错。","tag":"群落生态"},{"id":"ecology-b017","type":"single","stage":1,"stem":"在裸地上最先定居并能改变环境条件的植物种称为","options":["先锋种","建群种","优势种","伴生种"],"answer":[0],"explain":"先锋种是演替初期最先在裸地定居的物种，能耐受恶劣条件并改造环境，为后续物种的入侵和定居创造条件。建群种和优势种是成熟群落中的概念，伴生种作用较小，故B、C、D不符。","tag":"群落生态"},{"id":"ecology-b023","type":"single","stage":1,"stem":"草地上的“牧草→蝗虫→蜥蜴→鹰”所表示的食物链属于","options":["捕食食物链","腐生食物链","寄生食物链","混合食物链"],"answer":[0],"explain":"捕食食物链以活体绿色植物为起点，各环节均为捕食关系，如牧草被蝗虫取食。腐生食物链从动植物残体开始，寄生食物链由寄主体内取食构成，“混合食物链”不是规范分类，故B、C、D错。","tag":"生态系统"},{"id":"ecology-b024","type":"single","stage":1,"stem":"一棵大树上生活着大量昆虫，若以个体数量为指标绘制生态金字塔，会呈现倒置形。这说明","options":["能量金字塔也可以倒置","数量金字塔可能出现倒置","生物量金字塔必然倒置","生态金字塔必须保持正立"],"answer":[1],"explain":"数量金字塔以个体数量为指标，一棵树可对应大量昆虫，故可能倒置。能量金字塔遵循能量逐级递减，永远正立；生物量金字塔通常正立，仅在海洋浮游生物等特殊情况下倒置，并不必然倒置，故A、C、D错。","tag":"生态系统"},{"id":"ecology-b025","type":"single","stage":1,"stem":"与碳、氮循环相比，磷循环的特点是","options":["属于气体型循环，周转快","属于沉积型循环，周转慢","主要靠大气降水输入","在生物体内不参与代谢"],"answer":[1],"explain":"磷的主要储库是岩石和沉积物，没有气态形式，属沉积型循环，周转速度慢。碳、氮都有气态形式，属气体型循环；磷是核酸、ATP等的组成元素，必须参与代谢，故A、C、D错。","tag":"生态系统"},{"id":"ecology-b026","type":"single","stage":1,"stem":"绿色植物固定的太阳能总量扣除植物自身呼吸消耗后剩余的部分，称为","options":["总初级生产量","次级生产量","净初级生产量","生物量"],"answer":[2],"explain":"净初级生产量＝总初级生产量－植物呼吸消耗，是可供消费者和分解者利用的能量。总初级生产量未扣除呼吸消耗；次级生产量是消费者同化的能量；生物量是现存有机物质的总量，故A、B、D错。","tag":"生态系统"},{"id":"ecology-b027","type":"single","stage":1,"stem":"雄性昆虫释放性外激素吸引同种异性个体前来交配，这种信息属于","options":["物理信息","行为信息","营养信息","化学信息"],"answer":[3],"explain":"性外激素是昆虫分泌的化学物质，通过气味传递信息，属化学信息。物理信息包括光、声、温度等；行为信息指动物的特殊行为动作；营养信息指食物和营养关系，故A、B、C均不符。","tag":"生态系统"},{"id":"ecology-b028","type":"single","stage":1,"stem":"生态系统受到外界干扰后能够保持相对稳定，其自我调节的基础是","options":["正反馈调节","能量循环利用","物种不断入侵","负反馈调节"],"answer":[3],"explain":"负反馈调节使系统偏离稳定状态时通过一系列反应减弱干扰、恢复平衡，是生态系统自我调节的基础。正反馈会使偏离加剧；能量单向流动不能循环利用；物种入侵常破坏稳定性，故A、B、C错。","tag":"生态系统"},{"id":"ecology-b029","type":"single","stage":1,"stem":"湖泊中藻类大量繁殖形成水华，主要是由于水体中哪类元素大量输入","options":["碳和氧","钾和钙","氮和磷","硫和铁"],"answer":[2],"explain":"氮、磷是藻类生长的限制性营养元素，生活污水和农业径流带入大量氮磷，导致藻类暴发形成水华。碳、氧在水中并不缺乏，钾、钙、硫、铁不是藻类生长的主要限制因子，故A、B、D错。","tag":"生态系统"},{"id":"ecology-b030","type":"single","stage":1,"stem":"碳在生物群落与无机环境之间循环的主要形式是","options":["碳酸盐","二氧化碳","有机碳化合物","一氧化碳"],"answer":[1],"explain":"碳以二氧化碳形式通过光合作用进入生物群落，又以呼吸作用、分解作用和燃烧释放的二氧化碳返回大气。碳酸盐是岩石中的储库形式，有机碳在生物群落内部传递，一氧化碳含量极微，故A、C、D错。","tag":"生态系统"},{"id":"ecology-b031","type":"single","stage":1,"stem":"生态系统的基本功能包括","options":["能量流动、物质循环和信息传递","光合作用、呼吸作用和蒸腾作用","生产、消费和分解","竞争、捕食和寄生"],"answer":[0],"explain":"生态系统的基本功能是能量流动、物质循环和信息传递，三者把生物与无机环境联系为整体。光合、呼吸、蒸腾是植物生理过程；生产、消费、分解是生物成分类型；竞争、捕食、寄生是种间关系，故B、C、D错。","tag":"生态系统"},{"id":"ecology-b037","type":"single","stage":1,"stem":"草原是以哪类植物为主体的植被类型","options":["多年生草本植物","常绿阔叶乔木","一年生农作物","水生浮叶植物"],"answer":[0],"explain":"草原是以多年生旱生草本植物为主体、禾本科常占优势的植被类型，乔木十分稀少。常绿阔叶乔木是森林植被的主体，一年生农作物构成农田植被，水生浮叶植物属于水生植被，故B、C、D错。","tag":"草原生态"},{"id":"ecology-b038","type":"single","stage":1,"stem":"我国北方温带草原地区降水较少，限制草原初级生产力的主要生态因子通常是","options":["光照强度","水分","二氧化碳浓度","土壤质地"],"answer":[1],"explain":"温带草原处于半干旱区，水分是限制植物生长和初级生产力的首要因子，降水量的年际波动直接决定产草量。该区光照充足，大气二氧化碳浓度相对稳定，土壤质地也不是主要限制因子，故A、C、D错。","tag":"草原生态"},{"id":"ecology-b039","type":"single","stage":1,"stem":"草地经过适度放牧后，牧草产量有时反而高于未放牧草地，其主要原因是","options":["家畜粪便为牧草直接提供能量","放牧彻底消除了牧草病虫害","采食刺激牧草分蘖，产生补偿性生长","家畜活动提高了大气二氧化碳浓度"],"answer":[2],"explain":"适度采食可解除顶端优势、促进分蘖和再生，形成补偿性生长，使产草量提高。家畜粪便提供的是矿质养分而不是能量；放牧不能彻底消除病虫害；家畜活动不会明显改变大气二氧化碳浓度，故A、B、D错。","tag":"草原生态"},{"id":"ecology-b040","type":"single","stage":1,"stem":"草地退化最直观的表现是","options":["土壤温度逐年升高","牧草光合同化能力增强","地下水位明显上升","植被盖度下降、优良牧草比例减少"],"answer":[3],"explain":"草地退化首先表现为植被盖度降低、优良牧草比例下降、毒杂草和裸露斑块增加，进而引起土壤侵蚀。退化过程中生产力下降而非光合能力增强，土壤温度和地下水位的变化并不直观，故A、B、C错。","tag":"草原生态"},{"id":"ecology-b041","type":"single","stage":1,"stem":"把草地划分为若干小区，按一定顺序轮流放牧、每区放牧后留有恢复期的利用方式称为","options":["自由放牧","连续放牧","割草利用","划区轮牧"],"answer":[3],"explain":"划区轮牧通过分区轮换和休牧，使牧草有恢复再生时间，可防止过度放牧、提高草地利用率。自由放牧和连续放牧长期在同一地段采食，易导致草地退化；割草利用是刈割而不是放牧，故A、B、C错。","tag":"草原生态"},{"id":"ecology-b042","type":"single","stage":1,"stem":"草畜平衡的核心要求是","options":["尽量提高家畜存栏数量","全面禁牧以恢复草地","大量施用化肥提高产草量","家畜数量与草地生产能力相适应"],"answer":[3],"explain":"草畜平衡指家畜数量与草地可提供的饲草量相适应，即以草定畜，既保证生产又防止退化。单纯追求存栏数会超载过牧，全面禁牧只是恢复措施之一，化肥不能替代草地自身的生产能力，故A、B、C错。","tag":"草原生态"},{"id":"ecology-b046","type":"single","stage":1,"stem":"种群中个体在空间上分布均匀、彼此保持大致相等距离的格局属于","options":["均匀分布","随机分布","集群分布","镶嵌分布"],"answer":[0],"explain":"均匀分布多由资源均匀、个体间竞争或领域行为造成，个体间距大致相等。随机分布要求环境一致且个体间互不影响，自然界较少见；集群分布是最常见的格局，由资源斑块性和繁殖方式形成；镶嵌分布描述群落水平结构，不是种群分布格局。","tag":"种群生态"},{"id":"ecology-b047","type":"single","stage":1,"stem":"群落的物种多样性指数主要取决于","options":["物种丰富度和均匀度","只有物种丰富度","只有物种均匀度","群落的面积大小"],"answer":[0],"explain":"物种多样性由丰富度（物种数）和均匀度（各物种个体数分配的均匀程度）共同决定，二者都高时多样性高；仅看物种数或仅看均匀度都不全面，面积通过影响物种数间接起作用。","tag":"群落生态"},{"id":"ecology-b048","type":"single","stage":1,"stem":"以动植物遗体、落叶和粪便等死亡有机物质为起点的食物链是","options":["捕食食物链","寄生食物链","碎屑食物链","混合食物链"],"answer":[2],"explain":"碎屑食物链以动植物遗体和粪便等死亡有机物为起点，经细菌、真菌和蚯蚓、蜣螂等食碎屑动物再到捕食者。捕食食物链以绿色植物为起点；寄生食物链以活寄主为起点；混合食物链不是按起点划分的标准类型。","tag":"生态系统"},{"id":"ecology-b049","type":"single","stage":1,"stem":"我国高寒草原主要分布的地区是","options":["内蒙古高原东部","东北平原西部","黄土高原北部","青藏高原"],"answer":[3],"explain":"高寒草原发育于青藏高原海拔高、寒冷干燥的条件下，以耐寒多年生草本为主。内蒙古高原东部为草甸草原和典型草原，东北平原西部属草甸草原，黄土高原北部为典型草原向荒漠草原过渡，均不属于高寒草原。","tag":"草原生态"},{"id":"ecology-b050","type":"single","stage":1,"stem":"人类等大型哺乳动物幼年死亡率低、老年死亡率高的存活曲线属于","options":["凹型（Ⅲ型）","凸型（Ⅰ型）","对角线型（Ⅱ型）","S型"],"answer":[1],"explain":"凸型（Ⅰ型）曲线表示幼体和成体死亡率都低，多数个体能活到接近生理寿命，人类和大型哺乳动物属此类型。凹型（Ⅲ型）表示幼体死亡率极高，如鱼类；对角线型（Ⅱ型）表示各年龄死亡率大致相同，如鸟类；不存在S型存活曲线。","tag":"种群生态"},{"id":"ecology-b051","type":"single","stage":1,"stem":"群落的外貌随季节更替而发生明显变化的现象称为","options":["层片","镶嵌性","季相","生活型"],"answer":[2],"explain":"季相是群落外貌随季节更替而变化的现象，属于群落的时间结构，温带草原春夏秋外貌差异明显。层片是按生态习性划分的结构单位；镶嵌性是水平结构的表现；生活型是植物对环境长期适应形成的形态类型，都不表示季节性外貌变化。","tag":"群落生态"},{"id":"ecology-b052","type":"single","stage":1,"stem":"生态系统中能量流动与物质循环的关系是","options":["能量流动是物质循环的动力，物质循环是能量流动的载体","能量和物质都能在生态系统中循环利用","物质循环是单向的，能量流动是循环的","能量流动与物质循环彼此独立、互不影响"],"answer":[0],"explain":"能量流动为物质循环提供动力，物质作为载体使能量沿食物链传递，二者同时进行、相互依存。能量单向流动、逐级递减，不能循环利用；物质可以反复循环；说二者彼此独立或把单向与循环关系颠倒均错误。","tag":"生态系统"},{"id":"ecology-b053","type":"single","stage":1,"stem":"草原放牧试验中植物多样性往往在中等放牧强度下最高，这一现象可用下列哪一假说解释","options":["竞争排斥假说","岛屿生物地理学假说","耐受性假说","中度干扰假说"],"answer":[3],"explain":"中度干扰假说认为中等强度干扰能抑制竞争优势种、为更多物种提供定居机会，故多样性最高；干扰过弱时少数优势种垄断资源，过强则多数物种难以存活。竞争排斥假说解释种间竞争，岛屿生物地理学假说解释面积与隔离的作用。","tag":"草原生态"},{"id":"ecology-b058","type":"single","stage":1,"stem":"在逻辑斯谛增长中，种群数量达到环境容纳量K时，种群的瞬时增长率为","options":["最大值","等于内禀增长率r","接近于零","负值且不断减小"],"answer":[2],"explain":"数量达到K时资源限制使出生率与死亡率大致相等，瞬时增长率接近于零，种群数量保持稳定。增长速率最大出现在K/2处；内禀增长率r是理想条件下的最大增长率；只有超过K时增长率才为负值。","tag":"种群生态"},{"id":"ecology-b059","type":"single","stage":1,"stem":"根据岛屿生物地理学理论，下列岛屿中物种数目最多的是","options":["面积大且距大陆近的岛屿","面积大但距大陆远的岛屿","面积小且距大陆近的岛屿","面积小且距大陆远的岛屿"],"answer":[0],"explain":"岛屿面积越大，生境多样性和可容纳的种群越大，灭绝率越低；距大陆越近，迁入率越高，因此面积大、距离近的岛屿物种数最多。其余三项或在面积上、或在隔离程度上处于劣势，物种数目相对较少。","tag":"群落生态"},{"id":"ecology-b060","type":"single","stage":1,"stem":"海洋生态系统中浮游植物生物量金字塔常呈倒置状态，其主要原因是","options":["海洋中初级生产量极低","浮游植物个体小、繁殖快、周转率高","海洋消费者数量少于生产者","浮游植物含能量高于消费者"],"answer":[1],"explain":"生物量金字塔按现存量绘制。浮游植物个体小、繁殖快、被取食快，现存量虽少但周转迅速，能支撑较大的浮游动物现存量，故呈倒置。海洋初级生产量并不低，能量金字塔一般仍正立，与倒置无关。","tag":"生态系统"},{"id":"ecology-b061","type":"single","stage":1,"stem":"为减轻放牧对草地的持续压力、给牧草留出休养生息的时间，草原上最常采用的利用方式是","options":["自由放牧","连续全年放牧","单区固定放牧","划区轮牧"],"answer":[3],"explain":"划区轮牧把草地分成若干小区，按计划依次放牧、轮流休闲，使牧草有恢复和再生机会，是减轻草地压力最常用的利用方式。自由放牧、连续全年放牧和单区固定放牧都会使同一地块反复被采食践踏，导致草地退化。","tag":"草原生态"},{"id":"ecology-b062","type":"single","stage":1,"stem":"生态位概念所强调的核心内容是","options":["物种分布区面积的大小","种群个体数量的多少","物种在食物链中所处的营养级","物种在群落中的资源利用方式与功能作用"],"answer":[3],"explain":"生态位指物种在群落中所占据的资源空间及其与其他物种的关系，包括食物、活动时间和空间等，强调资源利用方式与功能作用。分布区面积、个体数量和营养级只是生态位的个别侧面，不能完整表达其含义。","tag":"种群生态"},{"id":"ecology-b063","type":"single","stage":1,"stem":"按休眠芽在植物体上所处的位置划分植物生活型，依据的是","options":["植物体高度和冠幅","休眠芽距地面的高度","叶片的大小和形状","根系分布的深度"],"answer":[1],"explain":"生活型是植物对综合环境长期适应形成的形态类型，按休眠芽或复苏芽距地面的高度可分为高位芽、地上芽、地面芽、地下芽和一年生植物。植物高度、叶形和根深都不是划分生活型的标准。","tag":"群落生态"},{"id":"ecology-b064","type":"single","stage":1,"stem":"生态系统中消费者和分解者利用初级生产量所形成的那部分生产量称为","options":["次级生产量","净初级生产量","总初级生产量","生物量"],"answer":[0],"explain":"次级生产量是消费者和分解者同化初级生产量后形成的自身有机物量。总初级生产量是生产者固定的全部能量；净初级生产量是总初级生产量减去生产者呼吸后的部分；生物量是某一时刻的现存量，三者含义均不同。","tag":"生态系统"},{"id":"ecology-b065","type":"single","stage":1,"stem":"下列现象中，最能作为草原退化直接指标的是","options":["草原土壤pH略有季节变化","牧草返青期推迟两三天","植被盖度下降、优良牧草比例降低、毒杂草增多","草原上空降水云量增多"],"answer":[2],"explain":"草原退化表现为植被盖度下降、生产力降低、优良牧草比例下降、毒杂草和裸露地增加，并常伴随土壤侵蚀，因此该项所列是退化的直接指标。土壤pH季节波动、返青期短期变化和云量变化受气候随机性影响大，不能作为判据。","tag":"草原生态"},{"id":"ecology-b069","type":"single","stage":1,"stem":"我国典型草原的代表性建群种是","options":["芨芨草和芦苇","大针茅和羊草","碱蓬和盐爪爪","高山嵩草和苔草"],"answer":[1],"explain":"典型草原以旱生丛生禾草为主，大针茅、羊草、克氏针茅和糙隐子草是代表性建群种。芨芨草和芦苇为草甸种；碱蓬、盐爪爪为盐生植物；高山嵩草和苔草为高寒草甸成分，均不是典型草原的建群种。","tag":"草原生态"},{"id":"ecology-b070","type":"single","stage":1,"stem":"某自然种群中幼年个体少、老年个体多，该种群的年龄结构属于","options":["增长型","稳定型","随机型","衰退型"],"answer":[3],"explain":"老年个体多、幼年个体少，意味着未来进入繁殖期的个体减少，种群数量将下降，属衰退型。增长型的幼年个体比例大；稳定型各年龄组比例适中；年龄结构只分为增长型、稳定型和衰退型，随机型不是其类型。","tag":"种群生态"},{"id":"ecology-b071","type":"single","stage":1,"stem":"单元顶极学说认为，在同一气候区内群落演替的最终结果是","options":["形成多种顶极群落的镶嵌组合","停留在草本阶段不再发展","形成与该气候相适应的单一顶极群落","由土壤条件决定形成土壤顶极"],"answer":[2],"explain":"单元顶极学说认为同一气候区内群落经过演替最终形成与该气候相适应的单一稳定顶极群落。多元顶极学说才认为因地形、土壤差异可形成多个顶极；停留在草本阶段和形成土壤顶极都不符合单元顶极学说。","tag":"群落生态"},{"id":"ecology-b072","type":"single","stage":1,"stem":"碳在生物群落与无机环境之间循环时，主要以哪种形式进行","options":["二氧化碳","碳酸盐","有机碳化合物","一氧化碳"],"answer":[0],"explain":"碳在生物群落与无机环境之间主要以二氧化碳形式循环：生产者经光合作用固定二氧化碳，生物经呼吸和分解又把二氧化碳释放回大气。有机碳主要在群落内部沿食物链传递；碳酸盐参与长期的沉积循环；一氧化碳不是主要形式。","tag":"生态系统"},{"id":"ecology-b074","type":"single","stage":1,"stem":"对活动能力强、活动范围大的动物进行种群密度调查时，宜采用的方法是","options":["标记重捕法","样方法","样带法","直接计数法"],"answer":[0],"explain":"活动能力强的动物难以在固定样方内统计，宜用标记重捕法，以重捕中标记个体的比例估算种群总数。样方法和样带法适用于植物及活动能力弱的动物；直接计数只适用于范围有限、个体易见的情况。","tag":"种群生态"},{"id":"ecology-b075","type":"single","stage":1,"stem":"在群落中个体数量不一定多，但对群落结构和物种共存起关键控制作用的物种称为","options":["优势种","伴生种","关键种","偶见种"],"answer":[2],"explain":"关键种的多度未必高，但其存在与否显著影响群落结构和其他物种的生存。优势种是数量多、覆盖度大、影响群落环境的种；伴生种和偶见种只是按数量划分的次要成分，都不强调关键控制作用。","tag":"群落生态"},{"id":"ecology-b080","type":"single","stage":1,"stem":"磷在生物地球化学循环中主要储存的库是","options":["大气","海洋表层水体","生物群落","岩石和沉积物"],"answer":[3],"explain":"磷没有气体形式，主要储存在岩石和沉积物中，经风化进入土壤和水体，被植物吸收后沿食物链传递，最终随遗体沉积，属沉积型循环。大气是碳、氮循环的主要库；海洋表层水体只是磷的中间转运库。","tag":"生态系统"},{"id":"ecology-b081","type":"single","stage":1,"stem":"在降水稀少的草原区，草地初级生产力最主要的限制因子通常是","options":["土壤有机质含量","降水量和水分条件","大气二氧化碳浓度","土壤中微量元素含量"],"answer":[1],"explain":"草原区降水少且变率大，水分是植物生长最主要的限制因子，初级生产量随年降水量增加而提高。土壤有机质和微量元素也影响产量，但作用受水分制约；大气二氧化碳浓度在大范围内相对稳定，一般不构成主要限制。","tag":"草原生态"},{"id":"ecology-b082","type":"single","stage":1,"stem":"由空间上彼此隔离、但通过个体迁移保持联系的若干局部种群组成的系统称为","options":["同生群","生活史","集合种群","边缘种群"],"answer":[2],"explain":"集合种群由空间上相互隔离的局部种群组成，局部种群间通过个体迁入迁出保持联系，即使个别局部种群灭绝，整体仍可长期存续。同生群指同一时期出生的个体群；生活史是个体发育和繁殖的全过程；边缘种群指分布区边缘的种群。","tag":"种群生态"},{"id":"ecology-b083","type":"single","stage":1,"stem":"植物群落分类的基本单位是","options":["群系","群丛","植被型","群系组"],"answer":[1],"explain":"群丛是植物群落分类的基本单位，指物种组成、结构和生态关系相同的一群群落。群系是中级单位，由建群种相同的一组群丛组成；植被型是最高级分类单位；群系组是群系之上的辅助单位。","tag":"群落生态"},{"id":"ecology-b088","type":"single","stage":1,"stem":"某些重金属和有机氯农药沿食物链传递时，在营养级越高的生物体内浓度越高的现象称为","options":["生物放大","生物降解","生物固氮","生物入侵"],"answer":[0],"explain":"生物放大指某些难降解物质沿食物链在较高营养级生物体内浓度逐渐升高的现象，如DDT在猛禽体内富集。生物降解是微生物分解有机物；生物固氮是固氮微生物把氮气转化为含氮化合物；生物入侵是外来种扩散，均不符合题意。","tag":"生态系统"},{"id":"ecology-b091","type":"single","stage":1,"stem":"在一定时间内占据一定空间的同种生物个体的集合称为","options":["种群","群落","生态系统","生物圈"],"answer":[0],"explain":"种群是同种个体组成的、具有一定结构和遗传特征的繁殖单元；群落是同一区域内所有种群的集合，生态系统还包括无机环境，生物圈是地球上最大的生态系统，三者范围均大于种群。","tag":"种群生态"},{"id":"ecology-b092","type":"single","stage":1,"stem":"某种群中幼年个体比例大、老年个体比例小，该种群的年龄结构属于","options":["稳定型","增长型","衰退型","不规则型"],"answer":[1],"explain":"幼年个体多、老年个体少，未来进入生殖期的个体多于死亡个体，种群数量将增加，属于增长型。稳定型各年龄组比例适中，衰退型幼年个体偏少；年龄结构只有这三类，不存在“不规则型”。","tag":"种群生态"},{"id":"ecology-b093","type":"single","stage":1,"stem":"某植物种群在资源分布均匀、个体间竞争强烈的环境中呈均匀分布，形成这种分布型的主要原因是","options":["种子散布受母株限制","环境资源呈斑块状","种内竞争","动物集群活动"],"answer":[2],"explain":"资源分布均匀时，个体间对水分和养分的竞争促使植株等距排列，形成均匀分布。A项使种子集中在母株附近，B项使个体成斑块聚集，二者都形成集群分布；D项与植物个体分布无关。","tag":"种群生态"},{"id":"ecology-b094","type":"single","stage":1,"stem":"以存活数量的对数为纵坐标、年龄为横坐标绘制的存活曲线中，幼体死亡率很高、进入成体后死亡率明显下降的类型是","options":["Ⅰ型","Ⅱ型","Ⅲ型","Ⅳ型"],"answer":[2],"explain":"Ⅲ型存活曲线初期陡降，反映幼体死亡率极高，进入成体后死亡率明显下降，鱼类和多数昆虫属于此类。Ⅰ型幼体存活率高、老年才大量死亡，Ⅱ型各年龄死亡率相近，不存在Ⅳ型曲线。","tag":"种群生态"},{"id":"ecology-b095","type":"single","stage":1,"stem":"种群在不受食物、空间和天敌限制的理想环境中，由遗传特性决定的最大增长率称为","options":["内禀增长率","实际增长率","迁入率","出生率"],"answer":[0],"explain":"内禀增长率是理想环境下由遗传特性决定的最大增长率，反映种群的增长潜力。实际增长率因食物、天敌等环境阻力而小于内禀增长率；迁入率和出生率只是影响种群增长的单一因素。","tag":"种群生态"},{"id":"ecology-b096","type":"single","stage":1,"stem":"调查活动能力强、活动范围大的动物种群密度时，常用的方法是","options":["样方法","标志重捕法","样带法","目测估计法"],"answer":[1],"explain":"标志重捕法先捕获并标记部分个体，释放后再重捕，根据重捕个体中标记个体的比例估算种群数量，适用于活动能力强的动物。样方法和样带法主要用于植物，目测估计法误差大，不能用于定量调查。","tag":"种群生态"},{"id":"ecology-b097","type":"single","stage":1,"stem":"某种昆虫种群的雌雄比为1∶3，与雌雄比1∶1相比，在其余条件相同的情况下，该种群的出生率通常","options":["不变","升高","先升高后降低","降低"],"answer":[3],"explain":"雌性个体是产生后代的主要一方，雌雄比由1∶1变为1∶3，雌性比例明显下降，可繁殖个体减少，出生率随之降低。其余条件相同时出生率不会升高或不变，也不会出现先升后降的情况。","tag":"种群生态"},{"id":"ecology-b102","type":"single","stage":1,"stem":"区别不同群落最重要的特征是","options":["群落面积大小","土壤类型","所在地区气候","物种组成"],"answer":[3],"explain":"物种组成决定群落的性质，是区别不同群落最重要的特征，不同群落的物种种类和数目明显不同。面积、土壤和气候只是影响群落的外界条件，不能作为区分不同群落的根本依据。","tag":"群落生态"},{"id":"ecology-b103","type":"single","stage":1,"stem":"草原群落中不同植物在一年内先后萌芽、开花和结实，使群落外貌随季节发生明显变化，这种现象称为","options":["季相","层片","边缘效应","演替"],"answer":[0],"explain":"季相是群落外貌随季节更替而发生的周期性变化，由组成植物的物候差异造成。层片是群落的结构单位，边缘效应指群落交界处生物多样性升高的现象，演替是群落组成的长期更替过程。","tag":"群落生态"},{"id":"ecology-b104","type":"single","stage":1,"stem":"由同一生活型的不同植物所组成的群落结构单位称为","options":["层","层片","群丛","优势种"],"answer":[1],"explain":"层片由同一生活型的不同植物组成，如草原上的多年生丛生禾草层片，是群落的结构单位。层是按高度划分的空间层次，群丛是群落分类的基本单位，优势种是数量占优的物种。","tag":"群落生态"},{"id":"ecology-b105","type":"single","stage":1,"stem":"由于地形起伏和土壤水分差异，群落内部不同植物种类呈斑块状相间分布，这体现了群落的","options":["垂直结构","时间结构","水平结构","营养结构"],"answer":[2],"explain":"水平结构指群落在水平方向上的镶嵌分布，由地形、土壤水分和养分等条件的差异造成。垂直结构指分层现象，时间结构指季相变化，营养结构指食物链和食物网，均与斑块状分布不符。","tag":"群落生态"},{"id":"ecology-b106","type":"single","stage":1,"stem":"一个物种在群落中所处的空间位置、所利用的资源以及与其它物种的关系，总称为该物种的","options":["生境","分布区","生活型","生态位"],"answer":[3],"explain":"生态位包括物种在群落中的空间位置、资源利用方式以及与其他物种的关系，强调其功能地位。生境指物种生活的环境条件，分布区指物种分布的地理范围，生活型是植物对环境的形态适应类型。","tag":"群落生态"},{"id":"ecology-b107","type":"single","stage":1,"stem":"在群落垂直结构的优势层中，数量和影响最大的优势种称为","options":["建群种","伴生种","偶见种","亚优势种"],"answer":[0],"explain":"建群种是优势层中的优势种，对群落结构和环境的形成起决定作用，如草原上的羊草和大针茅。伴生种和偶见种数量少、影响小，亚优势种只在局部或某一时期占优，均不能称为建群种。","tag":"群落生态"},{"id":"ecology-b112","type":"single","stage":1,"stem":"生态系统中，为生物提供物质和能量来源的阳光、水、空气和土壤等成分属于","options":["生产者","非生物环境","消费者","分解者"],"answer":[1],"explain":"阳光、水、空气和土壤等构成非生物环境，是生态系统物质和能量的最初来源。生产者指绿色植物等自养生物，消费者指动物，分解者指细菌和真菌，三者都是生物成分，不包括阳光和土壤。","tag":"生态系统"},{"id":"ecology-b113","type":"single","stage":1,"stem":"从绿色植物开始，经食草动物到各级食肉动物形成的食物链称为","options":["碎屑食物链","寄生食物链","捕食食物链","混生食物链"],"answer":[2],"explain":"捕食食物链以活的植物为起点，按捕食关系逐级传递，如草→兔→狐。碎屑食物链以动植物残体为起点，寄生食物链以寄主体内营养为环节，混生食物链是两者的混合，起点均与题意不符。","tag":"生态系统"},{"id":"ecology-b114","type":"single","stage":1,"stem":"食物链中处于同一营养层次上的所有生物的总和称为","options":["种群","食物网","生态金字塔","营养级"],"answer":[3],"explain":"营养级是食物链中处于同一营养层次的全部生物，如所有绿色植物同属第一营养级。种群是同种个体的集合，食物网是多条食物链交织成的网络，生态金字塔是以营养级为单位绘制的图形。","tag":"生态系统"},{"id":"ecology-b115","type":"single","stage":1,"stem":"生态系统能量流动的基本特点是","options":["循环流动、逐级递减","单向流动、逐级递减","单向流动、逐级递增","循环流动、逐级递增"],"answer":[1],"explain":"能量以光能形式输入生态系统后，沿食物链单向传递，不能逆向回流或循环利用；每一营养级都有大量能量以呼吸热的形式散失，因此逐级递减。物质可以循环，但能量不能循环。","tag":"生态系统"},{"id":"ecology-b116","type":"single","stage":1,"stem":"绿色植物通过光合作用固定的太阳能总量称为","options":["净初级生产量","次级生产量","总初级生产量","现存量"],"answer":[2],"explain":"总初级生产量是植物光合作用固定的全部能量，扣除呼吸消耗后剩余的部分才是净初级生产量。次级生产量是消费者同化有机物形成的生产量，现存量是某一时刻单位面积内的生物量。","tag":"生态系统"},{"id":"ecology-b117","type":"single","stage":1,"stem":"下列物质循环中，属于沉积型循环的是","options":["碳循环","氮循环","水循环","磷循环"],"answer":[3],"explain":"磷主要储存在岩石和沉积物中，经风化释放、被生物吸收后随残体沉积，循环缓慢且不经过大气，属于沉积型循环。碳、氮和水的主要储存库是大气或水体，属于气相型循环。","tag":"生态系统"},{"id":"ecology-b118","type":"single","stage":1,"stem":"海洋生态系统中浮游植物现存量少，但繁殖快、周转率高，能支撑较大的浮游动物生物量，其生物量金字塔常呈","options":["倒金字塔形","正金字塔形","纺锤形","无固定形状"],"answer":[0],"explain":"浮游植物个体小、繁殖快、周转率高，任一时刻的现存量虽少，但一段时间内生产的总量足以维持上层消费者，故生物量金字塔呈下窄上宽的倒置形。能量金字塔则始终是正立的。","tag":"生态系统"},{"id":"ecology-b119","type":"single","stage":1,"stem":"草原上狼的嚎叫声引起黄羊警觉逃逸，狼嚎声属于生态系统信息传递中的","options":["化学信息","物理信息","行为信息","营养信息"],"answer":[1],"explain":"声波属于物理刺激，由声音传递的信息为物理信息。化学信息指气味、激素等化学物质，行为信息指动物特殊的动作行为，营养信息指食物链中营养关系的传递，均与狼嚎声不符。","tag":"生态系统"},{"id":"ecology-b126","type":"single","stage":1,"stem":"我国草原中，分布在青藏高原、以耐寒多年生草本植物为主、群落结构简单的类型是","options":["草甸草原","典型草原","高寒草原","荒漠草原"],"answer":[2],"explain":"高寒草原分布在青藏高原等高海拔地区，气候寒冷、生长期短，以耐寒的多年生草本为主，群落结构简单。草甸草原和典型草原分布在温带半湿润、半干旱地区，荒漠草原则更为干旱、植被稀疏。","tag":"草原生态"},{"id":"ecology-b127","type":"single","stage":1,"stem":"在一定时期内使草地牧草生产量与家畜采食量保持相对平衡的管理原则称为","options":["划区轮牧","围封禁牧","补播改良","草畜平衡"],"answer":[3],"explain":"草畜平衡要求家畜数量与草地生产力相适应，以草定畜，防止超载过牧。划区轮牧是放牧方式，围封禁牧是恢复措施，补播改良是提高产草量的技术，三者都不能概括以草定畜的管理原则。","tag":"草原生态"},{"id":"ecology-b128","type":"single","stage":1,"stem":"草地退化的主要标志是","options":["优良牧草减少、毒杂草增多","土壤有机质含量升高","植被盖度明显提高","牧草产量逐年上升"],"answer":[0],"explain":"退化草地表现为优良牧草比例下降、毒杂草和裸露斑块增多、植被盖度和产草量降低，土壤有机质减少。B、C、D三项描述的都是草地状况改善的表现，与退化的方向相反。","tag":"草原生态"},{"id":"ecology-b129","type":"single","stage":1,"stem":"草地实行划区轮牧的主要作用是","options":["提高草地的放牧强度","减少草地的可利用面积","增加单位面积的家畜密度","给牧草留出恢复生长的时间"],"answer":[3],"explain":"划区轮牧把草地分成若干小区轮流放牧，使采食过的牧草有休养生息的机会，利于恢复再生。轮牧并不提高放牧强度或家畜密度，也不以减少草地面积为目的，其核心是合理利用与保护草地。","tag":"草原生态"},{"id":"ecology-b130","type":"single","stage":1,"stem":"草原植被凭借密集根系固持土壤、减轻风蚀，这主要体现了草原生态系统的","options":["气体调节功能","防风固沙功能","旅游文化功能","物质生产功能"],"answer":[1],"explain":"植物根系网络固定表土、削弱近地面风速，减少风蚀和沙化，属于防风固沙的调节功能。气体调节指固碳释氧，旅游文化属于文化服务，物质生产指提供牧草和畜产品，均与固持土壤无关。","tag":"草原生态"},{"id":"ecology-s01","type":"single","stem":"下列特征中，属于种群水平上研究的是","options":["年龄结构","体重","心率","血型"],"answer":[0],"explain":"种群是同一区域内同种个体的集合，年龄结构、出生率、死亡率、性别比等是种群的群体特征；体重、心率、血型描述的是个体属性，不属于种群特征。","tag":"种群生态","level":1,"stage":1,"standard":true},{"id":"ecology-s02","type":"single","stem":"在食物和空间充足、没有天敌和疾病等理想条件下，种群数量呈“J”形增长，其数量模型可表示为","options":["Nt=K/(1+e^(-rt))","Nt=N0λ^t","dN/dt=rN(1-N/K)","Nt=N0-rt"],"answer":[1],"explain":"理想条件下种群按恒定增长率增长，Nt=N0λ^t（或dN/dt=rN），呈J形；另两个含K的式子为逻辑斯谛增长模型，Nt=N0-rt表示线性下降。","tag":"种群生态","level":1,"stage":1,"standard":true},{"id":"ecology-s04","type":"single","stem":"下列因素中，属于密度制约因素的是","options":["寒潮","传染病","地震","火山爆发"],"answer":[1],"explain":"密度制约因素的作用强度随种群密度升高而增强，传染病在密度大、接触频繁时传播更快；寒潮、地震、火山爆发属于非密度制约因素，其影响与种群密度基本无关。","tag":"种群生态","level":1,"stage":1,"standard":true},{"id":"ecology-s05","type":"single","stem":"高斯用两种草履虫进行竞争实验，结果支持了","options":["生态位相同的两个物种不能长期共存","两种草履虫可以长期共存","捕食者必然使猎物灭绝","竞争总是使双方种群数量增加"],"answer":[0],"explain":"竞争排斥原理指出，生态位高度重叠的两个物种难以长期共存，竞争中占优势者会排斥另一方；实验中一种草履虫最终占优势，另一种减少，说明竞争可导致生态位分化或排除。","tag":"种群生态","level":1,"stage":1,"standard":true},{"id":"ecology-s06","type":"single","stem":"豆科植物与根瘤菌之间的关系属于","options":["捕食","寄生","竞争","互利共生"],"answer":[3],"explain":"根瘤菌固定大气中的氮供豆科植物利用，豆科植物为根瘤菌提供碳水化合物和栖息场所，双方均获益，属于互利共生；寄生是一方获益一方受害，竞争是争夺共同资源，捕食是取食关系。","tag":"种群生态","level":1,"stage":1,"standard":true},{"id":"ecology-s07","type":"single","stem":"森林群落中乔木层、灌木层、草本层和地被层分别占据不同高度，这种现象属于群落的","options":["垂直结构","水平结构","时间结构","营养结构"],"answer":[0],"explain":"群落垂直结构指不同物种在垂直方向上的分层现象，森林分层有利于充分利用光照；水平结构表现为镶嵌分布，时间结构表现为季相变化，营养结构指食物链和食物网。","tag":"群落生态","level":1,"stage":1,"standard":true},{"id":"ecology-s08","type":"single","stem":"下列群落演替中，属于初生演替的是","options":["弃耕农田上的演替","火灾后森林的演替","裸岩上的演替","采伐迹地上的演替"],"answer":[2],"explain":"初生演替发生在从未有植被覆盖或原有植被和土壤被彻底破坏、缺乏繁殖体的裸地上，如裸岩、沙丘和火山岩；弃耕农田、火灾迹地和采伐迹地仍保留土壤与繁殖体，属于次生演替。","tag":"群落生态","level":1,"stage":1,"standard":true},{"id":"ecology-s09","type":"single","stem":"关于群落边缘效应，下列说法正确的是","options":["边缘带物种数一定少于群落内部","边缘带不存在生态位分化","边缘带演替过程会完全停止","边缘带物种多样性通常高于群落内部"],"answer":[3],"explain":"边缘带同时受相邻两个群落影响，生境异质性高，常有边缘特有种，物种多样性通常较高；但边缘效应受边缘形状、宽度和人为干扰影响，不能说一定更少，也不能说演替停止。","tag":"群落生态","level":1,"stage":1,"standard":true},{"id":"ecology-s10","type":"single","stem":"生物多样性通常不包括下列哪个层次","options":["基因多样性","物种多样性","生态系统多样性","个体多样性"],"answer":[3],"explain":"生物多样性包括遗传（基因）多样性、物种多样性和生态系统多样性三个层次；个体间的差异属于遗传变异，不单独列为“个体多样性”层次，因此该项不属于公认层次。","tag":"群落生态","level":1,"stage":1,"standard":true},{"id":"ecology-s12","type":"single","stem":"群落中数量最多、覆盖度最大、对群落结构和环境形成影响最大的植物种称为","options":["伴生种","优势种","偶见种","入侵种"],"answer":[1],"explain":"优势种在群落中数量多、盖度大、生物量大，对群落结构和环境形成起主要控制作用；伴生种数量较少但较常见，偶见种出现频率低，入侵种是外来定殖并造成危害的物种。","tag":"群落生态","level":1,"stage":1,"standard":true},{"id":"ecology-s13","type":"single","stem":"生态系统中能把无机物合成有机物、为其他生物提供物质和能量的生物成分是","options":["生产者","消费者","分解者","非生物环境"],"answer":[0],"explain":"生产者主要是绿色植物和化能合成微生物，能利用光能或化学能把无机物合成有机物，是生态系统能量和物质的入口；消费者和分解者均为异养生物，非生物环境不属于生物成分。","tag":"生态系统","level":1,"stage":1,"standard":true},{"id":"ecology-s15","type":"single","stem":"在氮循环中，将大气中的氮气转化为含氮化合物的过程称为","options":["硝化作用","反硝化作用","固氮作用","氨化作用"],"answer":[2],"explain":"固氮作用将N2还原为氨或含氮化合物，包括生物固氮和工业固氮；硝化作用把铵盐氧化为硝酸盐，反硝化作用把硝酸盐还原为氮气返回大气，氨化作用将有机氮分解为氨。","tag":"生态系统","level":1,"stage":1,"standard":true},{"id":"ecology-s16","type":"single","stem":"陆地生态系统中，水分从植物体和地表返回大气的主要途径是","options":["光合作用","蒸腾与蒸发","呼吸作用","渗漏"],"answer":[1],"explain":"植物蒸腾和地表蒸发是陆地生态系统水分返回大气的主要途径，二者合称蒸散；光合作用消耗水但量小，呼吸作用产生水，渗漏是水分进入土壤或地下水的方向，均不是返回大气的主要途径。","tag":"生态系统","level":1,"stage":1,"standard":true},{"id":"ecology-s17","type":"single","stem":"生态系统中分解者的主要作用是","options":["把无机物合成有机物","固定太阳能","在生物之间传递信息","把有机物分解为无机物"],"answer":[3],"explain":"分解者主要是细菌和真菌，通过分解作用把动植物遗体、排泄物中的有机物转化为无机物，归还无机环境供生产者再利用；合成有机物是生产者的功能，固定太阳能靠光合作用，传递信息不是分解者的主要作用。","tag":"生态系统","level":1,"stage":1,"standard":true},{"id":"ecology-s18","type":"single","stem":"我国温带草原由东向西，随降水量减少，草原类型依次为","options":["荒漠→荒漠草原→典型草原→草甸草原","典型草原→草甸草原→荒漠→荒漠草原","草甸草原→荒漠草原→典型草原→荒漠","草甸草原→典型草原→荒漠草原→荒漠"],"answer":[3],"explain":"草原类型受水分梯度控制。由东向西降水逐渐减少，依次发育草甸草原、典型草原、荒漠草原和荒漠；选项A方向相反，其余选项顺序错乱，不符合水分递减规律。","tag":"草原生态","level":1,"stage":1,"standard":true},{"id":"ecology-b007","type":"multi","stage":1,"stem":"关于种群的空间分布格局，下列说法正确的有","options":["集群分布是自然界中最常见的种群分布格局","均匀分布常出现在资源均匀、种内竞争激烈的环境中","随机分布要求环境资源分布均匀且个体间相互作用很弱","种群的分布格局决定了其环境容纳量的大小"],"answer":[0,1,2],"explain":"集群分布最常见，常由资源斑块性和繁殖方式形成；均匀分布多见于资源均匀、竞争激烈处；随机分布需资源均匀且个体间作用弱。环境容纳量由环境资源条件决定，分布格局不能决定K值，故D错。","tag":"种群生态"},{"id":"ecology-b008","type":"multi","stage":1,"stem":"关于种群的年龄结构和性比，下列说法正确的有","options":["增长型种群的幼年个体比例大，老年个体比例小","稳定型种群各年龄组个体数比例相近，种群数量相对稳定","衰退型种群的死亡率大于出生率，种群密度将逐渐下降","只要种群的性比接近1∶1，种群数量就必然保持稳定"],"answer":[0,1,2],"explain":"增长型幼年个体多、老年个体少，种群将扩大；稳定型各年龄组比例相近；衰退型死亡率大于出生率，密度下降。性比接近1∶1只说明雌雄比例适宜，种群数量还取决于出生、死亡和迁入迁出，故D错。","tag":"种群生态"},{"id":"ecology-b009","type":"multi","stage":1,"stem":"关于生态位，下列说法正确的有","options":["生态位包括物种在群落中的时间、空间位置和营养关系","生态位完全相同的两个物种难以在同一群落长期共存","物种的基础生态位通常大于其实际生态位","生态位分化只发生在动物中，植物之间不存在生态位分化"],"answer":[0,1,2],"explain":"生态位包含时空位置与营养关系；生态位相同的物种会因竞争排斥而难以共存；实际生态位受竞争等生物因素压缩，小于基础生态位。植物同样存在生态位分化，如根系深浅和花期不同，故D错。","tag":"种群生态"},{"id":"ecology-b018","type":"multi","stage":1,"stem":"关于群落的基本特征，下列说法正确的有","options":["群落的物种组成是区别不同群落的重要依据","群落具有一定的空间结构，包括垂直结构和水平结构","群落外貌可随季节变化，形成季相","相邻群落之间都有清晰可辨的边界，不存在过渡带"],"answer":[0,1,2],"explain":"物种组成是区分不同群落的首要特征；群落具有垂直和水平结构；外貌随季节变化形成季相。相邻群落之间常存在过渡带即群落交错区，边界多不明显，故D错。","tag":"群落生态"},{"id":"ecology-b019","type":"multi","stage":1,"stem":"关于群落的季相与时间结构，下列叙述正确的有","options":["季相是群落外貌随季节更替而发生变化的现象","温带草原的季相变化通常比较明显","群落的时间结构还包括昼夜变化和年际变化","群落的结构一旦形成就不再随时间变化"],"answer":[0,1,2],"explain":"季相是群落外貌随季节变化的现象，温带草原季相变化明显；群落时间结构还包括昼夜和年际变化。群落结构始终处于动态变化中，第四项错误。","tag":"群落生态"},{"id":"ecology-b020","type":"multi","stage":1,"stem":"用样方法调查草地群落特征时，下列做法正确的有","options":["样方面积应不小于该群落的最小面积","样方应随机设置，避免主观选择长势最好的地段","样方数量应满足统计要求，并记录各物种的个体数和盖度","为了避免遗漏，应选择物种最丰富的斑块集中设置样方"],"answer":[0,1,2],"explain":"样方面积需达到最小面积才能反映群落组成；样方须随机设置以保证代表性；记录个体数和盖度可用于计算多度、重要值。集中选择物种最丰富的斑块会造成主观偏差，故D错。","tag":"群落生态"},{"id":"ecology-b032","type":"multi","stage":1,"stem":"关于生态系统中的能量流动，下列说法正确的有","options":["能量沿食物链单向流动，不能循环利用","相邻两个营养级之间的能量传递效率一般为10%~20%","营养级越高，可供利用的能量通常越少","营养级越高，该营养级生物个体所含的能量一定越多"],"answer":[0,1,2],"explain":"能量流动单向、逐级递减，传递效率一般10%~20%，故营养级越高可利用能量越少。个体大小与营养级高低无必然联系，如一棵树与大量昆虫，D项把个体能量与营养级总能量混淆，故错。","tag":"生态系统"},{"id":"ecology-b033","type":"multi","stage":1,"stem":"关于生态系统中的信息传递，下列说法正确的有","options":["鸟的鸣叫属于物理信息","昆虫释放的性外激素属于化学信息","信息传递能调节种间关系，有利于维持生态系统的稳定","信息只能由生物发出，光照、温度等非生物因素不能传递信息"],"answer":[0,1,2],"explain":"鸟鸣是声波，属物理信息；性外激素是化学物质，属化学信息；信息传递可调节种间关系、维持生态系统稳定。光照、温度等非生物因素也能作为物理信息影响生物的生命活动，故D错。","tag":"生态系统"},{"id":"ecology-b034","type":"multi","stage":1,"stem":"关于生态系统的初级生产量和生物量，下列说法正确的有","options":["总初级生产量是绿色植物固定的太阳能总量","净初级生产量等于总初级生产量减去植物呼吸消耗","净初级生产量是消费者和分解者可以利用的能量来源","生物量与生产量含义相同，都表示单位面积的有机物总量"],"answer":[0,1,2],"explain":"总初级生产量是植物固定的太阳能总量，扣除呼吸消耗即净初级生产量，后者可供消费者和分解者利用。生物量是某一时刻单位面积现存有机物的总量，是现存量而不是生产速率，故D混淆了两者。","tag":"生态系统"},{"id":"ecology-b043","type":"multi","stage":1,"stem":"关于草地的合理利用，下列说法正确的有","options":["以草定畜、保持草畜平衡是合理利用草地的基础","划区轮牧可使牧草有恢复生长的时间，有利于维持草地生产力","牧草萌发期和结实期放牧对草地危害较大，应安排休牧","只要草地产量高，放牧强度越大，经济效益和生态效益都越好"],"answer":[0,1,2],"explain":"以草定畜是合理利用的前提；划区轮牧留出恢复期；萌发期和结实期放牧会损伤生长点和种子生产，应休牧。放牧强度超过草地承载力会导致退化，经济效益和生态效益同时下降，故D错。","tag":"草原生态"},{"id":"ecology-b054","type":"multi","stage":1,"stem":"关于种群的空间分布格局与数量调查方法，下列说法正确的有","options":["集群分布是自然界最常见的种群分布格局","标记重捕法的估算结果不受标记脱落的影响","随机分布要求环境条件均匀且个体之间没有相互作用","均匀分布常由强烈的种内竞争或领域行为形成"],"answer":[0,2,3],"explain":"集群分布由资源斑块性、繁殖方式和社群行为形成，最为常见；随机分布要求环境均一且个体独立；均匀分布常由种内竞争或领域行为造成，因此A、C、D正确。标记脱落会使重捕中标记个体偏少、估算值偏大，B错误。","tag":"种群生态"},{"id":"ecology-b055","type":"multi","stage":1,"stem":"关于群落的结构，下列说法正确的有","options":["成层现象是群落垂直结构的表现","群落的垂直结构主要由动物种类决定","群落的空间结构只包括垂直结构","季相变化属于群落的时间结构"],"answer":[0,3],"explain":"成层现象是垂直结构的表现，季相变化属于时间结构，A、D正确。垂直结构主要由植物尤其乔木层的高度和根系分布决定，动物分层依附于植物分层，B错误；群落空间结构包括垂直结构和水平结构，C错误。","tag":"群落生态"},{"id":"ecology-b056","type":"multi","stage":1,"stem":"关于生态系统能量流动的特点，下列说法正确的有","options":["能量沿食物链单向流动，不能逆向返回","能量在相邻营养级间的传递效率一般只有10%左右","能量可以在食物链中循环利用","太阳辐射能是生态系统能量的基本来源"],"answer":[0,1,3],"explain":"能量流动是单向的、逐级递减的，传递效率约10%，太阳辐射能是生态系统的基本能源，A、B、D正确。能量最终以热能散失，不能循环利用，C错误；正因能量递减，食物链营养级数目才受到限制。","tag":"生态系统"},{"id":"ecology-b057","type":"multi","stage":1,"stem":"关于放牧对草原植被和土壤的影响，下列说法正确的有","options":["适度放牧可刺激牧草分蘖和再生，提高再生草产量","放牧强度越大，草原植物多样性越高","过度放牧使土壤紧实、水分入渗减少","牲畜只采食禾草，对双子叶植物没有影响"],"answer":[0,2],"explain":"适度采食可解除顶端优势、促进分蘖和再生；过牧使牲畜践踏加剧、土壤紧实、入渗下降，A、C正确。多样性在中等放牧强度下最高，强度过大反而下降，B错误；牲畜也采食豆科等双子叶植物，D错误。","tag":"草原生态"},{"id":"ecology-b068","type":"multi","stage":1,"stem":"关于生态系统的服务功能，下列说法正确的有","options":["涵养水源、保持水土属于调节服务","提供牧草、药材和木材属于供给服务","生态系统服务功能只有直接使用价值，无法进行价值估算","文化服务不包括生态旅游和科研教育"],"answer":[0,1],"explain":"涵养水源、保持水土属调节服务，提供牧草药材木材属供给服务，A、B正确。生态服务既有直接价值也有间接价值和存在价值，可用市场价值法、替代成本法等估算，C错误；生态旅游和科研教育正属于文化服务，D错误。","tag":"生态系统"},{"id":"ecology-b076","type":"multi","stage":1,"stem":"下列生物地球化学循环的实例与所属类型对应，正确的有","options":["碳循环属于气体型循环","磷循环属于沉积型循环","氮循环属于气体型循环","硫循环属于气体型循环"],"answer":[0,1,2],"explain":"碳和氮以气体形式进入大气，属气体型循环；磷主要储存在岩石和沉积物中，经风化释放，属沉积型循环，A、B、C正确。硫虽然部分以二氧化硫进入大气，但主要库在岩石和沉积物，通常归为沉积型循环，D错误。","tag":"生态系统"},{"id":"ecology-b078","type":"multi","stage":1,"stem":"关于种群的性别比例，下列说法正确的有","options":["性别比例通过影响有效繁殖雌体的数量影响出生率","性别比例失调会降低种群的出生率","性别比例对种群数量变化没有影响","性别比例是种群的特征之一"],"answer":[0,1,3],"explain":"性别比例通过改变参与繁殖的雌体数量影响出生率，比例失调会降低出生率；性别比例是种群特征之一。说它对种群数量没有影响是错误的。","tag":"种群生态"},{"id":"ecology-b079","type":"multi","stage":1,"stem":"关于群落演替的方向与顶极群落，下列说法正确的有","options":["进展演替使群落结构趋于复杂、稳定性增强","逆行演替常由过度放牧、火烧和砍伐等干扰引起","初生演替通常比次生演替速度快","任何气候区的演替最终都能形成森林"],"answer":[0,1],"explain":"进展演替使物种组成和结构趋于复杂、稳定性提高；逆行演替由过度放牧、火烧等干扰引起，群落向简单方向退化，A、B正确。初生演替从裸岩等无基质条件开始，速度远慢于次生演替；草原区的顶极是草原而不是森林，C、D错误。","tag":"群落生态"},{"id":"ecology-b084","type":"multi","stage":1,"stem":"关于生态系统的组成成分与营养结构，下列说法正确的有","options":["生产者把无机物合成有机物，是生态系统的基础","分解者把动植物遗体分解为无机物，供生产者利用","食物网越复杂，生态系统抵抗外界干扰的能力通常越强","消费者都是直接以绿色植物为食的肉食动物"],"answer":[0,1,2],"explain":"生产者固定太阳能合成有机物，分解者把遗体分解为无机物归还环境，食物网越复杂营养结构越稳定、抗干扰能力越强，A、B、C正确。消费者既有草食动物也有各级肉食动物，并非都是肉食动物，D错误。","tag":"生态系统"},{"id":"ecology-b085","type":"multi","stage":1,"stem":"关于草畜平衡与草地合理利用，下列说法正确的有","options":["无限延长放牧时间可以提高草地载畜量","载畜量应依据可食牧草产量和合理利用率估算","划区轮牧能为牧草提供休养生息的机会","草畜平衡要求牲畜数量与草地生产力相适应"],"answer":[1,2,3],"explain":"载畜量由可食牧草产量和合理利用率估算，划区轮牧使草地轮流休闲，草畜平衡的核心是牲畜数量与生产力相匹配，B、C、D正确。延长放牧时间只会加重采食和践踏、降低牧草再生能力，不能提高载畜量，A错误。","tag":"草原生态"},{"id":"ecology-b098","type":"multi","stage":1,"stem":"下列属于种群基本特征的有","options":["群落盖度","种群密度","年龄结构","出生率与死亡率"],"answer":[1,2,3],"explain":"种群密度、年龄结构、出生率和死亡率都是种群水平上的群体特征，反映种群的数量动态。群落盖度描述的是群落中植物的覆盖状况，属于群落特征而非种群特征。","tag":"种群生态"},{"id":"ecology-b099","type":"multi","stage":1,"stem":"关于r对策生物与K对策生物的比较，下列说法正确的有","options":["r对策生物多出现在环境稳定、竞争激烈的生境","r对策生物个体小、寿命短、繁殖力强","K对策生物种群数量常接近环境容纳量","K对策生物通常有较完善的幼体抚育"],"answer":[1,2,3],"explain":"r对策生物以高繁殖率适应多变环境，个体小、寿命短；K对策生物个体大、寿命长，有幼体抚育，数量常接近K值。A项说反了，环境稳定、竞争激烈有利于K对策生物，r对策生物多见于不稳定生境。","tag":"种群生态"},{"id":"ecology-b108","type":"multi","stage":1,"stem":"关于群落的水平结构，下列说法正确的有","options":["水平结构常表现为斑块状的镶嵌分布","地形、土壤水分和光照差异可形成水平镶嵌","斑块的大小和形状可以不同","群落的水平结构完全均匀一致"],"answer":[0,1,2],"explain":"群落水平结构表现为斑块状镶嵌，地形、土壤水分、光照等差异是重要原因，斑块大小形状多样；水平结构并非完全均匀，第四项错误。","tag":"群落生态"},{"id":"ecology-b109","type":"multi","stage":1,"stem":"关于顶极群落，下列说法正确的有","options":["顶极群落是演替达到相对稳定阶段的群落","顶极群落的结构和物种组成相对稳定","顶极群落中物种数目仍会无限快速增加","同一气候区内顶极群落类型可以相同"],"answer":[0,1,3],"explain":"顶极群落是群落演替达到的相对稳定阶段，其结构和物种组成与当地气候等环境条件相适应。达到顶极后物种数目趋于稳定，不会无限快速增加，因此C项错误。","tag":"群落生态"},{"id":"ecology-b120","type":"multi","stage":1,"stem":"关于生态系统的能量流动，下列说法正确的有","options":["能量流动的起点是生产者固定太阳能","营养级越多，最高营养级获得的能量越多","能量沿营养级传递时逐级递减","能量流动是单向的，不能循环利用"],"answer":[0,2,3],"explain":"能量流动从生产者固定太阳能开始，沿食物链单向传递并逐级递减，不能循环利用。营养级越多，途中散失的能量越多，最高营养级获得的能量越少，故B项错误。","tag":"生态系统"},{"id":"ecology-b121","type":"multi","stage":1,"stem":"关于生态系统的碳循环，下列说法正确的有","options":["光合作用把二氧化碳固定为有机物","碳在生物群落与无机环境之间主要以二氧化碳形式流动","碳在同一营养级内可反复循环利用","呼吸作用和微生物分解把有机碳释放为二氧化碳"],"answer":[0,1,3],"explain":"碳在生物群落与无机环境之间主要以二氧化碳形式流动，光合作用固定碳，呼吸作用和分解作用释放碳。能量单向流动，碳元素虽可在生物圈中反复循环，但不能在同一营养级内反复利用，故C项错误。","tag":"生态系统"},{"id":"ecology-b122","type":"multi","stage":1,"stem":"下列属于生态系统服务功能的有","options":["工厂向河流排放工业废水","森林涵养水源、调节径流","草地固定二氧化碳、调节气候","草原提供牧草和畜产品"],"answer":[1,2,3],"explain":"涵养水源、调节气候和提供牧草分别属于生态系统的调节服务和供给服务，都是生态系统为人类提供的惠益。A项排放工业废水是污染环境的行为，会破坏生态系统功能，不属于生态系统服务。","tag":"生态系统"},{"id":"ecology-b123","type":"multi","stage":1,"stem":"关于初级生产量和次级生产量，下列说法正确的有","options":["初级生产量由绿色植物固定太阳能形成","净初级生产量等于总初级生产量减去植物呼吸消耗","次级生产量可以直接由无机物合成","次级生产量是消费者同化有机物后形成的生产量"],"answer":[0,1,3],"explain":"初级生产量由自养生物固定太阳能形成，净初级生产量等于总初级生产量减去植物呼吸消耗，次级生产量是消费者同化有机物后形成的。次级生产量必须依赖有机物，不能直接由无机物合成，故C项错误。","tag":"生态系统"},{"id":"ecology-b131","type":"multi","stage":1,"stem":"关于放牧对草地的影响，下列说法正确的有","options":["过度放牧有利于多年生优良牧草繁殖","适度放牧可促进牧草分蘖和更新","过度放牧使土壤紧实、水分入渗减少","划区轮牧可减轻草地退化"],"answer":[1,2,3],"explain":"适度采食可刺激牧草分蘖、改善光照条件，过牧则使土壤紧实、入渗减少并引起植被退化，划区轮牧通过休牧减轻退化。过牧削弱多年生优良牧草、使一二年生杂草增多，故A项错误。","tag":"草原生态"},{"id":"ecology-b132","type":"multi","stage":1,"stem":"造成草地退化的主要原因有","options":["长期超载过牧","盲目开垦草原种植","坚持草畜平衡","气候持续干旱"],"answer":[0,1,3],"explain":"超载过牧使牧草来不及恢复，开垦破坏原生植被，干旱加剧水分亏缺，三者都是草地退化的重要原因。C项草畜平衡是按草地生产力控制家畜数量，属于保护措施，不会导致退化。","tag":"草原生态"},{"id":"ecology-b010","type":"judge","stage":1,"stem":"种群的年龄结构可以用来预测种群数量的变化趋势。","options":["正确","错误"],"answer":[0],"explain":"正确。年龄结构反映各年龄组个体的比例，决定了未来进入生殖期的个体数量，因此可根据幼年个体比例预测种群将增长、稳定还是衰退；但准确预测还需结合出生率、死亡率及环境条件的变化。","tag":"种群生态"},{"id":"ecology-b011","type":"judge","stage":1,"stem":"种群的内禀增长率会随种群密度升高而不断增大。","options":["正确","错误"],"answer":[1],"explain":"错误。内禀增长率是理想条件下、不受密度制约的最大增长率，是物种固有的生物学特性，在给定条件下为常数，不随密度升高而增大。随密度升高而下降的是实际增长率，这是密度制约因素作用的结果。","tag":"种群生态"},{"id":"ecology-b021","type":"judge","stage":1,"stem":"群落中物种数目越多，且各物种个体数分配越均匀，群落的物种多样性就越高。","options":["正确","错误"],"answer":[0],"explain":"正确。物种多样性由丰富度和均匀度共同决定：物种数目越多，丰富度越高；各物种个体数分配越均匀，均匀度越高，两者都使多样性指数增大。若物种数多但某一种占绝对优势，多样性反而较低。","tag":"群落生态"},{"id":"ecology-b022","type":"judge","stage":1,"stem":"次生演替是指群落从从未有生物定居过的裸地上开始的演替过程。","options":["正确","错误"],"answer":[1],"explain":"错误。从未有生物定居的裸地（如裸岩、沙丘）上开始的演替是初生演替；次生演替发生在原有植被已被破坏但土壤和繁殖体仍然保留的地段，如撂荒地、火烧迹地。正确表述为次生演替的起点原有土壤条件尚存。","tag":"群落生态"},{"id":"ecology-b035","type":"judge","stage":1,"stem":"能量金字塔不会出现倒置现象，因为能量沿营养级传递时逐级递减。","options":["正确","错误"],"answer":[0],"explain":"正确。能量金字塔以各营养级所含能量为依据，能量流动单向、逐级递减，传递效率仅10%~20%，故下层能量必然大于上层，不会倒置；可能倒置的是数量金字塔或特殊情形下的生物量金字塔。","tag":"生态系统"},{"id":"ecology-b036","type":"judge","stage":1,"stem":"碳循环属于沉积型循环，其周转速度比磷循环更慢。","options":["正确","错误"],"answer":[1],"explain":"错误。碳以二氧化碳形式在大气与生物群落之间快速循环，属气体型循环；磷主要储存在岩石和沉积物中，没有气态形式，才是沉积型循环且周转很慢。正确表述为碳循环是气体型循环，周转较快。","tag":"生态系统"},{"id":"ecology-b044","type":"judge","stage":1,"stem":"草原生态系统的食物链结构相对简单，抵抗力稳定性较低，退化后恢复较慢。","options":["正确","错误"],"answer":[0],"explain":"正确。草原物种数相对较少、食物网较简单，自我调节能力弱，抵抗力稳定性低；加之降水少、植被恢复慢，一旦退化甚至沙化，需要较长时间和较大投入才能恢复。","tag":"草原生态"},{"id":"ecology-b045","type":"judge","stage":1,"stem":"草原的初级生产力主要受热量条件限制，与降水量关系不大。","options":["正确","错误"],"answer":[1],"explain":"错误。草原多分布于半干旱区，水分是初级生产力的首要限制因子，产草量随降水量增加而提高。热量虽影响物候和植被分布，但在草原区水分的作用更突出，正确表述为草原初级生产力主要受水分限制。","tag":"草原生态"},{"id":"ecology-b066","type":"judge","stage":1,"stem":"两个物种的生态位完全重叠时，它们可以在同一群落中长期稳定共存。","options":["正确","错误"],"answer":[1],"explain":"生态位完全重叠的两个物种会因资源竞争而无法长期共存，竞争排斥原理指出通常只有一个物种存活，或二者发生生态位分化后才能共存，故该陈述错误。正确表述是：生态位重叠越多竞争越激烈，长期共存需要生态位分化。","tag":"种群生态"},{"id":"ecology-b067","type":"judge","stage":1,"stem":"群落的水平结构常表现为镶嵌性，其形成与地形起伏、土壤水分和养分差异有关。","options":["正确","错误"],"answer":[0],"explain":"群落水平结构指在水平方向上因地形起伏、土壤水分和养分差异而形成的斑块状镶嵌分布，该陈述正确。镶嵌性属于水平结构，与垂直方向上的成层现象不同，后者由光照、温度随高度变化引起。","tag":"群落生态"},{"id":"ecology-b073","type":"judge","stage":1,"stem":"初级生产量只包括绿色植物通过光合作用固定的能量，不包括化能合成细菌固定的能量。","options":["正确","错误"],"answer":[1],"explain":"初级生产量包括光合作用和化能合成作用所固定的能量，深海热泉和某些洞穴生态系统的初级生产主要依靠化能合成细菌，故该陈述错误。只把初级生产等同于光合作用，会遗漏化能合成这一重要途径。","tag":"生态系统"},{"id":"ecology-b077","type":"judge","stage":1,"stem":"草原围封禁牧后植被盖度和优良牧草比例通常逐步恢复，但封育时间过长可能出现枯落物大量累积而影响更新。","options":["正确","错误"],"answer":[0],"explain":"围封排除了牲畜采食和践踏，牧草得以恢复、优良草比例上升；但长期完全封育会使枯落物过厚，遮蔽光照、降低地温并抑制种子萌发和幼苗更新，因此需适时利用或刈割，该陈述正确。","tag":"草原生态"},{"id":"ecology-b086","type":"judge","stage":1,"stem":"捕食者与猎物种群的数量常出现周期性波动，捕食者数量的高峰通常滞后于猎物数量的高峰。","options":["正确","错误"],"answer":[0],"explain":"捕食者数量增长依赖于猎物数量，因此捕食者的高峰通常滞后于猎物高峰；猎物减少后捕食者随之下降，又给猎物回升的机会，二者形成周期性波动，该陈述正确。二者数量并非完全同步，也不是猎物的波动滞后于捕食者。","tag":"种群生态"},{"id":"ecology-b087","type":"judge","stage":1,"stem":"群落中的关键种一定是个体数量最多的物种。","options":["正确","错误"],"answer":[1],"explain":"关键种强调的是对群落结构和物种共存的控制作用，其个体数量未必多，例如某些捕食者数量很少却能显著改变群落组成；个体数量最多、覆盖度最大并影响群落环境的种是优势种，故该陈述错误。","tag":"群落生态"},{"id":"ecology-b089","type":"judge","stage":1,"stem":"草原生态系统的碳主要储存在植物地上部分，土壤碳库所占比例很小，可以忽略。","options":["正确","错误"],"answer":[1],"explain":"草原生态系统的碳大部分储存在土壤有机碳中，地上植物仅占较小部分，土壤碳库是草地碳汇的主体，因此该陈述错误。正因如此，过度放牧和开垦造成土壤碳流失，会显著削弱草地的碳汇功能。","tag":"草原生态"},{"id":"ecology-b090","type":"judge","stage":1,"stem":"食物链的营养级一般不超过五级，主要原因是能量沿食物链逐级递减。","options":["正确","错误"],"answer":[0],"explain":"能量在相邻营养级间的传递效率只有约10%，营养级越多，到达高层次营养级的能量越少，难以维持足够的种群规模，因此食物链一般不超过五级，该陈述正确。若能量能循环利用或传递效率很高，营养级数目可更多。","tag":"生态系统"},{"id":"ecology-b100","type":"judge","stage":1,"stem":"种群密度是种群最基本的数量特征，出生率、死亡率、迁入率和迁出率都会直接改变种群密度。","options":["正确","错误"],"answer":[0],"explain":"种群密度是单位面积或体积内的个体数，是种群最基本的数量特征；出生和迁入使密度增大，死亡和迁出使密度减小，四者直接决定种群密度的变化，故该陈述正确。","tag":"种群生态"},{"id":"ecology-b101","type":"judge","stage":1,"stem":"环境容纳量是指一定环境条件所能维持的种群最大数量，环境条件改变时环境容纳量也会随之改变。","options":["正确","错误"],"answer":[0],"explain":"环境容纳量（K值）由食物、空间、天敌等条件决定，是环境所能维持的种群最大数量。环境改善时K值升高，环境恶化时K值降低，K值随环境条件改变而变化，故该陈述正确。","tag":"种群生态"},{"id":"ecology-b110","type":"judge","stage":1,"stem":"在群落演替过程中，最先出现的先锋物种一定能保留到顶极群落阶段。","options":["正确","错误"],"answer":[1],"explain":"先锋物种适应裸露贫瘠的生境，随着土壤发育和竞争加剧，它们常被后来的物种取代，只有少数能保留到顶极阶段。演替的实质是优势种的更替，故该陈述错误。","tag":"群落生态"},{"id":"ecology-b111","type":"judge","stage":1,"stem":"两个物种的生态位重叠越大，它们对相同资源的竞争通常越激烈。","options":["正确","错误"],"answer":[0],"explain":"生态位重叠意味着两个物种利用相同的资源和空间，重叠程度越大，可利用资源越紧张，竞争越激烈。高斯两种草履虫的实验表明，生态位高度重叠的物种难以长期共存，故该陈述正确。","tag":"群落生态"},{"id":"ecology-b124","type":"judge","stage":1,"stem":"生态系统中的能量流动和物质循环是两个互不联系、各自独立进行的过程。","options":["正确","错误"],"answer":[1],"explain":"能量流动和物质循环同时进行、相互依存：物质是能量的载体，能量是物质循环的动力，二者不能独立。碳循环中碳的固定与释放都伴随能量的储存与释放，故该陈述错误。","tag":"生态系统"},{"id":"ecology-b125","type":"judge","stage":1,"stem":"在生态系统中，营养级越多，最高营养级所能获得的能量就越多。","options":["正确","错误"],"answer":[1],"explain":"能量每经过一个营养级都有大量散失，传递效率一般只有10%~20%，营养级越多，途中损失越大，最高营养级获得的能量越少，故该陈述错误。食物链过长时顶端捕食者往往难以维持。","tag":"生态系统"},{"id":"ecology-b133","type":"judge","stage":1,"stem":"我国北方草原的降水由东向西逐渐减少，草地生产力也大体随之降低。","options":["正确","错误"],"answer":[0],"explain":"水分是北方草原生产力的主要限制因子，降水由东向西递减，草群高度、盖度和产草量依次下降，草原类型也由草甸草原过渡到荒漠草原，故该陈述正确。","tag":"草原生态"},{"id":"ecology-b134","type":"judge","stage":1,"stem":"草原上的鼠类和害虫只取食牧草，对草地生态系统没有其他影响。","options":["正确","错误"],"answer":[1],"explain":"鼠类掘洞破坏土壤结构和牧草根系，加剧水土流失，还可能传播疾病；害虫大量发生时可使牧草成片枯死。它们不只取食牧草，还改变土壤和植被状况，故该陈述错误。","tag":"草原生态"},{"id":"ecology-b135","type":"judge","stage":1,"stem":"围封禁牧是退化草地恢复的有效措施，但长期完全禁牧可能造成枯落物积累过多，影响牧草的更新。","options":["正确","错误"],"answer":[0],"explain":"围封禁牧排除家畜采食和践踏，使牧草得以恢复，是退化草地常用的治理措施。但长期绝对禁牧会使枯落物积累过多、抑制幼苗出生，生产上常结合割草或适度利用，故该陈述正确。","tag":"草原生态"},{"id":"ecology-i001","type":"single","stage":2,"stem":"下列植物中，生活史对策最接近r-对策者的是","options":["一年生狗尾草","银杏","蒙古栎","油松"],"answer":[0],"explain":"r-对策者个体小、寿命短、繁殖力强、后代缺少亲代抚育，一年生狗尾草种子量大并以种子越冬，符合该特征。银杏、蒙古栎和油松均为寿命长、后代数量相对少且投入较多的K-对策者。","tag":"种群生态"},{"id":"ecology-i002","type":"single","stage":2,"stem":"某种群密度过低时，种群增长率随密度增加而上升，这种低密度下增长受阻的现象称为","options":["边缘效应","竞争释放","阿利效应","密度制约"],"answer":[2],"explain":"阿利效应指密度过低时个体寻找配偶困难、群体防御和改造环境的能力下降，使增长率随密度升高而上升。边缘效应指交错区物种增多，竞争释放是竞争者去除后种群扩张，密度制约则强调密度升高使增长受阻。","tag":"种群生态"},{"id":"ecology-i003","type":"single","stage":2,"stem":"某鸟类在质量高的斑块中繁殖过剩，部分个体迁入邻近质量差、繁殖不足以补偿死亡的斑块。质量差的斑块属于","options":["源种群","集合种群","边缘种群","汇种群"],"answer":[3],"explain":"汇种群所在生境质量差，出生率小于死亡率，必须依靠外来个体迁入才能维持，故质量差的斑块为汇。源种群出生率大于死亡率并向外输出个体，集合种群是多个局域种群组成的整体，边缘种群不是规范术语。","tag":"种群生态"},{"id":"ecology-i004","type":"single","stage":2,"stem":"集合种群能够长期存续的关键在于","options":["各局域种群均不灭绝","单个斑块面积不断扩大","局部灭绝与再定居保持动态平衡","迁入个体全部来自同一斑块"],"answer":[2],"explain":"集合种群由若干局域种群组成，局域种群会不断灭绝，只要再定居速率不低于灭绝速率，整体即可长期存续。要求各局域种群都不灭绝不符合集合种群概念，扩大单块面积和个体只来自同一斑块都不能保证再定居。","tag":"种群生态"},{"id":"ecology-i005","type":"single","stage":2,"stem":"对同一时期出生的同批个体连续跟踪其存活和死亡情况而编制的生命表是","options":["静态生命表","动态生命表","时间生命表","综合生命表"],"answer":[1],"explain":"动态生命表又称同生群生命表，跟踪同一批同时出生的个体，结果真实但耗时较长。静态生命表由某一时刻各年龄组的个体数推算，反映瞬时年龄结构；时间生命表和综合生命表不是规范的生命表类型。","tag":"种群生态"},{"id":"ecology-i006","type":"single","stage":2,"stem":"某一年生植物种群的净生殖率R0为0.6，在环境条件不变的条件下该种群数量将","options":["迅速增长","保持稳定","先增后稳","逐代下降"],"answer":[3],"explain":"净生殖率是每个个体一生平均产生的后代数，大于1时种群增长，等于1时稳定，小于1时逐代下降。R0为0.6意味着下一代个体数只有上一代的60%，故种群将逐代减少，不会增长或趋于稳定。","tag":"种群生态"},{"id":"ecology-i007","type":"single","stage":2,"stem":"两个种群实际个体数相同，但其中一个的有效种群大小明显偏小，其主要原因是","options":["性比失衡和个体繁殖贡献不均","种群所处生境面积较小","种群内物种数目较少","种群年龄结构为增长型"],"answer":[0],"explain":"有效种群大小只计入实际参与繁殖并贡献后代的个体，性比失衡、繁殖贡献差异大和数量波动都会使其小于实际个体数。生境面积和物种数目不直接决定有效大小，增长型年龄结构未来繁殖个体多，不会使其偏小。","tag":"种群生态"},{"id":"ecology-i008","type":"single","stage":2,"stem":"某植物种群密度增大到一定程度后，单株平均重量随密度增加而下降，但单位面积总产量基本恒定，对此解释正确的是","options":["种间竞争加剧使总产量稳定","种内竞争导致自疏，资源供给限制总产量","种群出生率与死亡率相等","环境容纳量随密度增大而提高"],"answer":[1],"explain":"密度过高时植株间对光、水和养分的种内竞争加剧，弱株死亡形成自疏，单株重量下降，而总产量受资源供给限制趋于恒定。种间竞争和出生率等于死亡率都不能解释单株与总产量的这种关系，容纳量也不随密度提高。","tag":"种群生态"},{"id":"ecology-i013","type":"single","stage":2,"stem":"根据岛屿生物地理学理论，物种丰富度最高的岛屿通常是","options":["面积大且靠近大陆的岛屿","面积小且远离大陆的岛屿","面积大但远离大陆的岛屿","面积小但靠近大陆的岛屿"],"answer":[0],"explain":"面积大意味着生境多样、可容纳更多种群且灭绝率低，靠近大陆则迁入来源充足、迁移阻力小，故面积大且靠近大陆的岛屿物种最丰富。面积小或远离大陆会分别提高灭绝率、降低迁入率，使丰富度下降。","tag":"群落生态"},{"id":"ecology-i014","type":"single","stage":2,"stem":"中度干扰假说认为，群落物种多样性最高的干扰状况是","options":["长期无干扰","干扰频繁且强度大","仅在演替初期有一次强干扰","干扰频率和强度中等"],"answer":[3],"explain":"中等干扰既阻止竞争力最强的物种独占资源，又为不耐竞争的物种保留定居机会，多样性最高。无干扰时竞争排斥使多样性下降，频繁强干扰使多数物种难以完成生活史，一次性强干扰也不能长期维持这一格局。","tag":"群落生态"},{"id":"ecology-i015","type":"single","stage":2,"stem":"两种近缘鸟类在同一地区共同生活时，其取食部位和喙形差异比各自单独分布时更明显，这种现象称为","options":["竞争释放","生态位重叠","性状替换","协同进化"],"answer":[2],"explain":"同域分布时近缘种因竞争而分化形态与取食习性，使生态位分离，称为性状替换。竞争释放指竞争者去除后生态位扩张，方向相反；生态位重叠是竞争的前提而非结果；协同进化指相互适应的进化过程，范围更大。","tag":"群落生态"},{"id":"ecology-i016","type":"single","stage":2,"stem":"在气候和地形相同的条件下，次生演替通常比初生演替历时短，主要原因是","options":["次生演替的顶极群落更简单","原有土壤和繁殖体得以保留","次生演替中物种数目更多","初生演替的光照条件较差"],"answer":[1],"explain":"次生演替发生在原有植被被破坏但土壤基本保留的立地，土壤养分、种子库和残存根茎使植物能迅速定居，故历时较短。物种数目和顶极群落的复杂程度是演替的结果而非原因，光照条件也不是初生演替缓慢的主因。","tag":"群落生态"},{"id":"ecology-i017","type":"single","stage":2,"stem":"关于优势种与建群种的关系，表述正确的是","options":["建群种一定是群落中个体数最多的物种","优势种与建群种是同一概念的不同叫法","建群种只出现在草本层中","建群种是优势层中的优势种，对群落环境影响最大"],"answer":[3],"explain":"建群种指优势层中作用最大的优势种，决定群落外貌并强烈影响环境，其个体数不一定最多。个体数最多是数量优势种的含义，二者概念不同；建群种可位于乔木层、灌木层或草本层，不限于草本层。","tag":"群落生态"},{"id":"ecology-i018","type":"single","stage":2,"stem":"草原群落中不同植物在水平方向上呈斑块状交错分布，形成这种镶嵌性的主要原因是","options":["光照在垂直方向上的分层","植物群落的季相变化","地形起伏引起水分和养分条件的差异","物种间共生关系的建立"],"answer":[2],"explain":"群落水平结构上的镶嵌性主要源于地形、土壤水分和养分条件的空间不均一，使不同物种各占适宜斑块。光照分层形成的是垂直结构，季相是群落外貌随季节的变化，共生关系并不决定水平方向的斑块格局。","tag":"群落生态"},{"id":"ecology-i019","type":"single","stage":2,"stem":"某地气候适宜森林发育，但因土层浅薄、保水能力差，稳定发育的群落为耐旱灌丛。按多元顶极理论，该灌丛属于","options":["土壤顶极","气候顶极","地形顶极","演替先锋群落"],"answer":[0],"explain":"多元顶极理论认为除气候外，土壤和地形等条件也能形成稳定的顶极群落。本题限制因素是土层浅薄和保水能力差，故为土壤顶极；地形顶极强调坡向坡位主导，先锋群落是演替早期阶段，尚未达到稳定状态。","tag":"群落生态"},{"id":"ecology-i024","type":"single","stage":2,"stem":"一棵乔木上生活着数以万计的植食性昆虫，由该关系构成的数量金字塔呈倒置形，这说明","options":["能量金字塔也可能倒置","该系统的能量流动是循环的","数量金字塔可以倒置，但能量金字塔不会倒置","昆虫的营养级高于乔木"],"answer":[2],"explain":"数量金字塔按个体数绘制，一个大型生产者可支撑大量小型消费者，故可以倒置；能量沿营养级流动不断递减，能量金字塔永远正立。能量流动是单向的而非循环，昆虫与乔木分处不同营养级，不能比较营养级高低。","tag":"生态系统"},{"id":"ecology-i025","type":"single","stage":2,"stem":"与碳、氮循环相比，磷循环的显著特点是","options":["以气体形式在大气中循环","属于沉积型循环，循环速度缓慢","主要依靠生物固磷完成循环","在生态系统中可被反复快速利用"],"answer":[1],"explain":"磷没有气态形式，主要在岩石、土壤、水体和生物之间转移，属沉积型循环，因岩石风化缓慢而周期很长。不存在大气循环和生物固磷过程，固氮才是常见的生物过程；磷还易被土壤固定，难以反复快速利用。","tag":"生态系统"},{"id":"ecology-i026","type":"single","stage":2,"stem":"在全球碳循环中，储量最大、周转最慢的碳库是","options":["大气圈","海洋","陆地植被","岩石圈"],"answer":[3],"explain":"岩石圈以碳酸盐和化石燃料形式储存的碳最多，周转以百万年计。大气圈碳储量小而周转快，海洋碳库较大但交换较快，陆地植被碳储量小且随生长周期快速更新，均不是储量最大、周转最慢的碳库。","tag":"生态系统"},{"id":"ecology-i027","type":"single","stage":2,"stem":"草原上放牧强度增加使牧草减少，牧草减少又反过来限制家畜数量的增长，这种调节属于","options":["负反馈调节","正反馈调节","前馈调节","非密度制约调节"],"answer":[0],"explain":"系统输出的变化反过来抑制自身继续变化，使系统趋于稳定，属于负反馈调节，它是生态系统自我调节的基础。正反馈会使偏离加剧，前馈调节强调提前预判，非密度制约调节与密度无关，均不符合该过程。","tag":"生态系统"},{"id":"ecology-i028","type":"single","stage":2,"stem":"关于生态系统抵抗力稳定性与恢复力稳定性，下列判断正确的是","options":["热带雨林抵抗力和恢复力都高","热带雨林抵抗力高、恢复力低","草原恢复力低、抵抗力高","二者总是同时升高"],"answer":[1],"explain":"热带雨林物种丰富、结构复杂，抵抗外界干扰能力强，但一旦被破坏后恢复极慢，恢复力低。草原抵抗力较低而恢复力较强；两者在一定条件下常呈相反关系，并非总是同时升高。","tag":"生态系统"},{"id":"ecology-i029","type":"single","stage":2,"stem":"某难降解的脂溶性农药进入湖泊后，在下列生物体内浓度最高的是","options":["浮游植物","浮游动物","小型鱼类","以鱼为食的猛禽"],"answer":[3],"explain":"脂溶性、难降解的污染物沿食物链发生生物放大，营养级越高体内浓度越大。浮游植物为生产者，浓度最低；浮游动物和小型鱼类营养级依次升高，但均低于以鱼为食的猛禽这一顶级消费者。","tag":"生态系统"},{"id":"ecology-i030","type":"single","stage":2,"stem":"在温带草原生态系统中，能量流动主要沿哪条途径进行","options":["捕食食物链","寄生食物链","碎屑食物链","混合食物链"],"answer":[2],"explain":"草原上大部分牧草未被家畜和野生动物采食，而是枯死后进入碎屑食物链，由分解者和食碎屑动物利用，故碎屑食物链占主导。捕食食物链只作用于被采食的那部分牧草，寄生食物链所占比例更小。","tag":"生态系统"},{"id":"ecology-i031","type":"single","stage":2,"stem":"近百年全球平均气温升高，其主要原因是人类活动","options":["大量排放二氧化碳等温室气体","大量排放二氧化硫形成酸雨","破坏臭氧层使紫外线增强","过度抽取地下水使地面下沉"],"answer":[0],"explain":"化石燃料燃烧和植被破坏使大气中二氧化碳、甲烷等温室气体浓度升高，增强温室效应，导致全球变暖。二氧化硫造成酸雨，臭氧层破坏主要影响紫外线，地面下沉属地质灾害，均与全球增温的直接机制无关。","tag":"生态系统"},{"id":"ecology-i032","type":"single","stage":2,"stem":"草地涵养水源、调节局部气候和固定二氧化碳，按生态系统服务功能分类属于","options":["供给服务","调节服务","支持服务","文化服务"],"answer":[1],"explain":"调节服务指生态系统调节气候、水文和大气成分等环境要素的功能，涵养水源、调节气候与固碳均属此类。供给服务提供食物和纤维等产品，支持服务是养分循环、土壤形成等基础过程，文化服务为休闲与科研价值。","tag":"生态系统"},{"id":"ecology-i033","type":"single","stage":2,"stem":"在其他条件相同时，下列枯落物中分解速度最快的是","options":["C/N比值高的枯落物","木质素含量高的枯落物","C/N比值低的枯落物","表面有厚蜡质层的枯落物"],"answer":[2],"explain":"C/N比值低时氮素相对充足，微生物的碳源与氮源比例适宜，分解速度较快。C/N比值高、木质素含量高以及表面蜡质层厚都会降低分解速率，故其余三项所描述的枯落物分解都慢于C/N比值低的枯落物。","tag":"生态系统"},{"id":"ecology-i039","type":"single","stage":2,"stem":"放牧优化假说认为，草原植物多样性最高的放牧强度一般是","options":["长期不放牧","轻度放牧","中度放牧","极度放牧"],"answer":[2],"explain":"中度放牧削弱了竞争力强的优势种，缓解竞争排斥，为更多物种提供定居和生长机会，多样性最高。长期不放牧易积累枯落物、优势种垄断资源，轻度放牧作用不足，极度放牧则使多数物种难以恢复。","tag":"草原生态"},{"id":"ecology-i040","type":"single","stage":2,"stem":"下列指标中，最能反映草地放牧退化早期征兆的是","options":["土壤母质类型改变","年降水量明显减少","草地海拔高度下降","优良禾草比例下降、毒害草和不可食草增多"],"answer":[3],"explain":"家畜优先采食适口性好的优良禾草，退化初期优良牧草比例下降，狼毒、醉马草等毒害草和不可食草比例上升，可作早期指示。母质和海拔短期内基本不变，降水减少属于气候因素而非放牧退化的征兆。","tag":"草原生态"},{"id":"ecology-i041","type":"single","stage":2,"stem":"天然打草场割草时一般要求留茬高度为5~8 cm，其主要目的是","options":["便于机械作业","保留贮藏养分和再生芽，利于牧草越冬与再生","减少牧草含水量","提高牧草种子产量"],"answer":[1],"explain":"留茬过低会带走大量茎基部和根颈处的贮藏养分与再生芽，削弱牧草越冬和翌年再生能力，留茬5~8 cm可兼顾收获与更新。留茬高度与机械作业、含水量关系不大，留茬过高反而造成产量损失。","tag":"草原生态"},{"id":"ecology-i042","type":"single","stage":2,"stem":"在草原管理中对退化草地实施计划烧除，其主要作用是","options":["清除积累的枯落物、促进返青并抑制灌丛侵入","彻底消灭所有土壤微生物","增加土壤水分蒸发","加速土壤有机质淋溶"],"answer":[0],"explain":"计划烧除可清除地表枯落物层，改善光照和地温，促进牧草返青，并能抑制灌木和不良草类侵入。烧除会暂时减少表层微生物但不会彻底消灭，且可减少蒸发、使灰分归还土壤，不会加速有机质淋溶。","tag":"草原生态"},{"id":"ecology-i043","type":"single","stage":2,"stem":"温带草原生态系统地下生物量通常远大于地上生物量，这一特点主要有利于","options":["加快群落演替速度","提高家畜采食效率","减少土壤有机质积累","增强抗旱抗牧压能力并储存碳"],"answer":[3],"explain":"草原植物把大量光合产物分配到根系，形成发达根网，有利于在干旱和频繁采食条件下吸收水分、储存养分并迅速再生，同时向土壤输入大量有机碳。该特点与演替速度、家畜采食效率无关，反而促进有机质积累。","tag":"草原生态"},{"id":"ecology-i048","type":"single","stage":2,"stem":"某一年生杂草在裸露地上迅速建立种群，单株产生大量细小种子，且几乎没有亲代抚育。按照r-K选择理论，该杂草最可能具有的特征是","options":["世代周期长，一生多次繁殖","种群密度长期稳定在环境容纳量附近","性成熟早，发育迅速","幼体存活率高，死亡率低"],"answer":[2],"explain":"r选择生物适应多变、不稳定的环境，其特征是性成熟早、发育快、体型小、产生大量细小种子，故C正确。A、B、D所描述的长寿命、多次繁殖、幼体存活率高和数量稳定在K值附近，均属K选择生物的特点。","tag":"种群生态"},{"id":"ecology-i049","type":"single","stage":2,"stem":"某珍稀动物种群密度很低时，个体难以找到配偶，群体警戒和防御能力也下降，导致种群增长率进一步降低。这种现象称为","options":["密度制约效应","他感作用","边缘效应","阿利效应"],"answer":[3],"explain":"阿利效应指种群密度过低时，因配偶难寻、群体防御和协作减弱而使增长率下降甚至出现负增长，故D正确。密度制约效应泛指作用强度随密度变化的现象，不能特指低密度不利；他感作用和边缘效应分别指植物间化学作用和群落交界处现象。","tag":"种群生态"},{"id":"ecology-i050","type":"single","stage":2,"stem":"某种草原昆虫分布在多个相互隔离的斑块中，各斑块内的局部种群可能灭绝，但又能由其他斑块迁入的个体重新建立。这种种群结构属于","options":["集合种群","单体种群","克隆种群","镶嵌种群"],"answer":[0],"explain":"由若干相互隔离、存在局部灭绝与迁入重建过程的种群构成的整体称为集合种群，故A正确。单体种群指连续分布、个体间可自由交流的单一群体；克隆种群强调无性繁殖形成的遗传相同个体群，镶嵌种群不是种群结构的术语。","tag":"种群生态"},{"id":"ecology-i051","type":"single","stage":2,"stem":"某动物种群的生命表中，1龄个体数为1000只，2龄个体数为500只，3龄个体数为100只。该种群从1龄到3龄的存活率为","options":["5%","10%","20%","50%"],"answer":[1],"explain":"存活率等于3龄个体数除以1龄个体数，即100÷1000×100%=10%，故B正确。50%只是1龄到2龄的阶段存活率，不能代表1龄到3龄的总存活率；5%和20%均与计算结果不符。","tag":"种群生态"},{"id":"ecology-i052","type":"single","stage":2,"stem":"甲、乙两种体型相近的昆虫，甲每年发生5代，乙每年发生1代，其他条件相同且均处于理想环境。关于二者的内禀增长率，判断正确的是","options":["甲大于乙","乙大于甲","二者相等","无法比较"],"answer":[0],"explain":"内禀增长率是理想条件下种群的最大瞬时增长率，与世代历期密切相关；世代短、每年繁殖代数多的甲积累增长更快，故A正确。乙世代历期长，即使单次产卵量相近，年增长也较慢；二者体型和环境相同，可以比较，故C、D错误。","tag":"种群生态"},{"id":"ecology-i053","type":"single","stage":2,"stem":"某害虫在田间呈集群分布。与随机分布相比，用同样大小的样方随机取样时，该害虫样方计数的方差与平均数之比","options":["与平均数无关","等于1","大于1","小于1"],"answer":[2],"explain":"方差与平均数之比可用于判断分布格局：大于1为集群分布，等于1为随机分布，小于1为均匀分布，故C正确。均匀分布时该比值小于1，随机分布时才接近1，A、D与此不符。","tag":"种群生态"},{"id":"ecology-i054","type":"single","stage":2,"stem":"某草甸用标志重捕法调查鼠的种群数量：第一次捕获并标志60只，第二次捕获50只，其中带标志的10只。该区域鼠的种群数量约为","options":["200只","250只","300只","400只"],"answer":[2],"explain":"标志重捕法的估算式为N等于第一次标志数乘第二次捕获数再除以重捕中的标志数，即60×50÷10=300只，故C正确。250只是误用第二次捕获数与标志数所得，200只和400只均无相应的计算依据。","tag":"种群生态"},{"id":"ecology-i055","type":"single","stage":2,"stem":"调查某草原蝗虫产在土壤中的卵块密度时，最适宜采用的调查方法是","options":["样方法","标志重捕法","灯光诱捕法","目测估计法"],"answer":[0],"explain":"蝗虫卵块固定于土中、活动能力为零，适合按面积设置样方挖土计数，故A正确。标志重捕法适用于活动能力强的动物，灯光诱捕只对成虫有效，目测估计无法反映土壤中的卵块数量。","tag":"种群生态"},{"id":"ecology-i059","type":"single","stage":2,"stem":"同一森林中，两种亲缘关系相近的食虫鸟分别在不同高度和不同枝叶部位取食，从而使竞争减弱。这种现象属于","options":["生态位分化","竞争排斥","协同进化","边缘效应"],"answer":[0],"explain":"两物种通过取食空间和食物资源利用方式的分化，降低生态位重叠以减少竞争，称为生态位分化，故A正确。竞争排斥指生态位相同者一方被排除；协同进化指物种间相互选择；边缘效应指群落交界处物种增多。","tag":"群落生态"},{"id":"ecology-i060","type":"single","stage":2,"stem":"某真菌附生于树皮表面，借树木获得栖息空间，而树木既不因此受益也不受害。二者的种间关系属于","options":["互利共生","偏利共生","寄生","竞争"],"answer":[1],"explain":"一方获益、另一方不受影响的关系为偏利共生，故B正确。互利共生要求双方均获益；寄生对宿主有害；竞争时双方都受不利影响。真菌只是获得附着空间，并未从树木获取营养，因此不是寄生。","tag":"群落生态"},{"id":"ecology-i061","type":"single","stage":2,"stem":"要比较两个相距很远的草原群落在物种组成上的差异程度，宜采用的指标是","options":["α多样性指数","β多样性指数","γ多样性指数","物种丰富度"],"answer":[1],"explain":"β多样性衡量不同生境或群落之间物种组成的差异和替代速率，故B正确。α多样性反映单一群落的物种多样性，γ多样性指较大区域内的总体多样性，物种丰富度只计物种数目，均不能表达两群落之间的差异。","tag":"群落生态"},{"id":"ecology-i062","type":"single","stage":2,"stem":"某草原群落的生活型谱中，地面芽植物和一年生植物所占比例很高，高位芽植物很少。这一特征反映的环境条件是","options":["全年高温多雨","气候温和湿润","长期阴暗潮湿","冬季寒冷、干湿季明显"],"answer":[3],"explain":"地面芽植物以贴近地面的芽和枯落物保护越冬，一年生植物以种子度过不良季节，二者比例高说明气候有严寒或明显干季，故D正确。全年高温多雨和温和湿润的环境中高位芽植物比例高，A、B不符。","tag":"群落生态"},{"id":"ecology-i063","type":"single","stage":2,"stem":"弃耕农田上发生的演替与裸岩上开始的演替相比，其主要差别在于","options":["起始于裸岩，演替速度更慢","起始于无土壤的裸地，演替速度更快","起始于保留土壤和种源的次生裸地，演替速度更快","起始于水生环境，演替速度更慢"],"answer":[2],"explain":"弃耕地保留原有土壤、养分和部分种子、根茎，属次生演替，无需经历漫长的土壤形成过程，速度明显快于裸岩上的初生演替，故C正确。A描述的是初生演替，B错误地否认了弃耕地已有土壤。","tag":"群落生态"},{"id":"ecology-i064","type":"single","stage":2,"stem":"在弃耕地上，先锋植物首先定居并改变了土壤养分和水分条件，使后来物种更容易侵入和定居。这种演替机制属于","options":["抑制作用","促进作用","忍耐作用","随机作用"],"answer":[1],"explain":"先锋种改善环境、为后续物种定居创造条件，属促进作用的演替机制，故B正确。抑制作用指早期物种阻碍后来者定居；忍耐作用指后来者凭借耐性在原有物种下生存，并不依赖环境的改善。","tag":"群落生态"},{"id":"ecology-i065","type":"single","stage":2,"stem":"按照岛屿生物地理学的平衡理论，面积大且距大陆近的岛屿，其物种数目通常","options":["最少","与面积和距离无关","中等","最多"],"answer":[3],"explain":"岛屿物种数取决于迁入率与灭绝率的平衡：面积大则灭绝率低，距大陆近则迁入率高，二者共同使平衡物种数最多，故D正确。面积小、距离远的岛屿迁入难而灭绝易，物种数最少，A、C与之相反。","tag":"群落生态"},{"id":"ecology-i066","type":"single","stage":2,"stem":"某草原的优势草种被一种啮齿动物大量取食，该动物还通过挖掘疏松土壤、为其他小动物提供洞穴；将其移除后群落物种多样性明显下降。该啮齿动物最可能是","options":["优势种","关键种","先锋种","伴生种"],"answer":[1],"explain":"关键种数量不一定多，但其活动对群落结构和多样性的影响远超其生物量，移除后多样性显著下降正是关键种的特征，故B正确。优势种以数量多、覆盖度大影响群落；先锋种出现在演替早期；伴生种作用较小。","tag":"群落生态"},{"id":"ecology-i071","type":"single","stage":2,"stem":"某生态系统总初级生产量为1200 g/(m²·a)，植物呼吸消耗量为400 g/(m²·a)。该生态系统的净初级生产量为","options":["400 g/(m²·a)","800 g/(m²·a)","1200 g/(m²·a)","1600 g/(m²·a)"],"answer":[1],"explain":"净初级生产量等于总初级生产量减去植物呼吸消耗量，即1200减400等于800 g/(m²·a)，故B正确。400是呼吸消耗量本身，1600是把两项相加的结果，1200则未扣除呼吸消耗，均不符合定义。","tag":"生态系统"},{"id":"ecology-i072","type":"single","stage":2,"stem":"某海域浮游植物的现存生物量少于浮游动物，其生物量金字塔呈倒置形。出现这一现象的主要原因是","options":["浮游动物的营养级高于浮游植物","该生态系统的能量传递效率偏低","分解者的数量多于消费者","浮游植物繁殖快、周转率高，现存量少而生产量大"],"answer":[3],"explain":"浮游植物个体小、繁殖快、被取食快，现存量虽小但周转迅速，一定时期内支撑的浮游动物生物量可以更大，故D正确。营养级高低和分解者数量都不能解释倒置，能量传递效率偏低只会使高营养级能量更少。","tag":"生态系统"},{"id":"ecology-i073","type":"single","stage":2,"stem":"与碳循环、氮循环相比，磷循环的突出特点是","options":["主要在大气圈中循环","循环速度在各元素中最快","没有气态阶段，主要在岩石、土壤与生物之间循环","完全依赖生物固持，不能返回土壤"],"answer":[2],"explain":"磷主要以磷酸盐形式存在，没有气态阶段，其循环依赖岩石风化、植物吸收、分解归还和沉积，属沉积型循环，故C正确。碳、氮都有气态阶段且可在大气中循环，磷循环速度较慢，分解者也能使磷返回土壤，A、B、D错误。","tag":"生态系统"},{"id":"ecology-i074","type":"single","stage":2,"stem":"草原植被防风固沙、涵养水源、调节气候等功能，属于生态系统服务中的","options":["供给服务","文化服务","调节服务","支持服务"],"answer":[2],"explain":"调节服务指生态系统对气候、水文、水土保持等过程的调节，防风固沙和涵养水源正属此类，故C正确。供给服务提供食物、纤维等产品，文化服务提供游憩和审美价值，支持服务指土壤形成、养分循环等基础过程。","tag":"生态系统"},{"id":"ecology-i075","type":"single","stage":2,"stem":"某草地长期施用有机氯杀虫剂后，调查发现鹰体内杀虫剂浓度远高于牧草。这一现象体现了","options":["生物富集","能量流动逐级递减","物质循环","分解者的富集作用"],"answer":[0],"explain":"脂溶性、难分解的污染物沿食物链传递时在生物体内不断积累、浓度逐级升高，称为生物富集，故A正确。能量逐级递减指能量数量减少，与污染物浓度升高方向相反；物质循环和分解者作用都不能解释这种富集。","tag":"生态系统"},{"id":"ecology-i076","type":"single","stage":2,"stem":"在相同的气候和土壤条件下，下列凋落物中最容易被微生物分解的是","options":["木质素含量高的枯枝","含氮量高、碳氮比低的豆科茎叶","单宁含量高的树叶","表面有厚蜡质层的叶片"],"answer":[1],"explain":"凋落物含氮量高、碳氮比低时，微生物可获得充足的氮源，分解速度快，故B正确。木质素、单宁和蜡质都是难分解的复杂有机物，会降低分解速率，A、C、D的凋落物分解都较慢。","tag":"生态系统"},{"id":"ecology-i077","type":"single","stage":2,"stem":"在通气不良的土壤中，硝态氮被还原为氮气返回大气的过程称为","options":["反硝化作用","硝化作用","氨化作用","固氮作用"],"answer":[0],"explain":"反硝化细菌在缺氧条件下将硝酸盐还原为氮气，造成氮素损失，故A正确。硝化作用是有氧条件下氨氧化为硝酸盐，方向相反；氨化作用是分解有机物释放氨；固氮作用是将氮气转化为含氮化合物。","tag":"生态系统"},{"id":"ecology-i078","type":"single","stage":2,"stem":"某草地长期过度放牧后退化为裸地，由碳汇转变为碳源。其碳收支变化的主要原因是","options":["降水增加使土壤水分条件改善","植物呼吸增强使总初级生产量上升","光合固定的碳减少，而土壤有机碳分解加快","土壤呼吸减弱使有机碳不断积累"],"answer":[2],"explain":"植被破坏后光合固碳能力下降，地表裸露使土壤温度升高、有机质分解加快，碳释放大于固定，故C正确。过牧不会使总初级生产量上升，土壤呼吸通常增强而非减弱，降水变化也不是主要原因，A、B、D错误。","tag":"生态系统"},{"id":"ecology-i079","type":"single","stage":2,"stem":"生态系统中捕食者数量增加使猎物减少，猎物减少又使捕食者数量随之下降。这种调节方式属于","options":["正反馈调节","前馈调节","不可逆调节","负反馈调节"],"answer":[3],"explain":"系统输出反过来抑制输入、使偏离减小的调节为负反馈，捕食者与猎物的相互制约即属此类，故D正确。正反馈使偏离加剧，与题干方向相反；前馈调节是依据预测信息提前调节，不可逆调节不是生态学中的调节类型。","tag":"生态系统"},{"id":"ecology-i085","type":"single","stage":2,"stem":"某草原长期完全禁牧后枯落物大量积累，物种数下降。按中度干扰假说，若改为中等强度的放牧，则该草地","options":["物种多样性最高","物种多样性最低","群落中只剩一年生植物","优势种完全消失"],"answer":[0],"explain":"中度干扰假说认为中等强度干扰下，既抑制竞争排斥又留出定居空间，物种多样性最高，故A正确。长期不干扰或干扰过强都会使多样性下降；中等放牧不会使优势种完全消失，也不会只剩一年生植物。","tag":"草原生态"},{"id":"ecology-i086","type":"single","stage":2,"stem":"某草原连续多年在牧草萌发期放牧，草地迅速退化。其主要原因是","options":["春季放牧促进了牧草分蘖","春季家畜采食量小，对草地影响有限","牧草萌发期被采食，光合器官和贮藏养分受损，再生困难","春季土壤水分充足，牧草补偿能力强"],"answer":[2],"explain":"萌发期牧草依赖贮藏养分建立光合器官，此时被采食会严重削弱再生能力，且地表裸露易受侵蚀，故C正确。春季家畜对返青草的采食强度并不小，A、B、D都低估了早春放牧的危害。","tag":"草原生态"},{"id":"ecology-i087","type":"single","stage":2,"stem":"下列现象中，最能指示某草地已开始退化的是","options":["土壤有机质含量上升","优良牧草比例下降，毒杂草增多","雨季降水量有所增加","蝗虫数量出现季节性波动"],"answer":[1],"explain":"草地退化的早期标志是可食优良牧草减少、不可食草和毒草比例上升，植被覆盖度下降，故B正确。土壤有机质上升说明草地状况改善，降水变化和蝗虫的季节性波动属自然环境常态，都不能作为退化指标。","tag":"草原生态"},{"id":"ecology-i088","type":"single","stage":2,"stem":"在退化草地补播时，将豆科牧草与禾本科牧草混播，其主要生态学意义是","options":["充分利用不同层次的光照和养分，提高群落生产力与稳定性","减少土壤水分蒸发以抑制杂草","加快单一草种在群落中的扩散","通过增加种间竞争降低病虫害"],"answer":[0],"explain":"豆科与禾本科在根系深度、养分利用和固氮能力上互补，混播可提高资源利用效率、改善饲草品质并增强群落稳定性，故A正确。混播不是为抑制杂草或加快单一草种扩散，种间竞争过强反而不利，C、D错误。","tag":"草原生态"},{"id":"ecology-i089","type":"single","stage":2,"stem":"关于草原计划烧除的作用，下列说法正确的是","options":["火烧能使土壤有机质含量大幅增加","火烧后群落物种多样性必然下降","火烧对草原植被和土壤没有影响","可清除枯落物、促进返青，但频繁火烧会损失有机质"],"answer":[3],"explain":"适度计划烧除可清除枯落物、提高地温、促进牧草返青并抑制灌木侵入，但频繁火烧会烧失有机质、加剧水土流失，故D正确。火烧通常使表层有机质减少，管理不当还会降低多样性，A、B、C均不成立。","tag":"草原生态"},{"id":"ecology-s03","type":"single","stem":"逻辑斯谛增长曲线中，种群增长速率达到最大的时刻，种群数量约为","options":["K","K/4","K/2","0"],"answer":[2],"explain":"逻辑斯谛增长方程为dN/dt=rN(1-N/K)，增长速率在N=K/2时最大；N接近K时增长速率趋于0，N=K/4时尚未达到最大值，N=0时增长速率为0。","tag":"种群生态","level":2,"stage":2,"standard":true},{"id":"ecology-s11","type":"single","stem":"甲、乙两个群落物种数目相同，甲群落各物种个体数分布较均匀，乙群落中某一物种个体数占90%。据此判断","options":["甲群落物种多样性高于乙群落","乙群落物种多样性高于甲群落","两群落物种多样性相同","仅凭上述信息无法比较"],"answer":[0],"explain":"物种多样性由丰富度和均匀度共同决定。两群落物种数相同，甲群落个体分布更均匀，均匀度更高，因此多样性高于乙；乙群落优势种占90%，均匀度低，多样性较低。","tag":"群落生态","level":2,"stage":2,"standard":true},{"id":"ecology-s14","type":"single","stem":"某生态系统第一营养级固定的能量为100000 kJ，按十分之一定律估算，第三营养级最多可获得的能量是","options":["10000 kJ","1000 kJ","100 kJ","10 kJ"],"answer":[1],"explain":"能量沿营养级传递时约只有10%进入下一营养级。第一营养级100000 kJ传到第二营养级约10000 kJ，再传到第三营养级约1000 kJ；10000 kJ只算了一次传递，100 kJ和10 kJ则多算了一级或两级。","tag":"生态系统","level":2,"stage":2,"standard":true},{"id":"ecology-s19","type":"single","stem":"某草地可食牧草年产量为9000 kg，一只羊每年需草450 kg，若牧草利用率按50%计算，该草地理论载畜量约为","options":["20只羊","5只羊","10只羊","40只羊"],"answer":[2],"explain":"理论载畜量=可食牧草产量×利用率÷家畜年需草量=9000×50%÷450=10只羊。20只是未乘利用率的结果，5只和40只分别把利用率或产量算错，均不符合公式。","tag":"草原生态","level":2,"stage":2,"standard":true},{"id":"ecology-s20","type":"single","stem":"草地长期过度放牧，植被演替的一般方向是","options":["优良牧草增加，向顶极群落演替","物种数立即增加并保持稳定","优良牧草减少，杂类草和毒杂草增加","草本植被直接演替为森林"],"answer":[2],"explain":"长期过牧使可食优良牧草被反复采食而衰退，耐牧、匍匐或带刺的杂类草和毒杂草增多，植被盖度下降、裸斑扩大，属于逆行演替；封育、轮牧和减畜可促进恢复。","tag":"草原生态","level":2,"stage":2,"standard":true},{"id":"ecology-i009","type":"multi","stage":2,"stem":"关于r-对策者与K-对策者，下列说法正确的有","options":["r-对策者寿命短、繁殖力强","K-对策者扩散能力强，易在新生境定居","K-对策者种群数量常接近环境容纳量","r-对策者后代存活率低、缺少亲代抚育"],"answer":[0,2,3],"explain":"r-对策者以高繁殖率弥补高死亡率，寿命短、后代存活率低、缺少亲代抚育；K-对策者个体大、寿命长，数量稳定在容纳量附近。扩散能力强、易在新生境迅速定居是r-对策者的特点，故B项把两类对策混淆了。","tag":"种群生态"},{"id":"ecology-i010","type":"multi","stage":2,"stem":"关于种群的统计特征，下列说法正确的有","options":["最大出生率是理想条件下的出生率，实际出生率通常低于它","由生命表可计算各年龄的期望寿命","种群密度越高，种群增长率一定越高","净生殖率等于1时种群数量保持稳定"],"answer":[0,1,3],"explain":"最大出生率是理想条件下的理论值，受环境限制实际出生率较低；生命表可推算各年龄期望寿命，净生殖率等于1时种群数量稳定。C项错误，密度过高时种内竞争加剧，增长率反而下降，并非随密度升高而升高。","tag":"种群生态"},{"id":"ecology-i020","type":"multi","stage":2,"stem":"关于生态位与种间竞争，下列说法正确的有","options":["生态位重叠越多，种间竞争通常越激烈","两个物种的生态位完全相同时也能长期稳定共存","生态位分化可使竞争物种长期共存","竞争者去除后，剩余物种可发生竞争释放"],"answer":[0,2,3],"explain":"生态位重叠意味着利用相同资源，重叠越多竞争越强；分化使资源利用错开而实现共存；竞争者去除后剩余物种扩张生态位，即竞争释放。B项错误，生态位完全相同必然导致竞争排斥，无法长期稳定共存。","tag":"群落生态"},{"id":"ecology-i021","type":"multi","stage":2,"stem":"某森林群落乔木层、灌木层和草本层分明，下列分析正确的有","options":["这种分层现象属于群落的垂直结构","分层有利于不同植物充分利用光照等资源","动物也会随植物分层出现分层分布","分层现象说明群落水平结构均匀一致"],"answer":[0,1,2],"explain":"植物分层是垂直结构的表现，有利于充分利用光照；动物依附植物分层而分层。分层不能说明水平结构均匀，第四项错误。","tag":"群落生态"},{"id":"ecology-i034","type":"multi","stage":2,"stem":"关于生态系统的能量传递效率，下列叙述正确的有","options":["相邻营养级之间的能量传递效率通常为10%~20%","传递效率越高，通常能支持的最高营养级生物量越多","呼吸消耗和未被利用的能量会降低能量传递效率","能量传递效率可以达到100%"],"answer":[0,1,2],"explain":"能量传递效率通常为10%~20%，呼吸消耗和未被利用部分使传递效率降低；传递效率高则支持的上层生物量较多。能量传递效率不可能达到100%，第四项错误。","tag":"生态系统"},{"id":"ecology-i035","type":"multi","stage":2,"stem":"关于生态系统的初级生产与分解作用，下列说法正确的有","options":["净初级生产量等于总初级生产量减去自养呼吸消耗","分解作用只发生在生态系统演替的末期","温度过低或水分不足都会限制净初级生产量","分解者的分解作用受枯落物C/N比和温湿度影响"],"answer":[0,2,3],"explain":"净初级生产量为总初级生产量扣除自养呼吸的剩余部分，受温度和水分等条件限制；分解速率取决于底物C/N比和温湿度。B项错误，分解作用贯穿生态系统演替的全过程，从早期阶段就已持续进行。","tag":"生态系统"},{"id":"ecology-i036","type":"multi","stage":2,"stem":"关于碳循环与全球变化，下列说法正确的有","options":["碳在生物群落与大气之间主要以二氧化碳形式交换","化石燃料燃烧把长期封存的碳迅速释放到大气","植被破坏会削弱生态系统的固碳能力","海洋对大气二氧化碳浓度没有调节作用"],"answer":[0,1,2],"explain":"碳在生物与大气之间以二氧化碳形式通过光合作用和呼吸作用交换，化石燃料燃烧与植被破坏分别增加排放、削弱固碳能力。D项错误，海洋是重要的碳汇，通过溶解和生物泵调节大气二氧化碳浓度。","tag":"生态系统"},{"id":"ecology-i044","type":"multi","stage":2,"stem":"关于草地放牧强度与植被的关系，下列叙述正确的有","options":["轻度放牧通常有利于保持群落多样性","重度放牧会使优良牧草比例下降、毒杂草增加","完全禁牧在任何情况下都最有利于草地恢复","轮牧可以给牧草留出恢复时间"],"answer":[0,1,3],"explain":"轻度放牧可维持一定的群落多样性；重度放牧使优良牧草减少、毒杂草增多；轮牧给牧草恢复时间。长期完全禁牧可能积累凋落物、抑制更新，第三项错误。","tag":"草原生态"},{"id":"ecology-i045","type":"multi","stage":2,"stem":"为实现草地资源可持续利用，下列措施合理的有","options":["以草定畜，按载畜量确定牲畜数量","划区轮牧，给牧草留出休养时间","为提高产量长期全面禁牧并停止一切监测","对退化草地补播适宜乡土草种"],"answer":[0,1,3],"explain":"以草定畜可实现草畜平衡，划区轮牧通过轮休恢复牧草，补播乡土草种能加快退化草地修复。C项错误，长期全面禁牧会造成枯落物堆积和多样性下降，停止监测也无法掌握草地动态，不符合可持续管理要求。","tag":"草原生态"},{"id":"ecology-i056","type":"multi","stage":2,"stem":"关于种群的数量波动与调节，下列叙述正确的有","options":["极端气候等非密度制约因素可引起种群数量波动","捕食和寄生通常属于密度制约因素","种群数量波动幅度过大可能增加灭绝风险","种群数量达到环境容纳量后就永远保持不变"],"answer":[0,1,2],"explain":"极端气候属于非密度制约因素；捕食、寄生的作用强度随密度升高而增强，属密度制约因素；波动过大增加灭绝风险。种群数量达到K值后仍会随环境变化而波动，第四项错误。","tag":"种群生态"},{"id":"ecology-i057","type":"multi","stage":2,"stem":"关于密度制约因素和非密度制约因素，下列说法正确的有","options":["食物、天敌和传染病属于密度制约因素","气候灾害的影响强度随种群密度升高而增大","密度制约因素常使种群数量围绕某一水平波动","非密度制约因素往往使种群数量出现无规律的剧烈波动"],"answer":[0,2,3],"explain":"食物、天敌、传染病的作用强度随密度升高而增强，属密度制约因素，并常使种群围绕一定水平波动；气候灾害属非密度制约因素，使数量无规律剧变，故A、C、D正确。B把气候灾害的影响说成随密度增大而增强，混淆了两类因素。","tag":"种群生态"},{"id":"ecology-i067","type":"multi","stage":2,"stem":"关于群落交错区（边缘带）的特征，下列叙述正确的有","options":["交错区是两个或多个群落之间的过渡带","交错区的物种多样性通常较高","边缘效应受边缘形状和人为干扰影响","交错区的物种数一定少于相邻群落内部"],"answer":[0,1,2],"explain":"交错区是群落之间的过渡带，生境异质性高，常有边缘特有种，多样性通常较高；边缘效应受形状、宽度和干扰影响。交错区物种数不一定少于内部，第四项错误。","tag":"群落生态"},{"id":"ecology-i068","type":"multi","stage":2,"stem":"关于群落演替的顶极群落，下列说法正确的有","options":["顶极群落结构相对稳定，但物种组成仍会有小幅变动","相同气候条件下演替最终都形成完全相同的顶极群落","单元顶极学说认为一个气候区只有一个气候顶极","干扰可使演替停留在较早阶段，不一定达到顶极"],"answer":[0,2,3],"explain":"顶极群落是相对稳定的动态平衡，物种组成仍有小幅变化；单元顶极学说主张一个气候区只有一个气候顶极；持续干扰可使演替停滞在早期阶段，故A、C、D正确。地形和土壤差异会使同一气候区形成不同顶极，B过于绝对。","tag":"群落生态"},{"id":"ecology-i080","type":"multi","stage":2,"stem":"关于生态系统的能量金字塔与生物量金字塔，下列叙述正确的有","options":["能量金字塔通常呈正立形","海洋生态系统的生物量金字塔可能倒置","生物量金字塔倒置时，能量金字塔仍为正立形","能量金字塔也可以倒置"],"answer":[0,1,2],"explain":"能量沿营养级递减，能量金字塔通常正立；海洋浮游植物现存量少、周转快，生物量金字塔可倒置，但能量金字塔仍正立。能量金字塔不能倒置，第四项错误。","tag":"生态系统"},{"id":"ecology-i081","type":"multi","stage":2,"stem":"关于碳循环与全球气候变化，下列叙述正确的有","options":["化石燃料燃烧是大气二氧化碳升高的重要原因","植物光合作用固定二氧化碳，呼吸作用释放二氧化碳","海洋是重要的碳库","碳循环只在大气与植物之间进行"],"answer":[0,1,2],"explain":"化石燃料燃烧释放大量二氧化碳；植物通过光合作用固定、呼吸作用释放二氧化碳；海洋是重要碳库。碳循环还涉及土壤、海洋和沉积物等，第四项错误。","tag":"生态系统"},{"id":"ecology-i082","type":"multi","stage":2,"stem":"关于生物富集，下列说法正确的有","options":["脂溶性高、难分解的物质容易沿食物链富集","富集程度通常随营养级升高而增大","生物富集与能量流动的逐级递减是同一过程","生物富集只发生在水生生态系统，陆地食物链中不存在"],"answer":[0,1],"explain":"脂溶性、难降解的物质不易排出，沿食物链传递时浓度逐级升高，故A、B正确。生物富集是污染物浓度的升高，能量传递是能量的递减，两者本质不同，C错误；陆地食物链中同样存在富集现象，D错误。","tag":"生态系统"},{"id":"ecology-i090","type":"multi","stage":2,"stem":"关于放牧与草地植被的关系，下列说法正确的有","options":["适度放牧可抑制高大优势种，为小杂类草提供机会","过牧使优良牧草比例下降，毒杂草增多","长期禁牧必然使草地生产力持续下降","划区轮牧可给牧草留出再生时间，减轻选择性采食"],"answer":[0,1,3],"explain":"适度放牧减轻优势种对资源的垄断，过牧导致优良牧草减少、毒杂草扩张，划区轮牧通过轮流休闲保障牧草再生，故A、B、D正确。长期完全禁牧可能使枯落物积累、更新受阻，但并非必然导致生产力持续下降，C过于绝对。","tag":"草原生态"},{"id":"ecology-i091","type":"multi","stage":2,"stem":"关于草原生态系统的结构与功能，下列说法正确的有","options":["草原植物根系主要集中于表层土壤，形成密集根网","草原的初级生产量主要受水分条件限制","草原土壤有机碳主要分布在深层，表层含量很少","草原生态系统抗逆性较强，但长期过牧仍可导致不可逆退化"],"answer":[0,1,3],"explain":"草原植物以须根系为主，根系密集分布于表层；水分是草原生产力的主要限制因子；草原虽有一定抗逆性，但过牧超过阈值后植被和土壤难以恢复，故A、B、D正确。草原土壤有机碳主要富集在表层，C错误。","tag":"草原生态"},{"id":"ecology-m01","type":"multi","stem":"下列种间关系实例与关系类型的对应，正确的有","options":["根瘤菌与豆科植物——互利共生","菟丝子与大豆——寄生","狼与兔——捕食","两种草履虫争夺食物和空间——偏利共生"],"answer":[0,1,2],"explain":"根瘤菌与豆科植物双方获益，为互利共生；菟丝子从大豆获取营养并使大豆受害，为寄生；狼取食兔为捕食。两种草履虫争夺食物和空间属于竞争，不是偏利共生，故D错误。","tag":"种群生态","level":2,"stage":2,"standard":true},{"id":"ecology-m02","type":"multi","stem":"关于群落演替，下列说法正确的有","options":["初生演替可始于无土壤、无繁殖体的裸岩","次生演替因保留土壤和繁殖体，通常比初生演替快","演替最终一定形成森林","人类活动能改变演替的速度和方向"],"answer":[0,1,3],"explain":"初生演替起点缺乏土壤和繁殖体，速度慢；次生演替保留了土壤、种子和根茎等，通常较快；人类活动如放牧、采伐和封育可改变演替速度与方向。演替终点受气候等限制，草原、荒漠不一定形成森林。","tag":"群落生态","level":2,"stage":2,"standard":true},{"id":"ecology-i011","type":"judge","stage":2,"stem":"某种群的年龄结构由增长型转变为衰退型时，其种群数量必然已经出现明显下降。","options":["正确","错误"],"answer":[1],"explain":"年龄结构反映未来数量变化的趋势，属于提前预警指标，常在数量明显下降之前就已改变。因此年龄结构转为衰退型时数量可能尚未下降，该陈述把趋势等同于已经发生的结果，是错误的。","tag":"种群生态"},{"id":
